# Builds the Server's Docker image from the release's Linux binaries and pushes it to GHCR. The
# Release workflow calls it once the GitHub Release exists (`publish-jobs` in dist-workspace.toml).
name: Docker

on:
  workflow_call:
    inputs:
      plan:
        description: dist's manifest of the release
        required: true
        type: string

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*-unknown-linux-gnu
          path: target/distrib/
          merge-multiple: true
      - name: Put each architecture's binary where the Dockerfile copies it from
        run: |
          for arch in amd64:x86_64 arm64:aarch64; do
            mkdir -p "docker/${arch%%:*}"
            tar --extract --xz --strip-components=1 --directory="docker/${arch%%:*}" \
              --file="target/distrib/nama-server-${arch#*:}-unknown-linux-gnu.tar.xz"
          done
      - name: Name the image's tags
        id: tags
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nama-server"
          version=$(jq --raw-output '.releases[] | select(.app_name == "nama-server") | .app_version' <<<"$PLAN")
          echo "tags=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"
      # apt-get runs inside the arm64 image too, hence QEMU.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
