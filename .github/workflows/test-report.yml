name: test-report

# Records each finished CI run's test results on the `test-history` branch, writes a summary of
# its flaky and slow tests, and keeps one `needs-triage` issue per flaky test (ADR 0022).
# `crates/nama-test-report` holds the logic; this workflow does the git and `gh` work around it.
#
# A `workflow_run` workflow, so the write token lives here and never in CI, whose Dependabot runs
# only get a read-only one. It runs main's code, never the PR's, and reads the run's test reports
# only as data.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  # Downloads the CI run's artifacts.
  actions: read
  # Pushes to `test-history`.
  contents: write
  issues: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_ID: ${{ github.event.workflow_run.id }}
  RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
  RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}

jobs:
  report:
    # A cancelled run is partial, and a skipped one (a closed PR's) ran nothing.
    if: contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the test reports
        id: reports
        run: |
          if ! error=$(gh run download "$RUN_ID" --pattern "test-reports-$RUN_ATTEMPT-*" \
              --dir "$RUNNER_TEMP/reports" 2>&1); then
            # This attempt uploaded none: its tests never ran.
            if grep -q 'no valid artifacts' <<< "$error"; then
              echo "::notice::CI run $RUN_ID attempt $RUN_ATTEMPT has no test reports; nothing to record."
              exit 0
            fi
            echo "$error"
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - if: steps.reports.outputs.found
        uses: dtolnay/rust-toolchain@stable
      - if: steps.reports.outputs.found
        uses: Swatinem/rust-cache@v2
      - name: Read the history and the flaky-test issues
        if: steps.reports.outputs.found
        run: |
          git fetch origin +refs/heads/test-history:refs/remotes/origin/test-history || true
          if git rev-parse --verify -q origin/test-history; then
            git worktree add --detach history origin/test-history
          else
            git worktree add --detach history
            git -C history checkout -q --orphan test-history
            git -C history rm -rfq --ignore-unmatch .
          fi
          # The tool needs the last 30 days: every month they touch, three when they span February.
          for month in $(for days in $(seq 30 -1 0); do
              date -u -d "${RUN_STARTED_AT:0:10} -$days days" +%Y-%m
            done | uniq); do
            cat "history/$month.jsonl" 2> /dev/null || true
          done > "$RUNNER_TEMP/recent.jsonl"
          # Not `--app github-actions`: it returns none of the issues github-actions opened.
          gh issue list --search "author:app/github-actions" --state all --limit 1000 \
            --json number,state,title,body > "$RUNNER_TEMP/issues.json"
      - name: Report
        if: steps.reports.outputs.found
        env:
          # Through a file, never inline in the script: the PR's branch name is in here.
          RUN: ${{ toJSON(github.event.workflow_run) }}
        run: |
          printf '%s' "$RUN" > "$RUNNER_TEMP/run.json"
          mkdir "$RUNNER_TEMP/out"
          mapfile -d '' reports < <(find "$RUNNER_TEMP/reports" -type f \( -name '*.xml' -o -name '*.json' \) -print0)
          # Every job tested the same tree; the tool refuses anything but one object name.
          tree=$(find "$RUNNER_TEMP/reports" -type f -name tree -exec cat {} + | sort -u)
          cargo run --release --locked -p nama-test-report -- \
            --run "$RUNNER_TEMP/run.json" --history "$RUNNER_TEMP/recent.jsonl" --tree "$tree" \
            --issues "$RUNNER_TEMP/issues.json" --out "$RUNNER_TEMP/out" "${reports[@]}"
          cat "$RUNNER_TEMP/out/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Append to the history
        if: steps.reports.outputs.found
        working-directory: history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          month="${RUN_STARTED_AT:0:7}.jsonl"
          # Empty when this CI run is already recorded (a re-run of this workflow) or ran no tests.
          if [ ! -s "$RUNNER_TEMP/out/history.jsonl" ]; then
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            cat "$RUNNER_TEMP/out/history.jsonl" >> "$month"
            git add "$month"
            git commit -qm "CI run $RUN_ID, attempt $RUN_ATTEMPT"
            git push -q origin HEAD:refs/heads/test-history && exit 0
            # Another report pushed first. Lines are only ever appended, so start again from its
            # history rather than merge.
            sleep $((attempt * 5))
            git fetch -q origin +refs/heads/test-history:refs/remotes/origin/test-history
            git reset -q --hard origin/test-history
          done
          echo "::error::Couldn't push to test-history"
          exit 1
      - name: Update the flaky-test issues
        if: steps.reports.outputs.found
        run: |
          # Each value goes to gh as one argument, never through the shell: test names come
          # from the PR's reports.
          while IFS= read -r action; do
            field() { jq -r ".$1" <<< "$action"; }
            case "$(field action)" in
              open) gh issue create --title "$(field title)" --body "$(field body)" --label needs-triage ;;
              comment) gh issue comment "$(field issue)" --body "$(field body)" ;;
              reopen) gh issue reopen "$(field issue)" ;;
              retitle) gh issue edit "$(field issue)" --title "$(field title)" ;;
            esac
          done < "$RUNNER_TEMP/out/issue-actions.jsonl"
