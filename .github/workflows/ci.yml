name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the tests when a draft is marked ready. closed runs nothing: it
    # joins the PR's concurrency group below, which cancels the run still going on a merged or
    # closed PR and frees its runners.
    types: [opened, synchronize, reopened, ready_for_review, closed]

# A new push to a PR (or to main) cancels the run already going on it.
# Keyed on the PR number, not github.ref: a merged PR's `closed` event has github.ref = main, so
# it would cancel main's push run for the merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: CI only needs pass/fail, and builds and links are faster without it.
  CARGO_PROFILE_DEV_DEBUG: 0

# GitHub-hosted runners, free for this public repo, so after `changes` every job runs at once.
# Rust builds are split by mode: `rust-check` only type-checks (sqlx, clippy and rustdoc share
# those artifacts), while `test` and `web-test` build to run and share one cache.
# Never self-hosted: on a public repo, a fork's PR could run its own code on that machine.

jobs:
  # Which side of the repo a PR touches, so a web-only PR skips the Rust work and the other way
  # round. Pushes to main run everything, keeping main's caches and test history complete.
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # The repo's default token can't list a PR's files.
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      # On a PR it lists the changed files through the API, so it needs no checkout.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # proto/ generates code on both sides, and a change to this file runs everything.
          filters: |
            rust:
              - 'crates/**'
              - 'plugins/**'
              - 'proto/**'
              - '.sqlx/**'
              - '.config/**'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
            web:
              - 'web/**'
              - 'proto/**'
              - '.impeccable/**'
              - 'DESIGN.md'
              - '.github/workflows/ci.yml'

  # The checks that build nothing: formatting, the schema in proto/ (ADR 0007: lint, no breaking
  # changes against main, generated code in crates/nama-proto and web/src/gen is current), unused
  # deps and cargo-deny. Runs on drafts too, as do `web` and `rust-check`.
  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      RUST: ${{ needs.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `buf breaking` and the advisories check read main from the local clone.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: env.RUST == 'true'
        run: cargo fmt --all --check
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          setup_only: true
      - name: buf lint
        working-directory: proto
        run: |
          buf lint
          buf format --diff --exit-code
      - name: buf breaking against main
        working-directory: proto
        run: |
          # HEAD^1 is the main this code sits on: a PR's merge ref's base, or main before this push.
          # Not origin/main, which may have moved since the merge ref was made and would read as
          # the PR deleting whatever landed in between.
          base=$(git rev-parse HEAD^1)
          # Until the Buf module first lands on main there is nothing to compare against.
          if git cat-file -e "$base:proto/buf.yaml" 2>/dev/null; then
            buf breaking --against "../.git#ref=$base,subdir=proto"
          else
            echo "main has no Buf module yet; skipping"
          fi
      # The generated code must compile against the connectrpc and buffa versions in
      # crates/nama-proto/Cargo.toml, so keep each plugin on the same minor version as its
      # runtime crate when bumping either (and update the README's install line).
      # Cached by version, since building them from source takes minutes. Bump the cache key with
      # any version here.
      - id: codegen-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/bin/protoc-gen-buffa
            ${{ env.CARGO_HOME }}/bin/protoc-gen-buffa-packaging
            ${{ env.CARGO_HOME }}/bin/protoc-gen-connect-rust
          key: codegen-${{ runner.os }}-buffa-0.9.2-connectrpc-0.9.0
      - name: Install codegen plugins
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: cargo install --locked protoc-gen-buffa@0.9.2 protoc-gen-buffa-packaging@0.9.2 connectrpc-codegen@0.9.0
      # Installs web/'s dependencies, protoc-gen-es among them.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: web
          cache: true
      - name: Generated code is up to date
        run: |
          (cd proto && buf generate)
          git add --all --intent-to-add
          git diff --exit-code || {
            echo "::error::crates/nama-proto/src/generated or web/src/gen is stale; run 'buf generate' in proto/ and commit the result"
            exit 1
          }
      - uses: taiki-e/install-action@v2
        if: env.RUST == 'true'
        with:
          tool: cargo-machete,cargo-deny
      # Dependencies declared in Cargo.toml that no code uses.
      - if: env.RUST == 'true'
        run: cargo machete
      # Licenses, banned and unknown sources (deny.toml).
      - if: env.RUST == 'true'
        run: cargo deny check bans licenses sources
      # An advisory published against a dependency main already has isn't the PR's to fix, so a
      # PR fails only on one its own Cargo.lock adds. advisories.yml files main's as issues.
      - name: No new advisories
        if: github.event_name == 'pull_request' && env.RUST == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && "$GITHUB_WORKSPACE/.github/scripts/advisories.sh") > "$RUNNER_TEMP/base.jsonl"
          git worktree remove --force "$RUNNER_TEMP/base"
          .github/scripts/advisories.sh > "$RUNNER_TEMP/head.jsonl"
          new=$(jq -sc --slurpfile base "$RUNNER_TEMP/base.jsonl" \
            '($base | map(.key)) as $old | .[] | select(.key as $k | $old | index($k) | not)' \
            "$RUNNER_TEMP/head.jsonl")
          jq -r '"Already on main: \(.key) (\(.title))"' "$RUNNER_TEMP/base.jsonl"
          if [ -n "$new" ]; then
            jq -r '"::error::\(.id) in \(.package) \(.version): \(.title) \(.url // "")"' <<< "$new"
            echo "Run 'cargo deny check advisories' for the fix, or ignore it in deny.toml with a reason."
            exit 1
          fi

  # The web app's checks (web/README.md, "Checks").
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: web
          cache: true
      - name: Web app checks
        working-directory: web
        run: |
          vp check
          vp test
          vp build
          vp run fallow
      # For the test-report workflow (ADR 0022). Missing when the tests never ran. Named per
      # attempt, so a re-run records only the jobs it re-ran. `tree` names the code tested, which
      # flakes are keyed on: a PR's run tests it merged into main, so it shares a tree, not a
      # commit, with main's run once the PR is squashed or rebased in.
      - if: ${{ !cancelled() && hashFiles('web/test-results/vitest.json') != '' }}
        run: git rev-parse 'HEAD^{tree}' > web/test-results/tree
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports-${{ github.run_attempt }}-vitest
          path: |
            web/test-results/vitest.json
            web/test-results/tree
          if-no-files-found: ignore
      # From the repo root, where impeccable finds .impeccable/config.json (which ignores
      # web/src/gen) and DESIGN.md. From web/ it would read neither.
      - name: Design check
        run: vp dlx impeccable@4.8.0 detect --json web/src

  # Everything that type-checks the workspace: .sqlx query data, clippy and rustdoc.
  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # Building the Server, as all three do, builds the Plugins it bundles for wasm32.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache's key leaves out the root Cargo.toml's [profile]s, so a profile change
          # restored builds made with the old one, rebuilt every dependency and never saved them.
          key: ${{ hashFiles('Cargo.toml') }}
          # A PR's cache is only visible to that PR, and the repo's 10 GB would fill with them.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # sqlx-cli stays on the same minor version as the sqlx crate in crates/nama-server/Cargo.toml.
      # Cached by version: it has no prebuilt binaries, and building it takes minutes.
      - id: sqlx-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/bin/sqlx
            ${{ env.CARGO_HOME }}/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-0.9.0
      - name: Install sqlx-cli
        if: steps.sqlx-cache.outputs.cache-hit != 'true'
        run: cargo install --locked sqlx-cli@0.9.0 --no-default-features --features sqlite,rustls
      # Queries are checked at compile time against the query data in .sqlx/, so builds need
      # no database. A scratch SQLite file with every migration applied checks it is current.
      - name: .sqlx is up to date
        run: |
          export DATABASE_URL="sqlite://$RUNNER_TEMP/sqlx-check.db"
          sqlx database create
          sqlx migrate run --source crates/nama-server/migrations
          cargo sqlx prepare --check --workspace -- --all-targets || {
            echo "::error::.sqlx is stale; see crates/nama-server/README.md for how to regenerate it"
            exit 1
          }
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The test Plugin and the bundled ones for wasm32, as Installed Plugins are built: with
      # nama-pdk, and nama-proto's messages without its ConnectRPC stubs.
      - run: cargo clippy --package nama-test-plugin --package nama-plugin-radarr --package nama-plugin-sonarr --package nama-plugin-telegram --package nama-servarr --target wasm32-unknown-unknown --locked -- -D warnings
      # Broken intra-doc links and malformed docs fail the build.
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The workspace's tests, each OS's split across two runners. A PR tests on Linux only; a push
  # to main also tests on macOS and Windows, which release builds target and where the Server has
  # platform-specific code (shutdown signals), but which take two to three times as long.
  # So a macOS- or Windows-only failure shows up on main, after the merge.
  # Clippy runs on Linux only (`rust-check`), so a lint in code for another OS isn't caught here.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.partition }}/2)
    needs: changes
    # Draft PRs get the checks only; marking one ready for review runs this and `web-test`.
    if: >-
      (github.event_name == 'push' || !github.event.pull_request.draft) &&
      needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ github.event_name == 'push'
            && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
            || fromJSON('["ubuntu-latest"]') }}
        partition: [1, 2]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so the steps below are one script for all three.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The Server bundles Plugins built for wasm32, and its tests build the test Plugin
          # (crates/nama-test-plugin).
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for both shards and `web-test`: they build the same dependencies.
          shared-key: test
          # As in `rust-check`.
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The cached target directory can hold an earlier run's reports, which would be uploaded
      # as this run's.
      - run: rm -rf target/nextest
      - uses: taiki-e/install-action@nextest
      # Tests make the media they probe with ffmpeg and probe it with ffprobe
      # (crates/nama-server/README.md, "ffmpeg").
      - if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
      # setup-ffmpeg has no macOS build for arm64, which `macos-latest` is.
      # Homebrew's `ffmpeg` lacks zimg, so zscale, which the HDR tone-mapping tests need
      # (crates/nama-server/README.md, "ffmpeg"); `ffmpeg-full` has it but is keg-only.
      - if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      # Only main's push run tests on macOS, so a wrong install should fail here, not as test failures.
      - if: runner.os == 'macOS'
        run: ffmpeg -hide_banner -filters | grep -w zscale
      # The tests that load the test Plugin build it themselves into `CARGO_TARGET_TMPDIR`'s
      # `test-plugin` (crates/nama-server/tests/support/test_plugin.rs). Its dependencies take over a
      # minute to build in release on a runner, and the first test to need them would pay that
      # inside its 90 s nextest timeout.
      - run: cargo build --release --locked --package nama-test-plugin --target wasm32-unknown-unknown --target-dir target/tmp/test-plugin
      # nextest builds every target it runs, so there's no separate `cargo build`. The `ci` profile
      # (.config/nextest.toml) retries, kills hung tests and writes a JUnit report. `count`
      # deals each binary's tests out in turn, so its slow ones land on both shards.
      - run: cargo nextest run --workspace --locked --profile ci --partition count:${{ matrix.partition }}/2
      # nextest doesn't run doctests.
      - if: matrix.partition == 1
        run: cargo test --workspace --doc --locked
      # For the test-report workflow (ADR 0022), as the vitest report in `web`.
      # ponytail: Linux only, since the history doesn't record the OS and a test failing on one OS
      # only would count as flaky. Add the OS to nama-test-report to record macOS and Windows.
      - if: ${{ !cancelled() && runner.os == 'Linux' && hashFiles('target/nextest/*/junit.xml') != '' }}
        run: git rev-parse 'HEAD^{tree}' > target/nextest/tree
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          name: test-reports-${{ github.run_attempt }}-nextest-${{ matrix.partition }}
          path: |
            target/nextest/*/junit.xml
            target/nextest/tree
          if-no-files-found: ignore

  # The one check main's ruleset requires (AGENTS.md, "CI jobs"). A job skipped by the path filter
  # counts as passed, but a skipped matrix job reports under its unexpanded name
  # (`test (${{ matrix.os }}, ...)`), so the ruleset can't require `test` itself.
  ci-ok:
    needs: [changes, lint, web, rust-check, test, web-test]
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # The Server with the `web` feature, which embeds the `vp build` output and serves it. Runs
  # for a web-only PR too.
  web-test:
    needs: changes
    if: >-
      (github.event_name == 'push' || !github.event.pull_request.draft) &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # As in `test`.
          shared-key: test
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rm -rf target/nextest
      - uses: taiki-e/install-action@nextest
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: web
          cache: true
      - run: vp -C web build
      - run: cargo nextest run -p nama-server --features web --test web --locked --profile ci-web
      - if: ${{ !cancelled() && hashFiles('target/nextest/*/junit.xml') != '' }}
        run: git rev-parse 'HEAD^{tree}' > target/nextest/tree
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports-${{ github.run_attempt }}-nextest-web
          path: |
            target/nextest/*/junit.xml
            target/nextest/tree
          if-no-files-found: ignore
