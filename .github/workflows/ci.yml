name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the tests when a draft is marked ready. closed runs nothing: it
    # joins the PR's concurrency group below, which cancels the run still going on a merged or
    # closed PR and frees its runner.
    types: [opened, synchronize, reopened, ready_for_review, closed]

# A new push to a PR (or to main) cancels the run already going on it.
# Keyed on the PR number, not github.ref: a merged PR's `closed` event has github.ref = main, so
# it would cancel main's push run for the merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: CI only needs pass/fail, and builds and links are faster without it.
  CARGO_PROFILE_DEV_DEBUG: 0
  # A fixed path, so rust-cache restores it: a cache only matches a job that caches the same
  # absolute paths, and each runner checks out under its own /_work/jit-runner-<id>/.
  CARGO_TARGET_DIR: /home/runner/target

# Jobs run on autoscaled self-hosted runners on the home lab (electather/home-services,
# runner-scaler in services/lab/docker-compose.yml), two at a time per run. After `changes`,
# `checks` and `test` run side by side. The split keeps each runner's build in one mode:
# `checks` only type-checks (sqlx, clippy and rustdoc share those artifacts), and `test` only
# builds to run, so neither compiles what the other does and each caches only its own kind.

jobs:
  # Which side of the repo a PR touches, so a web-only PR skips the Rust work and the other way
  # round. Pushes to main run everything, keeping main's caches and test history complete.
  changes:
    if: github.event.action != 'closed'
    runs-on: [self-hosted, nama-rust]
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      # On a PR it lists the changed files through the API, so it needs no checkout.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # proto/ generates code on both sides, and a change to this file runs everything.
          filters: |
            rust:
              - 'crates/**'
              - 'plugins/**'
              - 'proto/**'
              - '.sqlx/**'
              - '.config/**'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
            web:
              - 'web/**'
              - 'proto/**'
              - '.impeccable/**'
              - 'DESIGN.md'
              - '.github/workflows/ci.yml'

  # Everything but the tests, on one runner: formatting, the schema in proto/ (ADR 0007: lint, no
  # breaking changes against main, generated code in crates/nama-proto and web/src/gen is
  # current), .sqlx query data, clippy, docs, unused deps, cargo-deny and the web app's checks
  # (web/README.md, "Checks"). Runs on drafts too.
  checks:
    name: checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: [self-hosted, nama-rust]
    env:
      RUST: ${{ needs.changes.outputs.rust }}
      WEB: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `buf breaking` reads main from the local clone.
          fetch-depth: 0
      # Also when only web/ changed: installing the codegen tools on a cache miss needs cargo.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # Building the Server, as clippy, `cargo doc` and `cargo sqlx prepare` do, builds the
          # Plugins it bundles for wasm32.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.RUST == 'true'
        with:
          # CARGO_TARGET_DIR, written relative to the checkout (/_work/jit-runner-<id>/nama-rust/
          # nama-rust) because rust-cache joins it onto the workspace root.
          # ponytail: tied to the checkout's depth; fix the runner's work directory to drop it.
          workspaces: . -> ../../../../home/runner/target
          # rust-cache's key leaves out the root Cargo.toml's [profile]s, so a profile change
          # restored builds made with the old one, rebuilt every dependency and never saved them.
          key: ${{ hashFiles('Cargo.toml') }}
      - if: env.RUST == 'true'
        run: cargo fmt --all --check
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          setup_only: true
      - name: buf lint
        working-directory: proto
        run: |
          buf lint
          buf format --diff --exit-code
      - name: buf breaking against main
        working-directory: proto
        run: |
          # Until the Buf module first lands on main there is nothing to compare against.
          if git cat-file -e origin/main:proto/buf.yaml 2>/dev/null; then
            buf breaking --against "../.git#ref=origin/main,subdir=proto"
          else
            echo "main has no Buf module yet; skipping"
          fi
      # The generated code must compile against the connectrpc and buffa versions in
      # crates/nama-proto/Cargo.toml, so keep each plugin on the same minor version as its
      # runtime crate when bumping either (and update the README's install line). sqlx-cli
      # stays on the same minor version as the sqlx crate in crates/nama-server/Cargo.toml.
      # Cached by version, since building them from source took 2-4 minutes of every run (sqlx-cli
      # has no prebuilt binaries). Bump the cache key with any version here.
      - id: tools-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/bin/protoc-gen-buffa
            ${{ env.CARGO_HOME }}/bin/protoc-gen-buffa-packaging
            ${{ env.CARGO_HOME }}/bin/protoc-gen-connect-rust
            ${{ env.CARGO_HOME }}/bin/sqlx
            ${{ env.CARGO_HOME }}/bin/cargo-sqlx
          key: tools-${{ runner.os }}-buffa-0.9.2-connectrpc-0.9.0-sqlx-cli-0.9.0
      - name: Install codegen plugins and sqlx-cli
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked protoc-gen-buffa@0.9.2 protoc-gen-buffa-packaging@0.9.2 connectrpc-codegen@0.9.0
          cargo install --locked sqlx-cli@0.9.0 --no-default-features --features sqlite,rustls
      # Installs web/'s dependencies, protoc-gen-es among them, once for codegen and the web checks.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: web
          cache: true
      - name: Generated code is up to date
        run: |
          (cd proto && buf generate)
          git add --all --intent-to-add
          git diff --exit-code || {
            echo "::error::crates/nama-proto/src/generated or web/src/gen is stale; run 'buf generate' in proto/ and commit the result"
            exit 1
          }
      - name: Web app checks
        if: env.WEB == 'true'
        working-directory: web
        run: |
          vp check
          vp test
          vp build
          vp run fallow
      # For the test-report workflow (ADR 0022). Missing when the tests never ran. Named per
      # attempt, so a re-run records only the jobs it re-ran. `tree` names the code tested, which
      # flakes are keyed on: a PR's run tests it merged into main, so it shares a tree, not a
      # commit, with main's run once the PR is squashed or rebased in.
      - if: ${{ !cancelled() && hashFiles('web/test-results/vitest.json') != '' }}
        run: git rev-parse 'HEAD^{tree}' > web/test-results/tree
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && env.WEB == 'true' }}
        with:
          name: test-reports-${{ github.run_attempt }}-vitest
          path: |
            web/test-results/vitest.json
            web/test-results/tree
          if-no-files-found: ignore
      # From the repo root, where impeccable finds .impeccable/config.json (which ignores
      # web/src/gen) and DESIGN.md. From web/ it would read neither.
      - name: Design check
        if: env.WEB == 'true'
        run: vp dlx impeccable@4.8.0 detect --json web/src
      # Queries are checked at compile time against the query data in .sqlx/, so builds need
      # no database. A scratch SQLite file with every migration applied checks it is current.
      - name: .sqlx is up to date
        if: env.RUST == 'true'
        run: |
          export DATABASE_URL="sqlite://$RUNNER_TEMP/sqlx-check.db"
          sqlx database create
          sqlx migrate run --source crates/nama-server/migrations
          cargo sqlx prepare --check --workspace -- --all-targets || {
            echo "::error::.sqlx is stale; see crates/nama-server/README.md for how to regenerate it"
            exit 1
          }
      - if: env.RUST == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The test Plugin and the bundled ones for wasm32, as Installed Plugins are built: with
      # nama-pdk, and nama-proto's messages without its ConnectRPC stubs.
      - if: env.RUST == 'true'
        run: cargo clippy --package nama-test-plugin --package nama-plugin-radarr --package nama-plugin-sonarr --package nama-plugin-telegram --target wasm32-unknown-unknown --locked -- -D warnings
      # Broken intra-doc links and malformed docs fail the build.
      - if: env.RUST == 'true'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@v2
        if: env.RUST == 'true'
        with:
          tool: cargo-machete,cargo-deny
      # Dependencies declared in Cargo.toml that no code uses.
      - if: env.RUST == 'true'
        run: cargo machete
      # Licenses, banned and unknown sources (deny.toml).
      - if: env.RUST == 'true'
        run: cargo deny check bans licenses sources
      # An advisory published against a dependency main already has isn't the PR's to fix, so a
      # PR fails only on one its own Cargo.lock adds. advisories.yml files main's as issues.
      - name: No new advisories
        if: github.event_name == 'pull_request' && env.RUST == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && "$GITHUB_WORKSPACE/.github/scripts/advisories.sh") > "$RUNNER_TEMP/base.jsonl"
          git worktree remove --force "$RUNNER_TEMP/base"
          .github/scripts/advisories.sh > "$RUNNER_TEMP/head.jsonl"
          new=$(jq -sc --slurpfile base "$RUNNER_TEMP/base.jsonl" \
            '($base | map(.key)) as $old | .[] | select(.key as $k | $old | index($k) | not)' \
            "$RUNNER_TEMP/head.jsonl")
          jq -r '"Already on main: \(.key) (\(.title))"' "$RUNNER_TEMP/base.jsonl"
          if [ -n "$new" ]; then
            jq -r '"::error::\(.id) in \(.package) \(.version): \(.title) \(.url // "")"' <<< "$new"
            echo "Run 'cargo deny check advisories' for the fix, or ignore it in deny.toml with a reason."
            exit 1
          fi

  # Release builds target Linux, macOS and Windows, and the Server has
  # platform-specific code (shutdown signals), so this should check all three.
  # macOS and Windows are switched off for now: they need GitHub-hosted
  # minutes, which this account has none of. Re-add them to the matrix to
  # turn them back on.
  test:
    name: build and test (${{ matrix.os }})
    needs: changes
    # Draft PRs get `checks` only; marking one ready for review runs this. A web-only PR still
    # runs the Server's `web` feature test, which serves the built app.
    if: >-
      (github.event_name == 'push' || !github.event.pull_request.draft) &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: [self-hosted, nama-rust]
          # - os: macos-latest
          #   runner: macos-latest
          # - os: windows-latest
          #   runner: windows-latest
    runs-on: ${{ matrix.runner }}
    env:
      RUST: ${{ needs.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The Server bundles Plugins built for wasm32, and its tests build the test Plugin
          # (crates/nama-test-plugin).
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # As in `checks`.
          workspaces: . -> ../../../../home/runner/target
          key: ${{ hashFiles('Cargo.toml') }}
      # The cached target directory can hold an earlier run's reports, which would be uploaded
      # as this run's.
      - run: rm -rf "$CARGO_TARGET_DIR/nextest"
      - uses: taiki-e/install-action@nextest
      # nextest builds every target it runs, so there's no separate `cargo build`. The `ci` profile
      # (.config/nextest.toml) retries, kills hung tests and writes a JUnit report.
      - if: env.RUST == 'true'
        run: cargo nextest run --workspace --locked --profile ci
      # nextest doesn't run doctests.
      - if: env.RUST == 'true'
        run: cargo test --workspace --doc --locked
      # The Server with the `web` feature, which embeds the `vp build` output.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: web
          cache: true
      - run: vp -C web build
      - run: cargo nextest run -p nama-server --features web --test web --locked --profile ci-web
      # For the test-report workflow (ADR 0022), as the vitest report in `checks`.
      # ponytail: the history doesn't record the OS; add it before re-enabling macOS or Windows,
      # or a test failing on one OS only counts as flaky.
      - if: ${{ !cancelled() }}
        run: |
          if compgen -G "$CARGO_TARGET_DIR/nextest/*/junit.xml" > /dev/null; then
            git rev-parse 'HEAD^{tree}' > "$CARGO_TARGET_DIR/nextest/tree"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports-${{ github.run_attempt }}-nextest-${{ matrix.os }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/nextest/*/junit.xml
            ${{ env.CARGO_TARGET_DIR }}/nextest/tree
          if-no-files-found: ignore
