name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Jobs run on autoscaled self-hosted runners on the home lab (electather/home-services,
# runner-scaler-nama in services/lab/docker-compose.yml).

jobs:
  fmt:
    name: rustfmt
    runs-on: [self-hosted, nama-rust]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The schema in proto/ (ADR 0007): lint it, refuse breaking changes against main, and check
  # the generated Rust code in crates/nama-proto is what the schema produces.
  proto:
    name: buf lint, breaking and generate
    runs-on: [self-hosted, nama-rust]
    steps:
      - uses: actions/checkout@v6
        with:
          # `buf breaking` reads main from the local clone.
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          setup_only: true
      - name: buf lint
        working-directory: proto
        run: |
          buf lint
          buf format --diff --exit-code
      - name: buf breaking against main
        working-directory: proto
        run: |
          # Until the Buf module first lands on main there is nothing to compare against.
          if git cat-file -e origin/main:proto/buf.yaml 2>/dev/null; then
            buf breaking --against "../.git#ref=origin/main,subdir=proto"
          else
            echo "main has no Buf module yet; skipping"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Install codegen plugins
        # The generated code must compile against the connectrpc and buffa versions in
        # crates/nama-proto/Cargo.toml, so keep each plugin on the same minor version as its
        # runtime crate when bumping either (and update the README's install line).
        run: >-
          cargo install --locked
          protoc-gen-buffa@0.9.2
          protoc-gen-buffa-packaging@0.9.2
          connectrpc-codegen@0.9.0
      - name: Generated code is up to date
        run: |
          (cd proto && buf generate)
          git add --all --intent-to-add
          git diff --exit-code || {
            echo "::error::crates/nama-proto/src/generated is stale; run 'buf generate' in proto/ and commit the result"
            exit 1
          }

  # Queries are checked at compile time against the query data in .sqlx/, so builds need no
  # database. Here a scratch SQLite file with every migration applied checks that data is current.
  sqlx:
    name: sqlx query data
    runs-on: [self-hosted, nama-rust]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Keep on the same minor version as the sqlx crate in crates/nama-server/Cargo.toml.
      - run: cargo install --locked sqlx-cli@0.9.0 --no-default-features --features sqlite,rustls
      - name: .sqlx is up to date
        run: |
          export DATABASE_URL="sqlite://$RUNNER_TEMP/sqlx-check.db"
          sqlx database create
          sqlx migrate run --source crates/nama-server/migrations
          cargo sqlx prepare --check --workspace -- --all-targets || {
            echo "::error::.sqlx is stale; see crates/nama-server/README.md for how to regenerate it"
            exit 1
          }

  # Lints that don't depend on the platform: docs, unused deps, supply chain.
  hygiene:
    name: docs, unused deps and cargo-deny
    runs-on: [self-hosted, nama-rust]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links and malformed docs fail the build.
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny
      # Dependencies declared in Cargo.toml that no code uses.
      - run: cargo machete
      # Advisories, licenses, banned and unknown sources (deny.toml).
      - run: cargo deny check

  # Release builds target Linux, macOS and Windows, and the Server has
  # platform-specific code (shutdown signals), so this should check all three.
  # macOS and Windows are switched off for now: they need GitHub-hosted
  # minutes, which this account has none of. Re-add them to the matrix to
  # turn them back on.
  test:
    name: clippy, build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: [self-hosted, nama-rust]
          # - os: macos-latest
          #   runner: macos-latest
          # - os: windows-latest
          #   runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo build --workspace --locked
      - run: cargo nextest run --workspace --locked
      # nextest doesn't run doctests.
      - run: cargo test --workspace --doc --locked
