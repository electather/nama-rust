# Steps dist runs before each release build (`github-build-setup` in dist-workspace.toml).
# The `web` feature embeds web/dist, so the web app is built first (ADR 0004).
- name: Install Vite+
  uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
  with:
    working-directory: web
    cache: true
# dist drops `working-directory` from `run` steps, hence `-C`.
- name: Build the web app
  run: vp -C web build
