# Version updates. Security updates are a repo setting, not configured here.
# Minor and patch bumps are grouped per ecosystem so each week brings one PR to review, not dozens;
# majors stay separate because they're the ones that break. The cooldown mirrors pnpm's
# `minimumReleaseAge` in web/pnpm-workspace.yaml: a compromised release gets time to be pulled.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    # nama-server's wasmtime must be the one extism uses (see its Cargo.toml); bump both by hand.
    ignore:
      - dependency-name: wasmtime
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(cargo)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(web)"

  - package-ecosystem: github-actions
    directory: /
    # dist generates release.yml; bumps there would be overwritten by the next `dist generate`.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: docker
    directory: /.sandcastle
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(sandcastle)"

  - package-ecosystem: npm
    directory: /.sandcastle
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      sandcastle:
        patterns: ["*"]
    commit-message:
      prefix: "deps(sandcastle)"
