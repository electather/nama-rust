syntax = "proto3";

package nama.hub.v1;

// Creating an Account, and signing it in and out, for the Hub's web pages. A session is an
// HttpOnly `SameSite=Strict` cookie (ADR 0015), never in a response body. Failures a client can
// cause carry a `nama.hub.v1.Refusal`.
service AccountService {
  // Creates an Account with an email and a password, and signs it in. Fails with
  // `REFUSAL_REASON_EMAIL_TAKEN` when another Account has the email, with
  // `REFUSAL_REASON_EMAIL_INVALID` or `REFUSAL_REASON_PASSWORD_LENGTH` when one breaks the rules,
  // and with `REFUSAL_REASON_TOO_MANY_ATTEMPTS` after too many creations from one client.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  // Signs an Account in by its email, compared without regard to case, and password. Fails with
  // `REFUSAL_REASON_WRONG_EMAIL_OR_PASSWORD`, without saying which is wrong, and with
  // `REFUSAL_REASON_TOO_MANY_ATTEMPTS` after too many failures from one client or for one email.
  rpc SignIn(SignInRequest) returns (SignInResponse);
  // Emails a Sign-in Link to the Account with this email, compared without regard to case. It
  // answers the same whether or not an Account has the email, and sends nothing when none does.
  // Fails with `REFUSAL_REASON_SIGN_IN_LINKS_OFF` when the Hub has no mail set up,
  // `REFUSAL_REASON_EMAIL_INVALID`, and `REFUSAL_REASON_TOO_MANY_ATTEMPTS` after too many
  // requests from one client or for one email.
  rpc SendSignInLink(SendSignInLinkRequest) returns (SendSignInLinkResponse);
  // Names the Account a Sign-in Link signs in, without using it up. Fails with
  // `REFUSAL_REASON_SIGN_IN_LINK_EXPIRED` for a link that expired, was used or never existed.
  rpc GetSignInLink(GetSignInLinkRequest) returns (GetSignInLinkResponse);
  // Uses a Sign-in Link up, signing its Account in and ending the calling session, if any. The
  // first one used on an Account whose email isn't proven also ends its other sessions and removes
  // its password (ADR 0100). Fails as `GetSignInLink` does.
  rpc SignInWithLink(SignInWithLinkRequest) returns (SignInWithLinkResponse);
  // Sets the signed-in Account's password, replacing any it has, and ends the Account's other
  // sessions. Needs Recent Authentication: the calling session signed in, with any Sign-in Method,
  // in the last 10 minutes. Fails with `REFUSAL_REASON_SIGN_IN_REQUIRED` without a session,
  // `REFUSAL_REASON_RECENT_AUTHENTICATION_REQUIRED` before the password is checked, and
  // `REFUSAL_REASON_PASSWORD_LENGTH`.
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  // Deletes the signed-in Account and everything the Hub keeps for it: its sessions, Sign-in
  // Methods, Watch State, Watchlist and Viewing Events, and its Links, so each of its Users is
  // Unlinked, and each Server it Linked with every User Linked there. Pooled counts name no Account,
  // so they stay (ADR 0093). A Server learns of an Unlink the next time it names the User. Clears
  // the session cookie. Needs Recent Authentication, as `SetPassword` does. Fails with
  // `REFUSAL_REASON_SIGN_IN_REQUIRED` without a session, and
  // `REFUSAL_REASON_RECENT_AUTHENTICATION_REQUIRED`.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  // Ends the calling session and clears its cookie. Fails with `REFUSAL_REASON_SIGN_IN_REQUIRED`
  // without a session.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // Returns the signed-in Account, or fails with `REFUSAL_REASON_SIGN_IN_REQUIRED`.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// A person's identity on the Hub.
message Account {
  // The Account's id, a UUID.
  string id = 1;
  // The email it was created with, as it was typed.
  string email = 2;
}

message CreateAccountRequest {
  // Up to 254 characters, with an `@` that has something on each side.
  string email = 1;
  // 8 to 1024 characters.
  string password = 2;
}

message CreateAccountResponse {
  // The Account just created and signed in.
  Account account = 1;
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {
  // The Account just signed in.
  Account account = 1;
}

message SendSignInLinkRequest {
  string email = 1;
  // The Hub path to continue at once signed in, such as `/`. Anything else continues at `/`.
  string continue_to = 2;
}

message SendSignInLinkResponse {}

message GetSignInLinkRequest {
  // The token from the link's address.
  string token = 1;
}

message GetSignInLinkResponse {
  // The Account the link signs in.
  Account account = 1;
  // Whether the Account's email is proven. If not, using the link proves it, and also ends the
  // Account's other sessions and removes its password.
  bool email_proven = 2;
}

message SignInWithLinkRequest {
  string token = 1;
}

message SignInWithLinkResponse {
  // The Account just signed in.
  Account account = 1;
  // The Hub path to continue at, as asked for with the link.
  string continue_to = 2;
}

message SetPasswordRequest {
  // 8 to 1024 characters.
  string password = 1;
}

message SetPasswordResponse {}

message DeleteAccountRequest {}

message DeleteAccountResponse {}

message SignOutRequest {}

message SignOutResponse {}

message GetAccountRequest {}

message GetAccountResponse {
  Account account = 1;
  // Whether the Account has a password. One a Sign-in Link took over has none (ADR 0100).
  bool has_password = 2;
}
