syntax = "proto3";

package nama.hub.v1;

// Why the Hub refused a request, in the shape of the Server's `nama.v1.Refusal` (ADR 0019). Every
// error a client can cause carries one, as a Connect error detail of type `nama.hub.v1.Refusal`;
// failures on the Hub's side (`internal`, `unavailable`) carry none. The English text stays in the
// error's `message`.
message Refusal {
  // The rule the request broke. Each reason always comes with the same Connect code, given below.
  RefusalReason reason = 1;
  // The request field the refusal is about, such as `email`, or empty if it is about no one field.
  string field = 2;
  // The values the message mentions, so a client can say it in another language. Keys are
  // lowerCamelCase with the unit in the key (AIP-193); each reason lists its own.
  map<string, string> params = 3;
}

// The rules a request can break. Reasons are API contract: one is never renamed or reused. A
// client that gets one it doesn't know sees `REFUSAL_REASON_UNSPECIFIED`, and shows the message.
enum RefusalReason {
  // A reason this client doesn't know; read the message. The Hub never sends it.
  REFUSAL_REASON_UNSPECIFIED = 0;
  // `unauthenticated`: the call needs a signed-in Account.
  REFUSAL_REASON_SIGN_IN_REQUIRED = 1;
  // `unauthenticated`: no Account has this email and password. Which of the two is wrong isn't
  // said.
  REFUSAL_REASON_WRONG_EMAIL_OR_PASSWORD = 2;
  // `resource_exhausted`: too many attempts lately, such as failed sign-ins or Sign-in Links asked
  // for. Params: `retryAfterSeconds`, also sent as the `Retry-After` header.
  REFUSAL_REASON_TOO_MANY_ATTEMPTS = 3;
  // `already_exists`: another Account has this email, compared without regard to case.
  REFUSAL_REASON_EMAIL_TAKEN = 4;
  // `invalid_argument`: the email isn't an address, such as one without an `@`. Params:
  // `maxLength`, the most characters an email may have.
  REFUSAL_REASON_EMAIL_INVALID = 5;
  // `invalid_argument`: the password is too short or too long. Params: `minLength` and
  // `maxLength`, in characters.
  REFUSAL_REASON_PASSWORD_LENGTH = 6;
  // `not_found`: the Sign-in Link expired, was used already, or never existed.
  REFUSAL_REASON_SIGN_IN_LINK_EXPIRED = 7;
  // `failed_precondition`: the Hub has no mail set up, so it can't email Sign-in Links.
  REFUSAL_REASON_SIGN_IN_LINKS_OFF = 8;
  // `failed_precondition`: the call needs Recent Authentication, which the session lost
  // `recentMinutes` after it signed in. Signing in again gives it back. Params: `recentMinutes`.
  REFUSAL_REASON_RECENT_AUTHENTICATION_REQUIRED = 9;
  // `failed_precondition`: the Account's email isn't proven yet, which only using a Sign-in Link
  // sent to it does, and Linking needs it (ADR 0100).
  REFUSAL_REASON_EMAIL_NOT_PROVEN = 10;
  // `not_found`: no Server is waiting on this code: it was mistyped, expired or used.
  REFUSAL_REASON_LINK_CODE_NOT_FOUND = 11;
  // `not_found`: the device code expired, was used, or never existed. Start again.
  REFUSAL_REASON_LINK_EXPIRED = 12;
  // `unauthenticated`: the call needs a Linked Server's credential, and none came or the Hub
  // doesn't know it, such as once the Server was Unlinked.
  REFUSAL_REASON_SERVER_NOT_LINKED = 13;
}
