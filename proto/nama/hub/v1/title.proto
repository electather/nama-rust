syntax = "proto3";

package nama.hub.v1;

// Which kind of title an External ID names: Movies, Shows and Episodes are separate id spaces (ADR
// 0042). Each call says which kinds it takes.
enum TitleKind {
  TITLE_KIND_UNSPECIFIED = 0;
  TITLE_KIND_MOVIE = 1;
  TITLE_KIND_SHOW = 2;
  TITLE_KIND_EPISODE = 3;
}
