syntax = "proto3";

package nama.hub.v1;

// Registering a Server with the Hub, as an OAuth device flow (RFC 8628, ADR 0011): the Server
// starts it and polls, and the holder of an Account enters the code it shows on the Hub's pages.
// The Hub never calls a Server. Anyone may call it, since a Server not yet Linked has no identity.
service ServerLinkService {
  // Starts registering the calling Server: the code a person enters on the Hub, and the device code
  // the Server polls with. Both stop working after `expires_in_seconds`.
  rpc StartServerLink(StartServerLinkRequest) returns (StartServerLinkResponse);
  // Whether someone entered the code yet. Once they have, the first poll gets the Server's
  // credential and every later one fails. Fails with `REFUSAL_REASON_LINK_EXPIRED` for a device
  // code that expired, was used, or never existed.
  rpc PollServerLink(PollServerLinkRequest) returns (PollServerLinkResponse);
}

// Linking a Server to the signed-in Account, and listing the Servers it owns, for the Hub's web
// pages. Every call fails with `REFUSAL_REASON_SIGN_IN_REQUIRED` without a session.
service LinkService {
  // Makes the Server showing `code` a Linked Server of the signed-in Account. Fails with
  // `REFUSAL_REASON_RECENT_AUTHENTICATION_REQUIRED` unless the session signed in within the last
  // 10 minutes, with `REFUSAL_REASON_EMAIL_NOT_PROVEN` until a Sign-in Link proved the Account's
  // email (ADR 0100), and with `REFUSAL_REASON_LINK_CODE_NOT_FOUND` for a code no Server is waiting
  // on.
  rpc ApproveServerLink(ApproveServerLinkRequest) returns (ApproveServerLinkResponse);
  // Returns the signed-in Account's Linked Servers, oldest first.
  rpc ListLinkedServers(ListLinkedServersRequest) returns (ListLinkedServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Links the User showing `code` on their Server to the signed-in Account. An Account may have
  // Users on many Servers. Fails like `ApproveServerLink`, with `REFUSAL_REASON_LINK_CODE_NOT_FOUND`
  // for a code no User is waiting on.
  rpc ApproveUserLink(ApproveUserLinkRequest) returns (ApproveUserLinkResponse);
  // Returns the signed-in Account's Linked Users, oldest first.
  rpc ListLinkedUsers(ListLinkedUsersRequest) returns (ListLinkedUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Unlinks one of the signed-in Account's Users. Unlinking one it doesn't have does nothing.
  rpc UnlinkLinkedUser(UnlinkLinkedUserRequest) returns (UnlinkLinkedUserResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Returns the Users Admins created from the signed-in Account that it hasn't accepted yet,
  // oldest first (ADR 0092).
  rpc ListUserInvites(ListUserInvitesRequest) returns (ListUserInvitesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Accepts a User created from the signed-in Account, which Links them to it, so they can sign in
  // with it. Fails like `ApproveServerLink`, with `REFUSAL_REASON_USER_INVITE_NOT_FOUND` for an id
  // none of its invites has, and with `REFUSAL_REASON_USER_LINKED` if the User Linked meanwhile.
  rpc AcceptUserInvite(AcceptUserInviteRequest) returns (AcceptUserInviteResponse);
  // Names the Server a sign-in with the Account was started on, and the signed-in Account's User
  // there, so the person can check them before approving. Fails with
  // `REFUSAL_REASON_SERVER_SIGN_IN_NOT_FOUND` for a sign-in that expired, was approved, or never
  // existed.
  rpc GetServerSignIn(GetServerSignInRequest) returns (GetServerSignInResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Approves a sign-in with the signed-in Account, as its User on that Server, and returns where to
  // go back to. Fails like `GetServerSignIn`, and with `REFUSAL_REASON_NO_USER_ON_SERVER` if the
  // Account has no User Linked on that Server.
  rpc ApproveServerSignIn(ApproveServerSignInRequest) returns (ApproveServerSignInResponse);
}

// What a Linked Server asks the Hub. It sends the credential `PollServerLink` gave it in an
// `Authorization: Bearer <credential>` header, and every call fails with
// `REFUSAL_REASON_SERVER_NOT_LINKED` without one the Hub knows.
service LinkedServerService {
  // Unlinks the calling Server: its credential stops working at once, and it leaves its Account's
  // Servers.
  rpc UnlinkServer(UnlinkServerRequest) returns (UnlinkServerResponse);
  // Starts Linking one of the Server's Users: the code they enter on the Hub, which replaces any
  // code they were waiting on and stops working after `expires_in_seconds`. Fails with
  // `REFUSAL_REASON_USER_LINKED` for a User Linked already, since a User Links to one Account.
  rpc StartUserLink(StartUserLinkRequest) returns (StartUserLinkResponse);
  // Returns the Account one of the Server's Users is Linked to, if any. The Server asks while the
  // User waits for their code to be entered, and to see whether the Account Unlinked them.
  rpc GetUserLink(GetUserLinkRequest) returns (GetUserLinkResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Unlinks one of the Server's Users, or forgets the code they wait on. Unlinking a User who
  // isn't Linked does nothing.
  rpc UnlinkUser(UnlinkUserRequest) returns (UnlinkUserResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Asks the Account with `email`, if there is one, to accept one of the Server's Users created
  // from it (ADR 0092). It answers the same whether or not there is, so it reveals nothing about
  // which emails have Accounts. Asking again for the same User replaces the request.
  rpc InviteUser(InviteUserRequest) returns (InviteUserResponse);
  // Starts someone signing in to the Server with their Account, as an OAuth device flow: the
  // person approves it on the Hub's page for `id`, which then sends them to `return_url`, and the
  // Server collects the sign-in with `PollServerSignIn`. Both stop working after
  // `expires_in_seconds`.
  rpc StartServerSignIn(StartServerSignInRequest) returns (StartServerSignInResponse);
  // Whether the sign-in was approved. Once it is, the first poll gets the token naming the User
  // and every later one fails. Fails with `REFUSAL_REASON_LINK_EXPIRED` for a device code that
  // expired, was used, or never existed.
  rpc PollServerSignIn(PollServerSignInRequest) returns (PollServerSignInResponse);
}

// A Server registered with the Hub, owned by an Account.
message LinkedServer {
  // The Linked Server's id, a UUID.
  string id = 1;
  // The Server's name when it was Linked.
  string name = 2;
  // When it was Linked, in seconds since the Unix epoch.
  int64 linked_at = 3;
}

message StartServerLinkRequest {
  // The Server's name, which its Account's list of Servers shows: up to 100 characters, cut there
  // if longer.
  string name = 1;
}

message StartServerLinkResponse {
  // What the Server polls with. A secret: only the Server sees it.
  string device_code = 1;
  // What the Server shows and a person enters on the Hub, such as `BDFH-JKLM`.
  string user_code = 2;
  // How long both codes work.
  int32 expires_in_seconds = 3;
  // How long to wait between polls.
  int32 interval_seconds = 4;
}

message PollServerLinkRequest {
  string device_code = 1;
}

message PollServerLinkResponse {
  // Whether someone entered the code. Until then the other fields are empty; poll again after
  // `interval_seconds`.
  bool linked = 1;
  // The Server's credential for every later call to `LinkedServerService`. Sent once, here.
  string credential = 2;
  // A JWT the Hub signed with EdDSA (Ed25519), checked with the key set at
  // `/.well-known/jwks.json`: `sub` is the Linked Server's id, `email` its Account's email, and it
  // expires 5 minutes after it was made.
  string token = 3;
}

message ApproveServerLinkRequest {
  // The code the Server shows, in any case, with or without its hyphen.
  string code = 1;
}

message ApproveServerLinkResponse {
  // The Server just Linked, listed from now on. It gets its credential when it next polls.
  LinkedServer server = 1;
}

message ListLinkedServersRequest {}

message ListLinkedServersResponse {
  repeated LinkedServer servers = 1;
}

message UnlinkServerRequest {}

message UnlinkServerResponse {}

// A User on a Linked Server, Linked to an Account.
message LinkedUser {
  // The Link's id, a UUID.
  string id = 1;
  // The User's name on their Server when they Linked.
  string name = 2;
  // The name of the Linked Server the User is on.
  string server_name = 3;
  // When they Linked, in seconds since the Unix epoch.
  int64 linked_at = 4;
}

message ApproveUserLinkRequest {
  // The code the User's Server shows, in any case, with or without its hyphen.
  string code = 1;
}

message ApproveUserLinkResponse {
  // The User just Linked.
  LinkedUser user = 1;
}

message ListLinkedUsersRequest {}

message ListLinkedUsersResponse {
  repeated LinkedUser users = 1;
}

message UnlinkLinkedUserRequest {
  // The Link's id, as `LinkedUser.id`.
  string id = 1;
}

message UnlinkLinkedUserResponse {}

message StartUserLinkRequest {
  // The User's id on the Server.
  int64 user_id = 1;
  // The User's name, which their Account's list of Users shows: up to 100 characters, cut there if
  // longer.
  string name = 2;
}

message StartUserLinkResponse {
  // What the User's Server shows and they enter on the Hub, such as `BDFH-JKLM`.
  string user_code = 1;
  // How long the code works.
  int32 expires_in_seconds = 2;
}

message GetUserLinkRequest {
  // The User's id on the Server.
  int64 user_id = 1;
}

message GetUserLinkResponse {
  // The email of the Account the User is Linked to, or empty while they aren't.
  string account = 1;
}

message UnlinkUserRequest {
  // The User's id on the Server.
  int64 user_id = 1;
}

message UnlinkUserResponse {}

// A User an Admin created from an Account, waiting for it to accept them.
message UserInvite {
  // The invite's id, a UUID.
  string id = 1;
  // The User's name on their Server.
  string name = 2;
  // The name of the Linked Server the User is on.
  string server_name = 3;
  // When the Admin created them, in seconds since the Unix epoch.
  int64 invited_at = 4;
}

message ListUserInvitesRequest {}

message ListUserInvitesResponse {
  repeated UserInvite invites = 1;
}

message AcceptUserInviteRequest {
  // The invite's id, as `UserInvite.id`.
  string id = 1;
}

message AcceptUserInviteResponse {
  // The User just Linked.
  LinkedUser user = 1;
}

message GetServerSignInRequest {
  // The sign-in's id, from the page's address.
  string id = 1;
}

message GetServerSignInResponse {
  // The name of the Linked Server it signs in to.
  string server_name = 1;
  // The name of the signed-in Account's User on that Server, or empty if it has none there.
  string user_name = 2;
}

message ApproveServerSignInRequest {
  // The sign-in's id, from the page's address.
  string id = 1;
}

message ApproveServerSignInResponse {
  // Where to send the person back to, on the Server.
  string return_url = 1;
}

message InviteUserRequest {
  // The User's id on the Server.
  int64 user_id = 1;
  // The User's name, which the Account's list of invites shows: up to 100 characters, cut there if
  // longer.
  string name = 2;
  // The email of the Account to ask, in any case.
  string email = 3;
}

message InviteUserResponse {}

message StartServerSignInRequest {
  // Where the Hub's page sends the person once they approve: an `http` or `https` address on the
  // Server. Fails with `invalid_argument` for any other.
  string return_url = 1;
}

message StartServerSignInResponse {
  // What the Server polls with. A secret: only the Server and the browser that started see it.
  string device_code = 1;
  // The sign-in's id: the Hub's page for it is `/server-sign-in/<id>`.
  string id = 2;
  // How long both work.
  int32 expires_in_seconds = 3;
}

message PollServerSignInRequest {
  string device_code = 1;
}

message PollServerSignInResponse {
  // Empty until the sign-in is approved. Then a JWT the Hub signed as `PollServerLinkResponse`'s
  // is: `sub` is the User's id on the Server, `aud` the Linked Server's id, and it expires 5
  // minutes after it was made.
  string token = 1;
}
