syntax = "proto3";

package nama.v1;

import "nama/v1/page.proto";

// Fixing Matches by hand: finding titles in the title sources, and Matching items to them.
//
// A Match set or cleared here is pinned to what the item's file names: the title and year (and
// ID hint) of a Movie, or of the Show an Episode is in. Automatic Matching follows the pin instead
// of searching, so it holds when the file changes, or is renamed to a name that still says the same
// title, year and ID hint, and new Episodes of a pinned Show Match the pinned Show.
service MatchService {
  // Searches the enabled title sources for titles, best fit first, or only a Library's, in its
  // order. Fails with `invalid_argument` if the kind is unspecified or the title blank, with
  // `not_found` if there is no such Library, and with `unavailable` if no title source is enabled
  // or one failed.
  rpc SearchTitles(SearchTitlesRequest) returns (SearchTitlesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Matches an item to a title and pins the Match. For a Movie, the title is a Movie, and every
  // item in the Library named the same way is Matched to it. For an Episode, the title is its
  // Show, and every Episode in the Library named as being in the same Show is Matched again
  // through that Show's Seasons; an Episode the Show doesn't have is Unmatched. Given
  // `matched_title` in place of the item, it does so for each name the items Matched to that Movie
  // or Show bear, in one change. Fails with `not_found` if there is no such item, Library or
  // title, with `invalid_argument` if the id is missing or names no title, and with
  // `unavailable` if no title source can answer, in which case nothing changes.
  rpc SetMatch(SetMatchRequest) returns (SetMatchResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Removes an item's Match and pins it Unmatched, so automatic Matching leaves it so. Like
  // `SetMatch`, this applies to every item in the Library named the same way, and for an Episode
  // to every Episode of its Show, and given `matched_title`, to each name the items Matched to
  // that Movie or Show bear. `ListUnmatchedItems` then lists them with
  // `UNMATCHED_REASON_CLEARED_BY_HAND`. Fails with `not_found` if there is no such item, Library
  // or title.
  rpc ClearMatch(ClearMatchRequest) returns (ClearMatchResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Lists a page of the items of a Library that need a Match, in `sort`'s order: those Matching
  // left Unmatched, those it hasn't Matched yet, such as when no title source in its order searches, and
  // those pinned Unmatched with `ClearMatch`, with `UNMATCHED_REASON_CLEARED_BY_HAND`. The first
  // page also lists the Library's files whose names didn't parse, which an Admin fixes by
  // renaming. Fails with `not_found` if there is no such Library, and with `invalid_argument` if
  // `page.token` isn't one a call with the same `filter`, `sort` and `direction` returned.
  rpc ListUnmatchedItems(ListUnmatchedItemsRequest) returns (ListUnmatchedItemsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Whether a title is a Movie or a Show.
enum TitleKind {
  TITLE_KIND_UNSPECIFIED = 0;
  TITLE_KIND_MOVIE = 1;
  TITLE_KIND_SHOW = 2;
}

// An id of a title in a title source: a namespace and a value, such as `tmdb` and `603`.
// Movies and Shows have separate id spaces.
message ExternalId {
  reserved 1, 2, 3;
  reserved "tmdb", "imdb", "tvdb";
  // Who defines the value: lowercase ASCII letters and digits, such as `tmdb`, `imdb` or `tvdb`.
  string namespace = 4;
  // The id there. Never empty; the Server passes it on without reading it.
  string value = 5;
}

// A title a search found.
message TitleCandidate {
  // The id to pass to `SetMatch`.
  ExternalId id = 1;
  // The title, in its title source's language.
  string title = 2;
  // The title in its original language, if the title source has it.
  optional string original_title = 3;
  // The year a Movie was released or a Show first aired, if known.
  optional int32 year = 4;
  // Its Poster's URL on this Server, if its title source has one. Unset on `tied_titles`.
  optional string poster_url = 5;
}

message SearchTitlesRequest {
  // Must not be `TITLE_KIND_UNSPECIFIED`.
  TitleKind kind = 1;
  // Must not be blank.
  string title = 2;
  // The year a Movie was released or a Show first aired, to narrow the search.
  optional int32 year = 3;
  // The Library whose title sources to search, in its order. Unset searches every enabled one.
  optional int64 library_id = 4;
}

message SearchTitlesResponse {
  repeated TitleCandidate candidates = 1;
}

message SetMatchRequest {
  // The item to Match. Unset when `matched_title` is set.
  int64 item_id = 1;
  // The Movie, or for an Episode the Show, to Match it to, as `SearchTitles` gave it.
  ExternalId title_id = 2;
  // In place of `item_id`, a Movie or Show whose every item to Match.
  MatchedTitle matched_title = 3;
}

// A Movie or Show some items of a Library are Matched to, named as browsing names it.
message MatchedTitle {
  // The Library it is in, whose kind says whether it is a Movie or a Show.
  int64 library_id = 1;
  // Its id, as `BrowseService.ListMovies` or `ListShows` gave it.
  ExternalId id = 2;
}

message SetMatchResponse {
  // How many items are now Matched.
  uint64 matched = 1;
  // How many items are now Unmatched: Episodes the Show doesn't have.
  uint64 unmatched = 2;
}

message ClearMatchRequest {
  // The item whose Match to clear. Unset when `matched_title` is set.
  int64 item_id = 1;
  // In place of `item_id`, a Movie or Show whose every item's Match to clear.
  MatchedTitle matched_title = 2;
}

message ClearMatchResponse {
  // How many items are now Unmatched.
  uint64 unmatched = 1;
}

message ListUnmatchedItemsRequest {
  reserved 1;
  reserved "library_id";
  // Which items to list.
  UnmatchedItemFilter filter = 2;
  // The order to list them in.
  UnmatchedItemSort sort = 3;
  // Which way `sort` runs. Unspecified lists by path from A, and the item found most recently
  // first.
  SortDirection direction = 5;
  // The page of items to list.
  PageRequest page = 4;
}

// Which items `ListUnmatchedItems` lists.
message UnmatchedItemFilter {
  // The Library whose items to list.
  int64 library_id = 1;
}

// The order `ListUnmatchedItems` lists items in, each tie broken by item id.
enum UnmatchedItemSort {
  // `UNMATCHED_ITEM_SORT_PATH`.
  UNMATCHED_ITEM_SORT_UNSPECIFIED = 0;
  // By the path of the file that holds the item.
  UNMATCHED_ITEM_SORT_PATH = 1;
  // By when a scan found the item.
  UNMATCHED_ITEM_SORT_FOUND = 2;
}

message ListUnmatchedItemsResponse {
  // The page's items.
  repeated UnmatchedItem items = 1;
  // On the first page only, the absolute paths of the Library's files whose names don't follow
  // the naming conventions, by path. They hold no items, so nothing can Match them and there's no
  // item to pass to `SetMatch`: renaming the file and rescanning the Library is the fix.
  repeated string unparsed_paths = 2;
  // The next page's token, and on the first page how many items the Library has that need a
  // Match.
  PageResponse page = 3;
}

// An item that needs a Match, and what its file's name was parsed as. `kind`, `title` and `year`
// are what to pass to `SearchTitles` to find its title.
message UnmatchedItem {
  // The item to pass to `SetMatch`.
  int64 item_id = 1;
  // The absolute path of the file that holds it.
  string path = 2;
  // `TITLE_KIND_MOVIE` for a Movie, or `TITLE_KIND_SHOW` for an Episode of a Show.
  TitleKind kind = 3;
  // The Movie's title, or the title of the Show the Episode is in.
  string title = 4;
  // The year the Movie was released or the Show first aired, if the name says.
  optional int32 year = 5;
  // For an Episode, its Season number; 0 holds specials.
  optional int32 season = 6;
  // For an Episode, its number within the Season.
  optional int32 episode = 7;
  // Why the item is Unmatched.
  UnmatchedReason reason = 8;
  // For `UNMATCHED_REASON_AMBIGUOUS`, the titles that fit about as well as each other, best fit
  // first, to pass to `SetMatch`.
  repeated TitleCandidate tied_titles = 9;
  // The Version that holds it, to play it by.
  int64 version_id = 10;
}

// Why an item is Unmatched, which says how to fix it.
enum UnmatchedReason {
  // Matching hasn't decided about the item yet, such as when a title source failed, or left it
  // Unmatched for a reason it doesn't store.
  UNMATCHED_REASON_UNSPECIFIED = 0;
  // More than one title fits about as well, so picking one of `tied_titles` fixes it.
  UNMATCHED_REASON_AMBIGUOUS = 1;
  // No title the search found fits well enough. A rename or an ID Hint may fix it.
  UNMATCHED_REASON_NO_TITLE_FITS = 2;
  // The item's ID Hint names no title the title source has.
  UNMATCHED_REASON_UNKNOWN_ID_HINT = 3;
  // An Episode whose Show, found by Matching or picked by hand, has no such Season or Episode.
  // Matching it to another Show may fix it.
  UNMATCHED_REASON_NOT_IN_SHOW = 4;
  // An admin cleared its Match with `ClearMatch`; `SetMatch` Matches it again.
  UNMATCHED_REASON_CLEARED_BY_HAND = 5;
  // Matching hasn't decided about the item because no title source in its Library's
  // `title_sources` is enabled, running and searches. Enabling one, or adding one to the order,
  // lets the next scan decide it.
  UNMATCHED_REASON_NO_SEARCHING_SOURCE = 6;
}
