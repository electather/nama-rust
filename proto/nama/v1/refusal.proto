syntax = "proto3";

package nama.v1;

// Why the Server refused a request (ADR 0019). Every error a client can cause carries one, as a
// Connect error detail of type `nama.v1.Refusal`; server-side failures (`internal`) carry none.
// The English text stays in the error's `message`. Decode the detail's `value`: its `debug` holds
// the same Refusal as JSON, for people reading responses by hand.
message Refusal {
  // The rule the request broke. Each reason always comes with the same Connect code, given below.
  RefusalReason reason = 1;
  // The request field the refusal is about, as a path (`name`, `season.show_id`), or empty if it
  // is about no one field.
  string field = 2;
  // The values the message mentions, so a client can say it in another language. Keys are
  // lowerCamelCase with the unit in the key (AIP-193); each reason lists its own.
  map<string, string> params = 3;
}

// The rules a request can break. Reasons are API contract: one is never renamed or reused. A
// client that gets one it doesn't know sees `REFUSAL_REASON_UNSPECIFIED`, and shows the message.
enum RefusalReason {
  // A reason this client doesn't know; read the message. The Server never sends it.
  REFUSAL_REASON_UNSPECIFIED = 0;

  // `unauthenticated`: the call needs a signed-in Device.
  REFUSAL_REASON_SIGN_IN_REQUIRED = 1;
  // `permission_denied`: the call needs a Permission the caller lacks. Params: `permission`, the
  // `Permission` value's name (`PERMISSION_MANAGE_USERS`).
  REFUSAL_REASON_PERMISSION_REQUIRED = 2;
  // `unauthenticated`: no User has this name and password. Which of the two is wrong isn't said.
  REFUSAL_REASON_WRONG_NAME_OR_PASSWORD = 3;
  // `unauthenticated`: the password given isn't the User's.
  REFUSAL_REASON_WRONG_PASSWORD = 4;
  // `unauthenticated`: the calling Device was signed out before its change was made.
  REFUSAL_REASON_SIGNED_OUT = 5;
  // `resource_exhausted`: too many attempts failed lately. Params: `retryAfterSeconds`, also sent
  // as the `Retry-After` header.
  REFUSAL_REASON_TOO_MANY_ATTEMPTS = 6;

  // `permission_denied`: the Setup Code is wrong.
  REFUSAL_REASON_WRONG_SETUP_CODE = 7;
  // `failed_precondition`: the Server already has Users, so it can't be set up again.
  REFUSAL_REASON_ALREADY_SET_UP = 8;

  // `not_found`: no unexpired Sign-in Code matches.
  REFUSAL_REASON_SIGN_IN_CODE_NOT_FOUND = 9;
  // `failed_precondition`: the Sign-in Code was already approved.
  REFUSAL_REASON_SIGN_IN_CODE_ALREADY_APPROVED = 10;
  // `resource_exhausted`: too many sign-ins with a Sign-in Code are waiting.
  REFUSAL_REASON_TOO_MANY_PENDING_SIGN_INS = 11;
  // `not_found`: no sign-in is waiting on the handle.
  REFUSAL_REASON_HANDLE_NOT_FOUND = 12;

  // `not_found`: no User has the ID, or none the caller may see.
  REFUSAL_REASON_USER_NOT_FOUND = 13;
  // `already_exists`: another User already has the name, ignoring case.
  REFUSAL_REASON_USER_NAME_TAKEN = 14;
  // `failed_precondition`: the change would leave no User with `PERMISSION_ADMIN`.
  REFUSAL_REASON_LAST_ADMIN = 15;
  // `failed_precondition`: a User changes their own password with `ChangePassword`, not
  // `ResetPassword`.
  REFUSAL_REASON_OWN_PASSWORD_RESET = 16;
  // `not_found`: the User has no Device with the ID.
  REFUSAL_REASON_DEVICE_NOT_FOUND = 17;

  // `invalid_argument`: a required field is missing or blank. For a Plugin setting, params:
  // `settingKey`.
  REFUSAL_REASON_FIELD_REQUIRED = 18;
  // `invalid_argument`: an enum field is unset, or set to a value this Server doesn't know.
  REFUSAL_REASON_UNKNOWN_ENUM_VALUE = 19;

  // `not_found`: there is no Library with the ID. Params: `libraryId`.
  REFUSAL_REASON_LIBRARY_NOT_FOUND = 20;
  // `already_exists`: a folder already belongs to another Library. Params: `folder`, `library`
  // (the other Library's name).
  REFUSAL_REASON_FOLDER_TAKEN = 21;
  // `invalid_argument`: the Library holds another kind of media. Params: `libraryKind`, the kind
  // the call needs (`movies` or `shows`).
  REFUSAL_REASON_WRONG_LIBRARY_KIND = 22;
  // `not_found`: nothing in the Library is Matched to the id.
  REFUSAL_REASON_NOTHING_MATCHED = 23;
  // `not_found`: the Show has no such Season in the Library.
  REFUSAL_REASON_SEASON_NOT_FOUND = 24;
  // `not_found`: there is no such Version.
  REFUSAL_REASON_VERSION_NOT_FOUND = 25;
  // `invalid_argument`: the duration isn't more than zero and less than 2^63 milliseconds.
  // Params: `minDurationMs`, `maxDurationMs`.
  REFUSAL_REASON_DURATION_OUT_OF_RANGE = 26;

  // `not_found`: there is no item with the ID. Params: `itemId`.
  REFUSAL_REASON_ITEM_NOT_FOUND = 27;
  // `invalid_argument`: the metadata source has no title with the id, or can't look titles up by
  // it. Params: `titleId`, as the message shows it (`tmdb-949`), and for a Season of a Show
  // `seasonNumber`.
  REFUSAL_REASON_UNKNOWN_TITLE = 28;
  // `unavailable`: no metadata Provider is enabled, or it failed.
  REFUSAL_REASON_NO_METADATA_PROVIDER = 29;

  // `invalid_argument`: a User's or Device's name, trimmed, is too short or too long. Params:
  // `minLength`, `maxLength`, in characters.
  REFUSAL_REASON_NAME_LENGTH = 30;
  // `invalid_argument`: the Authenticator Plugin rejects the password. Its own text is the message.
  REFUSAL_REASON_PASSWORD_REJECTED = 31;
  // `invalid_argument`: a Library's folder, or the segment folder, isn't an absolute path. Params:
  // `folder`.
  REFUSAL_REASON_FOLDER_NOT_ABSOLUTE = 32;
  // `invalid_argument`: a Library's folder can't be found. Params: `folder`.
  REFUSAL_REASON_FOLDER_NOT_FOUND = 33;
  // `invalid_argument`: a Library's folder isn't a directory the Server can read. Params: `folder`.
  REFUSAL_REASON_FOLDER_NOT_READABLE = 34;
  // `invalid_argument`: a Library's folder resolves to a path that isn't valid UTF-8. Params:
  // `folder`, `resolvedPath` (with what isn't UTF-8 replaced).
  REFUSAL_REASON_FOLDER_NOT_UTF8 = 35;
  // `invalid_argument`: a folder is named more than once in the request. Params: `folder`.
  REFUSAL_REASON_FOLDER_REPEATED = 36;

  // `failed_precondition`: the call needs Recent Authentication, which the calling Device gets back
  // with `SignInService.Reauthenticate`.
  REFUSAL_REASON_RECENT_AUTHENTICATION_REQUIRED = 37;

  // `not_found`: there is no Request with the ID, or none the caller may see. Params: `requestId`.
  REFUSAL_REASON_REQUEST_NOT_FOUND = 38;
  // `failed_precondition`: the Movie, or every aired Episode of the Season, is already Matched in a
  // Library, so it can't be Requested. Params: `tmdbId` (a Season's Show's), and for a Season
  // `seasonNumber`.
  REFUSAL_REASON_ALREADY_IN_LIBRARY = 39;
  // `failed_precondition`: the Request isn't Pending, so it can't be approved, declined or withdrawn
  // from. Params: `requestId`.
  REFUSAL_REASON_REQUEST_NOT_PENDING = 40;

  // `not_found`: no Plugin has the id. Params: `pluginId`.
  REFUSAL_REASON_PLUGIN_NOT_FOUND = 41;
  // `failed_precondition`: no other enabled Plugin provides an Authenticator, so disabling this
  // one could leave nobody able to sign in. Params: `pluginId`.
  REFUSAL_REASON_LAST_AUTHENTICATOR = 42;
  // `invalid_argument`: a Plugin setting's value isn't of the kind its schema declares. Params:
  // `settingKey`, and `settingKind`, the `SettingKind` value's name (`SETTING_KIND_TEXT`).
  REFUSAL_REASON_SETTING_WRONG_KIND = 43;

  // `failed_precondition`: the caller isn't one of the Request's Requesters, so they can't withdraw
  // from it. Params: `requestId`.
  REFUSAL_REASON_NOT_A_REQUESTER = 44;

  // `failed_precondition`: a Plugin's settings check failed, ran too long or crashed, or the Plugin
  // has none. The message says why in plain words: the Plugin's own for a failed check, which can't
  // be translated, or else the Server's. Params: `pluginId`, and `timeoutSeconds` for a check that ran
  // too long. A refused save names the choice setting it couldn't check in `field` and `settingKey`.
  REFUSAL_REASON_SETTINGS_CHECK_FAILED = 45;

  // `failed_precondition`: the Request isn't Failed, so it can't be retried. Params: `requestId`.
  REFUSAL_REASON_REQUEST_NOT_FAILED = 46;

  // `failed_precondition`: a choice setting's value isn't one of the choices the Plugin's settings
  // check offers. Params: `pluginId`, `settingKey`, `settingValue`.
  REFUSAL_REASON_CHOICE_NOT_OFFERED = 47;

  // `failed_precondition`: another enabled Plugin already provides the Fulfiller for a kind of title
  // the Plugin provides one for, and each kind has at most one. Params: `pluginId`,
  // `fulfillerPluginId`, the Plugin that has it, and `titleKind`, `Movie` or `Show`.
  REFUSAL_REASON_FULFILLER_TAKEN = 48;

  // `not_found`: there is no Followed Show with the ID, or none the caller may see. Params:
  // `followedShowId`.
  REFUSAL_REASON_FOLLOWED_SHOW_NOT_FOUND = 49;
  // `failed_precondition`: the Followed Show isn't Pending, so it can't be approved or declined.
  // Params: `followedShowId`.
  REFUSAL_REASON_FOLLOWED_SHOW_NOT_PENDING = 50;
  // `failed_precondition`: the caller isn't one of the Followed Show's Requesters, so they can't
  // withdraw from it. Params: `followedShowId`.
  REFUSAL_REASON_NOT_A_FOLLOWED_SHOW_REQUESTER = 51;

  // `failed_precondition`: the Server refused the Plugin, such as an Installed Plugin built for
  // another Nama API version, so it can't be enabled. The message says why. Params: `pluginId`,
  // `reason` (in plain words, as `PluginSummary.refused_reason`).
  REFUSAL_REASON_PLUGIN_REFUSED = 52;

  // `invalid_argument`: the field isn't an http or https URL with a host, or has a query or fragment
  // where links are added to its end.
  REFUSAL_REASON_NOT_A_URL = 53;
  // `invalid_argument`: a Fulfiller's Qualities name the same profile twice, or two Qualities
  // share a name, ignoring case. `field` names the second, such as `qualities[1].name`.
  REFUSAL_REASON_QUALITY_REPEATED = 54;
  // `invalid_argument`: a Fulfiller's Qualities don't mark exactly one as the default.
  REFUSAL_REASON_DEFAULT_QUALITY_REQUIRED = 55;
  // `invalid_argument`: the Quality named isn't on the list of the Fulfiller the Request goes to,
  // or that Fulfiller has none or none is enabled. `field` is `quality` or `quality_id`. Params:
  // `qualityId`.
  REFUSAL_REASON_QUALITY_NOT_OFFERED = 56;
  // `permission_denied`: the caller named a Quality, even the default, without
  // `PERMISSION_CHOOSE_QUALITY`. `field` is `quality`.
  REFUSAL_REASON_QUALITY_NOT_ALLOWED = 57;
  // `invalid_argument`: the page token isn't one the Server handed out for the same request, such
  // as one listing Requests in another state. `field` is `page_token`.
  REFUSAL_REASON_PAGE_TOKEN_INVALID = 58;
  // `invalid_argument`: the Quality named isn't the Show's, which each of its Seasons takes: an
  // asker named another, or a Request manager changed it once a Season was handed off or
  // Approved, which fixes it. `field` is `quality` or `quality_id`. Params: `qualityId`, and the
  // Show's Quality as `showQualityId` and `showQualityName`.
  REFUSAL_REASON_SHOW_HAS_QUALITY = 59;
  // `resource_exhausted`: only a Transcode would play the Version on this Device, and the Server
  // is already running as many as its Playback settings allow. Params: `maxTranscodes`.
  REFUSAL_REASON_SERVER_BUSY = 60;
  // `invalid_argument`: the Playback settings name a GPU their hardware acceleration didn't pass
  // its test on when the Server started and that isn't the one saved with it, or name one with
  // Automatic, Off, NVENC or VideoToolbox, which take none. `field` is `settings.gpu`. Params:
  // `gpuId`.
  REFUSAL_REASON_GPU_NOT_OFFERED = 61;
  // `not_found`: the Version has no Track of the kind picked at the place named. `field` is
  // `track`.
  REFUSAL_REASON_TRACK_NOT_FOUND = 62;
  // `failed_precondition`: what a delete names is in a Library folder the Server couldn't write
  // to when it last scanned the Library, so nothing is deleted. Params: `folder`.
  REFUSAL_REASON_FOLDER_READ_ONLY = 63;
  // `invalid_argument`: the language named isn't an ISO 639 code. `field` is
  // `subtitle.language` or `audio.language`. Params: `language`.
  REFUSAL_REASON_UNKNOWN_LANGUAGE = 64;
  // `invalid_argument`: a Subtitle Preference for forced-only subtitles asks for them only over
  // audio in another language, but forced-only Tracks are for audio in their own. `field` is
  // `subtitle.foreign_audio_only`.
  REFUSAL_REASON_FOREIGN_AUDIO_ONLY_NOT_FULL = 65;
}
