syntax = "proto3";

package nama.v1;

import "nama/v1/playback.proto";

// Facts about a Server that any client can read, before signing in, and the Server's settings.
service ServerService {
  // Returns the Server's name and the version of Nama it runs.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns the Server's settings. Needs `PERMISSION_MANAGE_SETTINGS`.
  rpc GetServerSettings(GetServerSettingsRequest) returns (GetServerSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces the Server's settings. Needs `PERMISSION_MANAGE_SETTINGS`. A `url` that isn't an http
  // or https URL, or has a query or fragment, is refused with `REFUSAL_REASON_NOT_A_URL` naming it,
  // and nothing changes.
  rpc UpdateServerSettings(UpdateServerSettingsRequest) returns (UpdateServerSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Returns the ffmpeg and ffprobe the Server found at startup, which it needs to Remux and
  // Transcode, or why it can't use them; without both it only Direct Plays. Also returns the
  // hardware acceleration that passed its test at startup. Needs `PERMISSION_ADMIN`.
  rpc GetPlaybackStatus(GetPlaybackStatusRequest) returns (GetPlaybackStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns how the Server plays Versions it changes. Needs `PERMISSION_ADMIN`.
  rpc GetPlaybackSettings(GetPlaybackSettingsRequest) returns (GetPlaybackSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces how the Server plays Versions it changes, for plans made from then on, and for
  // running ones too for `keep_behind_minutes`. Needs `PERMISSION_ADMIN`. A `segment_folder` that
  // isn't an absolute path is refused with `REFUSAL_REASON_FOLDER_NOT_ABSOLUTE` naming it, a
  // `max_transcodes` or `keep_behind_minutes` set to 0 with `REFUSAL_REASON_FIELD_REQUIRED` naming
  // it, and nothing changes.
  rpc UpdatePlaybackSettings(UpdatePlaybackSettingsRequest) returns (UpdatePlaybackSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Returns how the Server resizes Posters and Backdrops. Needs `PERMISSION_MANAGE_SETTINGS`.
  rpc GetImageSettings(GetImageSettingsRequest) returns (GetImageSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces how the Server resizes Posters and Backdrops, from the next image asked for. Needs
  // `PERMISSION_MANAGE_SETTINGS`. A `resized_cache_mib` set to 0 is refused with
  // `REFUSAL_REASON_FIELD_REQUIRED` naming it, and nothing changes.
  rpc UpdateImageSettings(UpdateImageSettingsRequest) returns (UpdateImageSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  // The Server's display name, set by its admin.
  string name = 1;
  // The version of the Server program, e.g. "0.1.0".
  string version = 2;
  // Whether the Server has no Users yet, so the first Admin still has to be created with
  // `SignInService.Setup`.
  bool setup_required = 3;
  // The widths, in pixels and smallest first, an image's URL may ask for by adding `?width=` and
  // one of them, such as `/media/artwork/tmdb/%2Fposter.jpg?width=640`. Any other width is
  // refused with HTTP 400. While resizing is on (`ImageSettings.resize_images`), the Server sends
  // the image as a JPEG that wide, with its shape kept, or the stored image if it is no wider, an
  // SVG, has transparency or is over 12 megapixels. While it's off, the width is ignored.
  repeated uint32 image_widths = 4;
}

message GetServerSettingsRequest {}

message GetServerSettingsResponse {
  ServerSettings settings = 1;
}

message UpdateServerSettingsRequest {
  ServerSettings settings = 1;
}

message UpdateServerSettingsResponse {
  // The settings as saved.
  ServerSettings settings = 1;
}

// What an admin sets about the Server as a whole.
message ServerSettings {
  // The address people reach the Server at, such as `https://nama.example.com`, which links to the
  // web app in notifications start with. Empty, the default, for none: notifications have no links.
  string url = 1;
}

message GetPlaybackStatusRequest {}

message GetPlaybackStatusResponse {
  // ffmpeg, unset when the Server has none it can use.
  FoundProgram ffmpeg = 1;
  // ffprobe, unset when the Server has none it can use.
  FoundProgram ffprobe = 2;
  // Why the Server can't use ffmpeg, in plain words, such as "ffmpeg wasn't found at the
  // configured path /opt/ffmpeg". Empty when it can.
  string ffmpeg_problem = 3;
  // Why the Server can't use ffprobe, in plain words. Empty when it can.
  string ffprobe_problem = 4;
  // The hardware acceleration APIs that passed a test encode at startup, one per API and GPU, in the
  // order Automatic prefers them. Empty without ffmpeg, a GPU, or an ffmpeg built for one.
  repeated FoundHardware hardware = 5;
  // Whether ffmpeg has libx264, which a Transcode encodes with in software. Without it no
  // Transcode runs, even on hardware. False when the Server can't use ffmpeg.
  bool has_libx264 = 6;
  // Whether ffmpeg has zscale, which tone-maps HDR to SDR in software. Without it, a Transcode
  // tone-maps only on hardware whose `tone_maps` is set. False when the Server can't use ffmpeg.
  bool has_zscale = 7;
  // Whether the Server Transcodes at all, in software or on hardware. When it doesn't, it still
  // Direct Plays, and Remuxes if it has ffmpeg and ffprobe.
  bool can_transcode = 8;
}

// A hardware acceleration API that passed its test encode at startup, on one GPU.
message FoundHardware {
  // Which API. Never `HARDWARE_ACCELERATION_UNSPECIFIED` or `HARDWARE_ACCELERATION_OFF`.
  HardwareAcceleration api = 1;
  // The GPU it runs on. Unset where ffmpeg picks one: for NVENC, VideoToolbox, and VAAPI and QSV
  // when the Server found no GPU.
  Gpu gpu = 5;
  // Whether it also passed tone-mapping HDR to SDR on the GPU. `tone_mapping` says what
  // tone-maps on it.
  bool tone_maps = 2;
  // What tone-maps HDR to SDR in a Transcode on it, when nothing is burned into the picture.
  ToneMapping tone_mapping = 3;
  // Whether Automatic picks it.
  bool automatic = 4;
}

// A GPU the Server found.
message Gpu {
  // Its PCI address, such as `0000:03:00.0`, which stays the same across restarts.
  string id = 1;
  // Its name in plain words, such as "AMD Radeon RX 9070 XT" or "Intel integrated GPU".
  string name = 2;
}

// What tone-maps HDR to SDR in a Transcode.
enum ToneMapping {
  // Not said, as by a Server from before this was added.
  TONE_MAPPING_UNSPECIFIED = 0;
  // Nothing: HDR's colours look washed out on an SDR screen.
  TONE_MAPPING_NONE = 1;
  // The GPU the Transcode runs on.
  TONE_MAPPING_GPU = 2;
  // ffmpeg's zscale, in software.
  TONE_MAPPING_SOFTWARE = 3;
}

// What a Transcode decodes, scales, tone-maps and encodes its video with.
enum HardwareAcceleration {
  // Automatic: the first API that passed its test encode at startup, or software without one.
  HARDWARE_ACCELERATION_UNSPECIFIED = 0;
  // Software only.
  HARDWARE_ACCELERATION_OFF = 1;
  // VAAPI, for Intel and AMD on Linux.
  HARDWARE_ACCELERATION_VAAPI = 2;
  // Intel Quick Sync Video.
  HARDWARE_ACCELERATION_QSV = 3;
  // NVIDIA NVENC and NVDEC.
  HARDWARE_ACCELERATION_NVENC = 4;
  // Apple VideoToolbox.
  HARDWARE_ACCELERATION_VIDEOTOOLBOX = 5;
}

// A program the Server found and runs, such as ffmpeg.
message FoundProgram {
  // Where it is, such as `/usr/bin/ffmpeg`.
  string path = 1;
  // Its version as it reports it, such as `7.1.1`.
  string version = 2;
}

message GetPlaybackSettingsRequest {}

message GetPlaybackSettingsResponse {
  PlaybackSettings settings = 1;
}

message UpdatePlaybackSettingsRequest {
  PlaybackSettings settings = 1;
}

message UpdatePlaybackSettingsResponse {
  // The settings as saved.
  PlaybackSettings settings = 1;
}

// What an admin sets about how the Server plays Versions it changes.
message PlaybackSettings {
  // The folder a Remux or Transcode writes its segment files to, an absolute path such as a
  // tmpfs's. Each plan's files go in a folder of their own inside it: those further behind
  // playback than `keep_behind_minutes` are deleted as it plays, and the rest a minute after the
  // plan was last asked for. Empty, the default, for `transcodes` in the Server's data folder.
  string segment_folder = 1;
  // The most Transcodes the Server runs at once, at least 1; Remuxes don't count. A plan that
  // only a Transcode would play is refused while that many run. Unset for the default: no limit
  // while Transcodes use hardware acceleration, and 2 while they run in software.
  optional uint32 max_transcodes = 2;
  // The Playback Limit for a Device whose address isn't on the local network, until its User
  // picks one in the player. `PLAYBACK_LIMIT_ORIGINAL`, the default, for none; unset is taken as
  // that.
  PlaybackLimit remote_playback_limit = 3;
  // What Transcodes run on. One that didn't pass its test at startup leaves them in software.
  HardwareAcceleration hardware_acceleration = 4;
  // The GPU `hardware_acceleration` runs every Transcode on: one it passed its test on at startup,
  // as `GetPlaybackStatusResponse.hardware` lists them, or the one already saved. Unset for the
  // first GPU it passed on, and always for Automatic, Off, NVENC and VideoToolbox. A saved GPU
  // missing or failing its test at startup leaves Transcodes in software, and keeps its last
  // name. A save reads only its `id`.
  Gpu gpu = 5;
  // How many minutes behind the last segment asked for a running Remux or Transcode keeps its
  // files, so skipping back that far plays at once, at least 1. Unset for the default, 5. A change
  // applies to running plans from the Server's next look at them, within about 10 seconds.
  optional uint32 keep_behind_minutes = 6;
}

message GetImageSettingsRequest {}

message GetImageSettingsResponse {
  ImageSettings settings = 1;
}

message UpdateImageSettingsRequest {
  ImageSettings settings = 1;
}

message UpdateImageSettingsResponse {
  // The settings as saved.
  ImageSettings settings = 1;
}

// What an admin sets about how the Server resizes Posters and Backdrops.
message ImageSettings {
  // Whether an image asked for at a width (`GetServerInfoResponse.image_widths`) is sent resized
  // to it. Off, every image is sent as stored, and the browser scales it. On by default.
  bool resize_images = 1;
  // The most disk, in MiB, the resized copies the Server keeps take, at least 1. Once a new copy
  // takes them past it, those least recently sent are deleted until they fit. Unset for the
  // default, 1024.
  optional uint32 resized_cache_mib = 2;
}
