syntax = "proto3";

package nama.v1;

import "nama/v1/browse.proto";
import "nama/v1/event.proto";
import "nama/v1/playback.proto";

// Facts about a Server that any client can read, before signing in, and the Server's settings.
service ServerService {
  // Returns the Server's name and the version of Nama it runs.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns the Server's settings. Needs `PERMISSION_MANAGE_SETTINGS`.
  rpc GetServerSettings(GetServerSettingsRequest) returns (GetServerSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces the Server's settings. Needs `PERMISSION_MANAGE_SETTINGS`. A `url` that isn't an http
  // or https URL, or has a user name, password, query or fragment, is refused with
  // `REFUSAL_REASON_NOT_A_URL` naming it, and nothing changes.
  rpc UpdateServerSettings(UpdateServerSettingsRequest) returns (UpdateServerSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Returns the ffmpeg and ffprobe the Server found at startup, which it needs to Remux and
  // Transcode, or why it can't use them; without both it only Direct Plays. Also returns the
  // hardware acceleration that passed its test at startup. Needs `PERMISSION_ADMIN`.
  rpc GetPlaybackStatus(GetPlaybackStatusRequest) returns (GetPlaybackStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns how the Server plays Versions it changes. Needs `PERMISSION_ADMIN`.
  rpc GetPlaybackSettings(GetPlaybackSettingsRequest) returns (GetPlaybackSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces how the Server plays Versions it changes, for plans made from then on, and for
  // running ones too for `keep_behind_minutes`. Needs `PERMISSION_ADMIN`. A `segment_folder` that
  // isn't an absolute path is refused with `REFUSAL_REASON_FOLDER_NOT_ABSOLUTE` naming it, a
  // `max_transcodes` or `keep_behind_minutes` set to 0 with `REFUSAL_REASON_FIELD_REQUIRED` naming
  // it, a `segment_folder` the Server can't create or write a file in with
  // `REFUSAL_REASON_FOLDER_NOT_WRITABLE` naming it, and nothing changes.
  rpc UpdatePlaybackSettings(UpdatePlaybackSettingsRequest) returns (UpdatePlaybackSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Returns how the Server resizes Posters and Backdrops. Needs `PERMISSION_MANAGE_SETTINGS`.
  rpc GetImageSettings(GetImageSettingsRequest) returns (GetImageSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces how the Server resizes Posters and Backdrops, from the next image asked for. Needs
  // `PERMISSION_MANAGE_SETTINGS`. A `resized_cache_mib` set to 0 is refused with
  // `REFUSAL_REASON_FIELD_REQUIRED` naming it, and nothing changes.
  rpc UpdateImageSettings(UpdateImageSettingsRequest) returns (UpdateImageSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Moves the stored images (fetched artwork, Custom Images and Plugin logos) to another store
  // and makes it the one in use: local disk in the data directory for an empty `plugin_id`, or
  // the enabled Plugin with that id serving `EXTENSION_POINT_BLOB_STORE`. Needs
  // `PERMISSION_MANAGE_SETTINGS`. The new store is first checked by writing an object, reading it
  // back and deleting it. The images are then copied across in the background, one at a time,
  // which `GetImageSettingsResponse.switching` follows; until every one is copied, and if the
  // copy fails, the old store stays in use. The old store keeps its copies. Refused with
  // `REFUSAL_REASON_NOT_A_BLOB_STORE` for an id of no enabled Plugin serving the point,
  // `REFUSAL_REASON_IMAGE_STORE_IN_USE` for the store already in use, as a no-op that changes
  // nothing, `REFUSAL_REASON_IMAGE_STORE_SWITCHING` while another switch runs, and
  // `REFUSAL_REASON_IMAGE_STORE_FAILED_CHECK` for a store that fails its check.
  rpc SwitchImageStore(SwitchImageStoreRequest) returns (SwitchImageStoreResponse) {}
  // Returns the default Home layout every User's Home follows, with every Home row Home could
  // show now in its order: each row it doesn't place yet, such as one from a Plugin enabled since
  // it was set, at the end and shown. Needs `PERMISSION_MANAGE_SETTINGS`.
  rpc GetDefaultHomeLayout(GetDefaultHomeLayoutRequest) returns (GetDefaultHomeLayoutResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces the default Home layout, which `BrowseService.ListHomeRows` and `ListFeatured`
  // follow from then on. A row the old layout places and the request doesn't, such as a disabled
  // Plugin's, which `GetDefaultHomeLayout` leaves out, is kept after the row it followed. Needs
  // `PERMISSION_MANAGE_SETTINGS`. A row naming none is refused with
  // `REFUSAL_REASON_FIELD_REQUIRED`, and one with a Kernel row the Server doesn't know with
  // `REFUSAL_REASON_UNKNOWN_ENUM_VALUE`, both naming `layout.rows`, and nothing changes. A row
  // named twice keeps its first place.
  rpc SetDefaultHomeLayout(SetDefaultHomeLayoutRequest) returns (SetDefaultHomeLayoutResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Lists every plan playing now, on every User's Device, oldest first. Needs `PERMISSION_ADMIN`.
  // The Playback events follow each from here on, by plan id.
  rpc ListPlays(ListPlaysRequest) returns (ListPlaysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Stops a plan on any Device, the caller's own included, as its player's `StopPlayback` would,
  // and cuts off its Direct Play's file mid-response. Its `PlaybackEnded` carries `admin_stop`
  // with the message. A plan already stopped is left alone. Needs `PERMISSION_ADMIN`. A message
  // over 200 characters is refused with `REFUSAL_REASON_MESSAGE_TOO_LONG`, and nothing stops.
  rpc StopPlay(StopPlayRequest) returns (StopPlayResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message ListPlaysRequest {}

message ListPlaysResponse {
  repeated Play plays = 1;
}

// A plan playing now.
message Play {
  // How it plays now: as its `PlaybackStarted` told it, or its last `PlaybackChanged`.
  Playback playback = 1;
  // What it plays, as people name it: the Movie's title, or the Show's with the Episode, such as
  // "Dark S01E02", the first one for a file of several. The name the file was found under when it
  // isn't Matched. Empty if its Version was deleted since.
  string title = 2;
  // How far in the Device last said it was in this Version (`ReportProgress`), in milliseconds.
  // Unset until it says.
  optional uint64 position_ms = 3;
  // How long the Version is, as that report said, in milliseconds. 0 until it says.
  uint64 duration_ms = 4;
  // Where its Transcode runs now. Unset for a Direct Play or a Remux.
  TranscodeHardware transcodes_on = 5;
}

// Where a Transcode runs.
message TranscodeHardware {
  // The API it runs on, or `HARDWARE_ACCELERATION_OFF` for software, on the CPU, as after its
  // hardware failed partway.
  HardwareAcceleration api = 1;
  // The GPU it runs on. Unset in software, and where ffmpeg picks one, as for
  // `FoundHardware.gpu`.
  Gpu gpu = 2;
}

message StopPlayRequest {
  // The plan, as `Playback.plan_id` names it.
  uint64 plan_id = 1;
  // What to tell the viewer, at most 200 characters. Empty for nothing.
  string message = 2;
}

message StopPlayResponse {}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  // The Server's display name, set by its admin.
  string name = 1;
  // The version of the Server program, e.g. "0.1.0".
  string version = 2;
  // Whether the Server has no Users yet, so the first Admin still has to be created with
  // `SignInService.Setup`.
  bool setup_required = 3;
  // The widths, in pixels and smallest first, an image's URL may ask for by adding `?width=` and
  // one of them, such as `/media/artwork/tmdb/%2Fposter.jpg?width=640`. Any other width is
  // refused with HTTP 400. While resizing is on (`ImageSettings.resize_images`), the Server sends
  // the image that wide, with its shape kept: as a JPEG XL where the request's `Accept` lists
  // `image/jxl` and it would be at most 7 megapixels, else as a JPEG. It sends the stored image if
  // that is no wider, an SVG, or over 12 megapixels, or has transparency and would be a JPEG.
  // While it's off, the width is ignored.
  repeated uint32 image_widths = 4;
  // Whether the Server exports Diagnostics, because its admin set `OTEL_EXPORTER_OTLP_ENDPOINT`
  // (ADR 0054). Only then does a signed-in web app record its own and POST them as OTLP/HTTP to
  // `/diagnostics/v1/traces`, which the Server forwards there unchanged. That path answers 404
  // while this is false, refuses a body over 256 KiB with HTTP 413, and refuses a Device posting
  // too often with HTTP 429.
  bool exports_diagnostics = 5;
  // Anyone could read this before sign-in; `PlaybackPlan.can_search_subtitles` says it instead.
  reserved 6;
  reserved "searches_subtitles";
}

message GetServerSettingsRequest {}

message GetServerSettingsResponse {
  ServerSettings settings = 1;
}

message UpdateServerSettingsRequest {
  // Required: a request without it is refused, so leaving it out can't reset every setting.
  ServerSettings settings = 1;
}

message UpdateServerSettingsResponse {
  // The settings as saved.
  ServerSettings settings = 1;
}

// What an admin sets about the Server as a whole.
message ServerSettings {
  // The address people reach the Server at, such as `https://nama.example.com`, which links to the
  // web app in notifications start with. Empty, the default, for none: notifications have no links.
  string url = 1;
}

message GetPlaybackStatusRequest {}

message GetPlaybackStatusResponse {
  // ffmpeg, unset when the Server has none it can use.
  FoundProgram ffmpeg = 1;
  // ffprobe, unset when the Server has none it can use.
  FoundProgram ffprobe = 2;
  // Why the Server can't use ffmpeg, in plain words, such as "ffmpeg wasn't found at the
  // configured path /opt/ffmpeg". Empty when it can.
  string ffmpeg_problem = 3;
  // Why the Server can't use ffprobe, in plain words. Empty when it can.
  string ffprobe_problem = 4;
  // The hardware acceleration APIs that passed a test encode at startup, one per API and GPU, in the
  // order Automatic prefers them. Empty without ffmpeg, a GPU, or an ffmpeg built for one.
  repeated FoundHardware hardware = 5;
  // Whether ffmpeg has libx264, which a Transcode encodes with in software. Without it no
  // Transcode runs, even on hardware. False when the Server can't use ffmpeg.
  bool has_libx264 = 6;
  // Whether ffmpeg has zscale, which tone-maps HDR to SDR in software. Without it, a Transcode
  // tone-maps only on hardware whose `tone_maps` is set. False when the Server can't use ffmpeg.
  bool has_zscale = 7;
  // Whether the Server Transcodes at all, in software or on hardware. When it doesn't, it still
  // Direct Plays, and Remuxes if it has ffmpeg and ffprobe.
  bool can_transcode = 8;
}

// A hardware acceleration API that passed its test encode at startup, on one GPU.
message FoundHardware {
  // Which API. Never `HARDWARE_ACCELERATION_UNSPECIFIED` or `HARDWARE_ACCELERATION_OFF`.
  HardwareAcceleration api = 1;
  // The GPU it runs on. Unset where ffmpeg picks one: for NVENC, VideoToolbox, and VAAPI and QSV
  // when the Server found no GPU.
  Gpu gpu = 5;
  // Whether it also passed tone-mapping HDR to SDR on the GPU. `tone_mapping` says what
  // tone-maps on it.
  bool tone_maps = 2;
  // What tone-maps HDR to SDR in a Transcode on it, when nothing is burned into the picture.
  ToneMapping tone_mapping = 3;
  // Whether Automatic picks it.
  bool automatic = 4;
}

// A GPU the Server found.
message Gpu {
  // Its PCI address, such as `0000:03:00.0`, which stays the same across restarts.
  string id = 1;
  // Its name in plain words, such as "AMD Radeon RX 9070 XT" or "Intel integrated GPU".
  string name = 2;
}

// What tone-maps HDR to SDR in a Transcode.
enum ToneMapping {
  // Not said, as by a Server from before this was added.
  TONE_MAPPING_UNSPECIFIED = 0;
  // Nothing: HDR's colours look washed out on an SDR screen.
  TONE_MAPPING_NONE = 1;
  // The GPU the Transcode runs on.
  TONE_MAPPING_GPU = 2;
  // ffmpeg's zscale, in software.
  TONE_MAPPING_SOFTWARE = 3;
}

// What a Transcode decodes, scales, tone-maps and encodes its video with.
enum HardwareAcceleration {
  // Automatic: the first API that passed its test encode at startup, or software without one.
  HARDWARE_ACCELERATION_UNSPECIFIED = 0;
  // Software only.
  HARDWARE_ACCELERATION_OFF = 1;
  // VAAPI, for Intel and AMD on Linux.
  HARDWARE_ACCELERATION_VAAPI = 2;
  // Intel Quick Sync Video.
  HARDWARE_ACCELERATION_QSV = 3;
  // NVIDIA NVENC and NVDEC.
  HARDWARE_ACCELERATION_NVENC = 4;
  // Apple VideoToolbox.
  HARDWARE_ACCELERATION_VIDEOTOOLBOX = 5;
}

// A program the Server found and runs, such as ffmpeg.
message FoundProgram {
  // Where it is, such as `/usr/bin/ffmpeg`.
  string path = 1;
  // Its version as it reports it, such as `7.1.1`.
  string version = 2;
}

message GetPlaybackSettingsRequest {}

message GetPlaybackSettingsResponse {
  PlaybackSettings settings = 1;
}

message UpdatePlaybackSettingsRequest {
  // Required: a request without it is refused, so leaving it out can't reset every setting.
  PlaybackSettings settings = 1;
}

message UpdatePlaybackSettingsResponse {
  // The settings as saved.
  PlaybackSettings settings = 1;
}

// What an admin sets about how the Server plays Versions it changes.
message PlaybackSettings {
  // The folder a Remux or Transcode writes its segment files to, an absolute path such as a
  // tmpfs's. Each plan's files go in a folder of their own inside it: those further behind
  // playback than `keep_behind_minutes` are deleted as it plays, and the rest a minute after the
  // plan was last asked for. Empty, the default, for `transcodes` in the Server's data folder.
  // Saving one creates it and checks the Server can write a file there; a plan creates it again
  // if it's gone, as a tmpfs's is after a reboot.
  string segment_folder = 1;
  // The most Transcodes the Server runs at once, at least 1; Remuxes don't count. A plan that
  // only a Transcode would play is refused while that many run. Unset for the default: 2 at once
  // of those that run on the CPU, in software or tone-mapping HDR in software, and no limit for
  // those that run fully on a GPU.
  optional uint32 max_transcodes = 2;
  // The Playback Limit for a Device whose address isn't on the local network, until its User
  // picks one in the player. `PLAYBACK_LIMIT_ORIGINAL`, the default, for none; unset is taken as
  // that. A value this Server doesn't know is refused.
  PlaybackLimit remote_playback_limit = 3;
  // What Transcodes run on. One that didn't pass its test at startup leaves them in software. A
  // value this Server doesn't know is refused.
  HardwareAcceleration hardware_acceleration = 4;
  // The GPU `hardware_acceleration` runs every Transcode on: one it passed its test on at startup,
  // as `GetPlaybackStatusResponse.hardware` lists them, or the one already saved. Unset for the
  // first GPU it passed on, and always for Automatic, Off, NVENC and VideoToolbox. A saved GPU
  // missing or failing its test at startup leaves Transcodes in software, and keeps its last
  // name. A save reads only its `id`.
  Gpu gpu = 5;
  // How many minutes behind the last segment asked for a running Remux or Transcode keeps its
  // files, so skipping back that far plays at once, at least 1. Unset for the default, 5. A change
  // applies to running plans from the Server's next look at them, within about 10 seconds. The
  // kept files take room in `segment_folder`, memory on a tmpfs, which must fit them: about 1 GB
  // per 4K Remux at the default.
  optional uint32 keep_behind_minutes = 6;
}

message GetImageSettingsRequest {}

message GetImageSettingsResponse {
  ImageSettings settings = 1;
  // The running switch to another image store (`SwitchImageStore`), or the last one if it
  // failed. Unset when none has run since the Server started, or the last one succeeded.
  ImageStoreSwitch switching = 2;
}

message UpdateImageSettingsRequest {
  // Required: a request without it is refused, so leaving it out can't reset every setting.
  ImageSettings settings = 1;
}

message UpdateImageSettingsResponse {
  // The settings as saved.
  ImageSettings settings = 1;
}

// What an admin sets about how the Server resizes Posters and Backdrops.
message ImageSettings {
  // Whether an image asked for at a width (`GetServerInfoResponse.image_widths`) is sent resized
  // to it. Off, every image is sent as stored, and the browser scales it. On by default.
  bool resize_images = 1;
  // The most disk, in MiB, the resized copies the Server keeps take, at least 1. Once a new copy
  // takes them past it, those least recently sent are deleted until they fit. Unset for the
  // default, 1024.
  optional uint32 resized_cache_mib = 2;
  // The id of the Plugin keeping the stored images, or empty for local disk in the data
  // directory, the default. `UpdateImageSettings` ignores it; `SwitchImageStore` changes it.
  string store_plugin_id = 3;
}

message SwitchImageStoreRequest {
  // The id of the Plugin to keep the stored images, or empty for local disk.
  string plugin_id = 1;
}

message SwitchImageStoreResponse {
  // The switch just started, as `GetImageSettingsResponse.switching` follows it, or unset if it
  // already finished.
  ImageStoreSwitch switching = 1;
}

// How far a switch to another image store has got.
message ImageStoreSwitch {
  // The id of the Plugin the images are moving to, or empty for local disk.
  string to_plugin_id = 1;
  // The images handled so far, those the new store already held included.
  uint32 copied = 2;
  // The images to handle, 0 until they are listed.
  uint32 total = 3;
  // Why the switch stopped, the old store still in use, or empty while it runs.
  string failure = 4;
}

message GetDefaultHomeLayoutRequest {}

message GetDefaultHomeLayoutResponse {
  HomeLayout layout = 1;
}

message SetDefaultHomeLayoutRequest {
  // Required: a request without it is refused, so leaving it out can't reset the layout.
  HomeLayout layout = 1;
}

message SetDefaultHomeLayoutResponse {
  // The layout as saved, as `GetDefaultHomeLayout` returns it.
  HomeLayout layout = 1;
}

// The order of the Home rows, and which of them and whether Featured are shown. Featured is
// always at the top.
message HomeLayout {
  // Always set in a response. Unset in `UserService.SetHomeLayout` leaves the caller's Featured as
  // it is; unset in `SetDefaultHomeLayout` shows it.
  optional bool featured_hidden = 1;
  // In the order Home shows them.
  repeated HomeLayoutRow rows = 2;
}

// One place in a Home layout.
message HomeLayoutRow {
  oneof row {
    KernelHomeRow kernel = 1;
    // A row the Plugin gives every User or, in a User's own layout, one it gives them alone.
    // Saving a layout reads only its Plugin id and key.
    PluginHomeRow plugin = 2;
    // The id of a Plugin whose rows for each User, built for them alone, go here.
    string plugin_users_rows = 3;
  }
  bool hidden = 4;
}
