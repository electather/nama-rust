syntax = "proto3";

package nama.v1;

import "nama/v1/browse.proto";
import "nama/v1/playback.proto";
import "nama/v1/request.proto";

// Live updates: what happens on the Server as it happens. Observers receive the same `Event`s.
service EventService {
  // Streams the events that happen from now on, as filtered by the request, until the client
  // hangs up. Events about Libraries' files arrive in batches, each once the database has stored
  // the changes it describes.
  //
  // A client that reads more slowly than events happen doesn't hold up the Server. Once more
  // events are waiting for it than the Server buffers, the oldest are dropped and the client gets
  // a `Lagged` in their place, after which it may want to read again what it shows.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// The kinds of `Event`, one per field of its `event`.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_SCAN_STARTED = 1;
  EVENT_TYPE_SCAN_PROGRESS = 2;
  EVENT_TYPE_SCAN_FINISHED = 3;
  EVENT_TYPE_LIBRARY_ITEM_ADDED = 4;
  EVENT_TYPE_LIBRARY_ITEM_REMOVED = 5;
  EVENT_TYPE_ITEM_MATCHED = 6;
  EVENT_TYPE_REQUEST_CREATED = 7;
  EVENT_TYPE_REQUESTER_ADDED = 8;
  EVENT_TYPE_REQUEST_STATE_CHANGED = 9;
  EVENT_TYPE_REQUEST_CANCELLED = 10;
  EVENT_TYPE_REQUESTER_REMOVED = 11;
  EVENT_TYPE_REQUEST_WITHDRAWN = 12;
  EVENT_TYPE_REQUEST_PROGRESS = 13;
  EVENT_TYPE_FOLLOWED_SHOW_CREATED = 14;
  EVENT_TYPE_FOLLOWED_SHOW_REQUESTER_ADDED = 15;
  EVENT_TYPE_FOLLOWED_SHOW_STATE_CHANGED = 16;
  EVENT_TYPE_FOLLOWED_SHOW_CANCELLED = 17;
  EVENT_TYPE_FOLLOWED_SHOW_REQUESTER_REMOVED = 18;
  EVENT_TYPE_FOLLOWED_SHOW_WITHDRAWN = 19;
  EVENT_TYPE_PLAYBACK_STARTED = 20;
  EVENT_TYPE_PLAYBACK_ENDED = 21;
  EVENT_TYPE_PLAYBACK_CHANGED = 22;
  EVENT_TYPE_MATCHING_FINISHED = 23;
  EVENT_TYPE_PROBING_FINISHED = 24;
}

message SubscribeRequest {
  // Only events of these types. Empty means every type.
  repeated EventType types = 1;
  // Only events about these Libraries. Empty means every Library, and events about none, such as a
  // Request's.
  repeated int64 library_ids = 2;
}

message SubscribeResponse {
  oneof message {
    // Something that happened.
    Event event = 1;
    // Events were dropped here because the client fell behind.
    Lagged lagged = 2;
  }
}

// Events this client didn't read in time were dropped.
message Lagged {
  // How many were dropped, counting those the filter would have left out.
  uint64 dropped = 1;
}

// Something that happened on the Server.
message Event {
  oneof event {
    ScanStarted scan_started = 1;
    ScanProgress scan_progress = 2;
    ScanFinished scan_finished = 3;
    LibraryItemAdded library_item_added = 4;
    LibraryItemRemoved library_item_removed = 5;
    ItemMatched item_matched = 6;
    RequestCreated request_created = 7;
    RequesterAdded requester_added = 8;
    RequestStateChanged request_state_changed = 9;
    RequestCancelled request_cancelled = 10;
    RequesterRemoved requester_removed = 11;
    RequestWithdrawn request_withdrawn = 12;
    RequestProgress request_progress = 13;
    FollowedShowCreated followed_show_created = 14;
    FollowedShowRequesterAdded followed_show_requester_added = 15;
    FollowedShowStateChanged followed_show_state_changed = 16;
    FollowedShowCancelled followed_show_cancelled = 17;
    FollowedShowRequesterRemoved followed_show_requester_removed = 18;
    FollowedShowWithdrawn followed_show_withdrawn = 19;
    PlaybackStarted playback_started = 20;
    PlaybackEnded playback_ended = 21;
    PlaybackChanged playback_changed = 22;
    MatchingFinished matching_finished = 23;
    ProbingFinished probing_finished = 24;
  }
}

// A scan of a Library's folders began.
message ScanStarted {
  int64 library_id = 1;
}

// A scan stored another batch of the changes it found. Files that haven't changed since the last
// scan aren't counted.
message ScanProgress {
  int64 library_id = 1;
  // How many new, changed or gone files have been stored or removed so far.
  uint64 files_done = 2;
  // How many new, changed or gone files the scan found.
  uint64 files_total = 3;
}

// A scan stored every change it found. Matching the new Items follows, and `MatchingFinished` says
// when it has. A scan that fails or is cancelled sends none.
message ScanFinished {
  int64 library_id = 1;
  // Files found that weren't stored before.
  uint64 added = 2;
  // Stored files parsed again: those whose size or modified time changed, or that an older name
  // parser read.
  uint64 updated = 3;
  // Stored files that are gone.
  uint64 removed = 4;
  // Stored files left as they were.
  uint64 unchanged = 5;
}

// A scan's Matching decided what it could about the Library's Items. Sent even when no metadata
// Provider could answer, which leaves Items undecided; a scan that fails or is cancelled sends
// none. To wait for the one covering a `ScanLibrary` call, subscribe to events about the Library
// first, then make the call, then skip to the next `ScanStarted`: the first `MatchingFinished`
// after it covers the call.
message MatchingFinished {
  int64 library_id = 1;
  // Items that now have a Match.
  uint64 matched = 2;
  // Items that are now Unmatched.
  uint64 unmatched = 3;
  // Items Matching couldn't decide, because no metadata Provider is enabled or it failed. The next
  // scan tries them again.
  uint64 undecided = 4;
}

// Probing has caught up with a Library after a scan: every file without current Tracks that the
// scan left was probed, or ffprobe couldn't be run, which leaves the rest for the next scan. Sent
// after `MatchingFinished`, at once on a Server without ffprobe. Probing that ends after a later
// scan of the Library started sends none, leaving it to that scan; one that fails or is cancelled
// sends none. To wait for the one covering a `ScanLibrary` call, subscribe to events about the
// Library first, then make the call, then skip to the next `ScanStarted`: the first
// `ProbingFinished` after it covers the call.
message ProbingFinished {
  int64 library_id = 1;
  // Files whose Tracks were stored.
  uint64 probed = 2;
  // Files ffprobe couldn't read.
  uint64 failed = 3;
}

// A scan stored an Item, for a new file, one that changed or one a newer name parser read.
message LibraryItemAdded {
  int64 library_id = 1;
  int64 item_id = 2;
  // The absolute path, on the Server, of the file holding the Item.
  string path = 3;
}

// An Item is gone, because its file is gone or changed, or a newer name parser read it.
message LibraryItemRemoved {
  int64 library_id = 1;
  int64 item_id = 2;
}

// An Item was Matched, automatically or by hand.
message ItemMatched {
  int64 library_id = 1;
  int64 item_id = 2;
  // The title of the Movie or Episode it was Matched to.
  string title = 3;
}

// A User asked for a Movie that had no open Request, which opened this one. Request events reach
// only the Request's Requesters, unless the subscriber has `PERMISSION_VIEW_REQUESTS`.
message RequestCreated {
  Request request = 1;
}

// A User joined a Request as a Requester.
message RequesterAdded {
  // The Request as it is now, with them among its Requesters.
  Request request = 1;
  // The User who joined.
  int64 user_id = 2;
}

// A Request moved to another state.
message RequestStateChanged {
  // The Request as it is now, in its new state.
  Request request = 1;
}

// A User with `PERMISSION_MANAGE_REQUESTS` cancelled a Request, which removed it.
message RequestCancelled {
  // The Request as it was before it was removed.
  Request request = 1;
}

// A Requester withdrew from a Pending Request that others are still on.
message RequesterRemoved {
  // The Request as it was, with them still among its Requesters, so they get the event too.
  Request request = 1;
  // The User who withdrew.
  int64 user_id = 2;
}

// A Pending Request's last Requester withdrew, which removed it.
message RequestWithdrawn {
  // The Request as it was before it was removed.
  Request request = 1;
}

// What a Processing Request's Fulfiller is downloading for it changed, or the Server couldn't ask
// it, which leaves it with none.
message RequestProgress {
  // The Request as it is now, with its `downloads`.
  Request request = 1;
}

// A User asked for a whole Show that had no open Followed Show, which opened this one. Followed
// Show events reach whom Request events reach: its Requesters, and subscribers with
// `PERMISSION_VIEW_REQUESTS`.
message FollowedShowCreated {
  FollowedShow followed_show = 1;
}

// A User joined a Followed Show as a Requester.
message FollowedShowRequesterAdded {
  // The Followed Show as it is now, with them among its Requesters.
  FollowedShow followed_show = 1;
  // The User who joined.
  int64 user_id = 2;
}

// A Followed Show was approved or declined.
message FollowedShowStateChanged {
  // The Followed Show as it is now, in its new state.
  FollowedShow followed_show = 1;
}

// A User with `PERMISSION_MANAGE_REQUESTS` cancelled a Followed Show, which removed it.
message FollowedShowCancelled {
  // The Followed Show as it was before it was removed.
  FollowedShow followed_show = 1;
}

// A Requester withdrew from a Followed Show that others are still on.
message FollowedShowRequesterRemoved {
  // The Followed Show as it was, with them still among its Requesters, so they get the event too.
  FollowedShow followed_show = 1;
  // The User who withdrew.
  int64 user_id = 2;
}

// A Followed Show's last Requester withdrew, which removed it.
message FollowedShowWithdrawn {
  // The Followed Show as it was before it was removed.
  FollowedShow followed_show = 1;
}

// A Device was given a Playback Plan it can play: the first for a Version, or one that replaces
// another, which gets an event of its own. Playback events reach the User playing, and subscribers
// with `PERMISSION_ADMIN`.
message PlaybackStarted {
  Playback playback = 1;
}

// A plan that `PlaybackStarted` told of stopped: its player stopped it (`StopPlayback`), or went 60
// seconds without asking for it, as when its tab closed, or the Server shut down, which may end it
// before this is delivered.
message PlaybackEnded {
  // As its `PlaybackStarted` told it.
  Playback playback = 1;
}

// A plan that `PlaybackStarted` told of changed how it plays while playing: its Transcode's
// hardware acceleration failed, so the rest of it Transcodes in software, as a reason it adds says.
message PlaybackChanged {
  // As it plays now.
  Playback playback = 1;
}

// One Playback Plan playing a Version on a Device.
message Playback {
  // The User playing.
  int64 user_id = 1;
  // The Device playing.
  int64 device_id = 2;
  // The Version played.
  int64 version_id = 3;
  // How the plan plays it.
  PlaybackMethod method = 4;
  // The Tracks it plays, as its plan lists them.
  repeated Track tracks = 5;
  // Why it plays this way, as its plan says.
  repeated string reasons = 6;
}
