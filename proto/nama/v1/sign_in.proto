syntax = "proto3";

package nama.v1;

// Signing Devices in to a Server as Users, and finding out who is signed in (ADR 0014).
//
// A signed-in Device holds a session: a cookie for browsers, or a bearer token (`Authorization:
// Bearer <token>`) for other clients. Either one identifies the same User and Device on every
// request.
//
// A Device that goes unused for 90 days expires, and its session stops working.
//
// Guessing is slowed down: after 10 failed `SignIn`s for one name, or 50 failed `Setup`s and
// `SignIn`s together from one IP address, within 15 minutes, further attempts fail with
// `resource_exhausted`, without being checked, and a `Retry-After` header gives the seconds to
// wait. A successful `SignIn` clears its name's failures.
service SignInService {
  // Creates the first Admin on a fresh Server and signs the calling Device in as them. Needs the
  // Setup Code the Server printed to its log. Fails with `permission_denied` if the code is wrong,
  // `failed_precondition` once the Server has any User, and `invalid_argument` if a name or the
  // password breaks the rules.
  rpc Setup(SetupRequest) returns (SetupResponse);
  // Signs the calling Device in as an existing User, found by name ignoring case. Fails with
  // `unauthenticated` if the name or the password is wrong, without saying which, and with
  // `invalid_argument` if the Device name breaks the rules.
  rpc SignIn(SignInRequest) returns (SignInResponse);
  // Signs the calling Device out by deleting it: its session stops working at once, its open
  // `EventService.Subscribe` streams end, and a cookie session's cookie is cleared. Fails with
  // `unauthenticated` without a valid session.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // Returns the calling User and Device, or fails with `unauthenticated` without a valid session.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Starts signing the calling Device in without a password typed on it. It shows the returned
  // Sign-in Code, a User signed in on another Device approves it with `ApproveSignInCode`, and this
  // Device then picks up its session with `PollSignInCode`. The code and the poll handle expire
  // after 10 minutes, and a Server restart cancels them. Fails with `invalid_argument` if the
  // Device name breaks the rules, and `resource_exhausted` while too many sign-ins are waiting.
  rpc StartSignInCode(StartSignInCodeRequest) returns (StartSignInCodeResponse);
  // Returns the name of the Device a Sign-in Code would sign in, so the User can check it before
  // approving. Approves nothing. Fails with `not_found` if no unexpired code matches,
  // `failed_precondition` if it was already approved, and `unauthenticated` without a valid
  // session.
  rpc LookUpSignInCode(LookUpSignInCodeRequest) returns (LookUpSignInCodeResponse);
  // Approves a Sign-in Code, so the Device that shows it signs in as the calling User. Fails like
  // `LookUpSignInCode`.
  rpc ApproveSignInCode(ApproveSignInCodeRequest) returns (ApproveSignInCodeResponse);
  // Says whether the sign-in a poll handle stands for is still waiting for approval, expired, or
  // signed in. Signed in hands out the new Device's session, once, the way `SignIn` does: after
  // that, and for a handle the Server never gave out or has forgotten, it fails with `not_found`.
  rpc PollSignInCode(PollSignInCodeRequest) returns (PollSignInCodeResponse);
}

// How a signed-in Device is given its session.
enum SessionDelivery {
  SESSION_DELIVERY_UNSPECIFIED = 0;
  // As an HttpOnly cookie, for browsers. The token never appears in the response body, so page
  // scripts can't read it.
  SESSION_DELIVERY_COOKIE = 1;
  // As a token in the response body, which the client sends as `Authorization: Bearer <token>`.
  SESSION_DELIVERY_TOKEN = 2;
}

// What a User is allowed to do on a Server.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Manages the Server, its Libraries and its Users.
  ROLE_ADMIN = 1;
  // Watches and Requests.
  ROLE_MEMBER = 2;
}

// A person's identity on one Server.
message User {
  // Assigned by the Server, and never reused.
  int64 id = 1;
  // Unique on the Server, ignoring case.
  string name = 2;
  Role role = 3;
  // When the User was created, in seconds since the Unix epoch.
  int64 created_at = 4;
}

// A client installation signed in to a Server as a User.
message Device {
  // Assigned by the Server, and never reused.
  int64 id = 1;
  // What the client called itself when it signed in, such as "Living room TV".
  string name = 2;
}

message SetupRequest {
  // The Setup Code from the Server's log.
  string setup_code = 1;
  // The first Admin's name: 1 to 64 characters once leading and trailing spaces are trimmed.
  string name = 2;
  // The first Admin's password, which the Server's Authenticator checks against its own rules.
  string password = 3;
  // The signing-in Device's name: 1 to 64 characters.
  string device_name = 4;
  // How to hand out the session. Must be specified.
  SessionDelivery delivery = 5;
}

message SetupResponse {
  // The Admin just created.
  User user = 1;
  // The Device just signed in.
  Device device = 2;
  // The session token, for `SESSION_DELIVERY_TOKEN` only. Empty for a cookie.
  string token = 3;
}

message SignInRequest {
  // The User's name, in any case.
  string name = 1;
  // The User's password.
  string password = 2;
  // The signing-in Device's name: 1 to 64 characters.
  string device_name = 3;
  // How to hand out the session. Must be specified.
  SessionDelivery delivery = 4;
}

message SignInResponse {
  // The User signed in as.
  User user = 1;
  // The Device just signed in.
  Device device = 2;
  // The session token, for `SESSION_DELIVERY_TOKEN` only. Empty for a cookie.
  string token = 3;
}

message SignOutRequest {}

message SignOutResponse {}

message WhoAmIRequest {}

message WhoAmIResponse {
  User user = 1;
  Device device = 2;
}

message StartSignInCodeRequest {
  // The signing-in Device's name: 1 to 64 characters.
  string device_name = 1;
  // How to hand out the session once the code is approved. Must be specified.
  SessionDelivery delivery = 2;
}

message StartSignInCodeResponse {
  // The Sign-in Code to show, as `XXXX-XXXX`: 8 characters of Crockford's base32 alphabet, which
  // has no I, L, O or U. It is matched ignoring case and dashes.
  string code = 1;
  // What this Device polls `PollSignInCode` with. Keep it secret: whoever holds it gets the session.
  string handle = 2;
}

message LookUpSignInCodeRequest {
  // The Sign-in Code the other Device shows.
  string code = 1;
}

message LookUpSignInCodeResponse {
  // The name the Device asking to sign in gave itself.
  string device_name = 1;
}

message ApproveSignInCodeRequest {
  // The Sign-in Code the other Device shows.
  string code = 1;
}

message ApproveSignInCodeResponse {}

message PollSignInCodeRequest {
  // The handle `StartSignInCode` returned.
  string handle = 1;
}

// Where a sign-in with a Sign-in Code has got to.
enum SignInCodeStatus {
  SIGN_IN_CODE_STATUS_UNSPECIFIED = 0;
  // Not approved yet. Poll again in a few seconds.
  SIGN_IN_CODE_STATUS_WAITING = 1;
  // Not approved, or not polled once approved, within 10 minutes. Start again for a new code.
  SIGN_IN_CODE_STATUS_EXPIRED = 2;
  // Approved: the response carries the session.
  SIGN_IN_CODE_STATUS_SIGNED_IN = 3;
}

message PollSignInCodeResponse {
  SignInCodeStatus status = 1;
  // The User signed in as, the one who approved the code. Only when signed in.
  User user = 2;
  // The Device just signed in. Only when signed in.
  Device device = 3;
  // The session token, when signed in with `SESSION_DELIVERY_TOKEN`. Empty for a cookie.
  string token = 4;
}
