syntax = "proto3";

package nama.v1;

// Signing Devices in to a Server as Users, and finding out who is signed in (ADR 0014).
//
// A signed-in Device holds a session: a cookie for browsers, or a bearer token (`Authorization:
// Bearer <token>`) for other clients. Either one identifies the same User and Device on every
// request.
//
// A Device that goes unused for 90 days expires, and its session stops working.
//
// Guessing is slowed down: after 10 failed `SignIn`s and `Reauthenticate`s for one name, or 50
// failed `Setup`s, `SignIn`s, `Reauthenticate`s and `AcceptInvite`s together from one IP address,
// within 15 minutes, further attempts fail with `resource_exhausted`, without being checked, and a
// `Retry-After` header gives the seconds to wait. A successful `SignIn` or `Reauthenticate` clears
// its name's failures. In the same way, after 10 failed `LookUpSignInCode`s and
// `ApproveSignInCode`s together from one Device within 15 minutes, its further lookups and
// approvals fail with `resource_exhausted`.
//
// Changes to who can sign in as whom need Recent Authentication: the calling Device proved who it
// is with one of its User's Sign-in Methods in the last 10 minutes. They are `ApproveSignInCode`
// and `UserService`'s `ChangePassword`, `ResetPassword`, `SetPermissions`,
// `SetDefaultPermissions` and `DeleteUser`.
// Signing in with `Setup` or `SignIn` gives a Device Recent Authentication; signing in with a
// Sign-in Code or an Account doesn't, since that Device proved nothing itself: whoever approved,
// on another Device or on the Hub, may not hold it. Without it, those calls fail with
// `failed_precondition` and the `REFUSAL_REASON_RECENT_AUTHENTICATION_REQUIRED` Refusal before
// anything in the request is checked. `Reauthenticate` gives it back.
service SignInService {
  // Creates the first Admin, a User with `PERMISSION_ADMIN`, on a fresh Server and signs the
  // calling Device in as them. Needs the Setup Code the Server printed to its log. Fails with
  // `permission_denied` if the code is wrong, `failed_precondition` once the Server has any User,
  // and `invalid_argument` if a name or the password breaks the rules.
  rpc Setup(SetupRequest) returns (SetupResponse);
  // Signs the calling Device in as an existing User, found by name ignoring case. Fails with
  // `unauthenticated` if the name or the password is wrong, without saying which, and with
  // `invalid_argument` if the Device name breaks the rules.
  rpc SignIn(SignInRequest) returns (SignInResponse);
  // Signs the calling Device out by deleting it: its session stops working at once, its open
  // `EventService.Subscribe` streams end, and a cookie session's cookie is cleared. Fails with
  // `unauthenticated` without a valid session.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // Returns the calling User and Device, or fails with `unauthenticated` without a valid session.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Gives the calling Device Recent Authentication, once its User proves who they are again: with
  // their password, or with their Account approving a sign-in started with `StartAccountSignIn`,
  // the one way for a User created from an Account. The Device keeps its session: no new token or
  // cookie is handed out.
  // Fails with `unauthenticated` if the proof is wrong (`REFUSAL_REASON_WRONG_ACCOUNT` when
  // another User's Account approved), the Device was signed out meanwhile, or without a valid
  // session; with `invalid_argument` without a proof; and like `SignInWithAccount` for a sign-in
  // with an Account the Hub didn't approve or can't be asked about. Any failed proof counts toward
  // the limits above.
  rpc Reauthenticate(ReauthenticateRequest) returns (ReauthenticateResponse);

  // Starts signing the calling Device in without a password typed on it. It shows the returned
  // Sign-in Code, a User signed in on another Device approves it with `ApproveSignInCode`, and this
  // Device then picks up its session with `PollSignInCode`. The code and the poll handle expire
  // after 10 minutes, and a Server restart cancels them. Fails with `invalid_argument` if the
  // Device name breaks the rules, and `resource_exhausted` while too many sign-ins are waiting.
  rpc StartSignInCode(StartSignInCodeRequest) returns (StartSignInCodeResponse);
  // Returns the name of the Device a Sign-in Code would sign in, so the User can check it before
  // approving. Approves nothing. Fails with `not_found` if no unexpired code matches,
  // `failed_precondition` if it was already approved, and `unauthenticated` without a valid
  // session.
  rpc LookUpSignInCode(LookUpSignInCodeRequest) returns (LookUpSignInCodeResponse);
  // Approves a Sign-in Code, so the Device that shows it signs in as the calling User. Fails like
  // `LookUpSignInCode`.
  rpc ApproveSignInCode(ApproveSignInCodeRequest) returns (ApproveSignInCodeResponse);
  // Says whether the sign-in a poll handle stands for is still waiting for approval, expired, or
  // signed in. Signed in hands out the new Device's session, once, the way `SignIn` does: after
  // that, and for a handle the Server never gave out or has forgotten, it fails with `not_found`.
  // Once the code is approved, it fails with `unauthenticated` and `REFUSAL_REASON_SIGNED_OUT` if
  // the approving Device has since signed out or expired, and with `not_found` and
  // `REFUSAL_REASON_USER_NOT_FOUND` if the approving User has since been deleted. Either uses the
  // code up: start again for a new one.
  rpc PollSignInCode(PollSignInCodeRequest) returns (PollSignInCodeResponse);

  // Creates a User with an Invite's link, under the name and password they pick, and signs the
  // calling Device in as them, using the Invite up. They get the Invite's Permissions, less any its
  // creator has since lost. Fails with `not_found` and `REFUSAL_REASON_INVITE_NOT_FOUND` if the
  // Invite was used, revoked or expired, or its creator was deleted or lost
  // `PERMISSION_MANAGE_USERS`, which counts toward the limits above. Fails with `already_exists`
  // if another User has the name, ignoring case, and `invalid_argument` if a name or the password
  // breaks the rules; the Invite stays valid after either.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);

  // Starts signing the calling Device in with a Hub Account, on a Server Linked to the Hub (ADR
  // 0092). The client sends the person to `url`, where they approve it on the Hub, which then sends
  // them to `return_url` with a one-time code; the client then finishes with `SignInWithAccount`.
  // Fails with `invalid_argument` and `REFUSAL_REASON_NOT_A_URL` if `return_url` isn't an `http`
  // or `https` URL, with `invalid_argument` and `REFUSAL_REASON_NOT_A_SERVER_ADDRESS` if it's on
  // none of the Server URL and LAN address the Server reports, with `failed_precondition` and
  // `REFUSAL_REASON_NO_SERVER_LINKER` without an enabled Plugin that links the Server, and with
  // `unavailable` while the Server isn't Linked, the Hub can't be reached, or the Hub refuses a
  // `return_url` on none of the Server Addresses it was last told, which a Device already signed
  // in never needs.
  rpc StartAccountSignIn(StartAccountSignInRequest) returns (StartAccountSignInResponse);
  // Signs the calling Device in as the User whose Account approved the sign-in `handle` stands
  // for, the way `SignIn` does, without Recent Authentication. Once it was approved, the first
  // call ends it, signing in only with the right `code`. Fails with `not_found` and
  // `REFUSAL_REASON_ACCOUNT_SIGN_IN_NOT_FOUND` if it wasn't approved, expired or was used, or the
  // code is wrong, with
  // `not_found` and `REFUSAL_REASON_USER_NOT_FOUND` if the User was deleted, and like
  // `StartAccountSignIn` otherwise.
  rpc SignInWithAccount(SignInWithAccountRequest) returns (SignInWithAccountResponse);
}

// How a signed-in Device is given its session.
enum SessionDelivery {
  SESSION_DELIVERY_UNSPECIFIED = 0;
  // As an HttpOnly cookie, for browsers. The token never appears in the response body, so page
  // scripts can't read it.
  SESSION_DELIVERY_COOKIE = 1;
  // As a token in the response body, which the client sends as `Authorization: Bearer <token>`.
  SESSION_DELIVERY_TOKEN = 2;
}

// One thing a User is allowed to do on a Server (ADR 0020). Each User holds a set of them. Values
// are API contract: one is never renumbered or reused.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  // Passes every check, whatever Permission it needs.
  PERMISSION_ADMIN = 1;
  // Manages Users: creates, lists and deletes them, sets their Permissions, resets their passwords
  // and manages their Devices.
  PERMISSION_MANAGE_USERS = 2;
  // Manages Libraries and their Matches, and sees where a Library lives on disk.
  PERMISSION_MANAGE_LIBRARIES = 3;
  // Manages the Server's settings, such as its Plugins.
  PERMISSION_MANAGE_SETTINGS = 4;
  // Manages every User's Requests.
  PERMISSION_MANAGE_REQUESTS = 5;
  // Requests Movies and Shows: covers `PERMISSION_REQUEST_MOVIE` and `PERMISSION_REQUEST_TV`.
  PERMISSION_REQUEST = 6;
  // Requests Movies.
  PERMISSION_REQUEST_MOVIE = 7;
  // Requests Shows.
  PERMISSION_REQUEST_TV = 8;
  // Has their Requests approved as they make them: covers `PERMISSION_AUTO_APPROVE_MOVIE` and
  // `PERMISSION_AUTO_APPROVE_TV`.
  PERMISSION_AUTO_APPROVE = 9;
  // Has their Requests for Movies approved as they make them.
  PERMISSION_AUTO_APPROVE_MOVIE = 10;
  // Has their Requests for Shows approved as they make them.
  PERMISSION_AUTO_APPROVE_TV = 11;
  // Sees every User's Requests, not only their own.
  PERMISSION_VIEW_REQUESTS = 12;
  // Picks the Quality a title is downloaded at when Requesting it, from its Fulfiller's list
  // (ADR 0025). About quality alone: never folders, tags or servers.
  PERMISSION_CHOOSE_QUALITY = 13;
  // Deletes media from the Libraries' folders, for good (ADR 0038).
  PERMISSION_DELETE_MEDIA = 14;
  // Searches the subtitle sources for the Version they're watching and downloads one of the
  // subtitles found, which every User then sees as one of its Tracks (ADR 0067).
  PERMISSION_DOWNLOAD_SUBTITLES = 15;
}

// A person's identity on one Server.
message User {
  // Held what `permissions` replaced (ADR 0020).
  reserved 3;
  reserved "role";
  // Assigned by the Server, and never reused.
  int64 id = 1;
  // Unique on the Server, ignoring case.
  string name = 2;
  // When the User was created, in seconds since the Unix epoch.
  int64 created_at = 4;
  // What the User may do, in the order of `Permission`'s values, each once.
  repeated Permission permissions = 5;
}

// A client installation signed in to a Server as a User.
message Device {
  // Assigned by the Server, and never reused.
  int64 id = 1;
  // What the client called itself when it signed in, such as "Living room TV".
  string name = 2;
  // When it signed in, in seconds since the Unix epoch.
  int64 created_at = 3;
  // When it was last used, in seconds since the Unix epoch. Kept to the hour, so it may lag by up
  // to an hour.
  int64 last_seen_at = 4;
  // Whether it is the Device making this call.
  bool is_current = 5;
}

message SetupRequest {
  // The Setup Code from the Server's log.
  string setup_code = 1;
  // The first Admin's name: 1 to 64 characters once leading and trailing spaces are trimmed.
  string name = 2;
  // The first Admin's password, which the Server's Authenticator checks against its own rules.
  string password = 3;
  // The signing-in Device's name: up to 64 characters. When it is blank, the Server names the
  // Device after the browser and OS in its `User-Agent`, such as "Chrome on macOS".
  string device_name = 4;
  // How to hand out the session. Must be specified.
  SessionDelivery delivery = 5;
}

message SetupResponse {
  // The Admin just created.
  User user = 1;
  // The Device just signed in.
  Device device = 2;
  // The session token, for `SESSION_DELIVERY_TOKEN` only. Empty for a cookie.
  string token = 3;
}

message SignInRequest {
  // The User's name, in any case.
  string name = 1;
  // The User's password.
  string password = 2;
  // The signing-in Device's name: up to 64 characters. When it is blank, the Server names the
  // Device after the browser and OS in its `User-Agent`, such as "Chrome on macOS".
  string device_name = 3;
  // How to hand out the session. Must be specified.
  SessionDelivery delivery = 4;
}

message SignInResponse {
  // The User signed in as.
  User user = 1;
  // The Device just signed in.
  Device device = 2;
  // The session token, for `SESSION_DELIVERY_TOKEN` only. Empty for a cookie.
  string token = 3;
}

message SignOutRequest {}

message SignOutResponse {}

message WhoAmIRequest {}

message WhoAmIResponse {
  User user = 1;
  Device device = 2;
}

message ReauthenticateRequest {
  // How the User proves who they are, with one of their Sign-in Methods. Must be set.
  oneof proof {
    // The User's password.
    string password = 1;
    // The handle `StartAccountSignIn` returned, once the Account Linked to the User approved it on
    // the Hub. It refreshes the calling Device; no new one signs in.
    string account_sign_in_handle = 2;
  }
  // The one-time code the Hub added to `return_url`'s query as `code`. Needed with
  // `account_sign_in_handle`.
  string account_sign_in_code = 3;
}

message ReauthenticateResponse {}

message StartSignInCodeRequest {
  // The signing-in Device's name: up to 64 characters. When it is blank, the Server names the
  // Device after the browser and OS in its `User-Agent`, such as "Chrome on macOS".
  string device_name = 1;
  // How to hand out the session once the code is approved. Must be specified.
  SessionDelivery delivery = 2;
}

message StartSignInCodeResponse {
  // The Sign-in Code to show, as `XXXX-XXXX`: 8 characters of Crockford's base32 alphabet, which
  // has no I, L, O or U. It is matched ignoring case and dashes.
  string code = 1;
  // What this Device polls `PollSignInCode` with. Keep it secret: whoever holds it gets the session.
  string handle = 2;
}

message LookUpSignInCodeRequest {
  // The Sign-in Code the other Device shows.
  string code = 1;
}

message LookUpSignInCodeResponse {
  // The name the Device asking to sign in gave itself.
  string device_name = 1;
}

message ApproveSignInCodeRequest {
  // The Sign-in Code the other Device shows.
  string code = 1;
}

message ApproveSignInCodeResponse {}

message AcceptInviteRequest {
  // The token at the end of the Invite's link.
  string token = 1;
  // The new User's name: 1 to 64 characters once leading and trailing spaces are trimmed.
  string name = 2;
  // The new User's password, which the Server's Authenticator checks against its own rules.
  string password = 3;
  // The signing-in Device's name: up to 64 characters. When it is blank, the Server names the
  // Device after the browser and OS in its `User-Agent`, such as "Chrome on macOS".
  string device_name = 4;
  // How to hand out the session. Must be specified.
  SessionDelivery delivery = 5;
}

message AcceptInviteResponse {
  // The User just created.
  User user = 1;
  // The Device just signed in.
  Device device = 2;
  // The session token, for `SESSION_DELIVERY_TOKEN` only. Empty for a cookie.
  string token = 3;
}

message PollSignInCodeRequest {
  // The handle `StartSignInCode` returned.
  string handle = 1;
}

// Where a sign-in with a Sign-in Code has got to.
enum SignInCodeStatus {
  SIGN_IN_CODE_STATUS_UNSPECIFIED = 0;
  // Not approved yet. Poll again in a few seconds.
  SIGN_IN_CODE_STATUS_WAITING = 1;
  // Not approved, or not polled once approved, within 10 minutes. Start again for a new code.
  SIGN_IN_CODE_STATUS_EXPIRED = 2;
  // Approved: the response carries the session.
  SIGN_IN_CODE_STATUS_SIGNED_IN = 3;
}

message PollSignInCodeResponse {
  SignInCodeStatus status = 1;
  // The User signed in as, the one who approved the code. Only when signed in.
  User user = 2;
  // The Device just signed in. Only when signed in.
  Device device = 3;
  // The session token, when signed in with `SESSION_DELIVERY_TOKEN`. Empty for a cookie.
  string token = 4;
}

message StartAccountSignInRequest {
  // Where the Hub sends the person back to once they approve, adding the one-time code
  // `SignInWithAccount` needs to its query as `code`: such as the client's sign-in page, on one of
  // the Server's Server Addresses, since the Hub refuses any other address.
  string return_url = 1;
}

message StartAccountSignInResponse {
  // The Hub's page where the person approves signing in.
  string url = 1;
  // What the client finishes with. Keep it secret: whoever holds it gets the session once the
  // sign-in is approved.
  string handle = 2;
}

message SignInWithAccountRequest {
  // The handle `StartAccountSignIn` returned.
  string handle = 1;
  // The signing-in Device's name: up to 64 characters. When it is blank, the Server names the
  // Device after the browser and OS in its `User-Agent`, such as "Chrome on macOS".
  string device_name = 2;
  // How to hand out the session. Must be specified.
  SessionDelivery delivery = 3;
  // The one-time code the Hub added to `return_url`'s query as `code`.
  string code = 4;
}

message SignInWithAccountResponse {
  // The User signed in as.
  User user = 1;
  // The Device just signed in.
  Device device = 2;
  // The session token, for `SESSION_DELIVERY_TOKEN` only. Empty for a cookie.
  string token = 3;
}
