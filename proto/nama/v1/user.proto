syntax = "proto3";

package nama.v1;

import "nama/v1/playback.proto";
import "nama/v1/plugin.proto";
import "nama/v1/server.proto";
import "nama/v1/sign_in.proto";

// Managing the Server's Users, their Devices, Invites, Plugin Connections, Personal settings,
// notification preferences and Home layouts. Every RPC but `ListDevices`, `RevokeDevice`,
// `ChangePassword`, the Plugin Connection ones, the Personal settings ones, the notification
// preference ones, the Home layout ones and the User Link ones needs `PERMISSION_MANAGE_USERS`,
// and fails with `permission_denied` without it.
// Only a caller with `PERMISSION_ADMIN` may `SetPermissions`, `ResetPassword` or `DeleteUser` for a
// User with it, grant it, put it in the default Permissions or create a User while they hold it, or
// set their own Permissions; others fail with `permission_denied` and a Refusal naming
// `PERMISSION_ADMIN`. `ChangePassword`, `ResetPassword`, `SetPermissions`, `SetDefaultPermissions`,
// `DeleteUser`, `StartUserLink` and `CreateUserFromAccount` also need Recent Authentication, as
// `SignInService` describes.
// RPCs name Users by ID, not by name.
service UserService {
  // Creates a User, who can sign in at once, with the default Permissions as they are now. Fails
  // with `invalid_argument` if the name or the password breaks the rules, and `already_exists` if
  // another User has the name, ignoring case.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Creates a User from a Hub Account, with the default Permissions as they are now, on a Server
  // Linked to the Hub (ADR 0092). They have no password: the Account with `email` accepts them on
  // the Hub, which Links them to it, and from then on they sign in with it. It answers the same
  // whether or not an Account has the email. Fails like `CreateUser` for the name, with
  // `failed_precondition` and `REFUSAL_REASON_NO_SERVER_LINKER`, creating no User, without an
  // enabled Plugin that links the Server, and with `unavailable`, creating no User, while the
  // Server isn't Linked or the Hub can't be reached.
  rpc CreateUserFromAccount(CreateUserFromAccountRequest) returns (CreateUserFromAccountResponse);
  // Lists every User on the Server, oldest first.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces a User's Permissions and cap for remote playback, which apply from their next
  // request. Their Devices stay signed in. Fails with `invalid_argument` for
  // `PERMISSION_UNSPECIFIED` or a value the Server doesn't know, `not_found` if no User has the ID,
  // and `failed_precondition` if it would leave no User with `PERMISSION_ADMIN`.
  rpc SetPermissions(SetPermissionsRequest) returns (SetPermissionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Replaces which Libraries a User sees, from their next request: browsing, search, Home rows,
  // Plugin rows, Similar titles, title pages, playback and Requests leave out the titles of any
  // other. Without `PERMISSION_ADMIN`, the caller may change neither an Admin's nor their own, so
  // a User can't lift their own. Fails with `not_found` if no User has the ID, and
  // `permission_denied` for an Admin's or the caller's own without `PERMISSION_ADMIN`.
  rpc SetLibraryAccess(SetLibraryAccessRequest) returns (SetLibraryAccessResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Deletes a User with their credentials and signs them out of every Device, so they can't sign
  // in, their sessions stop working at once and their open `EventService.Subscribe` streams end. A
  // Device is signed out only once its last User goes. The caller may delete themselves. Fails
  // with `not_found` if no User has the ID, so a retry after a delete that went through gets
  // `not_found`, and `failed_precondition` if it would leave no User with `PERMISSION_ADMIN`.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Lists the Devices a User is signed in to that haven't expired, oldest first, whichever User
  // each acts as. Any signed-in User may list their
  // own; another User's needs `PERMISSION_MANAGE_USERS`. Fails with `not_found` if the User doesn't
  // exist, or isn't the caller and the caller lacks that Permission, so they can't learn which IDs
  // exist.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Signs a User out of one of their Devices, so it no longer acts as them and their open
  // `EventService.Subscribe` streams on it end. Its other Users stay signed in, and it acts as none
  // of them if it acted as this one; revoking its last User signs it out, as `SignOut` does, which
  // for the calling Device clears a cookie session's cookie. Who may revoke whose Devices is as for
  // `ListDevices`, and fails the same way; it also fails with `not_found` if the User isn't signed
  // in to the Device.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  // Changes the caller's own password. Their other Devices are revoked, as by `RevokeDevice`, and
  // the calling Device stays signed in. Fails with `unauthenticated` if the calling Device was
  // signed out meanwhile, and `invalid_argument` if the new password breaks the rules.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Sets a User's password, without their current one, for the caller to pass on to them. Every
  // Device of theirs is revoked, as by `RevokeDevice`. Fails with `invalid_argument` if the new
  // password breaks the rules, `not_found` if no User has the ID, and `failed_precondition` for the
  // caller's own User, who uses `ChangePassword` instead to keep the calling Device signed in.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // Gets the default Permissions: those `CreateUser` gives a new User, with the cap for remote
  // playback they get, as `CreateUser`, `CreateUserFromAccount` and `AcceptInvite` do. A fresh
  // Server's are `PERMISSION_REQUEST` and `PERMISSION_VIEW_REQUESTS`, with no cap.
  rpc GetDefaultPermissions(GetDefaultPermissionsRequest) returns (GetDefaultPermissionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces the default Permissions and cap. Users created before keep the Permissions and cap
  // they have. Fails with `invalid_argument` for `PERMISSION_UNSPECIFIED` or a value the Server
  // doesn't know.
  rpc SetDefaultPermissions(SetDefaultPermissionsRequest) returns (SetDefaultPermissionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Makes an Invite: a single-use link, valid for 7 days, with which one person creates their own
  // User with `SignInService.AcceptInvite`. The link is in the response only: the Server keeps a
  // hash of its token. Fails with `failed_precondition` and `REFUSAL_REASON_SERVER_URL_REQUIRED`
  // while the Server has no Server URL to link to, `permission_denied` and
  // `REFUSAL_REASON_PERMISSION_REQUIRED` for `PERMISSION_ADMIN` or a Permission the caller lacks,
  // and `invalid_argument` if the note breaks the rules for a name.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  // Lists every pending Invite, oldest first, whoever made it. Used and expired ones, and those
  // whose creator was deleted or lost `PERMISSION_MANAGE_USERS`, are left out: they no longer work.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Revokes a pending Invite, whoever made it, so its link stops working. Fails with `not_found`
  // and `REFUSAL_REASON_INVITE_NOT_FOUND` if no Invite has the ID.
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Lists the enabled Plugins the caller can connect to, such as Telegram, by id, with whether
  // they are connected. Any signed-in User may list their own, and only their own. What a Plugin
  // Connection holds, such as a Telegram chat id, never leaves the Server.
  rpc ListPluginConnections(ListPluginConnectionsRequest) returns (ListPluginConnectionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Starts connecting the caller to a Plugin, and returns the link they open to finish, such as
  // `https://t.me/<bot>?start=<code>`. The Plugin Connection is `PLUGIN_CONNECTION_STATE_WAITING`
  // until they do, for up to 10 minutes, then the link expires. Starting again replaces the link.
  // Fails with `REFUSAL_REASON_PLUGIN_NOT_FOUND` for a Plugin that isn't enabled or can't connect
  // Users, and with `unavailable` if the Plugin couldn't make the link.
  rpc StartPluginConnection(StartPluginConnectionRequest) returns (StartPluginConnectionResponse);
  // Disconnects the caller from a Plugin, deleting their Plugin Connection, or the link they are
  // waiting on. Disconnecting what isn't connected does nothing.
  rpc DeletePluginConnection(DeletePluginConnectionRequest) returns (DeletePluginConnectionResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Lists the caller's own Personal settings (ADR 0046): one entry per enabled Plugin whose
  // Manifest declares any, sorted by Plugin id. Any signed-in User may list their own, and only
  // their own. A secret's value is never sent, only whether it is set.
  rpc ListPersonalSettings(ListPersonalSettingsRequest) returns (ListPersonalSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces the caller's own Personal settings for one Plugin. A secret left out or blank keeps
  // its stored value, and a key the Plugin doesn't declare is ignored. Fails with
  // `REFUSAL_REASON_PLUGIN_NOT_FOUND` for a Plugin that isn't enabled or declares no Personal
  // settings, `REFUSAL_REASON_FIELD_REQUIRED` for a required one left out or blank, and
  // `REFUSAL_REASON_SETTING_WRONG_KIND` for a value of the wrong kind, each naming the setting as
  // `settings.<key>`.
  rpc UpdatePersonalSettings(UpdatePersonalSettingsRequest) returns (UpdatePersonalSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Forgets the caller's own Personal settings for one Plugin. Forgetting what isn't set does
  // nothing.
  rpc DeletePersonalSettings(DeletePersonalSettingsRequest) returns (DeletePersonalSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Starts linking the caller's account at a Watch sync Plugin's tracker, such as Trakt, by device
  // code: the caller enters `user_code` at `verification_url`, then polls with `device_code` until
  // `PollWatchSyncLink` says how it went. Unlinking is `DeletePersonalSettings`. Fails with
  // `REFUSAL_REASON_PLUGIN_NOT_FOUND` for a Plugin that isn't enabled or isn't a Watch sync, and
  // with `unavailable` if the Plugin couldn't start.
  rpc StartWatchSyncLink(StartWatchSyncLinkRequest) returns (StartWatchSyncLinkResponse);
  // Asks a Watch sync Plugin whether the caller entered the code `StartWatchSyncLink` gave. Once
  // they did, the Server keeps the tracker's tokens as the caller's secret Personal settings,
  // which no response ever holds. Fails as `StartWatchSyncLink` does.
  rpc PollWatchSyncLink(PollWatchSyncLinkRequest) returns (PollWatchSyncLinkResponse);
  // Lists which Request notifications the caller gets on every Notifier, through their Plugin
  // Connections and Personal settings. Each kind is on until they turn it off.
  // `NOTIFICATION_KIND_NEW_PENDING` is listed only to a caller with `PERMISSION_MANAGE_REQUESTS`.
  // A Notifier's channel isn't the caller's, so these don't change what it gets.
  rpc ListNotificationPreferences(ListNotificationPreferencesRequest) returns (ListNotificationPreferencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Turns one kind of Request notification on or off for the caller. Fails with
  // `REFUSAL_REASON_UNKNOWN_ENUM_VALUE` for `NOTIFICATION_KIND_UNSPECIFIED` or a value the Server
  // doesn't know.
  rpc SetNotificationPreference(SetNotificationPreferenceRequest) returns (SetNotificationPreferenceResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // The caller's own Home layout: every Home row they could see now, shown or hidden, in the order
  // `BrowseService.ListHomeRows` lists the shown ones, and whether Featured is shown. Each of their
  // own rows from a Plugin is listed on its own, as a `plugin` row.
  rpc GetHomeLayout(GetHomeLayoutRequest) returns (GetHomeLayoutResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Saves which Home rows, and whether Featured, the caller shows. Only the flags count, not the
  // order, which `ReorderHomeRows` saves. A row or Featured the caller hasn't set apart from the
  // default Home layout follows the default while it's saved as the default shows it. Once they
  // show or hide one otherwise, it keeps their flag, whatever the default does, until
  // `ResetHomeLayout`. A row the caller can't see now, such as a disabled Plugin's, keeps its flag.
  // Rows are named as `GetHomeLayout` names them, and one it doesn't list is ignored. A request
  // without a layout is refused with `REFUSAL_REASON_FIELD_REQUIRED` naming `layout`.
  rpc SetHomeLayout(SetHomeLayoutRequest) returns (SetHomeLayoutResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Saves the caller's order of their Home rows. Until they first do, their Home follows the
  // default Home layout's order; from then on it no longer moves their rows (ADR 0077). A row the
  // order doesn't place, such as a newly enabled Plugin's, goes after those it does. Rows are named
  // as `GetHomeLayout` names them; only which row each names counts, and one it doesn't list is
  // ignored.
  rpc ReorderHomeRows(ReorderHomeRowsRequest) returns (ReorderHomeRowsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Forgets the caller's Home layout, its order and flags, so their Home follows the default Home
  // layout again.
  rpc ResetHomeLayout(ResetHomeLayoutRequest) returns (ResetHomeLayoutResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Returns whether the caller is Linked to an Account, and to which, or the code they show while
  // they wait for it to be entered on the Hub (ADR 0011). While it waits, this is also what has the
  // Plugin ask the Hub whether it was entered. `link` is unset while the Server can't Link Users:
  // without an enabled Plugin that links it, such as the Hub Plugin, or before the Server is Linked
  // itself. Fails with `unavailable` if the Plugin failed.
  rpc GetUserLink(GetUserLinkRequest) returns (GetUserLinkResponse) {}
  // Starts Linking the caller to an Account, replacing a code they were showing, and returns the
  // new one. A User Links to one Account, so a caller Linked already gets that Link back. Fails
  // with `REFUSAL_REASON_NO_SERVER_LINKER` without an enabled Plugin that links the Server, and
  // with `unavailable` if the Plugin couldn't start, such as with the Hub unreachable.
  rpc StartUserLink(StartUserLinkRequest) returns (StartUserLinkResponse) {}
  // Unlinks the caller from their Account, or stops showing their code. Unlinking a User who isn't
  // Linked does nothing. Fails like `StartUserLink`; the caller stays Linked if the Hub couldn't be
  // told. Fails with `REFUSAL_REASON_LAST_SIGN_IN_METHOD` for a Linked caller whose Account is
  // their last Sign-in Method, such as a User created from one (ADR 0014).
  rpc UnlinkUser(UnlinkUserRequest) returns (UnlinkUserResponse) {}
}

message GetUserLinkRequest {}

message GetUserLinkResponse {
  // Unset while the Server can't Link Users.
  UserLink link = 1;
}

// Where Linking a User stands.
message UserLink {
  // Set while the User waits for someone to enter `code`.
  string code = 1;
  // Where to enter `code`, set with it.
  string url = 2;
  // The Account the User is Linked to, as its email, once they are.
  string account = 3;
}

message StartUserLinkRequest {}

message StartUserLinkResponse {
  UserLink link = 1;
}

message UnlinkUserRequest {}

message UnlinkUserResponse {}

message CreateUserRequest {
  // 1 to 64 characters once leading and trailing spaces are trimmed, and unique ignoring case.
  string name = 1;
  // The User's starting password, which the Server's Authenticator checks against its own rules.
  string password = 2;
  // Held what new Users now get from the Server (ADR 0020).
  reserved 3;
  reserved "role";
}

message CreateUserResponse {
  // The new User's ID.
  int64 id = 1;
}

message CreateUserFromAccountRequest {
  // As `CreateUserRequest.name`.
  string name = 1;
  // The email of the Account to create the User from, in any case.
  string email = 2;
}

message CreateUserFromAccountResponse {
  // The new User's ID.
  int64 id = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
  // The IDs of those `users` who can't sign in: they have no Sign-in Method the Server keeps and
  // aren't Linked to an Account, such as one created from an Account that was since deleted or
  // Unlinked them. Asking whether they are Linked is how the Server learns of an Unlink. An Admin
  // gives them a way in with `ResetPassword`.
  repeated int64 cannot_sign_in_user_ids = 2;
}

message SetPermissionsRequest {
  // The ID of the User whose Permissions change.
  int64 user_id = 1;
  // Every Permission the User is to have, replacing those they had. Empty takes them all away.
  repeated Permission permissions = 2;
  // Their cap, as `User.remote_playback_limit` says, replacing the one they had: unset or
  // `PLAYBACK_LIMIT_ORIGINAL` for none. A value this Server doesn't know is refused.
  PlaybackLimit remote_playback_limit = 3;
}

message SetPermissionsResponse {}

message SetLibraryAccessRequest {
  // The ID of the User whose Library access changes.
  int64 user_id = 1;
  // The Libraries they are to see, replacing those they saw: unset for every one, those added
  // later included. An ID no Library has is left out.
  LibraryAccess library_access = 2;
}

message SetLibraryAccessResponse {}

message DeleteUserRequest {
  // The ID of the User to delete.
  int64 user_id = 1;
}

message DeleteUserResponse {}

message ListDevicesRequest {
  // Whose Devices to list. Unset means the caller's own.
  optional int64 user_id = 1;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message RevokeDeviceRequest {
  // Whose Device to revoke. Unset means the caller's own.
  optional int64 user_id = 1;
  // The Device to revoke.
  int64 device_id = 2;
}

message RevokeDeviceResponse {}

message ChangePasswordRequest {
  // The current password was asked for before Recent Authentication.
  reserved 1;
  reserved "current_password";
  // The password to change to, which the Server's Authenticator checks against its own rules.
  string new_password = 2;
}

message ChangePasswordResponse {}

message ResetPasswordRequest {
  // The ID of the User whose password is reset.
  int64 user_id = 1;
  // The password to set, which the Server's Authenticator checks against its own rules.
  string new_password = 2;
}

message ResetPasswordResponse {}

message GetDefaultPermissionsRequest {}

message GetDefaultPermissionsResponse {
  // In the order of `Permission`'s values, each once.
  repeated Permission permissions = 1;
  // The cap new Users get, as `User.remote_playback_limit` says.
  PlaybackLimit remote_playback_limit = 2;
}

message SetDefaultPermissionsRequest {
  // Every Permission new Users are to get. Empty gives them none.
  repeated Permission permissions = 1;
  // The cap new Users are to get, as `SetPermissionsRequest.remote_playback_limit` says.
  PlaybackLimit remote_playback_limit = 2;
}

message SetDefaultPermissionsResponse {}

// A pending Invite, as Users who manage Users see it.
message Invite {
  // Assigned by the Server, and never reused.
  int64 id = 1;
  // Who it's for, as its creator noted it, such as "Mum", or empty. Never the new User's name.
  string note = 2;
  // The name of the User who made it.
  string creator_name = 3;
  // What the User it creates gets: those picked, less any its creator has since lost, in the order
  // of `Permission`'s values, each once.
  repeated Permission permissions = 4;
  // When it was made, in seconds since the Unix epoch.
  int64 created_at = 5;
  // When it stops working, in seconds since the Unix epoch.
  int64 expires_at = 6;
}

message CreateInviteRequest {
  // Who it's for, such as "Mum": up to 64 characters once trimmed, by the rules for a name, or
  // empty.
  string note = 1;
  // Every Permission the User it creates is to get. Never `PERMISSION_ADMIN`, nor one the caller
  // lacks.
  repeated Permission permissions = 2;
}

message CreateInviteResponse {
  // The Invite just made.
  Invite invite = 1;
  // The link to hand on, `<Server URL>/invite/<token>`. The token works through any address the
  // Server answers on.
  string url = 2;
}

message ListInvitesRequest {}

message ListInvitesResponse {
  // Oldest first.
  repeated Invite invites = 1;
  // Whether the Server has a Server URL, without which `CreateInvite` is refused.
  bool server_url_set = 2;
}

message RevokeInviteRequest {
  // The ID of the Invite to revoke.
  int64 invite_id = 1;
}

message RevokeInviteResponse {}

message ListPluginConnectionsRequest {}

message ListPluginConnectionsResponse {
  // One per Plugin the caller can connect to, by Plugin id.
  repeated PluginConnection connections = 1;
}

// A User's Plugin Connection, as the User sees it.
message PluginConnection {
  // The Plugin's id, such as `telegram`.
  string plugin_id = 1;
  PluginConnectionState state = 2;
}

// Where a User's Plugin Connection is.
enum PluginConnectionState {
  PLUGIN_CONNECTION_STATE_UNSPECIFIED = 0;
  // Not connected, and no link is waiting.
  PLUGIN_CONNECTION_STATE_NOT_CONNECTED = 1;
  // `StartPluginConnection` gave a link that the User hasn't finished with yet.
  PLUGIN_CONNECTION_STATE_WAITING = 2;
  // Connected.
  PLUGIN_CONNECTION_STATE_CONNECTED = 3;
}

message StartPluginConnectionRequest {
  // The Plugin's id, such as `telegram`.
  string plugin_id = 1;
}

message StartPluginConnectionResponse {
  // The link the User opens to finish connecting.
  string url = 1;
}

message DeletePluginConnectionRequest {
  // The Plugin's id, such as `telegram`.
  string plugin_id = 1;
}

message DeletePluginConnectionResponse {}

message ListPersonalSettingsRequest {}

message ListPersonalSettingsResponse {
  // One per enabled Plugin that declares Personal settings, sorted by Plugin id.
  repeated PersonalSettings plugins = 1;
}

// One Plugin's Personal settings, with the caller's own values.
message PersonalSettings {
  // The Plugin's id, such as `ntfy`.
  string plugin_id = 1;
  // The Plugin's name, from its Manifest.
  string name = 2;
  // Where to fetch the Plugin's logo, or empty if it has none.
  string logo_url = 3;
  // Each Personal setting the Manifest declares, in its order, with the caller's value. A
  // secret's value is never set: see `Setting.secret_set`.
  repeated Setting settings = 4;
  // Whether the Plugin is a Watch sync, whose account the caller links with
  // `StartWatchSyncLink` rather than by typing these settings.
  bool watch_sync = 5;
}

message UpdatePersonalSettingsRequest {
  // The Plugin's id, such as `ntfy`.
  string plugin_id = 1;
  // Every value the caller is to have, by key, replacing those they had but for a secret left out
  // or blank.
  map<string, SettingValue> settings = 2;
}

message UpdatePersonalSettingsResponse {
  // The Plugin's Personal settings as they are now.
  PersonalSettings plugin = 1;
}

message DeletePersonalSettingsRequest {
  // The Plugin's id, such as `ntfy`.
  string plugin_id = 1;
}

message DeletePersonalSettingsResponse {}

message StartWatchSyncLinkRequest {
  // The Plugin's id, such as `trakt`.
  string plugin_id = 1;
}

message StartWatchSyncLinkResponse {
  // The code the caller enters at `verification_url`.
  string user_code = 1;
  // Where the caller enters `user_code`, such as `https://trakt.tv/activate`.
  string verification_url = 2;
  // How long `user_code` works, in seconds.
  uint32 expires_in_seconds = 3;
  // How often to call `PollWatchSyncLink`, in seconds.
  uint32 interval_seconds = 4;
  // What `PollWatchSyncLink` asks with. Only the caller holds it, so keep it to themself.
  string device_code = 5;
}

message PollWatchSyncLinkRequest {
  // The Plugin's id, such as `trakt`.
  string plugin_id = 1;
  // What `StartWatchSyncLink` returned as `device_code`.
  string device_code = 2;
}

message PollWatchSyncLinkResponse {
  WatchSyncLinkState state = 1;
}

// Where linking an account at a Watch sync Plugin's tracker stands.
enum WatchSyncLinkState {
  WATCH_SYNC_LINK_STATE_UNSPECIFIED = 0;
  // The caller hasn't entered the code yet.
  WATCH_SYNC_LINK_STATE_PENDING = 1;
  // The caller entered the code, and the account is linked.
  WATCH_SYNC_LINK_STATE_LINKED = 2;
  // The code expired or the caller refused it: start again.
  WATCH_SYNC_LINK_STATE_EXPIRED = 3;
}

message ListNotificationPreferencesRequest {}

message ListNotificationPreferencesResponse {
  // One per kind offered to the caller, in the order of `NotificationKind`'s values.
  repeated NotificationPreference preferences = 1;
}

// Whether a User gets one kind of Request notification.
message NotificationPreference {
  // The kind of Request notification.
  NotificationKind kind = 1;
  // Whether the User gets it: true until they turn it off.
  bool on = 2;
}

// A kind of Request notification a User may get. Values are API contract: one is never
// renumbered or reused.
enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  // A Request of theirs was approved.
  NOTIFICATION_KIND_APPROVED = 1;
  // A Request of theirs was declined.
  NOTIFICATION_KIND_DECLINED = 2;
  // A Request of theirs Failed.
  NOTIFICATION_KIND_FAILED = 3;
  // A Request of theirs is Partially Available.
  NOTIFICATION_KIND_PARTIALLY_AVAILABLE = 4;
  // A Request of theirs is Available.
  NOTIFICATION_KIND_AVAILABLE = 5;
  // A Request of theirs was cancelled because the media it waited on was deleted.
  NOTIFICATION_KIND_CANCELLED_BY_DELETION = 6;
  // Someone made a Request that waits for approval. Only Users with
  // `PERMISSION_MANAGE_REQUESTS` get it.
  NOTIFICATION_KIND_NEW_PENDING = 7;
}

message SetNotificationPreferenceRequest {
  // The kind of Request notification to turn on or off.
  NotificationKind kind = 1;
  // Whether the caller gets `kind` from now on.
  bool on = 2;
}

message SetNotificationPreferenceResponse {}

message GetHomeLayoutRequest {}

message GetHomeLayoutResponse {
  HomeLayout layout = 1;
}

message SetHomeLayoutRequest {
  // Required: a request without it is refused, so leaving it out can't reset the layout.
  HomeLayout layout = 1;
}

message SetHomeLayoutResponse {
  // The layout as saved, as `GetHomeLayout` returns it.
  HomeLayout layout = 1;
}

message ReorderHomeRowsRequest {
  // Every Home row the caller sees, in the order their Home shows them.
  repeated HomeLayoutRow rows = 1;
}

message ReorderHomeRowsResponse {
  // The layout as saved, as `GetHomeLayout` returns it.
  HomeLayout layout = 1;
}

message ResetHomeLayoutRequest {}

message ResetHomeLayoutResponse {}
