syntax = "proto3";

package nama.v1;

import "nama/v1/sign_in.proto";

// Managing the Server's Users, their Devices and Plugin Connections. Every RPC but `ListDevices`,
// `RevokeDevice`, `ChangePassword` and the Plugin Connection ones needs `PERMISSION_MANAGE_USERS`,
// and fails with `permission_denied` without it.
// Only a caller with `PERMISSION_ADMIN` may `SetPermissions`, `ResetPassword` or `DeleteUser` for a
// User with it, grant it, put it in the default Permissions or create a User while they hold it, or
// set their own Permissions; others fail with `permission_denied` and a Refusal naming
// `PERMISSION_ADMIN`. `ChangePassword`, `ResetPassword`, `SetPermissions`, `SetDefaultPermissions`
// and `DeleteUser` also need Recent Authentication, as `SignInService` describes. RPCs name Users
// by ID, not by name.
service UserService {
  // Creates a User, who can sign in at once, with the default Permissions as they are now. Fails
  // with `invalid_argument` if the name or the password breaks the rules, and `already_exists` if
  // another User has the name, ignoring case.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Lists every User on the Server, oldest first.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces a User's Permissions, which apply from their next request. Their Devices stay signed
  // in. Fails with `invalid_argument` for `PERMISSION_UNSPECIFIED` or a value the Server doesn't
  // know, `not_found` if no User has the ID, and `failed_precondition` if it would leave no User
  // with `PERMISSION_ADMIN`.
  rpc SetPermissions(SetPermissionsRequest) returns (SetPermissionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Deletes a User with their Devices and credentials, so they can't sign in, their sessions stop
  // working at once and their open `EventService.Subscribe` streams end. The caller may delete
  // themselves, which signs out the calling Device too. Fails with `not_found` if no User has the
  // ID, so a retry after a delete that went through gets `not_found`, and `failed_precondition` if
  // it would leave no User with `PERMISSION_ADMIN`.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Lists a User's Devices that haven't expired, oldest first. Any signed-in User may list their
  // own; another User's needs `PERMISSION_MANAGE_USERS`. Fails with `not_found` if the User doesn't
  // exist, or isn't the caller and the caller lacks that Permission, so they can't learn which IDs
  // exist.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Revokes one of a User's Devices, so its session stops working at once and its open
  // `EventService.Subscribe` streams end. Revoking the calling Device signs it out, as `SignOut`
  // does. Who may revoke whose Devices is as for `ListDevices`, and fails the same way; it also
  // fails with `not_found` if the Device isn't that User's.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  // Changes the caller's own password. Their other Devices are revoked, as by `RevokeDevice`, and
  // the calling Device stays signed in. Fails with `unauthenticated` if the calling Device was
  // signed out meanwhile, and `invalid_argument` if the new password breaks the rules.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Sets a User's password, without their current one, for the caller to pass on to them. Every
  // Device of theirs is revoked, as by `RevokeDevice`. Fails with `invalid_argument` if the new
  // password breaks the rules, `not_found` if no User has the ID, and `failed_precondition` for the
  // caller's own User, who uses `ChangePassword` instead to keep the calling Device signed in.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // Gets the default Permissions: those `CreateUser` gives a new User. A fresh Server's are
  // `PERMISSION_REQUEST` and `PERMISSION_VIEW_REQUESTS`.
  rpc GetDefaultPermissions(GetDefaultPermissionsRequest) returns (GetDefaultPermissionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces the default Permissions. Users created before keep the Permissions they have. Fails
  // with `invalid_argument` for `PERMISSION_UNSPECIFIED` or a value the Server doesn't know.
  rpc SetDefaultPermissions(SetDefaultPermissionsRequest) returns (SetDefaultPermissionsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Lists the enabled Plugins the caller can connect to, such as Telegram, by id, with whether
  // they are connected. Any signed-in User may list their own, and only their own. What a Plugin
  // Connection holds, such as a Telegram chat id, never leaves the Server.
  rpc ListPluginConnections(ListPluginConnectionsRequest) returns (ListPluginConnectionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Starts connecting the caller to a Plugin, and returns the link they open to finish, such as
  // `https://t.me/<bot>?start=<code>`. The Plugin Connection is `PLUGIN_CONNECTION_STATE_WAITING`
  // until they do, for up to 10 minutes, then the link expires. Starting again replaces the link.
  // Fails with `REFUSAL_REASON_PLUGIN_NOT_FOUND` for a Plugin that isn't enabled or can't connect
  // Users, and with `unavailable` if the Plugin couldn't make the link.
  rpc StartPluginConnection(StartPluginConnectionRequest) returns (StartPluginConnectionResponse);
  // Disconnects the caller from a Plugin, deleting their Plugin Connection, or the link they are
  // waiting on. Disconnecting what isn't connected does nothing.
  rpc DeletePluginConnection(DeletePluginConnectionRequest) returns (DeletePluginConnectionResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message CreateUserRequest {
  // 1 to 64 characters once leading and trailing spaces are trimmed, and unique ignoring case.
  string name = 1;
  // The User's starting password, which the Server's Authenticator checks against its own rules.
  string password = 2;
  // Held what new Users now get from the Server (ADR 0020).
  reserved 3;
  reserved "role";
}

message CreateUserResponse {
  // The new User's ID.
  int64 id = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message SetPermissionsRequest {
  // The ID of the User whose Permissions change.
  int64 user_id = 1;
  // Every Permission the User is to have, replacing those they had. Empty takes them all away.
  repeated Permission permissions = 2;
}

message SetPermissionsResponse {}

message DeleteUserRequest {
  // The ID of the User to delete.
  int64 user_id = 1;
}

message DeleteUserResponse {}

message ListDevicesRequest {
  // Whose Devices to list. Unset means the caller's own.
  optional int64 user_id = 1;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message RevokeDeviceRequest {
  // Whose Device to revoke. Unset means the caller's own.
  optional int64 user_id = 1;
  // The Device to revoke.
  int64 device_id = 2;
}

message RevokeDeviceResponse {}

message ChangePasswordRequest {
  // The current password was asked for before Recent Authentication.
  reserved 1;
  reserved "current_password";
  // The password to change to, which the Server's Authenticator checks against its own rules.
  string new_password = 2;
}

message ChangePasswordResponse {}

message ResetPasswordRequest {
  // The ID of the User whose password is reset.
  int64 user_id = 1;
  // The password to set, which the Server's Authenticator checks against its own rules.
  string new_password = 2;
}

message ResetPasswordResponse {}

message GetDefaultPermissionsRequest {}

message GetDefaultPermissionsResponse {
  // In the order of `Permission`'s values, each once.
  repeated Permission permissions = 1;
}

message SetDefaultPermissionsRequest {
  // Every Permission new Users are to get. Empty gives them none.
  repeated Permission permissions = 1;
}

message SetDefaultPermissionsResponse {}

message ListPluginConnectionsRequest {}

message ListPluginConnectionsResponse {
  // One per Plugin the caller can connect to, by Plugin id.
  repeated PluginConnection connections = 1;
}

// A User's Plugin Connection, as the User sees it.
message PluginConnection {
  // The Plugin's id, such as `telegram`.
  string plugin_id = 1;
  PluginConnectionState state = 2;
}

// Where a User's Plugin Connection is.
enum PluginConnectionState {
  PLUGIN_CONNECTION_STATE_UNSPECIFIED = 0;
  // Not connected, and no link is waiting.
  PLUGIN_CONNECTION_STATE_NOT_CONNECTED = 1;
  // `StartPluginConnection` gave a link that the User hasn't finished with yet.
  PLUGIN_CONNECTION_STATE_WAITING = 2;
  // Connected.
  PLUGIN_CONNECTION_STATE_CONNECTED = 3;
}

message StartPluginConnectionRequest {
  // The Plugin's id, such as `telegram`.
  string plugin_id = 1;
}

message StartPluginConnectionResponse {
  // The link the User opens to finish connecting.
  string url = 1;
}

message DeletePluginConnectionRequest {
  // The Plugin's id, such as `telegram`.
  string plugin_id = 1;
}

message DeletePluginConnectionResponse {}
