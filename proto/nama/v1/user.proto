syntax = "proto3";

package nama.v1;

import "nama/v1/sign_in.proto";

// Managing the Server's Users and their Devices. Every RPC but `ListDevices`, `RevokeDevice` and
// `ChangePassword` needs the Admin Role, and fails with `permission_denied` without it. RPCs name
// Users by ID, not by name.
service UserService {
  // Creates a User, who can sign in at once. Fails with `invalid_argument` if the name, the
  // password or the Role breaks the rules, and `already_exists` if another User has the name,
  // ignoring case.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Lists every User on the Server, oldest first.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Gives a User a Role, which applies from their next request. Their Devices stay signed in.
  // Fails with `invalid_argument` for `ROLE_UNSPECIFIED`, `not_found` if no User has the ID, and
  // `failed_precondition` if it would leave the Server with no Admin.
  rpc SetRole(SetRoleRequest) returns (SetRoleResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Lists a User's Devices that haven't expired, oldest first. Any signed-in User may list their
  // own; another User's needs the Admin Role. Fails with `not_found` if the User doesn't exist, or
  // isn't the caller and the caller isn't an Admin, so a Member can't learn which IDs exist.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Revokes one of a User's Devices, so its session stops working at once and its open
  // `EventService.Subscribe` streams end. Revoking the calling Device signs it out, as `SignOut`
  // does. Who may revoke whose Devices is as for `ListDevices`, and fails the same way; it also
  // fails with `not_found` if the Device isn't that User's.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  // Changes the caller's own password, given their current one. Their other Devices are revoked,
  // as by `RevokeDevice`, and the calling Device stays signed in. Fails with `unauthenticated` if
  // the current password is wrong or the calling Device was signed out meanwhile, and
  // `invalid_argument` if the new one breaks the rules. A wrong current password counts toward the
  // limit on failed `SignInService.SignIn`s for the caller's name, and once it is reached, this
  // fails with `resource_exhausted` as `SignIn` does.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

message CreateUserRequest {
  // 1 to 64 characters once leading and trailing spaces are trimmed, and unique ignoring case.
  string name = 1;
  // The User's starting password, which the Server's Authenticator checks against its own rules.
  string password = 2;
  // Must not be `ROLE_UNSPECIFIED`.
  Role role = 3;
}

message CreateUserResponse {
  // The new User's ID.
  int64 id = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message SetRoleRequest {
  // The ID of the User whose Role changes.
  int64 user_id = 1;
  // Must not be `ROLE_UNSPECIFIED`.
  Role role = 2;
}

message SetRoleResponse {}

message ListDevicesRequest {
  // Whose Devices to list. Unset means the caller's own.
  optional int64 user_id = 1;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message RevokeDeviceRequest {
  // Whose Device to revoke. Unset means the caller's own.
  optional int64 user_id = 1;
  // The Device to revoke.
  int64 device_id = 2;
}

message RevokeDeviceResponse {}

message ChangePasswordRequest {
  // The caller's password now.
  string current_password = 1;
  // The password to change to, which the Server's Authenticator checks against its own rules.
  string new_password = 2;
}

message ChangePasswordResponse {}
