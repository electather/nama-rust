syntax = "proto3";

package nama.v1;

// The Server's Plugins and their settings. Needs `PERMISSION_MANAGE_SETTINGS`, or
// `PERMISSION_ADMIN` for `ListPluginLogLines`, and fails with `permission_denied` without it. A
// secret setting's value never leaves the Server. Every call but `GetPlugin` and
// `ListPluginLogLines` naming a Plugin the Server refused (see `PluginSummary.refused_reason`) fails
// with `REFUSAL_REASON_PLUGIN_REFUSED`. A Plugin the Server took may still refuse to start with its
// settings, which fails `EnablePlugin` with `REFUSAL_REASON_PLUGIN_REFUSED_TO_START`.
service PluginService {
  // Lists every Plugin on the Server, by id, without its settings. Reads the Installed Plugins
  // again first, and drops each one no longer there from the default Home layout.
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Plugin with its settings. A refused Plugin comes with its summary's
  // `refused_reason` and no settings. Fails with `not_found` for an unknown Plugin.
  rpc GetPlugin(GetPluginRequest) returns (GetPluginResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces a Plugin's settings and, if it is meant to be enabled, enables it again with them,
  // without a restart. Settings that don't fit its schema, such as an integer outside its bounds
  // (`REFUSAL_REASON_SETTING_OUT_OF_RANGE`), are refused with a Refusal naming `settings.<key>`,
  // and nothing changes; so is a `SETTING_KIND_LIBRARIES` setting naming an id no Library has, with
  // `REFUSAL_REASON_LIBRARY_NOT_FOUND` and the id in `libraryId`. A required setting left out or
  // blank is refused with `REFUSAL_REASON_FIELD_REQUIRED` only while the Plugin is meant to be
  // enabled: a disabled Plugin's can be cleared, and `EnablePlugin` checks them. A repeated Library
  // id is saved once, where it first appears. If a choice setting has a value, the Plugin's
  // settings check runs on the new settings first, and a check that fails, or doesn't offer that
  // value, is refused with `REFUSAL_REASON_SETTINGS_CHECK_FAILED` or
  // `REFUSAL_REASON_CHOICE_NOT_OFFERED` naming the setting, and nothing changes. A
  // `SETTING_KIND_CHOICES` setting's values are checked the same way, against the choices the check
  // offers for it or else its `Setting.choices`, the check running only if the Plugin has one, and
  // each is saved once, in the order its choices are listed. A Plugin that then refuses to start
  // with them doesn't fail the call: the settings are saved and it comes back not running
  // (`plugin.summary.enabled` false); `EnablePlugin` says why with
  // `REFUSAL_REASON_PLUGIN_REFUSED_TO_START`. Fails with `not_found` for an unknown Plugin.
  rpc UpdatePluginSettings(UpdatePluginSettingsRequest) returns (UpdatePluginSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Enables a Plugin with its stored settings, without a restart, and saves that it is enabled.
  // Enabling one that is enabled already only saves that. If its stored settings don't fit its
  // schema, fails with `REFUSAL_REASON_FIELD_REQUIRED`, `REFUSAL_REASON_SETTING_WRONG_KIND` or
  // `REFUSAL_REASON_SETTING_OUT_OF_RANGE`, naming the setting in `field` as `settings.<key>` and
  // in the `settingKey` param; the Plugin stays disabled and nothing is saved. A Plugin that
  // refuses to start with them fails with `REFUSAL_REASON_PLUGIN_REFUSED_TO_START` and stays
  // disabled.
  rpc EnablePlugin(EnablePluginRequest) returns (EnablePluginResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Runs a Plugin's settings check on `settings`, which may not be saved yet, and returns the
  // choices it offers for each `SETTING_KIND_CHOICE` setting, and for each `SETTING_KIND_CHOICES`
  // setting it offers its own for, which replace its `Setting.choices`. It runs only when called,
  // never to enable a Plugin. Settings that don't fit the Plugin's schema are refused as in
  // `UpdatePluginSettings`, except that a choice setting may be left out. A check that fails, runs
  // too long or crashes is refused with `REFUSAL_REASON_SETTINGS_CHECK_FAILED`, its message saying
  // why in plain words, as is a Plugin without a check (see `Plugin.checks_settings`). Fails with
  // `not_found` for an unknown Plugin.
  rpc TestPluginSettings(TestPluginSettingsRequest) returns (TestPluginSettingsResponse) {
    // Not NO_SIDE_EFFECTS, though it has none: that lets a client send it as a GET, which would put
    // a secret in the URL.
  }
  // Disables a Plugin, removing everything it registered, without a restart, and saves that it is
  // disabled. Fails with `REFUSAL_REASON_LAST_AUTHENTICATOR` if no other enabled Plugin provides an
  // Authenticator; it stays enabled and nothing is saved.
  rpc DisablePlugin(DisablePluginRequest) returns (DisablePluginResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Returns a Fulfiller's Qualities (ADR 0025), in the order an admin listed them. Empty until an
  // admin lists some, which leaves the Plugin's own `quality_profile` setting in use. Fails with
  // `not_found` for an unknown Plugin.
  rpc ListQualities(ListQualitiesRequest) returns (ListQualitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces a Fulfiller's Qualities. A list with any Qualities needs exactly one default, else
  // it is refused with `REFUSAL_REASON_DEFAULT_QUALITY_REQUIRED`; a blank name or profile with
  // `REFUSAL_REASON_FIELD_REQUIRED`; and a profile or name (ignoring case) given twice with
  // `REFUSAL_REASON_QUALITY_REPEATED`. The Plugin's settings check then runs on its stored
  // settings: a check that fails is refused with `REFUSAL_REASON_SETTINGS_CHECK_FAILED`, and a
  // profile it doesn't offer for `quality_profile` with `REFUSAL_REASON_CHOICE_NOT_OFFERED`. Each
  // refusal names the field, such as `qualities[1].profile_id`, and nothing changes. Clearing the
  // list runs no check. Fails with `not_found` for an unknown Plugin.
  rpc ReplaceQualities(ReplaceQualitiesRequest) returns (ReplaceQualitiesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Returns the last 100 lines of a Plugin's Plugin Log that passed the Server's log filter, newest
  // first. The Server keeps them in memory only, from when the Plugin is enabled: disabling it
  // clears them, and so does a restart. A Plugin that isn't enabled, or that the Server doesn't
  // have, has none.
  rpc ListPluginLogLines(ListPluginLogLinesRequest) returns (ListPluginLogLinesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ListPluginsRequest {}

message ListPluginsResponse {
  // Held every Plugin with its settings, which `GetPlugin` now returns.
  reserved 1;
  reserved "plugins";
  repeated PluginSummary summaries = 2;
}

message GetPluginRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
}

message GetPluginResponse {
  Plugin plugin = 1;
}

message UpdatePluginSettingsRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
  // Each setting's new value, by key. A setting left out or blank takes its default, except a
  // secret, which keeps its stored value unless `forgotten_secrets` names it. Keys the Plugin's
  // schema doesn't name are ignored.
  map<string, SettingValue> settings = 2;
  // The keys of secret settings whose stored value is forgotten. A key also given a value in
  // `settings` takes that value; a key that isn't a secret of the Plugin is ignored.
  repeated string forgotten_secrets = 3;
}

message UpdatePluginSettingsResponse {
  // The Plugin with its new settings, and whether it is running now.
  Plugin plugin = 1;
}

message EnablePluginRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
  // The Plugin Permissions the Admin grants an Installed Plugin, replacing those granted before.
  // Each must be one its `requested_permissions` lists, or the call is refused with
  // `REFUSAL_REASON_PERMISSION_NOT_REQUESTED`. Empty grants none. A Built-in Plugin ignores it and
  // holds every Plugin Permission it requests.
  repeated PluginPermission granted_permissions = 2;
}

message EnablePluginResponse {}

message TestPluginSettingsRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
  // The settings to test, by key, as `UpdatePluginSettingsRequest.settings`: a secret left out or
  // blank uses its stored value.
  map<string, SettingValue> settings = 2;
}

message TestPluginSettingsResponse {
  // The choices for each `SETTING_KIND_CHOICE` setting, and each `SETTING_KIND_CHOICES` setting
  // the check offers its own for, by key.
  map<string, SettingChoices> choices = 1;
}

// The values one choice setting may take, in the order a form shows them.
message SettingChoices {
  repeated Choice choices = 1;
}

// One value a choice setting may take.
message Choice {
  // What is stored as the setting's `text_value`, or among its `texts`, such as a quality
  // profile's id.
  string value = 1;
  // What an Admin picks it by, such as the profile's name.
  string label = 2;
}

message DisablePluginRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
}

message DisablePluginResponse {}

// One way a Fulfiller's service may download a title, as an admin offers it to Requesters: one of
// the service's quality profiles under a friendly name (ADR 0025).
message Quality {
  // Its stable id. Zero for a new one in `ReplaceQualitiesRequest`, which gives it one.
  int64 id = 1;
  // The service's quality profile, as a choice the Plugin's settings check offers for its
  // `quality_profile` setting, such as Radarr's profile id.
  string profile_id = 2;
  // What Requesters know it by, such as `HD`. Unique within the list, ignoring case.
  string name = 3;
  // What choosing it means, such as `About 50 GB per film`. Empty for none.
  string description = 4;
  // Whether a new Request gets it. Exactly one Quality in a list is the default.
  bool is_default = 5;
}

message ListQualitiesRequest {
  // The Fulfiller's Plugin id, such as `radarr`.
  string id = 1;
}

message ListQualitiesResponse {
  repeated Quality qualities = 1;
}

message ReplaceQualitiesRequest {
  // The Fulfiller's Plugin id, such as `radarr`.
  string id = 1;
  // The new list, in order. A Quality keeps its `id` if it is on the list now and no earlier
  // Quality here kept it; any other id gets a new one.
  repeated Quality qualities = 2;
}

message ReplaceQualitiesResponse {
  // The list as saved, with each Quality's id.
  repeated Quality qualities = 1;
}

message ListPluginLogLinesRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
}

message ListPluginLogLinesResponse {
  // Newest first.
  repeated PluginLogLine lines = 1;
}

// One line a Plugin logged.
message PluginLogLine {
  // When it was logged, in milliseconds since the Unix epoch.
  int64 at_ms = 1;
  PluginLogLevel level = 2;
  // What it says, with an Installed Plugin's secret settings blanked. A line over 2 KiB is cut
  // there and ends ` [cut]`.
  string text = 3;
}

// How much a Plugin Log line matters.
enum PluginLogLevel {
  PLUGIN_LOG_LEVEL_UNSPECIFIED = 0;
  // Detail for following what the Plugin does, also a Built-in Plugin's `trace` lines.
  PLUGIN_LOG_LEVEL_DEBUG = 1;
  PLUGIN_LOG_LEVEL_INFO = 2;
  PLUGIN_LOG_LEVEL_WARN = 3;
  PLUGIN_LOG_LEVEL_ERROR = 4;
}

// Where a Plugin comes from.
enum PluginKind {
  PLUGIN_KIND_UNSPECIFIED = 0;
  // Compiled into the Server.
  PLUGIN_KIND_BUILT_IN = 1;
  // Loaded from a `.wasm` file in the Server's `<data_dir>/plugins/`, which the Server reads again
  // each time it lists its Plugins.
  PLUGIN_KIND_INSTALLED = 2;
}

// What `ListPlugins` lists of a Plugin, and `Plugin` holds: all but its settings and whether it
// has a settings check.
message PluginSummary {
  // Its stable, unique name, such as `tmdb`.
  string id = 1;
  string version = 2;
  PluginKind kind = 3;
  // Whether it is running. A Plugin missing a required setting isn't, and an Installed Plugin
  // starts disabled.
  bool enabled = 4;
  // Why the Server refused it, in plain words, such as an Installed Plugin built for another Nama
  // API version. Empty unless it was refused. A refused Plugin can't be enabled, and its `id` is
  // its file's name, since the Server may not have learnt the id it gives itself.
  string refused_reason = 5;
  // Whether a required setting has no value, no default and no stored secret, so `EnablePlugin`
  // would refuse it with `REFUSAL_REASON_FIELD_REQUIRED`. An enabled Plugin may have one too, such
  // as an Installed Plugin upgraded with a new required setting.
  bool settings_missing = 6;
  // What admins know it by, such as "TMDB". Empty if it gives none, when `id` stands in.
  string name = 7;
  // What it does, in one sentence its author wrote. Empty if it gives none.
  string description = 8;
  // The Extension Points it takes part at, as its Manifest names them, whether it is enabled or
  // not. Empty for a refused Plugin.
  repeated ExtensionPoint extension_points = 9;
  // Held its logo's SVG text, which `logo_url` replaces.
  reserved 10;
  reserved "logo_svg";
  // Its logo's URL on this Server, or empty if it has none: its Custom Image if it has one, else
  // its Manifest's. An SVG may be one an Installed Plugin's author wrote, so show it only as an
  // image, never inline in a page.
  string logo_url = 11;
  // Whether `logo_url` is a Custom Image, which `DELETE /custom-images/plugin/<id>/logo` removes.
  // `PUT` there uploads one, a JPEG, PNG or WebP, or an SVG of at most 64 KiB, for a User with
  // `PERMISSION_MANAGE_SETTINGS`.
  bool custom_logo = 12;
  // The Plugin Permissions it asks for, which an Admin grants an Installed Plugin some or all of
  // in `EnablePlugin`.
  repeated PluginPermission requested_permissions = 13;
  // The Plugin Permissions it holds: for an Installed Plugin those an Admin granted, kept across
  // restarts until it is enabled again; for a Built-in Plugin always all it requests.
  repeated PluginPermission granted_permissions = 14;
}

// A unit of trusted functionality that plugs into a Server.
message Plugin {
  // Held what `summary` holds now.
  reserved 1, 2, 3, 4, 7, 8, 9, 10, 11;
  reserved "id", "version", "kind", "enabled", "refused_reason";
  reserved "name", "description", "extension_points", "logo_svg";
  // Its id, name, whether it is enabled and the rest that `ListPlugins` lists.
  PluginSummary summary = 12;
  // Every setting it takes, in the order a form shows them.
  repeated Setting settings = 5;
  // Whether it has a settings check, which `TestPluginSettings` runs.
  bool checks_settings = 6;
  // Held its Recogniser's failure, which `failures` holds now.
  reserved 13;
  reserved "recogniser_failure";
  // Each Extension Point it serves whose last call failed, so the Admin sees one that keeps
  // failing. Only points whose calls the Server records are listed, such as a Recogniser or a
  // Notifier; the rest show their failures only in the log.
  repeated ExtensionPointFailure failures = 14;
  // How to set it up, as Markdown its author wrote, or empty if it gives none. Raw text: render it
  // as data, never as HTML (ADR 0058).
  string setup_markdown = 15;
  // Its homepage or docs, an http or https URL, or empty if it gives none.
  string homepage_url = 16;
  // Where its source lives, an http or https URL, or empty if it gives none.
  string source_url = 17;
  // Its licence as an SPDX expression, such as `MIT`, or empty if it gives none.
  string license = 18;
  // The Jobs its Manifest declares, in that order, whether or not it is enabled, so an Admin sees
  // what it will run. `JobService` gives an enabled Plugin's Jobs with their Runs.
  repeated PluginJob jobs = 19;
}

// A Job a Plugin's Manifest declares.
message PluginJob {
  // Unique within its Plugin, such as `forget-home-rows`: `JobService` knows it by this id.
  string id = 1;
  string name = 2;
  // Its standard 5-field cron schedule, such as `0 4 * * *`, read in the Server's time zone, or
  // empty for a Job that runs only when an Admin starts it.
  string schedule = 3;
}

// An Extension Point of a Plugin whose last call failed. The Server keeps it in memory only: a call
// that answers clears it, and so do disabling the Plugin and a restart.
message ExtensionPointFailure {
  // The point that failed.
  ExtensionPoint point = 1;
  // What the last failure said, with the Plugin's secret settings blanked.
  string last_error = 2;
  // When it failed, in milliseconds since the Unix epoch.
  int64 at_ms = 3;
  // How many calls in a row have failed, the last included.
  uint32 failed_in_a_row = 4;
}

// What an Admin lets a Plugin do in the Server, as its Manifest requests (ADR 0049). These are
// not a User's Permissions: they say what the Plugin itself may read or change.
enum PluginPermission {
  PLUGIN_PERMISSION_UNSPECIFIED = 0;
  // Keep its own notes in the Server, such as which titles it has already looked at.
  PLUGIN_PERMISSION_STORE = 1;
  // See every Library and the Movies and Episodes in it.
  PLUGIN_PERMISSION_READ_LIBRARIES = 2;
  // See what every User has watched, and when.
  PLUGIN_PERMISSION_READ_WATCH_STATES = 3;
  // Delete Movies and Episodes, with their files on disk.
  PLUGIN_PERMISSION_DELETE_MEDIA = 4;
  // See every User's id and display name.
  PLUGIN_PERMISSION_READ_USERS = 5;
  // See which Users asked for each Movie and Episode, and nothing else about their Requests.
  PLUGIN_PERMISSION_READ_REQUESTS = 6;
  // See what every User put on their Watchlist.
  PLUGIN_PERMISSION_READ_WATCHLISTS = 7;
  // Delete the Home rows and Featured suggestions kept for Users who stopped opening home.
  PLUGIN_PERMISSION_FORGET_HOME_ROWS = 8;
  // Delete the settings and data kept for Plugins the Server stopped having a while ago.
  PLUGIN_PERMISSION_FORGET_GONE_PLUGINS = 9;
  // Delete the Devices and Invites that have expired, which no longer work.
  PLUGIN_PERMISSION_DELETE_EXPIRED_SIGN_INS = 10;
  // Fetch every Matched title's metadata again from its title source.
  PLUGIN_PERMISSION_REFRESH_METADATA = 11;
  // Write a Backup of the Server, every Plugin's keys included, into the folder the Admin set.
  PLUGIN_PERMISSION_BACK_UP = 12;
}

// A place in the Server a Plugin takes part at, as an admin is shown it. An Installed Plugin
// names the points it serves by their `nama.plugin.v1` service, such as
// `nama.plugin.v1.MovieFulfillerService` (ADR 0043).
enum ExtensionPoint {
  EXTENSION_POINT_UNSPECIFIED = 0;
  // Hands Approved Movie Requests to an outside service, such as Radarr.
  EXTENSION_POINT_MOVIE_FULFILLER = 1;
  // Hands Approved Season Requests to an outside service, such as Sonarr.
  EXTENSION_POINT_SHOW_FULFILLER = 2;
  // Delivers notifications about Requests through an outside service.
  EXTENSION_POINT_NOTIFIER = 3;
  // Connects Users to an outside service.
  EXTENSION_POINT_CONNECTOR = 4;
  // Checks the credentials people sign in with.
  EXTENSION_POINT_AUTHENTICATOR = 5;
  // A title source: searches for and describes Movies and Shows, such as TMDB.
  EXTENSION_POINT_TITLE_SOURCE = 6;
  // Observes the Server's Events.
  EXTENSION_POINT_EVENTS_OBSERVER = 7;
  // Observes the Server starting.
  EXTENSION_POINT_SERVER_STARTED_OBSERVER = 8;
  // Proposes what a file is, which a Library lists to ask it (ADR 0050).
  EXTENSION_POINT_RECOGNISER = 9;
  // Keeps the Server's stored images, such as in S3, once an Admin picks it with
  // `ServerService.SwitchImageStore`.
  EXTENSION_POINT_BLOB_STORE = 10;
  // Runs Jobs on their schedules and asks the Server's Kernel functions, as far as the
  // Permissions an Admin granted it allow, such as Cleanup (ADR 0079).
  EXTENSION_POINT_AUTOMATION = 11;
  // Searches an outside service, such as OpenSubtitles.com, for a Version's subtitles and
  // downloads one a User picks (ADR 0067).
  EXTENSION_POINT_SUBTITLE_SOURCE = 12;
  // Gives rows of titles for every User's home page, which the Server draws (ADR 0058).
  EXTENSION_POINT_HOME_ROW = 13;
  // Says where a Version's Intro, Recap and Credits are, which a Library lists to ask it
  // (ADR 0075).
  EXTENSION_POINT_SEGMENT_SOURCE = 14;
  // Adds titles to every User's search, such as by what they are about, after the Libraries'
  // and the title source's (ADR 0083).
  EXTENSION_POINT_SEARCH_SOURCE = 15;
  // Says which titles are like a title, for its Similar titles (ADR 0084).
  EXTENSION_POINT_SIMILAR_SOURCE = 16;
}

// What kind of value a setting takes.
enum SettingKind {
  SETTING_KIND_UNSPECIFIED = 0;
  // Text.
  SETTING_KIND_TEXT = 1;
  // Text that is never sent back or logged, such as an API key.
  SETTING_KIND_SECRET = 2;
  // On or off.
  SETTING_KIND_BOOL = 3;
  // A whole number.
  SETTING_KIND_INTEGER = 4;
  // Text picked from the choices the Plugin's settings check offers (`TestPluginSettings`), which
  // for an Installed Plugin is its `check_settings()` export.
  SETTING_KIND_CHOICE = 5;
  // An http or https URL, such as a Sonarr address. An Installed Plugin may send HTTP requests
  // to its host, as if its Manifest's `allowed_hosts` named it.
  SETTING_KIND_URL = 6;
  // The ids of Libraries, picked from the Server's Library list (`ListLibraries`). Saving an id
  // that names no Library is refused, and a repeated id is kept once; a Library deleted later
  // stays in the value.
  SETTING_KIND_LIBRARIES = 7;
  // Several values, unlike `SETTING_KIND_CHOICE`, each picked from `Setting.choices`, or from
  // those `TestPluginSettings` offers for it, which replace them. Each value is saved once, in the
  // order the choices are listed, and an empty list picks none. A value saved earlier may no
  // longer be offered.
  SETTING_KIND_CHOICES = 8;
}

// One setting a Plugin takes, as its schema declares it, and its stored value.
message Setting {
  // The key it is stored under, such as `api_key`.
  string key = 1;
  // A short name for a form's label.
  string label = 2;
  // What the setting does, for a form's help text.
  string description = 3;
  SettingKind kind = 4;
  // Whether the Plugin can't be enabled without it.
  bool required = 5;
  // The value used when none is stored. Never set for a secret.
  SettingValue default_value = 6;
  // The stored value. Never set for a secret: see `secret_set`.
  SettingValue value = 7;
  // Whether a secret has a stored value. Always false for other kinds.
  bool secret_set = 8;
  // The least and most a SETTING_KIND_INTEGER setting may be, inclusive, each unset if it has
  // none. Saving or enabling with a value outside them is refused with
  // `REFUSAL_REASON_SETTING_OUT_OF_RANGE`.
  optional int64 min_value = 9;
  optional int64 max_value = 10;
  // The choices a SETTING_KIND_CHOICES setting offers, in the order a form shows them, unless
  // `TestPluginSettings` offers others for it. Empty for other kinds.
  repeated Choice choices = 11;
}

// A setting's value, of the setting's kind.
message SettingValue {
  oneof value {
    // Text, for SETTING_KIND_TEXT, SETTING_KIND_SECRET, SETTING_KIND_CHOICE and SETTING_KIND_URL.
    string text_value = 1;
    // On or off, for SETTING_KIND_BOOL.
    bool bool_value = 2;
    // A whole number, for SETTING_KIND_INTEGER.
    int64 integer_value = 3;
    // Library ids, for SETTING_KIND_LIBRARIES.
    LibraryIds library_ids = 4;
    // The picked choices' values, for SETTING_KIND_CHOICES.
    Texts texts = 5;
  }
}

// The values a SETTING_KIND_CHOICES setting holds, in the order its choices are listed.
message Texts {
  repeated string values = 1;
}

// The ids of Libraries a SETTING_KIND_LIBRARIES setting names, in the order the admin gave them.
message LibraryIds {
  repeated int64 ids = 1;
}
