syntax = "proto3";

package nama.v1;

// The Server's Plugins and their settings. Needs `PERMISSION_MANAGE_SETTINGS`, and fails with
// `permission_denied` without it. A secret setting's value never leaves the Server. Every call
// but `GetPlugin` naming a Plugin the Server refused (see `Plugin.refused_reason`) fails with
// `REFUSAL_REASON_PLUGIN_REFUSED`.
service PluginService {
  // Lists every Plugin on the Server, by id, without its settings.
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Plugin with its settings. A refused Plugin comes with its `refused_reason` and no
  // settings. Fails with `not_found` for an unknown Plugin.
  rpc GetPlugin(GetPluginRequest) returns (GetPluginResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces a Plugin's settings and, if it is meant to be enabled, enables it again with them,
  // without a restart. Settings that don't fit its schema are refused with a Refusal naming
  // `settings.<key>`, and nothing changes. If a choice setting has a value, the Plugin's settings
  // check runs on the new settings first, and a check that fails, or doesn't offer that value, is
  // refused with `REFUSAL_REASON_SETTINGS_CHECK_FAILED` or `REFUSAL_REASON_CHOICE_NOT_OFFERED`
  // naming the setting, and nothing changes. Fails with `not_found` for an unknown Plugin.
  rpc UpdatePluginSettings(UpdatePluginSettingsRequest) returns (UpdatePluginSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Enables a Plugin with its stored settings, without a restart, and saves that it is enabled.
  // Enabling one that is enabled already only saves that. If its stored settings don't fit its
  // schema, fails with `REFUSAL_REASON_FIELD_REQUIRED` or `REFUSAL_REASON_SETTING_WRONG_KIND`,
  // naming the setting in `field` as `settings.<key>` and in the `settingKey` param; the Plugin
  // stays disabled and nothing is saved.
  rpc EnablePlugin(EnablePluginRequest) returns (EnablePluginResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Runs a Plugin's settings check on `settings`, which may not be saved yet, and returns the
  // choices it offers for each `SETTING_KIND_CHOICE` setting. It runs only when called, never to
  // enable a Plugin. Settings that don't fit the Plugin's schema are refused as in
  // `UpdatePluginSettings`, except that a choice setting may be left out. A check that fails, runs
  // too long or crashes is refused with `REFUSAL_REASON_SETTINGS_CHECK_FAILED`, its message saying
  // why in plain words, as is a Plugin without a check (see `Plugin.checks_settings`). Fails with
  // `not_found` for an unknown Plugin.
  rpc TestPluginSettings(TestPluginSettingsRequest) returns (TestPluginSettingsResponse) {
    // Not NO_SIDE_EFFECTS, though it has none: that lets a client send it as a GET, which would put
    // a secret in the URL.
  }
  // Disables a Plugin, removing everything it registered, without a restart, and saves that it is
  // disabled. Fails with `REFUSAL_REASON_LAST_AUTHENTICATOR` if no other enabled Plugin provides an
  // Authenticator; it stays enabled and nothing is saved.
  rpc DisablePlugin(DisablePluginRequest) returns (DisablePluginResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message ListPluginsRequest {}

message ListPluginsResponse {
  // Held every Plugin with its settings, which `GetPlugin` now returns.
  reserved 1;
  reserved "plugins";
  repeated PluginSummary summaries = 2;
}

message GetPluginRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
}

message GetPluginResponse {
  Plugin plugin = 1;
}

message UpdatePluginSettingsRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
  // Each setting's new value, by key. A setting left out or blank takes its default, except a
  // secret, which keeps its stored value. Keys the Plugin's schema doesn't name are ignored.
  map<string, SettingValue> settings = 2;
}

message UpdatePluginSettingsResponse {
  // The Plugin with its new settings, and whether it is running now.
  Plugin plugin = 1;
}

message EnablePluginRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
}

message EnablePluginResponse {}

message TestPluginSettingsRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
  // The settings to test, by key, as `UpdatePluginSettingsRequest.settings`: a secret left out or
  // blank uses its stored value.
  map<string, SettingValue> settings = 2;
}

message TestPluginSettingsResponse {
  // The choices for each `SETTING_KIND_CHOICE` setting, by key.
  map<string, SettingChoices> choices = 1;
}

// The values one choice setting may take, in the order a form shows them.
message SettingChoices {
  repeated Choice choices = 1;
}

// One value a choice setting may take.
message Choice {
  // What is stored as the setting's `text_value`, such as a quality profile's id.
  string value = 1;
  // What an Admin picks it by, such as the profile's name.
  string label = 2;
}

message DisablePluginRequest {
  // The Plugin's id, such as `tmdb`.
  string id = 1;
}

message DisablePluginResponse {}

// Where a Plugin comes from.
enum PluginKind {
  PLUGIN_KIND_UNSPECIFIED = 0;
  // Compiled into the Server.
  PLUGIN_KIND_BUILT_IN = 1;
  // Loaded from a `.wasm` file in the Server's `<data_dir>/plugins/`, which the Server reads again
  // each time it lists its Plugins.
  PLUGIN_KIND_INSTALLED = 2;
}

// A Plugin as `ListPlugins` lists it: a `Plugin` without its settings.
message PluginSummary {
  // As `Plugin.id`.
  string id = 1;
  string version = 2;
  PluginKind kind = 3;
  // As `Plugin.enabled`.
  bool enabled = 4;
  // As `Plugin.refused_reason`.
  string refused_reason = 5;
  // Whether a required setting has no value, no default and no stored secret, so `EnablePlugin`
  // would refuse it with `REFUSAL_REASON_FIELD_REQUIRED`. An enabled Plugin may have one too, such
  // as an Installed Plugin upgraded with a new required setting.
  bool settings_missing = 6;
}

// A unit of trusted functionality that plugs into a Server.
message Plugin {
  // Its stable, unique name, such as `tmdb`.
  string id = 1;
  string version = 2;
  PluginKind kind = 3;
  // Whether it is running. A Plugin missing a required setting isn't, and an Installed Plugin
  // starts disabled.
  bool enabled = 4;
  // Every setting it takes, in the order a form shows them.
  repeated Setting settings = 5;
  // Whether it has a settings check, which `TestPluginSettings` runs.
  bool checks_settings = 6;
  // Why the Server refused it, in plain words, such as an Installed Plugin built for another Nama
  // API version. Empty unless it was refused. A refused Plugin can't be enabled, and its `id` is
  // its file's name, since the Server may not have learnt the id it gives itself.
  string refused_reason = 7;
}

// What kind of value a setting takes.
enum SettingKind {
  SETTING_KIND_UNSPECIFIED = 0;
  SETTING_KIND_TEXT = 1;
  // Text that is never sent back, such as an API key.
  SETTING_KIND_SECRET = 2;
  SETTING_KIND_BOOL = 3;
  SETTING_KIND_INTEGER = 4;
  // Text picked from the choices the Plugin's settings check offers (`TestPluginSettings`).
  SETTING_KIND_CHOICE = 5;
  // An http or https URL, such as a Sonarr address. An Installed Plugin may send HTTP requests
  // to its host.
  SETTING_KIND_URL = 6;
}

// One setting a Plugin takes, as its schema declares it, and its stored value.
message Setting {
  // The key it is stored under, such as `api_key`.
  string key = 1;
  // A short name for a form's label.
  string label = 2;
  // What the setting does, for a form's help text.
  string description = 3;
  SettingKind kind = 4;
  // Whether the Plugin can't be enabled without it.
  bool required = 5;
  // The value used when none is stored. Never set for a secret.
  SettingValue default_value = 6;
  // The stored value. Never set for a secret: see `secret_set`.
  SettingValue value = 7;
  // Whether a secret has a stored value. Always false for other kinds.
  bool secret_set = 8;
}

// A setting's value, of the setting's kind.
message SettingValue {
  oneof value {
    string text_value = 1;
    bool bool_value = 2;
    int64 integer_value = 3;
  }
}
