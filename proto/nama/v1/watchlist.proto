syntax = "proto3";

package nama.v1;

import "nama/v1/browse.proto";
import "nama/v1/match.proto";

// The signed-in caller's Watchlist (ADR 0056): the Movies and Shows they mean to watch.
//
// A Watchlist keeps each title by its kind and external id, whether or not the Server has it, so
// a title missing from every Library can be added too. `BrowseService` says whether a Movie or
// Show is on the caller's Watchlist, under any of its ids, in `Movie.on_watchlist` and
// `Show.on_watchlist`.
service WatchlistService {
  // Adds a title to the caller's Watchlist. Adding one already on it changes nothing. Fails with
  // `invalid_argument` if the kind is unspecified or the id missing or malformed.
  rpc AddToWatchlist(AddToWatchlistRequest) returns (AddToWatchlistResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Removes a title from the caller's Watchlist, by the id it was added under. Removing one that
  // isn't on it changes nothing. Fails as `AddToWatchlist` does.
  rpc RemoveFromWatchlist(RemoveFromWatchlistRequest) returns (RemoveFromWatchlistResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Lists the caller's Watchlist, newest added first, each title as a Home row shows it: on the
  // Server in the oldest Library they see that has it, or else missing as the title source has it
  // now, if they may Request its kind. One only Libraries they don't see have, that their Maximum
  // Age keeps out, or that the title source doesn't have or can't be asked about now is left out.
  rpc ListWatchlist(ListWatchlistRequest) returns (ListWatchlistResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message AddToWatchlistRequest {
  // Whether the title is a Movie or a Show.
  TitleKind kind = 1;
  // The title's id, such as `Movie.id` or a Home row's missing title's id.
  ExternalId id = 2;
}

message AddToWatchlistResponse {}

message RemoveFromWatchlistRequest {
  // Whether the title is a Movie or a Show.
  TitleKind kind = 1;
  // The id the title was added under.
  ExternalId id = 2;
}

message RemoveFromWatchlistResponse {}

message ListWatchlistRequest {}

message ListWatchlistResponse {
  repeated WatchlistTitle titles = 1;
}

// A title on the caller's Watchlist.
message WatchlistTitle {
  // The id it was added under, which `RemoveFromWatchlist` takes it off by. A title added under
  // two of its ids the Server can't tell apart is listed once under each.
  ExternalId id = 1;
  // How it shows, its kind being the title's.
  HomeRowTitle title = 2;
}
