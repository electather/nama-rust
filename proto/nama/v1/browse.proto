syntax = "proto3";

package nama.v1;

import "nama/v1/match.proto";
import "nama/v1/watch_state.proto";

// Browsing what a Library holds, and the caller's Continue Watching, for any signed-in User.
//
// Only Matched items appear. Movies, Shows, Seasons and Episodes are not stored as such: they are
// grouped from the items Matched to the same title, and identified by its external id within the
// Library. A Show is grouped from its Episodes' Show ids, and a Season is the Show's Episodes that
// share a season number. Items that aren't Matched are in `MatchService.ListUnmatchedItems`
// instead.
service BrowseService {
  // Lists a Movies Library's Movies, by title, each with its Versions and the caller's Watch
  // State. Fails with `not_found` if there is no such Library, and with `invalid_argument` if it
  // is a Shows Library.
  rpc ListMovies(ListMoviesRequest) returns (ListMoviesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Movie of a Movies Library, with its Versions and the caller's Watch State. Fails
  // like `ListMovies`, or with `not_found` if nothing in the Library is Matched to that id.
  rpc GetMovie(GetMovieRequest) returns (GetMovieResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists a Shows Library's Shows, by title. Fails with `not_found` if there is no such Library,
  // and with `invalid_argument` if it is a Movies Library.
  rpc ListShows(ListShowsRequest) returns (ListShowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Show of a Shows Library, with its Seasons. Fails like `ListShows`, or with
  // `not_found` if nothing in the Library is Matched to an Episode of that Show.
  rpc GetShow(GetShowRequest) returns (GetShowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists one Season's Episodes, by episode number, each with its Versions and the caller's Watch
  // State. Fails like `GetShow`, or with `not_found` if the Show has no such Season in the
  // Library.
  rpc ListEpisodes(ListEpisodesRequest) returns (ListEpisodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists the caller's Continue Watching: the Movies and Episodes whose position is past 0 and
  // that they haven't played, most recent first by when their Watch State last changed. Only
  // those Matched in some Library are listed, each in the oldest Library that has it. The Watch
  // State of the rest is kept, so they are listed again once a rescan Matches them.
  rpc ListContinueWatching(ListContinueWatchingRequest) returns (ListContinueWatchingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Searches every Library for the Movies, Shows and Episodes whose titles have each word of the
  // query, ignoring case, accents and the marks that join words, so "amelie" finds Amélie and
  // "spiderman" finds Spider-Man. Each word matches the start of a word, so a client can search
  // as the User types. A last word of four digits after others is a year, which keeps only those
  // released or aired that year, or with it in their title: "dune 2021" finds the 2021 Dune. A
  // Show counts as of every year one of its Episodes aired. A Show is found by its own title,
  // and an Episode by its own, not its Show's.
  rpc SearchLibraries(SearchLibrariesRequest) returns (SearchLibrariesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// A Movie some items of a Library are Matched to, with the metadata its Match stores.
message Movie {
  // The Movie's external id, which identifies it within the Library: its TMDB id if the Match
  // has one, or else its IMDb or TVDB id.
  ExternalId id = 1;
  // The title, in the metadata Provider's language.
  string title = 2;
  // The title in its original language, if the metadata source has it.
  optional string original_title = 3;
  optional string overview = 4;
  // When it was released, as `YYYY-MM-DD`.
  optional string release_date = 5;
  optional uint32 runtime_minutes = 6;
  // The poster's URL on this Server.
  optional string poster_url = 7;
  // The backdrop's URL on this Server.
  optional string backdrop_url = 8;
  // The files the Movie is available in, by path. There is at least one.
  repeated Version versions = 9;
  // The caller's progress through it, kept across all its Versions. Unset if they haven't
  // started it.
  WatchState watch_state = 10;
  // Whether `poster_url` is a Custom Image, which `DELETE /custom-images/movie/<id>/poster`
  // removes, `<id>` being `id` as `tmdb-348`, `imdb-tt0078748` or `tvdb-81189`. `PUT` there
  // uploads one, for a User with `PERMISSION_MANAGE_LIBRARIES`.
  bool custom_poster = 11;
  // Whether `backdrop_url` is a Custom Image, at `/custom-images/movie/<id>/backdrop`.
  bool custom_backdrop = 12;
  // The poster's thumbhash (evanw.github.io/thumbhash), a blurred preview to show while it loads,
  // once the Server has resized it. Unset while resizing is off.
  optional bytes poster_thumbhash = 13;
  // As `poster_thumbhash`, for the backdrop.
  optional bytes backdrop_thumbhash = 14;
}

// One file a Movie or Episode is available in.
message Version {
  // Identifies the file, for playing it.
  int64 id = 1;
  // The file's name, without the folders it is in.
  string file_name = 2;
  // In bytes, so a client can default to the largest.
  uint64 size = 3;
  // Its video, audio and subtitle Tracks, in the order the file holds them. Empty until the
  // Server has probed it, which it does in the background after a scan, and always on a Server
  // without ffprobe.
  repeated Track tracks = 4;
}

// One video, audio or subtitle stream inside a Version.
message Track {
  // As ffprobe names it, such as `hevc`, `eac3` or `subrip`.
  string codec = 1;
  // As the file tags it, usually ISO 639-2, such as `eng`.
  optional string language = 2;
  optional string title = 3;
  // Whether the file marks it to play when nothing else is chosen.
  bool default = 4;
  // Whether the file marks it to show even when subtitles are off, as for foreign dialogue.
  bool forced = 5;
  // Whether the file marks it for the deaf and hard of hearing (SDH), as subtitles that also
  // describe sounds.
  bool sdh = 9;
  // What kind of Track it is, with the facts only that kind has.
  oneof kind {
    VideoTrack video = 6;
    AudioTrack audio = 7;
    SubtitleTrack subtitle = 8;
  }
}

// A video Track's own facts. Each number is 0 when the file doesn't say.
message VideoTrack {
  uint32 width = 1;
  uint32 height = 2;
  // In frames per second.
  double frame_rate = 3;
  // Bits per sample, such as 10 for most HDR.
  uint32 bit_depth = 4;
  // `HDR_FORMAT_UNSPECIFIED` for SDR, or when the file doesn't say.
  HdrFormat hdr = 5;
  // Set only when `hdr` is `HDR_FORMAT_DOLBY_VISION`.
  DolbyVision dolby_vision = 6;
}

// How a video Track's picture is HDR.
enum HdrFormat {
  HDR_FORMAT_UNSPECIFIED = 0;
  HDR_FORMAT_HDR10 = 1;
  HDR_FORMAT_HLG = 2;
  HDR_FORMAT_DOLBY_VISION = 3;
}

// A Dolby Vision video Track's own facts.
message DolbyVision {
  reserved 2;
  reserved "hdr10_base_layer";
  // Such as 5, 7 or 8, which says which players can show it.
  uint32 profile = 1;
  // What a player without Dolby Vision shows instead, and a Transcode makes.
  BaseLayer base_layer = 3;
}

// A Dolby Vision Track's Base Layer: the picture a player without Dolby Vision shows instead.
enum BaseLayer {
  // It has none, as in profile 5, so only a Dolby Vision player can show it.
  BASE_LAYER_UNSPECIFIED = 0;
  BASE_LAYER_SDR = 1;
  BASE_LAYER_HDR10 = 2;
  BASE_LAYER_HLG = 3;
}

// An audio Track's own facts.
message AudioTrack {
  // How many, such as 6 for 5.1. 0 when the file doesn't say.
  uint32 channels = 1;
}

// A subtitle Track's own facts.
message SubtitleTrack {
  // Whether it is a bitmap, such as PGS, rather than text, such as SRT, which a client can
  // restyle.
  bool image = 1;
}

message ListMoviesRequest {
  // The Movies Library whose Movies to list.
  int64 library_id = 1;
}

message ListMoviesResponse {
  repeated Movie movies = 1;
}

message GetMovieRequest {
  // The Movies Library the Movie is in.
  int64 library_id = 1;
  // The Movie's id, as `ListMovies` gave it.
  ExternalId movie_id = 2;
}

message GetMovieResponse {
  Movie movie = 1;
  // The Library folder holding a Version of the Movie that the Server couldn't write to when it
  // last scanned the Library, if there is one, in which case deleting the Movie is refused. Set
  // only for a caller with `PERMISSION_DELETE_MEDIA`.
  optional string read_only_folder = 2;
}

// A Show some items of a Library are Matched to Episodes of.
message Show {
  // The Show's external id, which identifies it within the Library: its TMDB id if the Matches
  // have one, or else its IMDb or TVDB id.
  ExternalId id = 1;
  // The title, in the metadata Provider's language.
  string title = 2;
  // Its poster's URL on this Server: its Custom Image if it has one, else its first Season's.
  optional string poster_url = 3;
  // The backdrop's URL on this Server.
  optional string backdrop_url = 4;
  // Whether `poster_url` is the Show's own Custom Image, at `/custom-images/show/<id>/poster`,
  // as for `Movie.custom_poster`.
  bool custom_poster = 5;
  // Whether `backdrop_url` is a Custom Image, at `/custom-images/show/<id>/backdrop`.
  bool custom_backdrop = 6;
  // As `Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 7;
  // As `Movie.backdrop_thumbhash`.
  optional bytes backdrop_thumbhash = 8;
}

// A Season of a Show that some items of a Library are Matched to Episodes of.
message Season {
  // The season number. Season 0 holds specials.
  uint32 number = 1;
  // The poster's URL on this Server.
  optional string poster_url = 2;
  // Whether `poster_url` is a Custom Image, at
  // `/custom-images/show/<show id>/season/<number>/poster`, as for `Movie.custom_poster`.
  bool custom_poster = 3;
  // As `Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 4;
}

// An Episode some items of a Library are Matched to, with the metadata its Match stores.
message Episode {
  // The Episode's own external id: its TMDB id if the Match has one, or else its IMDb or TVDB id.
  ExternalId id = 1;
  uint32 season_number = 2;
  uint32 episode_number = 3;
  // The title, in the metadata Provider's language.
  string title = 4;
  optional string overview = 5;
  // When it first aired, as `YYYY-MM-DD`.
  optional string air_date = 6;
  optional uint32 runtime_minutes = 7;
  // The files the Episode is available in, by path. There is at least one. A file holding two
  // Episodes is a Version of each.
  repeated Version versions = 8;
  // The caller's progress through it, kept across all its Versions. Unset if they haven't
  // started it.
  WatchState watch_state = 9;
}

message ListShowsRequest {
  // The Shows Library whose Shows to list.
  int64 library_id = 1;
}

message ListShowsResponse {
  repeated Show shows = 1;
}

message GetShowRequest {
  // The Shows Library the Show is in.
  int64 library_id = 1;
  // The Show's id, as `ListShows` gave it.
  ExternalId show_id = 2;
}

message GetShowResponse {
  Show show = 1;
  // The Seasons the Library has Episodes of, by number.
  repeated Season seasons = 2;
}

message ListEpisodesRequest {
  // The Shows Library the Show is in.
  int64 library_id = 1;
  // The Show's id, as `ListShows` gave it.
  ExternalId show_id = 2;
  // The Season's number, as `GetShow` gave it.
  uint32 season_number = 3;
}

message ListEpisodesResponse {
  repeated Episode episodes = 1;
}

// A Movie or Episode the caller has started and not played, with what a client needs to show it
// and resume it.
message ContinueWatchingEntry {
  // The Library it is in.
  int64 library_id = 1;
  // It, with its Versions and the caller's Watch State, as browsing describes it.
  oneof movie_or_episode {
    Movie movie = 2;
    ContinueWatchingEpisode episode = 3;
  }
  reserved 4;
  reserved "show";
}

// An Episode in Continue Watching, with the Show it is of. The Server sets both.
message ContinueWatchingEpisode {
  Episode episode = 1;
  Show show = 2;
}

message ListContinueWatchingRequest {}

message ListContinueWatchingResponse {
  // Most recent first.
  repeated ContinueWatchingEntry entries = 1;
}

message SearchLibrariesRequest {
  // The words to search for. One without letters or digits finds nothing.
  string query = 1;
}

// What `SearchLibraries` found, each kind best fit first. A Movie, Show or Episode in two
// Libraries is found in each.
message SearchLibrariesResponse {
  repeated MovieInLibrary movies = 1;
  repeated ShowInLibrary shows = 2;
  repeated EpisodeInLibrary episodes = 3;
}

// A Movie a search found, with what a client needs to show it and open it with `GetMovie`.
message MovieInLibrary {
  // The Library it is in.
  int64 library_id = 1;
  // As `ListMovies` gives it.
  ExternalId id = 2;
  string title = 3;
  // When it was released, as `YYYY-MM-DD`.
  optional string release_date = 4;
  // The poster's URL on this Server: its Custom Image, if it has one.
  optional string poster_url = 5;
  // As `Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 6;
}

// A Show a search found, with what a client needs to show it and open it with `GetShow`.
message ShowInLibrary {
  // The Library it is in.
  int64 library_id = 1;
  // As `ListShows` gives it.
  ExternalId id = 2;
  string title = 3;
  // The Show's Custom Poster's URL on this Server, or else a Season's poster's.
  optional string poster_url = 4;
  // As `Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 5;
}

// An Episode a search found, with what a client needs to show it and open its Season with
// `ListEpisodes`.
message EpisodeInLibrary {
  // The Library it is in.
  int64 library_id = 1;
  // As `ListEpisodes` gives it.
  ExternalId id = 2;
  // Its Show's id, as `ListShows` gives it.
  ExternalId show_id = 3;
  string show_title = 4;
  uint32 season_number = 5;
  uint32 episode_number = 6;
  string title = 7;
}
