syntax = "proto3";

package nama.v1;

import "nama/v1/library.proto";
import "nama/v1/match.proto";
import "nama/v1/page.proto";
import "nama/v1/request.proto";
import "nama/v1/watch_state.proto";

// Browsing what a Library holds, and the caller's Continue Watching, for any signed-in User.
//
// Movies, Shows, Seasons and Episodes are not stored as such: they are grouped from the items
// Matched to the same title, and identified by its external id within the Library. A Show is
// grouped from its Episodes' Show ids, and a Season is the Show's Episodes that share a season
// number. Items that aren't Matched appear only in `ListUnmatched`, by what their files' names
// were parsed as, never by where the files are (ADR 0069).
service BrowseService {
  // Lists a page of a Movies Library's Movies (ADR 0055), filtered and sorted as asked, each with
  // only what a grid of them shows: `GetMovie` gives the rest. Fails with `not_found` if there is
  // no such Library, and with `invalid_argument` if it is a Shows Library or the page token isn't
  // one this filter and sort gave.
  rpc ListMovies(ListMoviesRequest) returns (ListMoviesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Movie of a Movies Library, with its Versions and the caller's Watch State. Fails
  // like `ListMovies`, or with `not_found` if nothing in the Library is Matched to that id.
  rpc GetMovie(GetMovieRequest) returns (GetMovieResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists a page of a Shows Library's Shows, as `ListMovies` lists Movies: `GetShow` gives the
  // rest. Fails like `ListMovies`, a Movies Library being the wrong kind.
  rpc ListShows(ListShowsRequest) returns (ListShowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Show of a Shows Library, with its Seasons. Fails like `ListShows`, or with
  // `not_found` if nothing in the Library is Matched to an Episode of that Show.
  rpc GetShow(GetShowRequest) returns (GetShowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists the genres a Library's Movies or Shows have, by name, to filter `ListMovies` or
  // `ListShows` by. Fails with `not_found` if there is no such Library.
  rpc ListGenres(ListGenresRequest) returns (ListGenresResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists one Season's Episodes, by episode number, each with its Versions and the caller's Watch
  // State. Fails like `GetShow`, or with `not_found` if the Show has no such Season in the
  // Library.
  rpc ListEpisodes(ListEpisodesRequest) returns (ListEpisodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns the Episode that plays after the one asked about, with its Versions and the caller's
  // Watch State: the first the caller hasn't played after it in aired order, Specials aside, as
  // `ListContinueWatching` picks a Show's next Episode. Only Episodes in the Library count. `next`
  // is unset if there is none, or if the Episode asked about is a Special. Fails like
  // `ListEpisodes`, or with `not_found` if the Season has no such Episode in the Library.
  rpc GetNextEpisode(GetNextEpisodeRequest) returns (GetNextEpisodeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns the Episode just before the one asked about, with its Versions and the caller's Watch
  // State: the one before it in aired order, Specials aside, played or not, since going back is to
  // watch it again. Only Episodes in the Library count. `previous` is unset for the Show's first
  // Episode, or if the Episode asked about is a Special. Fails like `GetNextEpisode`.
  rpc GetPreviousEpisode(GetPreviousEpisodeRequest) returns (GetPreviousEpisodeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists a page of the caller's Continue Watching, most recent first by when their Watch State
  // last changed: the Movies whose position is past 0 and that they haven't played, and one
  // Episode of each Show they've watched, listed by its latest Watch State of any Episode. That
  // Episode is the one they most recently started and haven't played, or else the Show's next
  // Episode, which has no Watch State: the first unplayed one after the one they played most
  // recently, in aired order, Specials aside. Only those Matched in some Library are listed,
  // each in the oldest Library that has it. The Watch State of the rest is kept, so they are
  // listed again once a rescan Matches them.
  // Fails with `invalid_argument` if `page.token` isn't one an earlier call returned.
  rpc ListContinueWatching(ListContinueWatchingRequest) returns (ListContinueWatchingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists Featured for the caller (ADR 0072): up to 5 Movies and Shows, heaviest first, those of
  // equal weight the most recently added first, each once. Suggested are their Continue Watching
  // entries, at 0.8 halving every 14 days since their Watch State changed, and the titles added
  // to a Library in the last 14 days, at 0.5 fading to nothing over them. A title suggested twice
  // keeps its heavier weight, and is listed in the Library that suggestion came from. Lists none
  // while the default Home layout hides Featured.
  rpc ListFeatured(ListFeaturedRequest) returns (ListFeaturedResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists a page of a Library's Unmatched Items, the one found most recently first, each by what
  // its file's name was parsed as and the Version to play it by. Playing one keeps no Watch State
  // (ADR 0013). Fails with `not_found` if there is no such Library, and with `invalid_argument` if
  // the page token isn't one this Library's list gave.
  rpc ListUnmatched(ListUnmatchedRequest) returns (ListUnmatchedResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns a Version of a Library that holds an Unmatched Item, to play it by, with its first
  // such Item. Fails with `not_found` if there is no such Library, or the Library has no such
  // Version holding an Unmatched Item.
  rpc GetUnmatchedVersion(GetUnmatchedVersionRequest) returns (GetUnmatchedVersionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists the caller's Home rows in the order Home shows them: the default Home layout's
  // (`ServerService.GetDefaultHomeLayout`), leaving out the rows it hides. The rows it doesn't
  // place follow, the Kernel's first, Continue Watching then each Library's Recently Added row,
  // oldest Library first, then the rows Plugins give (ADR 0058), each enabled Plugin's in Plugin
  // id order, then in the order the Plugin gave them. A Plugin row with no title to show the
  // caller, as `ListHomeRowTitles` shows them, is left out. Featured isn't a Home row, so it's
  // never listed.
  // Never waits on a Plugin: rows past their time to live are refreshed in the background, and
  // what was stored before is listed meanwhile, so a Plugin's first rows show on a later call.
  rpc ListHomeRows(ListHomeRowsRequest) returns (ListHomeRowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists a page of one Home row's titles, in the row's order: each on the Server in the oldest
  // Library that has it, and each missing one the title source had at the row's last refresh, if
  // the caller may Request its kind. A row its Plugin no longer gives lists none. Fails with
  // `invalid_argument` if `page.token` isn't one an earlier call for the same row returned.
  rpc ListHomeRowTitles(ListHomeRowTitlesRequest) returns (ListHomeRowTitlesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Box Set, with its Movies as the caller sees them. Fails with `not_found` if the
  // caller can't see it: none of its Movies is in a Library, or they'd see fewer than two.
  rpc GetBoxSet(GetBoxSetRequest) returns (GetBoxSetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists a page of the Box Sets the caller can see that have a Movie in a Movies Library, by
  // name. Fails like `ListMovies`.
  rpc ListBoxSets(ListBoxSetsRequest) returns (ListBoxSetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns a Person with each title in a Library they have a Role in. Every Library counts, since
  // every User may browse each one. Fails with `not_found` (`REFUSAL_REASON_PERSON_NOT_FOUND`) if
  // no title in a Library has a Role of theirs.
  rpc GetPerson(GetPersonRequest) returns (GetPersonResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// A Movie some items of a Library are Matched to, with the metadata its Match stores.
message Movie {
  // The Movie's external id, which identifies it within the Library: its TMDB id if the Match
  // has one, or else its IMDb or TVDB id.
  ExternalId id = 1;
  // The title, in its title source's language.
  string title = 2;
  // The title in its original language, if the title source has it.
  optional string original_title = 3;
  optional string overview = 4;
  // When it was released, as `YYYY-MM-DD`.
  optional string release_date = 5;
  optional uint32 runtime_minutes = 6;
  // The poster's URL on this Server.
  optional string poster_url = 7;
  // The backdrop's URL on this Server.
  optional string backdrop_url = 8;
  // The files the Movie is available in, by path. There is at least one.
  repeated Version versions = 9;
  // The caller's progress through it, kept across all its Versions. Unset if they haven't
  // started it.
  WatchState watch_state = 10;
  // Whether `poster_url` is a Custom Image, which `DELETE /custom-images/movie/<id>/poster`
  // removes, `<id>` being `id` as `<namespace>-<value>`, the value percent-encoded, such as
  // `tmdb-348`. `PUT` there uploads one, for a User with `PERMISSION_MANAGE_LIBRARIES`.
  bool custom_poster = 11;
  // Whether `backdrop_url` is a Custom Image, at `/custom-images/movie/<id>/backdrop`.
  bool custom_backdrop = 12;
  // The poster's thumbhash (evanw.github.io/thumbhash), a blurred preview to show while it loads,
  // once the Server has resized it. Unset while resizing is off.
  optional bytes poster_thumbhash = 13;
  // As `poster_thumbhash`, for the backdrop.
  optional bytes backdrop_thumbhash = 14;
  // Its Title Logo's URL on this Server, picked from its title sources' artwork. Unset if none
  // has one: show `title` as text instead.
  optional string title_logo_url = 15;
  // Its genres' names, in its title source's language.
  repeated string genres = 16;
  // Its Content Rating in its title source's country, such as `R`. Unset if it has none
  // there.
  optional string content_rating = 17;
  // Whether it is on the caller's Watchlist, under any of its ids.
  bool on_watchlist = 18;
  // A backdrop with its title written on it, in English for now, to show without the Title Logo
  // over it, such as on a Continue Watching card. Unset if its title sources have none. A Custom
  // Image never replaces it.
  optional string titled_backdrop_url = 19;
  // As `poster_thumbhash`, for the titled backdrop.
  optional bytes titled_backdrop_thumbhash = 20;
  // Its Score, from 0 to 10, as the title source it is Matched to averages it. Unset, not 0, if
  // nobody has voted or that source has none.
  optional double score = 21;
  // The ISO 639-1 code of the language it was made in, such as `ja`, as its title source has it.
  optional string original_language = 22;
  // Its Trailers, as the title source it is Matched to gives them, at most 5.
  repeated Trailer trailers = 23;
  // Its Cast, in billing order, from the title source it is Matched to.
  repeated Role cast = 24;
  // Its Crew, in billing order, from that source. Its directors have the job `Director`.
  repeated Role crew = 25;
}

// One file a Movie or Episode is available in.
message Version {
  // Identifies the file, for playing it.
  int64 id = 1;
  // The file's name, without the folders it is in.
  string file_name = 2;
  // In bytes, so a client can default to the largest.
  uint64 size = 3;
  // Its video, audio and subtitle Tracks, in the order the file holds them. Empty until the
  // Server has probed it, which it does in the background after a scan, and always on a Server
  // without ffprobe.
  repeated Track tracks = 4;
  // The Edition it holds, such as "Director's Cut", as its file or folder name writes it. A
  // client shows it where it lists a title's Versions. Unset on an Unmatched Item's Version.
  optional string edition = 5;
}

// One video, audio or subtitle stream inside a Version.
message Track {
  // As ffprobe names it, such as `hevc`, `eac3` or `subrip`.
  string codec = 1;
  // As the file tags it, usually ISO 639-2, such as `eng`.
  optional string language = 2;
  optional string title = 3;
  // Whether the file marks it to play when nothing else is chosen.
  bool default = 4;
  // Whether the file marks it to show even when subtitles are off, as for foreign dialogue.
  bool forced = 5;
  // Whether the file marks it for the deaf and hard of hearing (SDH), as subtitles that also
  // describe sounds. A subtitle whose title says so, such as "English (SDH)", counts too.
  bool sdh = 9;
  // What kind of Track it is, with the facts only that kind has.
  oneof kind {
    VideoTrack video = 6;
    AudioTrack audio = 7;
    SubtitleTrack subtitle = 8;
  }
}

// A video Track's own facts. Each number is 0 when the file doesn't say.
message VideoTrack {
  uint32 width = 1;
  uint32 height = 2;
  // In frames per second.
  double frame_rate = 3;
  // Bits per sample, such as 10 for most HDR.
  uint32 bit_depth = 4;
  // `HDR_FORMAT_UNSPECIFIED` for SDR, or when the file doesn't say.
  HdrFormat hdr = 5;
  // Set only when `hdr` is `HDR_FORMAT_DOLBY_VISION`.
  DolbyVision dolby_vision = 6;
}

// How a video Track's picture is HDR.
enum HdrFormat {
  HDR_FORMAT_UNSPECIFIED = 0;
  HDR_FORMAT_HDR10 = 1;
  HDR_FORMAT_HLG = 2;
  HDR_FORMAT_DOLBY_VISION = 3;
}

// A Dolby Vision video Track's own facts.
message DolbyVision {
  reserved 2;
  reserved "hdr10_base_layer";
  // Such as 5, 7 or 8, which says which players can show it.
  uint32 profile = 1;
  // What a player without Dolby Vision shows instead, and a Transcode makes.
  BaseLayer base_layer = 3;
}

// A Dolby Vision Track's Base Layer: the picture a player without Dolby Vision shows instead.
enum BaseLayer {
  // It has none, as in profile 5, so only a Dolby Vision player can show it.
  BASE_LAYER_UNSPECIFIED = 0;
  BASE_LAYER_SDR = 1;
  BASE_LAYER_HDR10 = 2;
  BASE_LAYER_HLG = 3;
}

// An audio Track's own facts.
message AudioTrack {
  // How many, such as 6 for 5.1. 0 when the file doesn't say.
  uint32 channels = 1;
  // Whether its profile says it carries Dolby Atmos, as TrueHD and E-AC-3 (JOC) can.
  bool atmos = 2;
  // Whether the file marks it as Audio Description, for the visually impaired.
  bool audio_description = 3;
}

// A subtitle Track's own facts.
message SubtitleTrack {
  // Whether it is a bitmap, such as PGS, rather than text, such as SRT, which a client can
  // restyle.
  bool image = 1;
}

// A Movie as a Library's grid shows it. Each field keeps the number it has in `Movie`.
message MovieSummary {
  // As `Movie.id`.
  ExternalId id = 1;
  string title = 2;
  // When it was released, as `YYYY-MM-DD`.
  optional string release_date = 5;
  // As `Movie.poster_url`: its Custom Image, if it has one.
  optional string poster_url = 7;
  // The caller's progress through it. Unset if they haven't started it.
  WatchState watch_state = 10;
  // As `Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 13;
}

// What `ListMovies` sorts by, tie-broken by the Movie's id.
enum MovieSort {
  // As `MOVIE_SORT_TITLE`.
  MOVIE_SORT_UNSPECIFIED = 0;
  // By title, ignoring case, accents and a leading English "The", "A" or "An". Ascending by
  // default.
  MOVIE_SORT_TITLE = 1;
  // By when its first Version was added to the Library, so a second copy doesn't move it. Most
  // recent first by default.
  MOVIE_SORT_ADDED = 2;
  // By release date, those without one first when ascending. Most recent first by default.
  MOVIE_SORT_RELEASED = 3;
}

// Which titles a list keeps, by the caller's Watch State of them.
enum WatchedFilter {
  // All of them.
  WATCHED_FILTER_UNSPECIFIED = 0;
  // Those they haven't started: for a Show, one with no Episode started or played.
  WATCHED_FILTER_NOT_STARTED = 1;
  // Those they've started and not played: for a Show, one with some Episodes started or played,
  // but not all played.
  WATCHED_FILTER_STARTED = 2;
  // Those they've played: for a Show, one with every Episode played.
  WATCHED_FILTER_PLAYED = 3;
}

// Which Movies `ListMovies` lists: those that pass every filter set.
message MovieFilter {
  // Those with any of these genres, by name as `ListGenres` gives them. Empty for any.
  repeated string genres = 1;
  // Those released in this year or later.
  optional uint32 min_year = 2;
  // Those released in this year or earlier.
  optional uint32 max_year = 3;
  WatchedFilter watched = 4;
}

message ListMoviesRequest {
  // The Movies Library whose Movies to list.
  int64 library_id = 1;
  MovieFilter filter = 2;
  MovieSort sort = 3;
  // Which way `sort` runs, `SORT_DIRECTION_UNSPECIFIED` being the way it names.
  SortDirection direction = 4;
  PageRequest page = 5;
}

message ListMoviesResponse {
  repeated MovieSummary movies = 1;
  PageResponse page = 2;
}

message GetMovieRequest {
  // The Movies Library the Movie is in.
  int64 library_id = 1;
  // The Movie's id, as `ListMovies` gave it.
  ExternalId movie_id = 2;
}

message GetMovieResponse {
  Movie movie = 1;
  // The Library folder holding a Version of the Movie that the Server couldn't write to when it
  // last scanned the Library, if there is one, in which case deleting the Movie is refused. Set
  // only for a caller with `PERMISSION_DELETE_MEDIA`.
  optional string read_only_folder = 2;
  // Its Similar titles that are in a Library, most alike first, at most 20, each with `library_id`
  // set to the oldest Library it is in. The Similar sources name them (ADR 0084), and one in no
  // Library is left out.
  repeated MovieHit similar = 3;
  // The Box Set it belongs to, the Movie among its `movies`, unset if it has none the caller can
  // see.
  BoxSet box_set = 4;
}

// A Show some items of a Library are Matched to Episodes of.
message Show {
  // The Show's external id, which identifies it within the Library: its TMDB id if the Matches
  // have one, or else its IMDb or TVDB id.
  ExternalId id = 1;
  // The title, in its title source's language.
  string title = 2;
  // Its poster's URL on this Server: its Custom Image if it has one, else its own, else (as
  // before the Server has fetched its own) its first Season's after the Specials.
  optional string poster_url = 3;
  // The backdrop's URL on this Server.
  optional string backdrop_url = 4;
  // Whether `poster_url` is the Show's own Custom Image, at `/custom-images/show/<id>/poster`,
  // as for `Movie.custom_poster`.
  bool custom_poster = 5;
  // Whether `backdrop_url` is a Custom Image, at `/custom-images/show/<id>/backdrop`.
  bool custom_backdrop = 6;
  // As `Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 7;
  // As `Movie.backdrop_thumbhash`.
  optional bytes backdrop_thumbhash = 8;
  // As `Movie.title_logo_url`.
  optional string title_logo_url = 9;
  // As `Movie.genres`.
  repeated string genres = 10;
  // As `Movie.content_rating`, such as `TV-MA`.
  optional string content_rating = 11;
  optional string overview = 12;
  // When it first aired, as `YYYY-MM-DD`.
  optional string first_air_date = 13;
  // As `Movie.on_watchlist`.
  bool on_watchlist = 14;
  // How many of its Seasons the Library has an Episode of, Specials aside.
  uint32 season_count = 15;
  // As `Movie.titled_backdrop_url`.
  optional string titled_backdrop_url = 16;
  // As `Movie.titled_backdrop_thumbhash`.
  optional bytes titled_backdrop_thumbhash = 17;
  // As `Movie.score`.
  optional double score = 18;
  // As `Movie.original_language`.
  optional string original_language = 19;
  // As `Movie.trailers`.
  repeated Trailer trailers = 20;
  // As `Movie.cast`, over the Show's whole run.
  repeated Role cast = 21;
  // As `Movie.crew`, over the Show's whole run. Its creators have the job `Creator`.
  repeated Role crew = 22;
}

// A Season of a Show that some items of a Library are Matched to Episodes of.
message Season {
  // The season number. Season 0 holds specials.
  uint32 number = 1;
  // The poster's URL on this Server.
  optional string poster_url = 2;
  // Whether `poster_url` is a Custom Image, at
  // `/custom-images/show/<show id>/season/<number>/poster`, as for `Movie.custom_poster`.
  bool custom_poster = 3;
  // As `Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 4;
}

// An Episode some items of a Library are Matched to, with the metadata its Match stores.
message Episode {
  // The Episode's own external id: its TMDB id if the Match has one, or else its IMDb or TVDB id.
  ExternalId id = 1;
  uint32 season_number = 2;
  uint32 episode_number = 3;
  // The title, in its title source's language.
  string title = 4;
  optional string overview = 5;
  // When it first aired, as `YYYY-MM-DD`.
  optional string air_date = 6;
  optional uint32 runtime_minutes = 7;
  // The files the Episode is available in, by path. There is at least one. A file holding two
  // Episodes is a Version of each.
  repeated Version versions = 8;
  // The caller's progress through it, kept across all its Versions. Unset if they haven't
  // started it.
  WatchState watch_state = 9;
  // Its Still's URL on this Server. Unset if its title source has none.
  optional string still_url = 10;
  // As `Movie.poster_thumbhash`, for the Still.
  optional bytes still_thumbhash = 11;
}

// A Show as a Library's grid shows it. Each field keeps the number it has in `Show`.
message ShowSummary {
  // As `Show.id`.
  ExternalId id = 1;
  string title = 2;
  // As `Show.poster_url`.
  optional string poster_url = 3;
  // As `Show.poster_thumbhash`.
  optional bytes poster_thumbhash = 7;
  // When it first aired, as `YYYY-MM-DD`.
  optional string first_air_date = 13;
  // How many of its Episodes the Library has.
  uint32 episode_count = 14;
  // How many of those the caller has played.
  uint32 played_episode_count = 15;
}

// What `ListShows` sorts by, tie-broken by the Show's id.
enum ShowSort {
  // As `SHOW_SORT_TITLE`.
  SHOW_SORT_UNSPECIFIED = 0;
  // As `MOVIE_SORT_TITLE`.
  SHOW_SORT_TITLE = 1;
  // By when its newest Episode was added to the Library, so a new Episode moves it up. Most
  // recent first by default.
  SHOW_SORT_ADDED = 2;
  // By first air date, those without one first when ascending. Most recent first by default.
  SHOW_SORT_RELEASED = 3;
}

// Which Shows `ListShows` lists: those that pass every filter set.
message ShowFilter {
  // As `MovieFilter.genres`.
  repeated string genres = 1;
  // Those that first aired in this year or later.
  optional uint32 min_year = 2;
  // Those that first aired in this year or earlier.
  optional uint32 max_year = 3;
  WatchedFilter watched = 4;
}

message ListShowsRequest {
  // The Shows Library whose Shows to list.
  int64 library_id = 1;
  ShowFilter filter = 2;
  ShowSort sort = 3;
  // As `ListMoviesRequest.direction`.
  SortDirection direction = 4;
  PageRequest page = 5;
}

message ListShowsResponse {
  repeated ShowSummary shows = 1;
  PageResponse page = 2;
}

message ListGenresRequest {
  // The Library whose genres to list.
  int64 library_id = 1;
}

message ListGenresResponse {
  // By name.
  repeated string genres = 1;
}

message GetShowRequest {
  // The Shows Library the Show is in.
  int64 library_id = 1;
  // The Show's id, as `ListShows` gave it.
  ExternalId show_id = 2;
}

message GetShowResponse {
  Show show = 1;
  // The Seasons the Library has Episodes of, by number.
  repeated Season seasons = 2;
  // How many of the Show's Episodes, Specials aside, have aired by today, by the air dates its
  // title source gave when the Show was last fetched. 0 if it gave none.
  uint32 aired_episode_count = 3;
  // As `GetMovieResponse.similar`, for the Show.
  repeated ShowHit similar = 4;
}

message ListEpisodesRequest {
  // The Shows Library the Show is in.
  int64 library_id = 1;
  // The Show's id, as `ListShows` gave it.
  ExternalId show_id = 2;
  // The Season's number, as `GetShow` gave it.
  uint32 season_number = 3;
}

message ListEpisodesResponse {
  repeated Episode episodes = 1;
}

message GetNextEpisodeRequest {
  // The Shows Library the Show is in.
  int64 library_id = 1;
  // The Show's id, as `ListShows` gave it.
  ExternalId show_id = 2;
  // The Episode's Season's number, as `GetShow` gave it.
  uint32 season_number = 3;
  // The Episode's number, as `ListEpisodes` gave it.
  uint32 episode_number = 4;
}

message GetNextEpisodeResponse {
  // The Episode that plays after the one asked about, unset if none does.
  optional Episode next = 1;
}

message GetPreviousEpisodeRequest {
  // The Shows Library the Show is in.
  int64 library_id = 1;
  // The Show's id, as `ListShows` gave it.
  ExternalId show_id = 2;
  // The Episode's Season's number, as `GetShow` gave it.
  uint32 season_number = 3;
  // The Episode's number, as `ListEpisodes` gave it.
  uint32 episode_number = 4;
}

message GetPreviousEpisodeResponse {
  // The Episode just before the one asked about, unset if there is none.
  optional Episode previous = 1;
}

// A Movie or Episode in the caller's Continue Watching, with what a client needs to show it and
// resume or start it.
message ContinueWatchingEntry {
  // The Library it is in.
  int64 library_id = 1;
  // It, with its Versions and the caller's Watch State, as browsing describes it.
  oneof movie_or_episode {
    Movie movie = 2;
    ContinueWatchingEpisode episode = 3;
  }
  reserved 4;
  reserved "show";
}

// An Episode in Continue Watching, with the Show it is of. The Server sets both.
message ContinueWatchingEpisode {
  Episode episode = 1;
  Show show = 2;
}

message ListContinueWatchingRequest {
  // The page of Continue Watching to list.
  PageRequest page = 1;
}

message ListContinueWatchingResponse {
  // The page's entries, most recent first, those changed in the same second newest-started first.
  repeated ContinueWatchingEntry entries = 1;
  // The rest of the list: the next page's token, and on the first page how many entries it has.
  PageResponse page = 2;
}

// Asks for the caller's Featured, which takes no options.
message ListFeaturedRequest {}

// The caller's Featured.
message ListFeaturedResponse {
  // Heaviest first.
  repeated FeaturedTitle titles = 1;
}

// A Movie or Show in Featured, with what its Play or Resume starts. The web app words why it is
// shown from the caller's Watch State: there is no reason field (ADR 0072).
message FeaturedTitle {
  // The Library it is in.
  int64 library_id = 1;
  // It, as browsing describes it: a Movie with its Versions and the caller's Watch State.
  oneof movie_or_show {
    Movie movie = 2;
    Show show = 3;
  }
  // A Show's Episode that Play or Resume starts, with its Versions and the caller's Watch State:
  // the one they most recently started and haven't played, or else the one `GetNextEpisode`
  // picks after the one they played most recently, or else the first they haven't played in
  // aired order, Specials aside. Unset for a Movie, or a Show with none of those.
  optional Episode next_episode = 4;
}

// A Movie in a Library, with what a client needs to show it and open it with `GetMovie`.
message MovieInLibrary {
  // The Library it is in.
  int64 library_id = 1;
  // As `ListMovies` gives it.
  ExternalId id = 2;
  string title = 3;
  // When it was released, as `YYYY-MM-DD`.
  optional string release_date = 4;
  // The poster's URL on this Server: its Custom Image, if it has one.
  optional string poster_url = 5;
  // As `Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 6;
}

// A Show in a Library, with what a client needs to show it and open it with `GetShow`.
message ShowInLibrary {
  // The Library it is in.
  int64 library_id = 1;
  // As `ListShows` gives it.
  ExternalId id = 2;
  string title = 3;
  // The Show's Custom Poster's URL on this Server, or else a Season's poster's.
  optional string poster_url = 4;
  // As `Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 5;
}

message ListUnmatchedRequest {
  // The Library whose Unmatched Items to list.
  int64 library_id = 1;
  PageRequest page = 2;
}

message ListUnmatchedResponse {
  repeated UnmatchedItemSummary items = 1;
  // The next page's token, and on the first page how many Unmatched Items the Library has.
  PageResponse page = 2;
}

// An Unmatched Item as any User sees it: what its file's name was parsed as, not where it is.
message UnmatchedItemSummary {
  // The Version that holds it, to play it by. A file holding several Episodes holds an item for
  // each, so their summaries share it.
  int64 version_id = 1;
  // `TITLE_KIND_MOVIE` for a Movie, or `TITLE_KIND_SHOW` for an Episode of a Show.
  TitleKind kind = 2;
  // The Movie's title, or the title of the Show the Episode is in.
  string title = 3;
  // The year the Movie was released or the Show first aired, if the name says.
  optional int32 year = 4;
  // For an Episode, its Season number; 0 holds specials.
  optional int32 season = 5;
  // For an Episode, its number within the Season.
  optional int32 episode = 6;
  // The item, to Match it by with `MatchService.SetMatch`.
  int64 item_id = 7;
}

message GetUnmatchedVersionRequest {
  // The Library the Version is in.
  int64 library_id = 1;
  // The Version, as `ListUnmatched` or `MatchService.ListUnmatchedItems` gave it.
  int64 version_id = 2;
}

message GetUnmatchedVersionResponse {
  // The Version's first Unmatched Item: a file holding several Episodes holds one for each.
  UnmatchedItemSummary item = 1;
  Version version = 2;
}

message ListHomeRowsRequest {}

message ListHomeRowsResponse {
  repeated HomeRow rows = 1;
}

// A headed row of titles on the home page, which the Kernel builds or a Plugin gives.
message HomeRow {
  reserved 1, 2, 3;
  reserved "plugin_id", "key", "heading";
  oneof kernel_or_plugin {
    // Read through its own rpc, such as `ListContinueWatching`.
    KernelHomeRow kernel = 4;
    PluginHomeRow plugin = 5;
    RecentlyAddedHomeRow recently_added = 6;
  }
}

// A Kernel row of one Library's newest titles, which `ListMovies` or `ListShows` list sorted by
// `*_SORT_ADDED`, newest first. Every Library has one.
message RecentlyAddedHomeRow {
  int64 library_id = 1;
  string library_name = 2;
  LibraryKind library_kind = 3;
}

// A Home row the Kernel builds.
enum KernelHomeRow {
  KERNEL_HOME_ROW_UNSPECIFIED = 0;
  KERNEL_HOME_ROW_CONTINUE_WATCHING = 1;
}

// A Home row a Plugin gives, whose titles `ListHomeRowTitles` lists. Its Plugin and key name it.
message PluginHomeRow {
  // The Plugin that gives it.
  string plugin_id = 1;
  // What the Plugin tells it from its other rows by.
  string key = 2;
  // Plain text of at most 40 characters.
  string heading = 3;
}

message ListHomeRowTitlesRequest {
  // As `PluginHomeRow.plugin_id`.
  string plugin_id = 1;
  // As `PluginHomeRow.key`.
  string key = 2;
  PageRequest page = 3;
}

message ListHomeRowTitlesResponse {
  repeated HomeRowTitle titles = 1;
  // The rest of the row: the next page's token, and on the first page how many titles it shows.
  PageResponse page = 2;
}

// A title in a Home row: on the Server as a search finds it, or missing as a search for titles to
// Request finds it.
message HomeRowTitle {
  oneof movie_or_show {
    MovieInLibrary movie = 1;
    ShowInLibrary show = 2;
    // A Movie on no Library, which `RequestService.LookUpMovie` opens by `id`.
    MovieHit missing_movie = 3;
    // A Show on no Library, which `RequestService.LookUpShow` opens by `id`.
    ShowHit missing_show = 4;
  }
}

// A group of Movies its title source says belong together, such as the Alien films. It is a
// grouping, not a title.
message BoxSet {
  // Its id at its title source, such as `tmdb-8091`, which `GetBoxSet` opens it by.
  ExternalId id = 1;
  // Its name, in its title source's language.
  string name = 2;
  optional string overview = 3;
  // The poster's URL on this Server.
  optional string poster_url = 4;
  // The backdrop's URL on this Server.
  optional string backdrop_url = 5;
  // Its Movies in release order, those without a release date last: each on the Server in the
  // oldest Library that has it, or, for a caller with `PERMISSION_REQUEST_MOVIE`, missing as its
  // title source had it when last fetched.
  repeated HomeRowTitle movies = 6;
}

// A Box Set as the Box Sets of a Library list it.
message BoxSetSummary {
  // As `BoxSet.id`.
  ExternalId id = 1;
  string name = 2;
  // As `BoxSet.poster_url`.
  optional string poster_url = 3;
}

message GetBoxSetRequest {
  // As `BoxSet.id`.
  ExternalId box_set_id = 1;
}

message GetBoxSetResponse {
  BoxSet box_set = 1;
}

message GetPersonRequest {
  // As `Role.person_id`.
  ExternalId person_id = 1;
}

message GetPersonResponse {
  // Their name, as one of their Roles gives it.
  string name = 1;
  // Their headshot's URL on this Server, if one of their Roles has one.
  optional string headshot_url = 2;
  // The titles they play a character in, newest first by release or first air date, those
  // without one last, each once, in the oldest Library that has it.
  repeated PersonRole cast = 3;
  // The titles they did a job on, ordered as `cast`.
  repeated PersonRole crew = 4;
}

// A title in a Library, and a Person's parts in it.
message PersonRole {
  oneof title {
    MovieHit movie = 1;
    ShowHit show = 2;
  }
  // The characters they play, or the jobs they did, as `Role.part`, in billing order, leaving out
  // empty ones.
  repeated string parts = 3;
}

message ListBoxSetsRequest {
  // The Movies Library whose Box Sets to list.
  int64 library_id = 1;
  PageRequest page = 2;
}

message ListBoxSetsResponse {
  repeated BoxSetSummary box_sets = 1;
  // The next page's token, and on the first page how many Box Sets the Library has.
  PageResponse page = 2;
}
