syntax = "proto3";

package nama.v1;

import "nama/v1/browse.proto";

// How the signed-in caller's Device plays a Version.
//
// The Server builds a Playback Plan by running separate steps in a fixed order, each of which can
// only narrow what the plan may be (ADR 0027), and gives the Playback Reasons for it (ADR 0034).
service PlaybackService {
  // Returns a Playback Plan for playing a Version on the caller's Device, probing the Version
  // first if the Server has no current Tracks for it. A choice the caller asks for that the plan
  // can't honour here is dropped, and a reason says so (ADR 0031). Fails with `not_found` if
  // there is no such Version, and is refused with `REFUSAL_REASON_SERVER_BUSY` when the Device
  // itself needs a Transcode to play it, never for a choice, and the Server is already running as
  // many as it may; one of the caller's own Device's doesn't count, as a new plan replaces the one
  // it plays.
  rpc PlanPlayback(PlanPlaybackRequest) returns (PlanPlaybackResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Stops a plan the caller's Device was given, as when its player closes or a new plan replaces
  // it, so the Server stops any ffmpeg it runs and tells Observers its playback ended. A plan
  // already stopped, or another Device's, is left alone.
  rpc StopPlayback(StopPlaybackRequest) returns (StopPlaybackResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Keeps the Track the caller picked while playing a Version, or that they turned it off, as
  // their Preference for the Show or Movie the Version is of, which later plans of any of its
  // Versions start with (ADR 0035). A Version of an Unmatched Item keeps nothing. Fails with
  // `not_found` if there is no such Version, and is refused with
  // `REFUSAL_REASON_TRACK_NOT_FOUND` if the Version has no Track of that kind at that place, and
  // with `REFUSAL_REASON_FIELD_REQUIRED` for an audio pick that names no Track.
  rpc ReportTrackPick(ReportTrackPickRequest) returns (ReportTrackPickResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Returns the caller's own Track Preferences, the ones they set in Settings.
  rpc GetTrackPreferences(GetTrackPreferencesRequest) returns (GetTrackPreferencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Sets the caller's own Subtitle Preference, which a plan starts with when the Show or Movie
  // has none of its own, an Unmatched Item's Version included (ADR 0035). Refused with
  // `REFUSAL_REASON_UNKNOWN_LANGUAGE` if the language isn't an ISO 639 code.
  rpc SetSubtitlePreference(SetSubtitlePreferenceRequest) returns (SetSubtitlePreferenceResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message GetTrackPreferencesRequest {}

message GetTrackPreferencesResponse {
  // The caller's own Subtitle Preference: off when they never set one.
  UsersSubtitlePreference subtitle = 1;
}

message SetSubtitlePreferenceRequest {
  // The caller's own Subtitle Preference from now on.
  UsersSubtitlePreference subtitle = 1;
}

message SetSubtitlePreferenceResponse {}

// What a User wants subtitles to start as in everything they play, unless the Show or Movie has a
// Subtitle Preference of its own.
message UsersSubtitlePreference {
  // The language, an ISO 639 code such as `en` or `eng`. Unset for subtitles off.
  optional string language = 1;
  // Which subtitle in that language. Ignored when `language` is unset.
  SubtitleKind kind = 2;
}

// Which of a language's subtitle Tracks a User's own Subtitle Preference wants.
enum SubtitleKind {
  SUBTITLE_KIND_UNSPECIFIED = 0;
  // All dialogue, neither forced-only nor SDH. Never a forced-only Track.
  SUBTITLE_KIND_FULL = 1;
  // All dialogue, preferring SDH, which also describes sounds.
  SUBTITLE_KIND_SDH = 2;
  // Forced-only: signs and dialogue in another language.
  SUBTITLE_KIND_FORCED = 3;
}

message ReportTrackPickRequest {
  // The Version playing, as browsing gave it.
  int64 version_id = 1;
  // The kind of Track picked.
  PickedTrackKind kind = 2;
  // The Track picked, by its place in the Version's `tracks`, counting from 0. Unset when the
  // User turned subtitles off; audio is never off.
  optional uint32 track = 3;
}

message ReportTrackPickResponse {}

// The kind of Track a User picks while playing.
enum PickedTrackKind {
  PICKED_TRACK_KIND_UNSPECIFIED = 0;
  PICKED_TRACK_KIND_SUBTITLE = 1;
  PICKED_TRACK_KIND_AUDIO = 2;
}

message StopPlaybackRequest {
  // The plan, as `PlaybackPlan.id` names it.
  uint64 plan_id = 1;
}

message StopPlaybackResponse {}

message PlanPlaybackRequest {
  // The Version to play, as browsing gave it.
  int64 version_id = 1;
  // Where playing starts, in milliseconds.
  uint64 start_position_ms = 2;
  // The audio Track the caller chose, by its place in the Version's `tracks`, counting from 0.
  // Unset for the Server to choose by the User's Audio Preference, or else the one the Version
  // plays by default, which `PlaybackPlan.audio_track` then says.
  optional uint32 audio_track = 3;
  // The subtitle Track the caller chose to burn into the picture, one the Device can't draw such
  // as PGS on a Device that doesn't list it, or an ASS or SSA one it doesn't draw, with its
  // styling, which makes the plan a Transcode, by its place in the Version's `tracks`, counting
  // from 0. Unset, with `no_subtitles` unset too, for the Server to choose by the User's Subtitle
  // Preference, which `PlaybackPlan.starting_subtitle` then says.
  optional uint32 subtitle_track = 4;
  // The Playback Limit the caller picked. Unset until they pick one, when a Device outside the
  // local network gets the Server's default for remote playback.
  PlaybackLimit playback_limit = 5;
  // What the Device can decode, as it found out just now.
  DeviceDecoding device_decoding = 6;
  // The methods that just failed to play this Version on this Device.
  repeated PlaybackMethod failed_methods = 7;
  // Set, with `subtitle_track` unset, for none burned in and none chosen, as when the player
  // shows no subtitle or a text one from `PlaybackPlan.subtitles` itself.
  bool no_subtitles = 8;
}

// The most a User asks playback to send.
enum PlaybackLimit {
  // The User hasn't picked one.
  PLAYBACK_LIMIT_UNSPECIFIED = 0;
  // As much as the Version holds.
  PLAYBACK_LIMIT_ORIGINAL = 1;
  PLAYBACK_LIMIT_1080P = 2;
  PLAYBACK_LIMIT_720P = 3;
  PLAYBACK_LIMIT_480P = 4;
}

// What a Device can decode.
message DeviceDecoding {
  reserved 1;
  reserved "content_types";
  // The containers it can play.
  repeated Container containers = 6;
  // The video codecs it can decode.
  repeated VideoCodec video_codecs = 7;
  // The audio codecs it can decode.
  repeated AudioCodec audio_codecs = 8;
  // Whether its display shows HDR.
  bool hdr = 2;
  // Whether it plays HLS without a script's help.
  bool native_hls = 3;
  // Whether it has Media Source Extensions, through which a script can play HLS.
  bool mse = 4;
  // How many audio channels it plays out at once, such as 6 for 5.1. 0 when it doesn't say,
  // which the Server takes as stereo.
  uint32 audio_channels = 5;
  // The subtitle formats it draws itself, over the video. WebVTT is never listed: every Device
  // shows it (ADR 0033).
  repeated SubtitleFormat subtitle_formats = 9;
}

// A format the Server serves a subtitle Track in, for a Device to show it itself.
enum SubtitleFormat {
  SUBTITLE_FORMAT_UNSPECIFIED = 0;
  // Text, which a player shows as a `<track>`.
  SUBTITLE_FORMAT_WEBVTT = 1;
  // Blu-ray's image subtitles, as the Track's own `.sup`.
  SUBTITLE_FORMAT_PGS = 2;
  // ASS or SSA with its styling, as the Track's own `.ass`, drawn with the fonts its file carries.
  SUBTITLE_FORMAT_ASS = 3;
  // DVD's image subtitles, as the Track copied into Matroska (`.mks`), which carries its palette
  // and size.
  SUBTITLE_FORMAT_VOBSUB = 4;
}

// A container the Server knows whether a Device plays.
enum Container {
  CONTAINER_UNSPECIFIED = 0;
  CONTAINER_MP4 = 1;
  CONTAINER_WEBM = 2;
  CONTAINER_MATROSKA = 3;
}

// A video codec the Server knows whether a Device decodes.
enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_H264 = 1;
  VIDEO_CODEC_HEVC = 2;
  VIDEO_CODEC_VP8 = 3;
  VIDEO_CODEC_VP9 = 4;
  VIDEO_CODEC_AV1 = 5;
}

// An audio codec the Server knows whether a Device decodes.
enum AudioCodec {
  AUDIO_CODEC_UNSPECIFIED = 0;
  AUDIO_CODEC_AAC = 1;
  AUDIO_CODEC_MP3 = 2;
  AUDIO_CODEC_AC3 = 3;
  AUDIO_CODEC_EAC3 = 4;
  AUDIO_CODEC_OPUS = 5;
  AUDIO_CODEC_VORBIS = 6;
  AUDIO_CODEC_FLAC = 7;
  AUDIO_CODEC_DTS = 8;
  AUDIO_CODEC_TRUEHD = 9;
}

// How a Playback Plan plays a Version.
enum PlaybackMethod {
  // It can't be played on this Device.
  PLAYBACK_METHOD_UNSPECIFIED = 0;
  // Its file exactly as it is.
  PLAYBACK_METHOD_DIRECT_PLAY = 1;
  // Its video as it is, in a different container, with its audio converted to AAC if the
  // Device can't decode it.
  PLAYBACK_METHOD_REMUX = 2;
  // With its video re-encoded.
  PLAYBACK_METHOD_TRANSCODE = 3;
}

message PlanPlaybackResponse {
  PlaybackPlan plan = 1;
}

// How the Server will play one Version on one Device, and why.
message PlaybackPlan {
  // `PLAYBACK_METHOD_UNSPECIFIED` when the Version can't be played on this Device; `reasons` say
  // why.
  PlaybackMethod method = 1;
  // Where to play it from, on this Server. Empty when it can't be played.
  string url = 2;
  // The Tracks it plays: its video, then its audio, as the Device gets them, so audio a Remux
  // converts is AAC here. Empty when they aren't known, as on a Server without ffprobe.
  repeated Track tracks = 3;
  reserved 4;
  // The facts that shaped it, in the order the steps that found them ran. A step that changes
  // nothing gives none, so a Direct Play nothing stood in the way of has none.
  repeated PlaybackReason reasons = 13;
  // The subtitles the Device shows itself, which the player turns on and off without a new plan,
  // in the order the Version holds them: the text ones, and those in a format the Device draws
  // (ADR 0033). A Track here in a format the Device draws isn't among `burn_in_tracks`.
  repeated PlaybackSubtitle subtitles = 5;
  // Names it to `StopPlayback`. 0 when it can't be played.
  uint64 id = 6;
  // The Playback Limit it keeps to: the one asked for, or else the Server's default for remote
  // playback on a Device outside the local network, or else `PLAYBACK_LIMIT_ORIGINAL`, as when it
  // can't keep to the one that applies.
  PlaybackLimit playback_limit = 7;
  // The audio Track it plays, by its place in the Version's `tracks`, counting from 0: the one
  // asked for or the Server chose, or else the one the Version plays by default. Unset when it has
  // no audio or its Tracks aren't known.
  optional uint32 audio_track = 8;
  // The subtitle Track it burns into the picture, by its place in the Version's `tracks`. Unset
  // for none, as when the one asked for can't be burned in.
  optional uint32 subtitle_track = 9;
  // The choices a plan for this Version can ever honour on this Server and Device, whatever a
  // busy Server or a method that failed on the Device rules out for now: the audio Tracks it can
  // play, by their place in the Version's `tracks`, in that order.
  repeated uint32 audio_tracks = 10;
  // The subtitle Tracks it can burn into the picture, likewise: those the Device can't draw, such
  // as ASS or SSA ones it doesn't draw, whose styling their WebVTT among `subtitles` drops.
  repeated uint32 burn_in_tracks = 11;
  // The Playback Limits below Original it can scale the picture down to, largest first.
  repeated PlaybackLimit playback_limits = 12;
  // The subtitle Track playback starts with, by its place in the Version's `tracks`: the one it
  // burns in, or else, when the request left the choice to the Server, one of `subtitles` that
  // the player shows itself. Unset for none.
  optional uint32 starting_subtitle = 14;
}

// A subtitle the Device shows itself: a text one as a WebVTT `<track>`, or one it draws.
message PlaybackSubtitle {
  // Its Track, for its language, title and whether it's Forced or SDH.
  Track track = 1;
  // Its Track's place in the Version's `tracks`, counting from 0.
  uint32 place = 5;
  // Where to fetch it in `format`, on this Server. The first fetch can take minutes while the
  // Server reads it out of the file; later ones are answered at once.
  string url = 2;
  // The format it's fetched in.
  SubtitleFormat format = 3;
  // Where to fetch the fonts its file carries, on this Server, for an ASS one to be drawn with.
  // Empty for any other format.
  repeated string font_urls = 4;
}

// One fact that shaped a Playback Plan (ADR 0034).
message PlaybackReason {
  PlaybackReasonKind kind = 1;
  // The values the reason mentions. Keys are lowerCamelCase with the unit in the key (AIP-193);
  // each kind lists its own.
  map<string, string> params = 2;
  // The Server's English sentence, for a client that doesn't know the kind. Not API contract.
  string text = 3;
  // Whether it decided the plan, or is context. It decided the plan if it rules out a method the
  // plan would rather have used than the one it plays (Direct Play before Remux before
  // Transcode), or any method when the plan can't play, or if it says what the method it plays
  // changes or that a choice was dropped.
  bool decided = 4;
}

// The kinds of fact that shape a Playback Plan. A kind, its params and the methods it rules out
// are API contract: one is never renamed or reused. A param that names a schema enum carries
// that value's name (`PLAYBACK_LIMIT_1080P`), and a number is a plain decimal.
enum PlaybackReasonKind {
  // A kind this client doesn't know; show the reason's `text`. The Server never sends it.
  PLAYBACK_REASON_KIND_UNSPECIFIED = 0;

  // Rules out Remux and Transcode: the Version's Tracks aren't known.
  PLAYBACK_REASON_KIND_TRACKS_UNKNOWN = 1;
  // Rules out Remux and Transcode: the Version's length isn't known.
  PLAYBACK_REASON_KIND_LENGTH_UNKNOWN = 2;
  // Rules out Direct Play: the Device doesn't decode the container. Params: `container`, the
  // `Container` value's name (`CONTAINER_MATROSKA`), or else ffprobe's name for it (`avi`).
  PLAYBACK_REASON_KIND_DEVICE_CANT_DECODE_CONTAINER = 3;
  // Rules out Direct Play and Remux: the Device doesn't decode the video Track. Params: `codec`,
  // as ffprobe names it (`hevc`), as in `Track.codec`.
  PLAYBACK_REASON_KIND_DEVICE_CANT_DECODE_VIDEO = 4;
  // Rules out Direct Play: the Device doesn't decode the audio Track the plan plays. Params:
  // `codec`, as for the video.
  PLAYBACK_REASON_KIND_DEVICE_CANT_DECODE_AUDIO = 5;
  // Rules out Direct Play and Remux: the Device can't show the picture's HDR. Params:
  // `hdrFormat` (`HDR_FORMAT_HDR10`).
  PLAYBACK_REASON_KIND_DEVICE_CANT_SHOW_HDR = 6;
  // Rules out Remux and Transcode: the Device doesn't play HLS.
  PLAYBACK_REASON_KIND_DEVICE_CANT_PLAY_HLS = 7;
  // Rules out Remux and Transcode: the Server lacks ffmpeg or ffprobe.
  PLAYBACK_REASON_KIND_SERVER_LACKS_FFMPEG = 8;
  // Rules out Transcode: the Server's ffmpeg lacks libx264.
  PLAYBACK_REASON_KIND_SERVER_CANT_ENCODE_VIDEO = 9;
  // Rules out Transcode: the picture is Dolby Vision with no Base Layer, as in profile 5.
  PLAYBACK_REASON_KIND_DOLBY_VISION_NEEDS_BASE_LAYER = 10;
  // Rules out the method in `method` (`PLAYBACK_METHOD_REMUX`): it just failed on the Device.
  // One for each method that did.
  PLAYBACK_REASON_KIND_METHOD_FAILED_ON_DEVICE = 11;
  // Rules out Transcode: the Server runs as many Transcodes as it may. Params: `maxTranscodes`.
  PLAYBACK_REASON_KIND_SERVER_BUSY = 12;
  // Rules out Direct Play: the audio Track chosen isn't the one browsers play from the file.
  PLAYBACK_REASON_KIND_CHOSEN_AUDIO_NOT_FILES_OWN = 13;
  // Rules out Direct Play and Remux: the picture is larger than the Playback Limit in effect, so
  // a Transcode scales it down. Params: `playbackLimit` (`PLAYBACK_LIMIT_720P`), and the size it
  // scales to, `widthPixels` and `heightPixels`.
  PLAYBACK_REASON_KIND_PICTURE_SCALED_DOWN = 14;
  // Rules out Direct Play and Remux: the subtitles chosen need Burn-in.
  PLAYBACK_REASON_KIND_SUBTITLES_BURNED_IN = 15;
  // Rules out Direct Play and Remux: the ASS subtitles chosen need Burn-in on a Device that draws
  // ASS, because their file carries no fonts to draw them with (ADR 0033).
  PLAYBACK_REASON_KIND_SUBTITLES_FILE_CARRIES_NO_FONTS = 31;
  // Rules out Direct Play and Remux: the VobSub subtitles chosen need Burn-in on a Device that
  // draws VobSub, because their Track carries no palette to draw them with (ADR 0033).
  PLAYBACK_REASON_KIND_SUBTITLES_TRACK_CARRIES_NO_PALETTE = 32;

  // The rest rule nothing out.

  // The plan converts the audio to fewer channels because the Device says it plays fewer.
  // Params: `channels`, how many it converts to.
  PLAYBACK_REASON_KIND_DEVICE_PLAYS_FEWER_CHANNELS = 16;
  // The same, because the Device doesn't say how many it plays. Params: `channels`.
  PLAYBACK_REASON_KIND_DEVICE_CHANNELS_UNKNOWN = 17;
  // The same, because that is the most the method makes. Params: `channels`.
  PLAYBACK_REASON_KIND_CONVERSION_CHANNELS_CAPPED = 18;
  // The plan Transcodes and tone-maps the picture to SDR. Params: `hdrFormat`.
  PLAYBACK_REASON_KIND_HDR_TONE_MAPPED = 19;
  // The plan Transcodes HDR the Device can't show, and nothing tone-maps it, so its colours look
  // washed out. Params: `hdrFormat`.
  PLAYBACK_REASON_KIND_HDR_NOT_TONE_MAPPED = 20;
  // The default Playback Limit for remote playback chose the limit, as the Device is outside the
  // local network, and the limit scaled the picture down or was dropped. Params: `playbackLimit`.
  PLAYBACK_REASON_KIND_REMOTE_DEFAULT_LIMIT = 21;
  // A Playback Limit below Original is in effect and the picture's size isn't known, so it's
  // taken to fit. Params: `playbackLimit`.
  PLAYBACK_REASON_KIND_PICTURE_SIZE_UNKNOWN = 22;
  // The plan dropped the audio Track chosen for the file's own (ADR 0031). The reasons that ruled
  // out the methods that would play it are in the same list.
  PLAYBACK_REASON_KIND_CHOSEN_AUDIO_DROPPED = 23;
  // The plan dropped the Playback Limit for Original, likewise. Params: `playbackLimit`, the one
  // dropped.
  PLAYBACK_REASON_KIND_PLAYBACK_LIMIT_DROPPED = 24;
  // The plan dropped the subtitles chosen, likewise.
  PLAYBACK_REASON_KIND_CHOSEN_SUBTITLES_DROPPED = 25;
  // The plan Transcodes on a GPU. Params: `hardwareAcceleration`
  // (`HARDWARE_ACCELERATION_VAAPI`).
  PLAYBACK_REASON_KIND_TRANSCODES_ON_HARDWARE = 26;
  // The plan Transcodes in software because hardware acceleration is off.
  PLAYBACK_REASON_KIND_HARDWARE_ACCELERATION_OFF = 27;
  // The same, because none passed its test when the Server started.
  PLAYBACK_REASON_KIND_NO_HARDWARE_ACCELERATION_PASSED = 28;
  // The same, because the one the Admin picked didn't pass its test when the Server started.
  // Params: `hardwareAcceleration`.
  PLAYBACK_REASON_KIND_HARDWARE_ACCELERATION_FAILED_TEST = 29;
  // The hardware the plan Transcoded on failed while playing, so the rest Transcodes in
  // software. Only in `PlaybackChanged`. Params: `hardwareAcceleration`.
  PLAYBACK_REASON_KIND_HARDWARE_FAILED_PARTWAY = 30;
}
