syntax = "proto3";

package nama.v1;

import "nama/v1/browse.proto";

// How the signed-in caller's Device plays a Version.
//
// The Server builds a Playback Plan by running separate steps in a fixed order, each of which can
// only narrow what the plan may be, and records why (ADR 0027).
service PlaybackService {
  // Returns a Playback Plan for playing a Version on the caller's Device, probing the Version
  // first if the Server has no current Tracks for it. A choice the caller asks for that the plan
  // can't honour here is dropped, and its `reasons` say why (ADR 0031). Fails with `not_found` if
  // there is no such Version, and is refused with `REFUSAL_REASON_SERVER_BUSY` when the Device
  // itself needs a Transcode to play it, never for a choice, and the Server is already running as
  // many as it may; one of the caller's own Device's doesn't count, as a new plan replaces the one
  // it plays.
  rpc PlanPlayback(PlanPlaybackRequest) returns (PlanPlaybackResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Stops a plan the caller's Device was given, as when its player closes or a new plan replaces
  // it, so the Server stops any ffmpeg it runs and tells Observers its playback ended. A plan
  // already stopped, or another Device's, is left alone.
  rpc StopPlayback(StopPlaybackRequest) returns (StopPlaybackResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message StopPlaybackRequest {
  // The plan, as `PlaybackPlan.id` names it.
  uint64 plan_id = 1;
}

message StopPlaybackResponse {}

message PlanPlaybackRequest {
  // The Version to play, as browsing gave it.
  int64 version_id = 1;
  // Where playing starts, in milliseconds.
  uint64 start_position_ms = 2;
  // The audio Track the caller chose, by its place in the Version's `tracks`, counting from 0.
  // Unset for the one the Version plays by default.
  optional uint32 audio_track = 3;
  // The subtitle Track the caller chose to burn into the picture, one the Device can't draw such
  // as PGS on a Device that doesn't list it, or an ASS or SSA one it doesn't draw, with its
  // styling, which makes the plan a Transcode, by its place in the Version's `tracks`, counting
  // from 0. Unset for none, as when the player shows a subtitle from `PlaybackPlan.subtitles`
  // itself.
  optional uint32 subtitle_track = 4;
  // The Playback Limit the caller picked. Unset until they pick one, when a Device outside the
  // local network gets the Server's default for remote playback.
  PlaybackLimit playback_limit = 5;
  // What the Device can decode, as it found out just now.
  DeviceDecoding device_decoding = 6;
  // The methods that just failed to play this Version on this Device.
  repeated PlaybackMethod failed_methods = 7;
}

// The most a User asks playback to send.
enum PlaybackLimit {
  // The User hasn't picked one.
  PLAYBACK_LIMIT_UNSPECIFIED = 0;
  // As much as the Version holds.
  PLAYBACK_LIMIT_ORIGINAL = 1;
  PLAYBACK_LIMIT_1080P = 2;
  PLAYBACK_LIMIT_720P = 3;
  PLAYBACK_LIMIT_480P = 4;
}

// What a Device can decode.
message DeviceDecoding {
  reserved 1;
  reserved "content_types";
  // The containers it can play.
  repeated Container containers = 6;
  // The video codecs it can decode.
  repeated VideoCodec video_codecs = 7;
  // The audio codecs it can decode.
  repeated AudioCodec audio_codecs = 8;
  // Whether its display shows HDR.
  bool hdr = 2;
  // Whether it plays HLS without a script's help.
  bool native_hls = 3;
  // Whether it has Media Source Extensions, through which a script can play HLS.
  bool mse = 4;
  // How many audio channels it plays out at once, such as 6 for 5.1. 0 when it doesn't say,
  // which the Server takes as stereo.
  uint32 audio_channels = 5;
  // The subtitle formats it draws itself, over the video. WebVTT is never listed: every Device
  // shows it (ADR 0033).
  repeated SubtitleFormat subtitle_formats = 9;
}

// A format the Server serves a subtitle Track in, for a Device to show it itself.
enum SubtitleFormat {
  SUBTITLE_FORMAT_UNSPECIFIED = 0;
  // Text, which a player shows as a `<track>`.
  SUBTITLE_FORMAT_WEBVTT = 1;
  // Blu-ray's image subtitles, as the Track's own `.sup`.
  SUBTITLE_FORMAT_PGS = 2;
  // ASS or SSA with its styling, as the Track's own `.ass`, drawn with the fonts its file carries.
  SUBTITLE_FORMAT_ASS = 3;
}

// A container the Server knows whether a Device plays.
enum Container {
  CONTAINER_UNSPECIFIED = 0;
  CONTAINER_MP4 = 1;
  CONTAINER_WEBM = 2;
  CONTAINER_MATROSKA = 3;
}

// A video codec the Server knows whether a Device decodes.
enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_H264 = 1;
  VIDEO_CODEC_HEVC = 2;
  VIDEO_CODEC_VP8 = 3;
  VIDEO_CODEC_VP9 = 4;
  VIDEO_CODEC_AV1 = 5;
}

// An audio codec the Server knows whether a Device decodes.
enum AudioCodec {
  AUDIO_CODEC_UNSPECIFIED = 0;
  AUDIO_CODEC_AAC = 1;
  AUDIO_CODEC_MP3 = 2;
  AUDIO_CODEC_AC3 = 3;
  AUDIO_CODEC_EAC3 = 4;
  AUDIO_CODEC_OPUS = 5;
  AUDIO_CODEC_VORBIS = 6;
  AUDIO_CODEC_FLAC = 7;
  AUDIO_CODEC_DTS = 8;
  AUDIO_CODEC_TRUEHD = 9;
}

// How a Playback Plan plays a Version.
enum PlaybackMethod {
  // It can't be played on this Device.
  PLAYBACK_METHOD_UNSPECIFIED = 0;
  // Its file exactly as it is.
  PLAYBACK_METHOD_DIRECT_PLAY = 1;
  // Its video as it is, in a different container, with its audio converted to AAC if the
  // Device can't decode it.
  PLAYBACK_METHOD_REMUX = 2;
  // With its video re-encoded.
  PLAYBACK_METHOD_TRANSCODE = 3;
}

message PlanPlaybackResponse {
  PlaybackPlan plan = 1;
}

// How the Server will play one Version on one Device, and why.
message PlaybackPlan {
  // `PLAYBACK_METHOD_UNSPECIFIED` when the Version can't be played on this Device; `reasons` say
  // why.
  PlaybackMethod method = 1;
  // Where to play it from, on this Server. Empty when it can't be played.
  string url = 2;
  // The Tracks it plays: its video, then its audio, as the Device gets them, so audio a Remux
  // converts is AAC here. Empty when they aren't known, as on a Server without ffprobe.
  repeated Track tracks = 3;
  // Why it plays this way, in plain words, one for each step, in the order they ran.
  repeated string reasons = 4;
  // The subtitles the Device shows itself, which the player turns on and off without a new plan,
  // in the order the Version holds them: the text ones, and those in a format the Device draws
  // (ADR 0033). A Track here in a format the Device draws isn't among `burn_in_tracks`.
  repeated PlaybackSubtitle subtitles = 5;
  // Names it to `StopPlayback`. 0 when it can't be played.
  uint64 id = 6;
  // The Playback Limit it keeps to: the one asked for, or else the Server's default for remote
  // playback on a Device outside the local network, or else `PLAYBACK_LIMIT_ORIGINAL`, as when it
  // can't keep to the one that applies.
  PlaybackLimit playback_limit = 7;
  // The audio Track it plays, by its place in the Version's `tracks`, counting from 0: the one
  // asked for, or else the one the Version plays by default. Unset when it has no audio or its
  // Tracks aren't known.
  optional uint32 audio_track = 8;
  // The subtitle Track it burns into the picture, by its place in the Version's `tracks`. Unset
  // for none, as when the one asked for can't be burned in.
  optional uint32 subtitle_track = 9;
  // The choices a plan for this Version can ever honour on this Server and Device, whatever a
  // busy Server or a method that failed on the Device rules out for now: the audio Tracks it can
  // play, by their place in the Version's `tracks`, in that order.
  repeated uint32 audio_tracks = 10;
  // The subtitle Tracks it can burn into the picture, likewise: those the Device can't draw, such
  // as ASS or SSA ones it doesn't draw, whose styling their WebVTT among `subtitles` drops.
  repeated uint32 burn_in_tracks = 11;
  // The Playback Limits below Original it can scale the picture down to, largest first.
  repeated PlaybackLimit playback_limits = 12;
}

// A subtitle the Device shows itself: a text one as a WebVTT `<track>`, or one it draws.
message PlaybackSubtitle {
  // Its Track, for its language, title and whether it's Forced or SDH.
  Track track = 1;
  // Where to fetch it in `format`, on this Server. The first fetch can take minutes while the
  // Server reads it out of the file; later ones are answered at once.
  string url = 2;
  // The format it's fetched in.
  SubtitleFormat format = 3;
  // Where to fetch the fonts its file carries, on this Server, for an ASS one to be drawn with.
  // Empty for any other format.
  repeated string font_urls = 4;
}
