syntax = "proto3";

package nama.v1;

import "nama/v1/match.proto";

// The Server's Libraries: named collections of one kind of media, each backed by one or more
// folders on the Server's disk. Every RPC but `ListLibraries` and those deleting media needs
// `PERMISSION_MANAGE_LIBRARIES`, and fails with `permission_denied` without it.
service LibraryService {
  // Creates a Library. Fails with `invalid_argument` if the name is blank, the kind is
  // unspecified, or a folder isn't an absolute path to a readable directory, and with
  // `already_exists` if a folder already belongs to another Library.
  rpc CreateLibrary(CreateLibraryRequest) returns (CreateLibraryResponse);
  // Lists every Library on the Server, oldest first. Any signed-in User may list them, to browse,
  // but only one with `PERMISSION_MANAGE_LIBRARIES` gets their folders.
  rpc ListLibraries(ListLibrariesRequest) returns (ListLibrariesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Library, or fails with `not_found`.
  rpc GetLibrary(GetLibraryRequest) returns (GetLibraryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces a Library's name and folders. Its kind can't change. Fails like `CreateLibrary`,
  // or with `not_found` if there is no such Library.
  rpc UpdateLibrary(UpdateLibraryRequest) returns (UpdateLibraryResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Deletes a Library. The files in its folders are left alone. Fails with `not_found` if there
  // is no such Library, so a retry after a delete that went through gets `not_found`.
  rpc DeleteLibrary(DeleteLibraryRequest) returns (DeleteLibraryResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Starts scanning a Library's folders for video files, and returns without waiting for the
  // scan to finish. If the Library is already being scanned, one more scan follows it, so
  // changes made since the running scan began are picked up. Fails with `not_found` if there is
  // no such Library.
  //
  // To wait for the scan, subscribe to events about the Library first, then call this, then skip
  // to the next `ScanStarted`: the first `MatchingFinished` and `ProbingFinished` after it cover
  // this call.
  rpc ScanLibrary(ScanLibraryRequest) returns (ScanLibraryResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Lists the files `DeleteMedia` would delete for the same target, and the bytes they would
  // free, deleting nothing. Needs `PERMISSION_DELETE_MEDIA`. Fails as `DeleteMedia` does.
  rpc PreviewDeleteMedia(PreviewDeleteMediaRequest) returns (PreviewDeleteMediaResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Deletes media from disk for good, with nothing to undo it: each Version's file, its sidecars
  // (the files beside it whose names start with the video's name, without its extension, followed
  // by `.` or `-`, and that aren't videos), and the folders that leaves empty, never a Library's
  // own folder or above it. The Versions whose files went are removed as a scan removes them, with
  // `LibraryItemRemoved`. A file that can't be deleted is listed with why, and the rest still go.
  // Before deleting anything, it asks every enabled Fulfiller of its kind, such as Radarr, to stop
  // monitoring the title, which it keeps; one that can't be told is listed, and doesn't stop it.
  // Needs `PERMISSION_DELETE_MEDIA` and Recent Authentication. Fails with `invalid_argument` if
  // the target is missing, or names a Shows Library as a Movie's, and with `not_found` if there
  // is no such Library, Movie or Version.
  rpc DeleteMedia(DeleteMediaRequest) returns (DeleteMediaResponse);
}

// The kind of media a Library holds. A Library holds exactly one kind.
enum LibraryKind {
  LIBRARY_KIND_UNSPECIFIED = 0;
  LIBRARY_KIND_MOVIES = 1;
  LIBRARY_KIND_SHOWS = 2;
}

// A named collection of one kind of media on a Server, backed by one or more folders.
message Library {
  // Assigned by the Server when the Library is created, and never reused.
  int64 id = 1;
  // The display name, set by an admin.
  string name = 2;
  // The kind of media the Library holds, fixed when it is created.
  LibraryKind kind = 3;
  // Absolute paths, on the Server, of the directories the Library's media lives in, in the
  // order they were given. The Server stores each in canonical form, with symlinks resolved and
  // no trailing separator, so a folder may come back spelled differently from how it was sent.
  // Each folder belongs to at most one Library. Empty in `ListLibraries` for a caller without
  // `PERMISSION_MANAGE_LIBRARIES`.
  repeated string folders = 4;
}

message CreateLibraryRequest {
  // Must not be blank.
  string name = 1;
  // Must not be `LIBRARY_KIND_UNSPECIFIED`.
  LibraryKind kind = 2;
  // At least one absolute path to a directory the Server can read, each named once.
  repeated string folders = 3;
}

message CreateLibraryResponse {
  Library library = 1;
}

message ListLibrariesRequest {}

message ListLibrariesResponse {
  repeated Library libraries = 1;
}

message GetLibraryRequest {
  // The Library to return.
  int64 id = 1;
}

message GetLibraryResponse {
  Library library = 1;
}

message UpdateLibraryRequest {
  // The Library to update.
  int64 id = 1;
  // The new name, under the same rules as `CreateLibraryRequest.name`.
  string name = 2;
  // The new folders, replacing the old ones, under the same rules as
  // `CreateLibraryRequest.folders`.
  repeated string folders = 3;
}

message UpdateLibraryResponse {
  Library library = 1;
}

message DeleteLibraryRequest {
  // The Library to delete.
  int64 id = 1;
}

message DeleteLibraryResponse {}

message ScanLibraryRequest {
  // The Library to scan.
  int64 id = 1;
}

message ScanLibraryResponse {}

message PreviewDeleteMediaRequest {
  MediaToDelete target = 1;
}

message PreviewDeleteMediaResponse {
  // Each file that would go: the Versions' files and their sidecars.
  repeated MediaFile files = 1;
  // What deleting `files` would free.
  uint64 bytes_freed = 2;
}

message DeleteMediaRequest {
  MediaToDelete target = 1;
}

message DeleteMediaResponse {
  // Each file that went.
  repeated MediaFile deleted = 1;
  // What deleting `deleted` freed.
  uint64 bytes_freed = 2;
  // Each file that couldn't be deleted. A Version whose own file is here stays, with its
  // sidecars.
  repeated FileNotDeleted not_deleted = 3;
  // The name of each Fulfiller that couldn't be told to stop monitoring what was deleted, so its
  // service may download it again. The Server doesn't try it again.
  repeated string fulfillers_not_told = 4;
}

// What to delete: a title's every Version, or one Version.
message MediaToDelete {
  oneof target {
    // Every Version of a Movie.
    MovieToDelete movie = 1;
    // One Version of a Movie, by its id as browsing gives it.
    int64 version_id = 2;
  }
}

// A Movie, named as `BrowseService.GetMovie` names it.
message MovieToDelete {
  // The Movies Library the Movie is in.
  int64 library_id = 1;
  // The Movie's id, as `BrowseService.ListMovies` gave it.
  ExternalId movie_id = 2;
}

// A file on the Server's disk.
message MediaFile {
  // The file's name, without the folders it is in.
  string file_name = 1;
  // In bytes.
  uint64 size = 2;
}

// A file a delete couldn't delete, and why.
message FileNotDeleted {
  // The file's name, without the folders it is in.
  string file_name = 1;
  // Why, as the Server's operating system put it, such as "Permission denied".
  string reason = 2;
}
