syntax = "proto3";

package nama.v1;

// Users asking for Movies, and Seasons of Shows, that aren't on the Server to be added to it
// (ADR 0012). Without `PERMISSION_VIEW_REQUESTS`, a User sees only the Requests they are a
// Requester of, here and in `EventService`.
service RequestService {
  // Asks for a Movie for the caller. If the Movie has an open Request, the caller joins it as a
  // Requester, which changes nothing if they already are one. Otherwise a new Request opens:
  // Approved if the caller has `PERMISSION_AUTO_APPROVE_MOVIE`, else Pending. Needs
  // `PERMISSION_REQUEST_MOVIE`. Fails with `failed_precondition` if a Library already has the
  // Movie, `invalid_argument` if the metadata source has no Movie with the id, and `unavailable`
  // if no metadata Provider is enabled, or it failed.
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
  // Asks for Seasons of a Show for the caller, one Request per Season, each as `CreateRequest`
  // asks for a Movie: Approved if the caller has `PERMISSION_AUTO_APPROVE_TV`, else Pending. Needs
  // `PERMISSION_REQUEST_TV`. A Season is in a Library once it has aired and every one of its aired
  // Episodes is Matched, and asking for such a Season fails with `failed_precondition`. Fails with
  // `invalid_argument` if no Season is named or the metadata source has no such Show or Season,
  // and `unavailable` if no metadata Provider is enabled, or it failed. A failure changes no
  // Request.
  rpc CreateSeasonRequests(CreateSeasonRequestsRequest) returns (CreateSeasonRequestsResponse);
  // Lists the Requests the caller may see, newest first.
  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Request. Fails with `not_found` if there is none with the ID, or none the caller
  // may see, so they can't learn which IDs exist.
  rpc GetRequest(GetRequestRequest) returns (GetRequestResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Searches the metadata source for Movies to ask for, best fit first. Unlike
  // `MatchService.SearchMetadata`, it needs only `PERMISSION_REQUEST_MOVIE`. Fails with
  // `invalid_argument` if the title is blank, and `unavailable` if no metadata Provider is
  // enabled, or it failed.
  rpc SearchMovies(SearchMoviesRequest) returns (SearchMoviesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Movie from the metadata source, for its page when no Library has it. Needs
  // `PERMISSION_REQUEST_MOVIE`. Fails with `invalid_argument` if the metadata source has no Movie
  // with the id, and `unavailable` if no metadata Provider is enabled, or it failed.
  rpc LookUpMovie(LookUpMovieRequest) returns (LookUpMovieResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Searches the metadata source for Shows to ask for Seasons of, best fit first. Needs
  // `PERMISSION_REQUEST_TV`. Fails as `SearchMovies` does.
  rpc SearchShows(SearchShowsRequest) returns (SearchShowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Show from the metadata source with each of its Seasons, for picking which to ask
  // for. Needs `PERMISSION_REQUEST_TV`. Fails with `invalid_argument` if the metadata source has no
  // Show with the id, and `unavailable` if no metadata Provider is enabled, or it failed.
  rpc LookUpShow(LookUpShowRequest) returns (LookUpShowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Approves a Pending Request, which then waits for the Movie to be Matched in a Library. Needs
  // `PERMISSION_MANAGE_REQUESTS`, which manages every User's Requests. Fails with `not_found` if
  // there is no Request with the ID, and `failed_precondition` if it isn't Pending.
  rpc ApproveRequest(ApproveRequestRequest) returns (ApproveRequestResponse);
  // Declines a Pending Request, which closes it: asking for the Movie again opens a new one. Needs
  // `PERMISSION_MANAGE_REQUESTS`. Fails as `ApproveRequest` does.
  rpc DeclineRequest(DeclineRequestRequest) returns (DeclineRequestResponse);
  // Removes a Request, whatever its state. Needs `PERMISSION_MANAGE_REQUESTS`. Fails with
  // `not_found` if there is no Request with the ID.
  rpc CancelRequest(CancelRequestRequest) returns (CancelRequestResponse);
  // Takes the caller off a Pending Request's Requesters, which removes the Request once nobody is
  // left on it. Fails with `not_found` if there is no Request with the ID, or none the caller may
  // see, and `failed_precondition` if the caller isn't one of its Requesters or it isn't Pending.
  rpc WithdrawRequest(WithdrawRequestRequest) returns (WithdrawRequestResponse);
}

// Where a Request is on its way to the Library (ADR 0012).
enum RequestState {
  REQUEST_STATE_UNSPECIFIED = 0;
  // Waiting for a User with `PERMISSION_MANAGE_REQUESTS` to approve or decline it.
  REQUEST_STATE_PENDING = 1;
  // Approved, and waiting for what it asks for to be Matched in a Library.
  REQUEST_STATE_APPROVED = 2;
  // Declined, and closed: asking again opens a new Request.
  REQUEST_STATE_DECLINED = 3;
  // Handed to a Fulfiller, which is fetching it.
  REQUEST_STATE_PROCESSING = 4;
  // Some, but not all, of what it asks for is Matched in a Library.
  REQUEST_STATE_PARTIALLY_AVAILABLE = 5;
  // Matched in a Library, and closed.
  REQUEST_STATE_AVAILABLE = 6;
  // The Fulfiller couldn't fetch it.
  REQUEST_STATE_FAILED = 7;
}

// Users asking for one Movie, or one Season of a Show. Each has at most one open Request: one that
// is neither Declined nor Available.
message Request {
  int64 id = 1;
  // The Movie asked for, unless it asks for a Season.
  RequestedMovie movie = 2;
  RequestState state = 3;
  // Who asked for it, first asker first. There is at least one.
  repeated Requester requesters = 4;
  // When it was opened, in seconds since the Unix epoch.
  int64 created_at = 5;
  // Why it was declined, for its Requesters to read. Only a Declined Request has one, and only if
  // the decliner gave one.
  optional string decline_reason = 6;
  // The Season asked for, unless it asks for a Movie.
  RequestedSeason season = 7;
}

// A Movie a Request asks for, with its metadata as the metadata source gave it when the Request
// was opened.
message RequestedMovie {
  // The Movie's TMDB id.
  int64 tmdb_id = 1;
  // The title, in the metadata Provider's language.
  string title = 2;
  // When it was released, as `YYYY-MM-DD`.
  optional string release_date = 3;
}

// A Season a Request asks for, with its metadata as the metadata source gave it when the Request
// was opened.
message RequestedSeason {
  // The Show's TMDB id.
  int64 show_tmdb_id = 1;
  // The Season's number within the Show. Season 0 holds specials.
  uint32 season_number = 2;
  // The Show's title, in the metadata Provider's language.
  string show_title = 3;
  // When the Season first aired, as `YYYY-MM-DD`.
  optional string air_date = 4;
}

// A User who asked for what a Request covers.
message Requester {
  int64 user_id = 1;
  // The User's name.
  string name = 2;
  // When they asked, in seconds since the Unix epoch.
  int64 requested_at = 3;
}

message CreateRequestRequest {
  // The TMDB id of the Movie to ask for.
  int64 movie_tmdb_id = 1;
}

message CreateRequestResponse {
  // The Request the caller is now a Requester of.
  Request request = 1;
}

message CreateSeasonRequestsRequest {
  // The TMDB id of the Show.
  int64 show_tmdb_id = 1;
  // The numbers of the Seasons to ask for: at least one. A number given twice counts once.
  repeated uint32 season_numbers = 2;
}

message CreateSeasonRequestsResponse {
  // The Requests the caller is now a Requester of, one per Season, in Season order.
  repeated Request requests = 1;
}

message ListRequestsRequest {}

message ListRequestsResponse {
  repeated Request requests = 1;
}

message GetRequestRequest {
  // The ID of the Request.
  int64 id = 1;
}

message GetRequestResponse {
  Request request = 1;
}

message ApproveRequestRequest {
  // The ID of the Request.
  int64 id = 1;
}

message ApproveRequestResponse {
  // The Request, Approved.
  Request request = 1;
}

message DeclineRequestRequest {
  // The ID of the Request.
  int64 id = 1;
  // Why it is declined, for its Requesters to read. Blank gives none.
  string reason = 2;
}

message DeclineRequestResponse {
  // The Request, Declined.
  Request request = 1;
}

message CancelRequestRequest {
  // The ID of the Request.
  int64 id = 1;
}

message CancelRequestResponse {}

message WithdrawRequestRequest {
  // The ID of the Request.
  int64 id = 1;
}

message WithdrawRequestResponse {}

// A Movie in the metadata source, and how close it is to being on the Server: in a Library, asked
// for in a Request, or neither, in which case `CreateRequest` asks for it.
message FoundMovie {
  // The Movie's TMDB id.
  int64 tmdb_id = 1;
  // The title, in the metadata Provider's language.
  string title = 2;
  // The year it was released, if known.
  optional int32 year = 3;
  // Only `LookUpMovie` gives it.
  optional string overview = 4;
  // Only `LookUpMovie` gives it.
  optional uint32 runtime_minutes = 5;
  // The poster's URL, under `/media/artwork/` on this Server.
  optional string poster_url = 6;
  // The backdrop's URL, under `/media/artwork/` on this Server. Only `LookUpMovie` gives it.
  optional string backdrop_url = 7;
  // The oldest Library the Movie is Matched in, if any. `BrowseService.GetMovie` opens it there,
  // by `tmdb_id`.
  optional int64 library_id = 8;
  // The Movie's open Request, if it has one the caller may see.
  Request request = 9;
}

message SearchMoviesRequest {
  // Must not be blank.
  string title = 1;
}

message SearchMoviesResponse {
  repeated FoundMovie movies = 1;
}

message LookUpMovieRequest {
  // The Movie's TMDB id.
  int64 movie_tmdb_id = 1;
}

message LookUpMovieResponse {
  FoundMovie movie = 1;
}

// A Show in the metadata source, whose Seasons `CreateSeasonRequests` asks for.
message FoundShow {
  // The Show's TMDB id.
  int64 tmdb_id = 1;
  // The title, in the metadata Provider's language.
  string title = 2;
  // The year it first aired, if known.
  optional int32 year = 3;
  // Only `LookUpShow` gives it.
  optional string overview = 4;
  // The poster's URL, under `/media/artwork/` on this Server.
  optional string poster_url = 5;
  // The backdrop's URL, under `/media/artwork/` on this Server. Only `LookUpShow` gives it.
  optional string backdrop_url = 6;
  // Its Seasons, in order. Only `LookUpShow` gives them.
  repeated FoundSeason seasons = 7;
}

// A Season of a Show in the metadata source, and how close it is to being on the Server: in a
// Library, asked for in a Request, or neither.
message FoundSeason {
  // The Season's number within the Show. Season 0 holds specials.
  uint32 season_number = 1;
  // When the Season first aired, as `YYYY-MM-DD`.
  optional string air_date = 2;
  // Whether a Library has it: it has aired, and every one of its aired Episodes is Matched.
  // `CreateSeasonRequests` refuses to ask for such a Season.
  bool in_library = 3;
  // The Season's open Request, if it has one the caller may see.
  Request request = 4;
}

message SearchShowsRequest {
  // Must not be blank.
  string title = 1;
}

message SearchShowsResponse {
  repeated FoundShow shows = 1;
}

message LookUpShowRequest {
  // The Show's TMDB id.
  int64 show_tmdb_id = 1;
}

message LookUpShowResponse {
  FoundShow show = 1;
}
