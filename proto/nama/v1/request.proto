syntax = "proto3";

package nama.v1;

import "nama/v1/match.proto";
import "nama/v1/plugin.proto";

// Users asking for Movies, and Seasons of Shows, that aren't on the Server to be added to it
// (ADR 0012). Without `PERMISSION_VIEW_REQUESTS`, a User sees only the Requests they are a
// Requester of, here and in `EventService`.
service RequestService {
  // Asks for a Movie for the caller. If the Movie has an open Request, the caller joins it as a
  // Requester, which changes nothing if they already are one. Otherwise a new Request opens:
  // Approved if the caller has `PERMISSION_AUTO_APPROVE_MOVIE`, else Pending. Needs
  // `PERMISSION_REQUEST_MOVIE`. Fails with `failed_precondition` if a Library already has the
  // Movie, `invalid_argument` if the metadata source has no Movie with the id, and `unavailable`
  // if no metadata Provider is enabled, or it failed. A new Request takes the Quality named in
  // `quality`, else the caller's default from `SetDefaultQuality` if they have
  // `PERMISSION_CHOOSE_QUALITY` and the list still has it, else the Movie Fulfiller's default;
  // joining one keeps its Quality. Naming a Quality without `PERMISSION_CHOOSE_QUALITY` is refused
  // with `REFUSAL_REASON_QUALITY_NOT_ALLOWED`, and one not on the Movie Fulfiller's list with
  // `REFUSAL_REASON_QUALITY_NOT_OFFERED`.
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
  // Returns the enabled Movie Fulfiller's Qualities, in the order an admin listed them, to pick
  // one for `CreateRequest`. Empty if no Movie Fulfiller is enabled or it has none. Needs
  // `PERMISSION_REQUEST_MOVIE`.
  rpc ListMovieQualities(ListMovieQualitiesRequest) returns (ListMovieQualitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns the caller's default Quality for each enabled Fulfiller, Movies first, whose list has
  // more than one Quality, or has one left after an admin removed the caller's, for their
  // settings. Any signed-in User may read their own, and only their own. The Server uses them only
  // while the User has `PERMISSION_CHOOSE_QUALITY`.
  rpc ListDefaultQualities(ListDefaultQualitiesRequest) returns (ListDefaultQualitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Sets the caller's default Quality for a Fulfiller, which a new Request they open takes when
  // they name none, or clears it so the Fulfiller's default applies. Any signed-in User may set
  // their own. Refused with `REFUSAL_REASON_QUALITY_NOT_OFFERED` if the Quality isn't on the
  // Fulfiller's list.
  rpc SetDefaultQuality(SetDefaultQualityRequest) returns (SetDefaultQualityResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Asks for Seasons of a Show for the caller, one Request per Season, each as `CreateRequest`
  // asks for a Movie: Approved if the caller has `PERMISSION_AUTO_APPROVE_TV`, else Pending. Needs
  // `PERMISSION_REQUEST_TV`. A Season is in a Library once it has aired and every one of its aired
  // Episodes is Matched, and asking for such a Season fails with `failed_precondition`. Fails with
  // `invalid_argument` if no Season is named or the metadata source has no such Show or Season,
  // and `unavailable` if no metadata Provider is enabled, or it failed. A failure changes no
  // Request. A new Request takes the Show's Quality (`FoundShow.quality`) if it has one, else one
  // picked as `CreateRequest` picks a Movie's, refusing a Quality as `CreateRequest` does, and one
  // other than the Show's with `REFUSAL_REASON_SHOW_HAS_QUALITY`.
  rpc CreateSeasonRequests(CreateSeasonRequestsRequest) returns (CreateSeasonRequestsResponse);
  // Returns the enabled Shows Fulfiller's Qualities, as `ListMovieQualities` does the Movie
  // Fulfiller's, to pick one for `CreateSeasonRequests`. Needs `PERMISSION_REQUEST_TV`.
  rpc ListShowQualities(ListShowQualitiesRequest) returns (ListShowQualitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Asks for a whole Show for the caller: its Seasons now and any that come out later. Asks for
  // each current Season not in a Library as `CreateSeasonRequests` does, skipping those in one,
  // and joins the Show's open Followed Show or opens one: Approved if the caller has
  // `PERMISSION_AUTO_APPROVE_TV`, else Pending. Needs `PERMISSION_REQUEST_TV`. While the Followed
  // Show is Approved, a scan Matching Episodes of a Season that came out after it was opened opens
  // a Request for its Requesters at the Show's Quality. A new Followed Show takes the Show's Quality
  // if it has one, else one picked and refused as `CreateSeasonRequests` picks and refuses one;
  // joining one keeps its Quality. Fails with `invalid_argument` if the metadata source has no Show
  // with the id, and `unavailable` if no metadata Provider is enabled, or it failed.
  rpc CreateFollowedShow(CreateFollowedShowRequest) returns (CreateFollowedShowResponse);
  // Lists a page of the Requests and Followed Shows the caller may see, newest first: only those in
  // `state` if one is given. Each is filtered on its own, so a Season Request can be listed without
  // its Followed Show. Fails with `invalid_argument` if `page_token` isn't one a call with the same
  // `state` returned.
  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Request. Fails with `not_found` if there is none with the ID, or none the caller
  // may see, so they can't learn which IDs exist.
  rpc GetRequest(GetRequestRequest) returns (GetRequestResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Counts the Requests and Followed Shows the caller may see that are Pending, for the Requests
  // link: as many rows as `ListRequests` lists Pending, so a Pending Followed Show and each of its
  // Pending Season Requests count once each. Needs `PERMISSION_MANAGE_REQUESTS`.
  rpc CountPendingRequests(CountPendingRequestsRequest) returns (CountPendingRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Searches the metadata source for Movies to ask for, best fit first. Unlike
  // `MatchService.SearchMetadata`, it needs only `PERMISSION_REQUEST_MOVIE`. Fails with
  // `invalid_argument` if the title is blank, and `unavailable` if no metadata Provider is
  // enabled, or it failed.
  rpc SearchMovies(SearchMoviesRequest) returns (SearchMoviesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Movie from the metadata source, for its page when no Library has it. Needs
  // `PERMISSION_REQUEST_MOVIE`. Fails with `invalid_argument` if the metadata source has no Movie
  // with the id, and `unavailable` if no metadata Provider is enabled, or it failed.
  rpc LookUpMovie(LookUpMovieRequest) returns (LookUpMovieResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Searches the metadata source for Shows to ask for Seasons of, best fit first. Needs
  // `PERMISSION_REQUEST_TV`. Fails as `SearchMovies` does.
  rpc SearchShows(SearchShowsRequest) returns (SearchShowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns one Show from the metadata source with each of its Seasons, for picking which to ask
  // for. Needs `PERMISSION_REQUEST_TV`. Fails with `invalid_argument` if the metadata source has no
  // Show with the id, and `unavailable` if no metadata Provider is enabled, or it failed.
  rpc LookUpShow(LookUpShowRequest) returns (LookUpShowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Approves a Pending Request and hands a Movie Request to the Movie Fulfiller, if one is enabled:
  // Processing once it takes it, or Failed if it doesn't. Either way it then waits for what it asks
  // for to be Matched in a Library. Given a `quality_id`, it first changes the Request's Quality to
  // that one, keeping the change in `Request.quality_change`, and for a Season Request that of
  // every open Season Request of its Show. Needs `PERMISSION_MANAGE_REQUESTS`, which manages every
  // User's Requests. Fails with `not_found` if there is no Request with the ID,
  // `failed_precondition` if it isn't Pending, and `invalid_argument` if the Quality isn't on its
  // Fulfiller's list (`REFUSAL_REASON_QUALITY_NOT_OFFERED`), or isn't the Show's once another
  // Season of the Show was handed off or Approved, which fixes the Show's Quality
  // (`REFUSAL_REASON_SHOW_HAS_QUALITY`).
  rpc ApproveRequest(ApproveRequestRequest) returns (ApproveRequestResponse);
  // Declines a Pending Request, which closes it: asking for the Movie again opens a new one. Needs
  // `PERMISSION_MANAGE_REQUESTS`. Fails as `ApproveRequest` does.
  rpc DeclineRequest(DeclineRequestRequest) returns (DeclineRequestResponse);
  // Removes a Request, whatever its state. Needs `PERMISSION_MANAGE_REQUESTS`. Fails with
  // `not_found` if there is no Request with the ID.
  rpc CancelRequest(CancelRequestRequest) returns (CancelRequestResponse);
  // Moves a Failed Request back to Approved and hands it to its Fulfiller again, changing its
  // Quality first as `ApproveRequest` does. Needs `PERMISSION_MANAGE_REQUESTS`. Fails with
  // `not_found` if there is no Request with the ID, `failed_precondition` if it isn't Failed, and
  // `invalid_argument` if the Quality isn't offered for it or isn't the Show's, as
  // `ApproveRequest` says.
  rpc RetryRequest(RetryRequestRequest) returns (RetryRequestResponse);
  // Takes the caller off a Pending Request's Requesters, which removes the Request once nobody is
  // left on it. Fails with `not_found` if there is no Request with the ID, or none the caller may
  // see, and `failed_precondition` if the caller isn't one of its Requesters or it isn't Pending.
  rpc WithdrawRequest(WithdrawRequestRequest) returns (WithdrawRequestResponse);
  // Approves a Pending Followed Show, and with it each Pending Season Request it opened. Given a
  // `quality_id`, it first changes the Show's Quality to that one, as `ApproveRequest` changes a
  // Season Request's. Needs `PERMISSION_MANAGE_REQUESTS`. Fails with `not_found` if there is no
  // Followed Show with the ID, `failed_precondition` if it isn't Pending, and `invalid_argument` if
  // the Quality isn't offered for the Show or isn't its fixed Quality, as `ApproveRequest` says.
  rpc ApproveFollowedShow(ApproveFollowedShowRequest) returns (ApproveFollowedShowResponse);
  // Declines a Pending Followed Show, and with it each Pending Season Request it opened, which ends
  // it. Needs `PERMISSION_MANAGE_REQUESTS`. Fails as `ApproveFollowedShow` does.
  rpc DeclineFollowedShow(DeclineFollowedShowRequest) returns (DeclineFollowedShowResponse);
  // Removes a Followed Show, whatever its state, leaving the Season Requests it opened as they are.
  // Needs `PERMISSION_MANAGE_REQUESTS`. Fails with `not_found` if there is no Followed Show with
  // the ID.
  rpc CancelFollowedShow(CancelFollowedShowRequest) returns (CancelFollowedShowResponse);
  // Takes the caller off a Followed Show's Requesters, which removes it once nobody is left on it,
  // leaving the Season Requests it opened as they are. Fails with `not_found` if there is no
  // Followed Show with the ID, or none the caller may see, and `failed_precondition` if the caller
  // isn't one of its Requesters.
  rpc WithdrawFollowedShow(WithdrawFollowedShowRequest) returns (WithdrawFollowedShowResponse);
  // Returns the Qualities the enabled Fulfiller for a kind of title offers, for a Request manager to
  // pick from when approving or retrying a Request. Empty if no such Fulfiller is enabled or it
  // offers none. Needs `PERMISSION_MANAGE_REQUESTS`.
  rpc ListOfferedQualities(ListOfferedQualitiesRequest) returns (ListOfferedQualitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Where a Request is on its way to the Library (ADR 0012).
enum RequestState {
  REQUEST_STATE_UNSPECIFIED = 0;
  // Waiting for a User with `PERMISSION_MANAGE_REQUESTS` to approve or decline it.
  REQUEST_STATE_PENDING = 1;
  // Approved, and waiting for what it asks for to be Matched in a Library.
  REQUEST_STATE_APPROVED = 2;
  // Declined, and closed: asking again opens a new Request.
  REQUEST_STATE_DECLINED = 3;
  // Handed to a Fulfiller, which is fetching it.
  REQUEST_STATE_PROCESSING = 4;
  // Some, but not all, of what it asks for is Matched in a Library.
  REQUEST_STATE_PARTIALLY_AVAILABLE = 5;
  // Matched in a Library, and closed.
  REQUEST_STATE_AVAILABLE = 6;
  // The Fulfiller didn't take it, for the reason in `failure_reason`. It stays Failed until
  // `RequestService.RetryRequest` hands it over again.
  REQUEST_STATE_FAILED = 7;
}

// Users asking for one Movie, or one Season of a Show. Each has at most one open Request: one that
// is neither Declined nor Available.
message Request {
  int64 id = 1;
  // What it asks for.
  oneof movie_or_season {
    RequestedMovie movie = 2;
    RequestedSeason season = 7;
  }
  RequestState state = 3;
  // Who asked for it, first asker first. There is at least one.
  repeated Requester requesters = 4;
  // When it was opened, in seconds since the Unix epoch.
  int64 created_at = 5;
  // Why it was declined, for its Requesters to read. Only a Declined Request has one, and only if
  // the decliner gave one.
  optional string decline_reason = 6;
  // Why the Fulfiller didn't take it, in the Fulfiller's own words. Only a Failed Request has one.
  optional string failure_reason = 8;
  // The ID of the Followed Show that opened it, while that Followed Show lasts.
  optional int64 followed_show_id = 9;
  // What its Fulfiller's service is downloading for it, as the Server last heard, which it asks
  // every minute while any Request its Fulfiller has isn't Available yet. Only a Processing or
  // Partially Available Request has any. The Server keeps them in memory only, so after it
  // restarts a Request has none until it asks again, and `EventService` sends a `RequestProgress`
  // whenever they change.
  repeated Download downloads = 10;
  // The Quality it is downloaded at, as its first Requester picked it or else as its Fulfiller's
  // default was when it opened (ADR 0025). Unset if no Fulfiller was enabled or it had no
  // Qualities then, when the Plugin's own `quality_profile` applies. A Season Request takes its
  // Show's (`FoundShow.quality`).
  RequestedQuality quality = 11;
  // The Quality its service is downloading it at, as the hand-off reported it, which differs from
  // `quality` when the service already had the title and kept its own profile. Unset until it is
  // handed off, if it has no `quality`, or if the Fulfiller didn't say. With no Quality on the
  // list for that profile, `id` is 0 and `name` is the service's own: set in the service.
  RequestedQuality quality_used = 12;
  // The latest change a Request manager made to its Quality, if any. Only the latest is kept.
  QualityChange quality_change = 13;
  // The ID of the Plugin whose Fulfiller it was handed to at its latest Hand-off, whether or not
  // it took it. Unset until it is handed off.
  optional string fulfiller_plugin_id = 14;
}

// A Request manager changing a Request's Quality, as `Request.quality` now has it.
message QualityChange {
  // The Request manager's name, unset once that User is deleted.
  optional string changed_by = 1;
  // The friendly name of the Quality it had before, unset if it had none.
  optional string previous_name = 2;
  // When, in seconds since the Unix epoch.
  int64 changed_at = 3;
}

// A copy of the Quality a Request took, kept as it was so renaming or removing the Quality changes
// neither what the Request reads nor what it is handed off with.
message RequestedQuality {
  // The Quality's id on its Fulfiller's list, which may not have it any more.
  int64 id = 1;
  // Its friendly name, such as `HD`.
  string name = 2;
  // The service's quality profile it is handed off with, as `Quality.profile_id`.
  string profile_id = 3;
}

// One download a Fulfiller's service is making for a Request. A Season may be one download of the
// whole Season or one per Episode.
message Download {
  // What is downloading, as the service names it.
  string title = 1;
  // How much is done, from 0 to 100.
  float percent = 2;
  // How big it is, in bytes, if the service knows.
  optional uint64 size_bytes = 3;
  // How long until it is done, in seconds, if the service knows.
  optional uint64 eta_seconds = 4;
  DownloadStatus status = 5;
  // Why it needs attention, in the Fulfiller's own words, if it says. Only a download that needs
  // attention has one.
  optional string attention_reason = 6;
}

// Where a download is.
enum DownloadStatus {
  DOWNLOAD_STATUS_UNSPECIFIED = 0;
  // Waiting for its turn to download.
  DOWNLOAD_STATUS_QUEUED = 1;
  DOWNLOAD_STATUS_DOWNLOADING = 2;
  // Downloaded, and being moved into the Library's folder.
  DOWNLOAD_STATUS_IMPORTING = 3;
  // Stopped until someone looks at it in the service, such as when it stalled, failed or can't be
  // imported.
  DOWNLOAD_STATUS_NEEDS_ATTENTION = 4;
}

// Users asking for a whole Show: its Seasons now and any that come out later, approved once. A
// Show has at most one open Followed Show: one that isn't Declined.
message FollowedShow {
  int64 id = 1;
  // The Show's TMDB id.
  int64 show_tmdb_id = 2;
  // The Show's title, in the metadata Provider's language, as it was when the Followed Show was
  // opened.
  string show_title = 3;
  // Pending, Approved or Declined.
  RequestState state = 4;
  // Who asked for it, first asker first. There is at least one.
  repeated Requester requesters = 5;
  // When it was opened, in seconds since the Unix epoch.
  int64 created_at = 6;
  // Why it was declined, for its Requesters to read. Only a Declined Followed Show has one, and
  // only if the decliner gave one.
  optional string decline_reason = 7;
  // The Quality it was opened at, or a Request manager last changed the Show's to. Each Season
  // Request it opens, now or when a later Season comes out, takes the Show's (`FoundShow.quality`),
  // which is this one unless Sonarr kept another for a series it already had. Unset if the Shows
  // Fulfiller had no Qualities when it opened.
  RequestedQuality quality = 8;
}

// A Movie a Request asks for, with its metadata as the metadata source gave it when the Request
// was opened.
message RequestedMovie {
  // The Movie's TMDB id.
  int64 tmdb_id = 1;
  // The title, in the metadata Provider's language.
  string title = 2;
  // When it was released, as `YYYY-MM-DD`.
  optional string release_date = 3;
}

// A Season a Request asks for, with its metadata as the metadata source gave it when the Request
// was opened.
message RequestedSeason {
  // The Show's TMDB id.
  int64 show_tmdb_id = 1;
  // The Season's number within the Show. Season 0 holds specials.
  uint32 season_number = 2;
  // The Show's title, in the metadata Provider's language.
  string show_title = 3;
  // When the Season first aired, as `YYYY-MM-DD`.
  optional string air_date = 4;
  // The Show's IMDb id, such as `tt5753856`, if the metadata source has one.
  optional string show_imdb_id = 5;
  // The Show's TVDB id, if the metadata source has one.
  optional int64 show_tvdb_id = 6;
}

// A User who asked for what a Request covers.
message Requester {
  int64 user_id = 1;
  // The User's name.
  string name = 2;
  // When they asked, in seconds since the Unix epoch.
  int64 requested_at = 3;
}

message CreateRequestRequest {
  // The TMDB id of the Movie to ask for.
  int64 movie_tmdb_id = 1;
  // The id of the Quality to download it at, from `ListMovieQualities`. Unset for the default.
  optional int64 quality = 2;
}

message CreateRequestResponse {
  // The Request the caller is now a Requester of.
  Request request = 1;
}

message CreateSeasonRequestsRequest {
  // The TMDB id of the Show.
  int64 show_tmdb_id = 1;
  // The numbers of the Seasons to ask for: at least one. A number given twice counts once.
  repeated uint32 season_numbers = 2;
  // The id of the Quality to download them at, from `ListShowQualities`. Unset for the Show's, or
  // else the default.
  optional int64 quality = 3;
}

message CreateSeasonRequestsResponse {
  // The Requests the caller is now a Requester of, one per Season, in Season order.
  repeated Request requests = 1;
}

message ListRequestsRequest {
  // The state to list Requests and Followed Shows in. Unspecified lists every state.
  RequestState state = 1;
  // How many Requests and Followed Shows, together, to list at most. 0 lists 50, and more than 100
  // lists 100.
  uint32 page_size = 2;
  // The `next_page_token` of the page before, to list the page after it, or empty for the first.
  // Pages follow the newest-first order as it was, so Requests opened while paging don't shift
  // later pages.
  string page_token = 3;
}

message CreateFollowedShowRequest {
  // The TMDB id of the Show.
  int64 show_tmdb_id = 1;
  // The id of the Quality to download its Seasons at, from `ListShowQualities`. Unset for the
  // Show's, or else the default.
  optional int64 quality = 2;
}

message CreateFollowedShowResponse {
  // The Followed Show the caller is now a Requester of.
  FollowedShow followed_show = 1;
  // The Requests the caller is now a Requester of, one per Season not in a Library, in Season
  // order.
  repeated Request requests = 2;
}

message ListRequestsResponse {
  // The page's Requests, newest first. With `followed_shows`, one page of a single newest-first
  // list: by `created_at`, a Request before a Followed Show opened in the same second.
  repeated Request requests = 1;
  // The page's Followed Shows, newest first.
  repeated FollowedShow followed_shows = 2;
  // The `page_token` that lists the next page, or empty if this is the last.
  string next_page_token = 3;
}

message ListMovieQualitiesRequest {}

message ListMovieQualitiesResponse {
  repeated Quality qualities = 1;
  // The id of the caller's default among `qualities`, which `CreateRequest` takes when they name
  // none. Unset if they have none, it is no longer on the list, or they lack
  // `PERMISSION_CHOOSE_QUALITY`.
  optional int64 personal_default = 2;
}

message ListShowQualitiesRequest {}

message ListShowQualitiesResponse {
  repeated Quality qualities = 1;
  // The id of the caller's default among `qualities`, as `ListMovieQualitiesResponse` has it.
  optional int64 personal_default = 2;
}

message ListDefaultQualitiesRequest {}

message ListDefaultQualitiesResponse {
  // One for each enabled Fulfiller, Movies first, whose list has more than one Quality, or has
  // one left after an admin removed the User's default.
  repeated DefaultQuality defaults = 1;
}

// A User's default Quality for one Fulfiller (ADR 0025).
message DefaultQuality {
  // The Fulfiller's Plugin id, such as `radarr`.
  string plugin_id = 1;
  // What it fulfils: `EXTENSION_POINT_MOVIE_FULFILLER` or `EXTENSION_POINT_SHOW_FULFILLER`.
  ExtensionPoint fulfiller = 2;
  // The Fulfiller's Qualities, in the order an admin listed them.
  repeated Quality qualities = 3;
  // The id of the User's default. Unset for none, when the Fulfiller's default applies. If an
  // admin has since removed it, `qualities` doesn't have it, and the Fulfiller's default applies.
  optional int64 quality = 4;
}

message SetDefaultQualityRequest {
  // The Fulfiller's Plugin id, such as `radarr`.
  string plugin_id = 1;
  // The id of the Quality on its list. Unset to clear the default.
  optional int64 quality = 2;
}

message SetDefaultQualityResponse {}

message GetRequestRequest {
  // The ID of the Request.
  int64 id = 1;
}

message GetRequestResponse {
  Request request = 1;
}

message CountPendingRequestsRequest {}

message CountPendingRequestsResponse {
  // How many Requests and Followed Shows are Pending.
  uint32 count = 1;
}

message ApproveRequestRequest {
  // The ID of the Request.
  int64 id = 1;
  // The id of the Quality to change it to, from its Fulfiller's list. Unset keeps its Quality.
  optional int64 quality_id = 2;
}

message ApproveRequestResponse {
  // The Request, Approved.
  Request request = 1;
}

message DeclineRequestRequest {
  // The ID of the Request.
  int64 id = 1;
  // Why it is declined, for its Requesters to read. Blank gives none.
  string reason = 2;
}

message DeclineRequestResponse {
  // The Request, Declined.
  Request request = 1;
}

message CancelRequestRequest {
  // The ID of the Request.
  int64 id = 1;
}

message CancelRequestResponse {}

message RetryRequestRequest {
  // The ID of the Request.
  int64 id = 1;
  // The id of the Quality to change it to, from its Fulfiller's list. Unset keeps its Quality.
  optional int64 quality_id = 2;
}

message RetryRequestResponse {
  // The Request, Processing if its Fulfiller took it, else Failed again, or Approved if no
  // Fulfiller is enabled.
  Request request = 1;
}

message WithdrawRequestRequest {
  // The ID of the Request.
  int64 id = 1;
}

message WithdrawRequestResponse {}

message ApproveFollowedShowRequest {
  // The ID of the Followed Show.
  int64 id = 1;
  // The id of the Quality to change the Show's to, from the Shows Fulfiller's list. Unset keeps it.
  optional int64 quality_id = 2;
}

message ApproveFollowedShowResponse {
  // The Followed Show, Approved.
  FollowedShow followed_show = 1;
}

message DeclineFollowedShowRequest {
  // The ID of the Followed Show.
  int64 id = 1;
  // Why it is declined, for its Requesters to read. Blank gives none.
  string reason = 2;
}

message DeclineFollowedShowResponse {
  // The Followed Show, Declined.
  FollowedShow followed_show = 1;
}

message CancelFollowedShowRequest {
  // The ID of the Followed Show.
  int64 id = 1;
}

message CancelFollowedShowResponse {}

message WithdrawFollowedShowRequest {
  // The ID of the Followed Show.
  int64 id = 1;
}

message WithdrawFollowedShowResponse {}

message ListOfferedQualitiesRequest {
  // `TITLE_KIND_MOVIE` for the Movie Fulfiller's, or `TITLE_KIND_SHOW` for the Show Fulfiller's.
  TitleKind kind = 1;
}

message ListOfferedQualitiesResponse {
  // In the order an admin listed them.
  repeated Quality qualities = 1;
}

// A Movie a search found, and how close it is to being on the Server: in a Library, asked for in
// a Request, or neither, in which case `CreateRequest` asks for it. Numbered as `FoundMovie`, so a
// client built when searches gave `FoundMovie`s still decodes it.
message MovieHit {
  // The Movie's TMDB id.
  int64 tmdb_id = 1;
  // The title, in the metadata Provider's language.
  string title = 2;
  // The year it was released, if known.
  optional int32 year = 3;
  // The poster's URL on this Server: its Custom Image, if it has one.
  optional string poster_url = 6;
  // The oldest Library the Movie is Matched in, if any. `BrowseService.GetMovie` opens it there,
  // by `tmdb_id`.
  optional int64 library_id = 8;
  // The Movie's open Request, if it has one the caller may see.
  Request request = 9;
  // As `nama.v1.Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 10;
}

// A Movie looked up in the metadata source: all a `MovieHit` has, and what only a look-up fetches.
message FoundMovie {
  // The Movie's TMDB id.
  int64 tmdb_id = 1;
  // The title, in the metadata Provider's language.
  string title = 2;
  // The year it was released, if known.
  optional int32 year = 3;
  // What it is about, in the metadata Provider's language.
  optional string overview = 4;
  optional uint32 runtime_minutes = 5;
  // The poster's URL on this Server: its Custom Image, if it has one.
  optional string poster_url = 6;
  // The backdrop's URL on this Server: its Custom Image, if it has one.
  optional string backdrop_url = 7;
  // The oldest Library the Movie is Matched in, if any. `BrowseService.GetMovie` opens it there,
  // by `tmdb_id`.
  optional int64 library_id = 8;
  // The Movie's open Request, if it has one the caller may see.
  Request request = 9;
  // As `nama.v1.Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 10;
  // As `nama.v1.Movie.backdrop_thumbhash`.
  optional bytes backdrop_thumbhash = 11;
}

message SearchMoviesRequest {
  // Must not be blank.
  string title = 1;
}

message SearchMoviesResponse {
  repeated MovieHit movies = 1;
}

message LookUpMovieRequest {
  // The Movie's TMDB id.
  int64 movie_tmdb_id = 1;
}

message LookUpMovieResponse {
  FoundMovie movie = 1;
}

// A Show a search found. Numbered as `FoundShow`, so a client built when searches gave
// `FoundShow`s still decodes it.
message ShowHit {
  // The Show's TMDB id.
  int64 tmdb_id = 1;
  // The title, in the metadata Provider's language.
  string title = 2;
  // The year it first aired, if known.
  optional int32 year = 3;
  // The poster's URL on this Server: its Custom Image, if it has one.
  optional string poster_url = 5;
  // As `nama.v1.Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 10;
}

// A Show looked up in the metadata source, whose Seasons `CreateSeasonRequests` asks for.
message FoundShow {
  // The Show's TMDB id.
  int64 tmdb_id = 1;
  // The title, in the metadata Provider's language.
  string title = 2;
  // The year it first aired, if known.
  optional int32 year = 3;
  // What it is about, in the metadata Provider's language.
  optional string overview = 4;
  // The poster's URL on this Server: its Custom Image, if it has one.
  optional string poster_url = 5;
  // The backdrop's URL on this Server: its Custom Image, if it has one.
  optional string backdrop_url = 6;
  // Its Seasons, in order.
  repeated FoundSeason seasons = 7;
  // The Show's open Followed Show, if it has one the caller may see.
  FollowedShow followed_show = 8;
  // The Show's Quality, which each of its Season Requests takes, as Sonarr keeps one profile per
  // series (ADR 0025): that of its earliest Season Request that has one and is open or was handed
  // off, else that of its open Followed Show. Unset if it has none, so a new Season Request or
  // Followed Show may pick one.
  RequestedQuality quality = 9;
  // As `nama.v1.Movie.poster_thumbhash`.
  optional bytes poster_thumbhash = 10;
  // As `nama.v1.Movie.backdrop_thumbhash`.
  optional bytes backdrop_thumbhash = 11;
}

// A Season of a Show in the metadata source, and how close it is to being on the Server: in a
// Library, asked for in a Request, or neither.
message FoundSeason {
  // The Season's number within the Show. Season 0 holds specials.
  uint32 season_number = 1;
  // When the Season first aired, as `YYYY-MM-DD`.
  optional string air_date = 2;
  // Whether a Library has it: it has aired, and every one of its aired Episodes is Matched.
  // `CreateSeasonRequests` refuses to ask for such a Season.
  bool in_library = 3;
  // The Season's open Request, if it has one the caller may see.
  Request request = 4;
}

message SearchShowsRequest {
  // Must not be blank.
  string title = 1;
}

message SearchShowsResponse {
  repeated ShowHit shows = 1;
}

message LookUpShowRequest {
  // The Show's TMDB id.
  int64 show_tmdb_id = 1;
}

message LookUpShowResponse {
  FoundShow show = 1;
}
