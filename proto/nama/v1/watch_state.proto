syntax = "proto3";

package nama.v1;

import "nama/v1/match.proto";

// Remembering how far the signed-in caller has got through what they play.
//
// Watch State is kept per User against the Movie or Episode a Version is Matched to, by its
// external id, never against the file. So it survives rescans, renames and new Versions, and every
// Version of a Movie or Episode shares it. An Item that isn't Matched has none. `BrowseService`
// returns it with each Movie and Episode, and lists the caller's Continue Watching.
service WatchStateService {
  // Reports how far the caller has got through a Version they are playing, and stores it against
  // the Movie or Episodes the Version is Matched to. A file holding several Episodes plays as one:
  // each Episode, in episode order, gets an even share of the duration, and the position fills
  // the shares in turn. An Episode whose share the position hasn't reached is left alone. A Movie
  // or Episode is marked played once its position passes 90% of its duration, and stays played if
  // it is played again from the start. A Version whose Items aren't Matched is accepted, and
  // nothing is stored. Fails with `not_found` if there is no such Version, and with
  // `invalid_argument` if the duration is zero.
  rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Marks a Movie, an Episode, or every Episode of a Season or a Show that is Matched in a
  // Library, played or unplayed for the caller, without playing it. Marking played leaves the
  // position alone. Marking unplayed clears the Watch State, position and all, so it starts from
  // the beginning. Fails with `not_found` if there is no such Library, or nothing in it is
  // Matched to that Movie, Episode, Show or Season, and with `invalid_argument` if no target is
  // given, or a Movie is asked of a Shows Library or an Episode, Season or Show of a Movies
  // Library.
  rpc SetPlayed(SetPlayedRequest) returns (SetPlayedResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// A User's progress through a Movie or Episode.
message WatchState {
  // How far in, in milliseconds.
  uint64 position_ms = 1;
  // How long it is, in milliseconds, as the player last reported it. Zero if no player has, as
  // when it was marked played without being played.
  uint64 duration_ms = 2;
  // Whether it has been played: its position has passed 90% of its duration, or it was marked
  // played.
  bool played = 3;
  // When it last changed, in seconds since the Unix epoch.
  int64 updated_at = 4;
}

message ReportProgressRequest {
  // The Version being played, as browsing gave it.
  int64 version_id = 1;
  // How far in, in milliseconds. A position past the duration is taken as the end.
  uint64 position_ms = 2;
  // How long the Version is, in milliseconds. Must not be zero.
  uint64 duration_ms = 3;
}

message ReportProgressResponse {}

message SetPlayedRequest {
  // The Library the Movie, Episode, Season or Show is in.
  int64 library_id = 1;
  // What to mark, identified as browsing identifies it.
  oneof target {
    // A Movie of a Movies Library, by its id as `ListMovies` gave it.
    ExternalId movie_id = 2;
    // An Episode of a Shows Library, by its id as `ListEpisodes` gave it.
    ExternalId episode_id = 3;
    // Every Episode of one Season of a Show that the Library has.
    ShowSeason season = 4;
    // Every Episode of a Show that the Library has, by its id as `ListShows` gave it.
    ExternalId show_id = 5;
  }
  // Whether it is now played.
  bool played = 6;
}

// A Season of a Show, as browsing identifies it.
message ShowSeason {
  // The Show's id, as `ListShows` gave it.
  ExternalId show_id = 1;
  // The Season's number, as `GetShow` gave it.
  uint32 season_number = 2;
}

message SetPlayedResponse {}
