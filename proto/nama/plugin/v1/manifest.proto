syntax = "proto3";

// Messages between the Server and its Installed Plugins (ADR 0006). An Installed Plugin is a
// `.wasm` file whose exports take and return these, encoded as protobuf.
package nama.plugin.v1;

// What an Installed Plugin is and what it needs from the Server. The Plugin returns it from its
// `manifest()` export, which takes no input.
//
// A Plugin may also export `check_settings()`, which takes no input and checks its settings, read
// from its Extism config as for any call, against the outside service they are for. It returns
// `CheckedSettings`, or fails with an error an admin can act on. The Server calls it only when an
// admin tests settings, which may be unsaved, so the hosts of the URL settings tested are allowed
// for that call alone.
message Manifest {
  // The Plugin's stable, unique name, such as "sonarr".
  string id = 1;
  // The Plugin's own version, such as "1.2.0".
  string version = 2;
  // The versions of the Nama API the Plugin works with, as a Cargo-style semver requirement
  // such as "^0.3.0". A Server whose Nama API version doesn't match refuses the Plugin. A Server
  // reads this field before the rest of the Manifest, so it keeps field number 3 in every version.
  string nama_api = 3;
  // The settings the Plugin takes, in the order a form shows them. The Plugin reads each one's
  // value from its Extism config under its key, as text: a bool as "true" or "false", a number in
  // decimal.
  repeated SettingField settings = 4;
  // Host names the Plugin may send HTTP requests to, such as "api.example.com" or
  // "*.example.com". Ports aren't part of the match, so a host allows every port on it, and a
  // Server refuses a Plugin naming a host with one.
  repeated string allowed_hosts = 5;
  // The Extension Points the Plugin registers an Observer at. A Server refuses a Plugin naming
  // one it doesn't know, or lacking an export one needs.
  repeated ObservePoint observers = 6;
  // The capabilities the Plugin registers a Provider for. A Server refuses a Plugin naming one it
  // doesn't know, or lacking an export one needs.
  repeated ProvidePoint providers = 7;
  // What admins know the Plugin by, such as "Sonarr". Optional: its `id` stands in.
  string name = 8;
  // What the Plugin does, in one sentence. Optional.
  string description = 9;
  // The Plugin's logo: an SVG document's text, not base64, such as "<svg xmlns=...>...</svg>".
  // A Server keeps it as `svg-hush` cleans it, without scripts or outside loads, and serves it by URL.
  // It drops one over 64 KiB, or that isn't well-formed SVG, logging why, and still loads the Plugin.
  // Admins see it as an image on a neutral tile in either colour scheme, so it should read on both.
  string logo_svg = 10;
}

// One setting an Installed Plugin takes.
message SettingField {
  // The key it is stored and configured under, such as "api_key".
  string key = 1;
  // A short name for a form's label.
  string label = 2;
  // What the setting does, for a form's help text.
  string description = 3;
  // What kind of value it takes.
  SettingKind kind = 4;
  // Whether the Plugin can't be enabled without it.
  bool required = 5;
  // The value used when none is given. Unset if there is none.
  SettingValue default_value = 6;
}

// What an Installed Plugin's `check_settings()` returns when its settings work.
message CheckedSettings {
  // The choices for each `SETTING_KIND_CHOICE` setting, by key.
  map<string, SettingChoices> choices = 1;
}

// What kind of value a setting takes.
enum SettingKind {
  SETTING_KIND_UNSPECIFIED = 0;
  // Text.
  SETTING_KIND_TEXT = 1;
  // Text that admins never see again once saved and the Server never logs, such as an API key.
  SETTING_KIND_SECRET = 2;
  // On or off.
  SETTING_KIND_BOOL = 3;
  // A whole number.
  SETTING_KIND_INTEGER = 4;
  // Text picked from the choices the Plugin's `check_settings()` export offers in
  // `CheckedSettings`.
  SETTING_KIND_CHOICE = 5;
  // An http or https URL, such as a Sonarr address. The Plugin may send HTTP requests to its host,
  // as if `Manifest.allowed_hosts` named it.
  SETTING_KIND_URL = 6;
}

// A setting's value, of the setting's kind.
message SettingValue {
  oneof value {
    // Text, for SETTING_KIND_TEXT, SETTING_KIND_SECRET, SETTING_KIND_CHOICE and SETTING_KIND_URL.
    string text_value = 1;
    // On or off, for SETTING_KIND_BOOL.
    bool bool_value = 2;
    // A whole number, for SETTING_KIND_INTEGER.
    int64 integer_value = 3;
  }
}

// The values a SETTING_KIND_CHOICE setting may take, in the order a form offers them.
message SettingChoices {
  repeated Choice choices = 1;
}

// One value a SETTING_KIND_CHOICE setting may take.
message Choice {
  // What the setting's value holds as its `text_value` when an admin picks it, such as a quality
  // profile's id.
  string value = 1;
  // What an admin picks it by, such as the profile's name.
  string label = 2;
}

// An Observe Extension Point an Installed Plugin can register an Observer at.
enum ObservePoint {
  OBSERVE_POINT_UNSPECIFIED = 0;
  // Things happened in the Kernel: the kinds of `Event` the contract has. The Plugin's
  // `observe_events` export takes each batch as `ObservedEvents` and returns nothing.
  OBSERVE_POINT_EVENTS = 1;
}

// A capability an Installed Plugin can register a Provider for.
enum ProvidePoint {
  PROVIDE_POINT_UNSPECIFIED = 0;
  // The Fulfiller for Movie Requests. The Plugin's `fulfill` export takes each `Request` and
  // returns `Fulfilled`, and its `progress` export takes `ProgressAsked` and
  // returns `Progress`. Its `stop_monitoring` export, which takes `StopMonitoring`, is optional: a
  // Plugin without it isn't asked.
  PROVIDE_POINT_MOVIE_FULFILLER = 1;
  // The Fulfiller for Season Requests, with the same exports as PROVIDE_POINT_MOVIE_FULFILLER and
  // an `unfollow` export, which takes the `Request` for a Season of a Followed Show that ended,
  // stops following the Show and returns nothing. A Plugin providing both tells a Movie Request
  // from a Season one by which it holds.
  PROVIDE_POINT_SHOW_FULFILLER = 2;
  // A Notifier. The Plugin's `deliver` export takes each notification as `Delivery` and returns
  // `Delivered`, or fails with why the service didn't take it, which the Server logs.
  PROVIDE_POINT_NOTIFIER = 3;
  // A Connector, which connects Users to the outside service. The Plugin's `start_connection`
  // export takes `ConnectionStart` and returns `ConnectionStarted`, and its `poll_connection` export
  // takes `ConnectionPoll` and returns `ConnectionPolled`.
  PROVIDE_POINT_CONNECTOR = 4;
}
