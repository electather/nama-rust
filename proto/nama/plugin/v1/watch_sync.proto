syntax = "proto3";

package nama.plugin.v1;

import "nama/plugin/v1/automation.proto";
import "nama/plugin/v1/request.proto";

// The Extension Point for Watch sync: a Plugin that follows each User's Watch State to an outside
// tracker, such as Trakt, and brings the changes made there back. An Installed Plugin serves it
// through the WASM exports its rpcs name, taking and returning its messages encoded as protobuf.
// Every export is required.
//
// Each User links their own account by device code (`start_link`, `poll_link`), and the Kernel
// keeps what the tracker hands back as their secret Personal settings (ADR 0046): it asks
// `scrobble` and `import` only for a User who set any of them, with that User's values and never
// another's. Watch State only; ratings don't sync.
service WatchSyncService {
  // The `scrobble` export: one write's changes to a User's Watch State, told as the write is
  // made, a position update while they play included. Best effort: a failed call is logged and
  // shown on the Plugins page, and not asked again. A change `import` brought in is never
  // scrobbled back.
  rpc Scrobble(ScrobbleAsked) returns (Scrobbled);
  // The `import` export: the changes to a User's Watch State on the outside tracker since the
  // last import, asked every 15 minutes. The Kernel takes each of a Movie or an Episode a Library
  // has that is newer than the Server's own (ADR 0008), and keeps the `cursor` for the next ask,
  // per User, until the User or the Plugin is gone. A failed call keeps the cursor.
  rpc Import(ImportAsked) returns (Imported);
  // The `start_link` export: starts linking a User's account at the tracker, for the User to enter
  // `user_code` at `verification_url`.
  rpc StartLink(StartLinkAsked) returns (LinkStarted);
  // The `poll_link` export: whether the User entered the code `start_link` gave yet, asked as
  // often as its `interval_seconds` while they link.
  rpc PollLink(PollLinkAsked) returns (LinkPolled);
}

// What the `start_link` export is asked: nothing yet.
message StartLinkAsked {}

// What the `start_link` export returns.
message LinkStarted {
  // The code the User enters at `verification_url`.
  string user_code = 1;
  // Where the User enters `user_code`, such as `https://trakt.tv/activate`.
  string verification_url = 2;
  // How long `user_code` works, in seconds.
  uint32 expires_in_seconds = 3;
  // How often `poll_link` may be asked, in seconds.
  uint32 interval_seconds = 4;
  // Opaque to the Kernel, which hands it back to `poll_link`. The User's own client holds it
  // while they link.
  string device_code = 5;
}

// What the `poll_link` export is asked.
message PollLinkAsked {
  // What `start_link` returned as `device_code`.
  string device_code = 1;
}

// What the `poll_link` export returns: empty while the User hasn't entered the code.
message LinkPolled {
  // Once the User entered the code, the tracker's tokens as values of the Plugin's SECRET Personal
  // settings by key, which the Kernel keeps as the User's, never shows back, and hands to
  // `scrobble` and `import`. A key that isn't a SECRET Personal setting is dropped.
  map<string, string> personal_settings = 1;
  // The code expired or the User refused it: they start again.
  bool expired = 2;
}

// What the `scrobble` export is told.
message ScrobbleAsked {
  // The User's values for the Plugin's Personal settings, as `UserRowsAsked.personal_settings`.
  map<string, string> personal_settings = 1;
  int64 user_id = 2;
  // One per Movie or Episode the write changed.
  repeated SyncedWatchState changes = 3;
}

// What the `scrobble` export returns: nothing yet.
message Scrobbled {}

// What the `import` export is asked.
message ImportAsked {
  // As `ScrobbleAsked.personal_settings`.
  map<string, string> personal_settings = 1;
  int64 user_id = 2;
  // The `cursor` the Plugin returned for this User last, empty on the first ask.
  string since = 3;
}

// What the `import` export returns.
message Imported {
  // Changes to the User's Watch State since `since`, in any order. One whose title no Library
  // has, or that isn't newer than the Server's own, is dropped.
  repeated SyncedWatchState changes = 1;
  // Where the next ask continues from, opaque to the Kernel, which hands it back as `since`.
  string cursor = 2;
}

// A Movie's or Episode's Watch State as a change left it.
message SyncedWatchState {
  // TITLE_REF_KIND_MOVIE or TITLE_REF_KIND_EPISODE.
  TitleRefKind kind = 1;
  // Its External IDs, any of which identifies it. The Kernel sends every one it has, the one it
  // keeps the Watch State under first (ADR 0013).
  repeated TitleId ids = 2;
  bool played = 3;
  // How far in, in milliseconds. Unplayed at 0 of 0 is marked unplayed.
  uint64 position_ms = 4;
  // How long it is, in milliseconds; 0 if unknown.
  uint64 duration_ms = 5;
  // When it changed, in milliseconds since the Unix epoch, which decides the newer of two changes.
  int64 changed_at_ms = 6;
  // Every id the Kernel knows an Episode's Show by, at most one per namespace, any one of which
  // identifies it. The Kernel sets this and the two numbers below only for an Episode Matched in
  // a Library, for a tracker that finds an Episode by its Show, season and number; `import` may
  // leave them unset.
  repeated TitleId show_ids = 7;
  // An Episode's Season's number within its Show, as `show_ids`. Season 0 holds specials.
  optional uint32 season_number = 8;
  // An Episode's number within its Season, as `show_ids`.
  optional uint32 episode_number = 9;
}
