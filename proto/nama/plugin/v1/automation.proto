syntax = "proto3";

package nama.plugin.v1;

import "nama/plugin/v1/request.proto";
import "nama/plugin/v1/title_source.proto";

// The Kernel's functions, which any Plugin asks the Kernel through (ADR 0048).
//
// They are the functions in the Wasm import namespace `nama` that any Plugin, whatever its
// Manifest's `points`, may call during any of its calls (ADR 0071). Each takes its request
// message, encoded, and returns a `KernelAnswer`. Each needs the Plugin Permission named beside
// it, which the Admin granted when enabling the Plugin; without it the Kernel answers `refused`.
//
//   store_get:         StoreKey         -> StoreValue     PERMISSION_STORE
//   store_put:         StoreEntry       -> Stored         PERMISSION_STORE
//   store_delete:      StoreKey         -> Stored         PERMISSION_STORE
//   list_libraries:    LibrariesAsked   -> Libraries      PERMISSION_READ_LIBRARIES
//   list_titles:       TitlesAsked      -> Titles         PERMISSION_READ_LIBRARIES
//   list_watch_states: WatchStatesAsked -> WatchStates    PERMISSION_READ_WATCH_STATES
//   list_users:        UsersAsked       -> Users          PERMISSION_READ_USERS
//   list_requesters:   RequestersAsked  -> Requesters     PERMISSION_READ_REQUESTS
//   list_watchlist:    WatchlistAsked   -> Watchlist      PERMISSION_READ_WATCHLISTS
//   delete_media:      DeleteAsked      -> DeleteStarted  PERMISSION_DELETE_MEDIA
//   forget_home_rows:  ForgetHomeRowsAsked -> HomeRowsForgotten  PERMISSION_FORGET_HOME_ROWS
//   delete_expired_sign_ins: ExpiredSignInsAsked -> ExpiredSignInsDeleted
//                      PERMISSION_DELETE_EXPIRED_SIGN_INS
//
// The functions are documented here rather than declared as a service: they are not an Extension
// Point, and no Manifest names them. They are versioned with `CONTRACT_VERSION`.

// What a Kernel function returns.
message KernelAnswer {
  oneof result {
    // The function's response, encoded.
    bytes answer = 1;
    // Why the Kernel refused, in plain words, such as a Permission not granted.
    string refused = 2;
  }
}

// What a Plugin may ask the Kernel for, requested in its Manifest's `permissions` and granted by
// the Admin when enabling it.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  // The Plugin's own Store: `store_get`, `store_put` and `store_delete`.
  PERMISSION_STORE = 1;
  // Libraries and their titles: `list_libraries` and `list_titles`.
  PERMISSION_READ_LIBRARIES = 2;
  // Every User's Watch State: `list_watch_states`.
  PERMISSION_READ_WATCH_STATES = 3;
  // Deleting a title's media files: `delete_media`.
  PERMISSION_DELETE_MEDIA = 4;
  // Every User's id and display name: `list_users`.
  PERMISSION_READ_USERS = 5;
  // Who Requested each title: `list_requesters`.
  PERMISSION_READ_REQUESTS = 6;
  // Every User's Watchlist: `list_watchlist`.
  PERMISSION_READ_WATCHLISTS = 7;
  // Deleting the Home rows and Featured suggestions of Users who stopped opening home:
  // `forget_home_rows`.
  PERMISSION_FORGET_HOME_ROWS = 8;
  // Deleting the Devices and Invites that have expired: `delete_expired_sign_ins`.
  PERMISSION_DELETE_EXPIRED_SIGN_INS = 9;
}

// An entry in the Plugin's Store, for `store_get` and `store_delete`.
message StoreKey {
  // Up to 256 bytes.
  string key = 1;
  // Scopes the entry to one User. Unset, the entry is the Plugin's alone.
  optional int64 user_id = 2;
}

// What `store_put` keeps in the Plugin's Store, replacing any value under the same key and User.
// A Plugin keeps at most 10 000 entries, Plugin-wide and per-User together: at that cap the Kernel
// refuses a new key, though it still replaces the value under a key the Plugin holds.
message StoreEntry {
  // Up to 256 bytes.
  string key = 1;
  // Scopes the entry to one User. Unset, the entry is the Plugin's alone.
  optional int64 user_id = 2;
  // Up to 64 KiB.
  bytes value = 3;
}

// What `store_get` answers: the value kept, unset if there is none.
message StoreValue {
  optional bytes value = 1;
}

// What `store_put` and `store_delete` answer.
message Stored {}

// What `list_libraries` takes.
message LibrariesAsked {}

// What `list_libraries` answers: every Library.
message Libraries {
  repeated Library libraries = 1;
}

// A Library.
message Library {
  int64 id = 1;
  string name = 2;
  LibraryKind kind = 3;
}

// What a Library holds.
enum LibraryKind {
  LIBRARY_KIND_UNSPECIFIED = 0;
  LIBRARY_KIND_MOVIES = 1;
  LIBRARY_KIND_SHOWS = 2;
}

// What `list_titles` takes: a page of a Library's titles, by kind and then id.
message TitlesAsked {
  int64 library_id = 1;
  // How many titles a page holds, at most 1000. 0 asks for every title in one answer, without a
  // `next_page_token`.
  uint32 page_size = 2;
  // The `next_page_token` of the page before, or empty for the first page. The Kernel refuses one
  // it didn't hand out.
  string page_token = 3;
}

// What `list_titles` answers: a page of the Library's Movies, or its Shows' Episodes.
message Titles {
  repeated Title titles = 1;
  // What `page_token` asks for the next page with. Empty on the last page.
  string next_page_token = 2;
}

// A Movie or an Episode in a Library.
message Title {
  TitleRef title_ref = 1;
  // The Movie's or the Episode's title.
  string title = 2;
  // The Episode's Show's title. Unset for a Movie.
  optional string show_title = 3;
  // Unset for a Movie.
  optional uint32 season_number = 4;
  // Unset for a Movie.
  optional uint32 episode_number = 5;
  // When a Scan first stored the Movie's newest Version, or the Episode's, in milliseconds since
  // the Unix epoch. A rescan or a new Match keeps it, even of a file changed in place. Items
  // stored before Servers recorded it have the time the Server upgraded.
  int64 added_at_ms = 6;
  // The Movie's genres, or the Episode's Show's, by name in the title source's language.
  repeated string genres = 7;
  // The Movie's Content Rating, or the Episode's Show's, such as `PG-13` or `TV-MA`. Unset if
  // the title source gave none.
  optional string content_rating = 8;
  // The id of the Episode's Show, picked as `title_ref.id` is. Unset for a Movie.
  TitleId show_id = 9;
}

// Which Movie or Episode, in which Library.
message TitleRef {
  int64 library_id = 1;
  TitleRefKind kind = 2;
  // The id its Watch State is kept by.
  TitleId id = 3;
}

// Whether a `TitleRef` is a Movie or an Episode.
enum TitleRefKind {
  TITLE_REF_KIND_UNSPECIFIED = 0;
  TITLE_REF_KIND_MOVIE = 1;
  TITLE_REF_KIND_EPISODE = 2;
}

// What `list_watch_states` takes.
message WatchStatesAsked {
  repeated TitleRef titles = 1;
  // Asks for this User's Watch States only. Unset, it asks for every User's.
  optional int64 user_id = 2;
}

// What `list_watch_states` answers: each title asked for with every User's Watch State of it, or
// only the User's that `WatchStatesAsked.user_id` names.
message WatchStates {
  repeated TitleWatchStates titles = 1;
}

// One title's Watch States.
message TitleWatchStates {
  TitleRef title_ref = 1;
  // One per User who has one.
  repeated WatchState states = 2;
}

// One User's Watch State of a title.
message WatchState {
  int64 user_id = 1;
  bool played = 2;
  uint64 position_ms = 3;
  uint64 duration_ms = 4;
  // When it last changed, in milliseconds since the Unix epoch.
  int64 updated_at_ms = 5;
}

// What `list_users` takes.
message UsersAsked {}

// What `list_users` answers: every User. Every User sees every Library, so these are every User who
// can watch a title, including those without any Watch State.
message Users {
  repeated User users = 1;
}

// A User, as a Plugin sees one: their id and display name only.
message User {
  int64 id = 1;
  string display_name = 2;
}

// What `list_requesters` takes.
message RequestersAsked {
  repeated TitleRef titles = 1;
}

// What `list_requesters` answers: each title asked for with who Requested it.
message Requesters {
  repeated TitleRequesters titles = 1;
}

// Who Requested one title. A Movie's Requesters are those of any Request for it that isn't
// Declined, whatever its state. An Episode's are those of any such Request for its Season, and
// of the Followed Show that requested that Season unless it was Declined.
message TitleRequesters {
  TitleRef title_ref = 1;
  // Whether any such Request is for the title, even one whose Requesters were all deleted.
  bool requested = 2;
  // The ids of its Requesters who are still Users, each once.
  repeated int64 user_ids = 3;
}

// What `delete_media` takes: the title whose media files to delete.
message DeleteAsked {
  TitleRef title_ref = 1;
  // Other titles the Plugin agrees to lose with it. A file holding two Episodes goes with either,
  // so the Kernel refuses, deleting nothing, a delete that would take along an Episode not named
  // here, and its refusal names each such Episode.
  repeated TitleRef also = 2;
}

// What `delete_media` answers: the Kernel checked the delete and it goes on in the background.
message DeleteStarted {
  // The other titles that go with this delete, since a file of the title holds them too.
  repeated TitleRef taken_along = 1;
}

// What `list_watchlist` takes.
message WatchlistAsked {
  int64 user_id = 1;
}

// What `list_watchlist` answers: the User's Watchlist, empty for a User with none or no such
// User.
message Watchlist {
  repeated WatchlistTitle titles = 1;
}

// A title on a Watchlist, by the id it was added under, whether or not a Library has it.
message WatchlistTitle {
  TitleKind kind = 1;
  TitleId id = 2;
}

// What `forget_home_rows` takes.
message ForgetHomeRowsAsked {
  // Forgets the rows of each User who hasn't opened home in at least this many days. At least 1.
  uint32 days = 1;
}

// What `forget_home_rows` answers once it deleted each such User's own Home rows and Featured
// suggestions. A User who opens home again gets fresh ones, as after any stale visit.
message HomeRowsForgotten {
  // How many Users had rows it deleted.
  uint32 users = 1;
}

// What `delete_expired_sign_ins` takes.
message ExpiredSignInsAsked {}

// What `delete_expired_sign_ins` answers once it deleted every Device whose session expired and
// every Invite past its expiry. Neither worked any more; they were only still stored.
message ExpiredSignInsDeleted {
  // How many Devices it deleted.
  uint32 devices = 1;
  // How many Invites it deleted.
  uint32 invites = 2;
}
