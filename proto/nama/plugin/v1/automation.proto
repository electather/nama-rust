syntax = "proto3";

package nama.plugin.v1;

import "nama/plugin/v1/request.proto";
import "nama/plugin/v1/title_source.proto";

// The Kernel's functions, which any Plugin asks the Kernel through (ADR 0048).
//
// They are the functions in the Wasm import namespace `nama` that any Plugin, whatever its
// Manifest's `points`, may call during any of its calls (ADR 0071). Each takes its request
// message, encoded, and returns a `KernelAnswer`. Each needs the Plugin Permission named beside
// it, which the Admin granted when enabling the Plugin; without it the Kernel answers `refused`.
//
//   store_get:         StoreKey         -> StoreValue     PERMISSION_STORE
//   store_put:         StoreEntry       -> Stored         PERMISSION_STORE
//   store_delete:      StoreKey         -> Stored         PERMISSION_STORE
//   list_libraries:    LibrariesAsked   -> Libraries      PERMISSION_READ_LIBRARIES
//   list_titles:       TitlesAsked      -> Titles         PERMISSION_READ_LIBRARIES
//   list_watch_states: WatchStatesAsked -> WatchStates    PERMISSION_READ_WATCH_STATES
//   list_users:        UsersAsked       -> Users          PERMISSION_READ_USERS
//   list_requesters:   RequestersAsked  -> Requesters     PERMISSION_READ_REQUESTS
//   list_watchlist:    WatchlistAsked   -> Watchlist      PERMISSION_READ_WATCHLISTS
//   delete_media:      DeleteAsked      -> DeleteStarted  PERMISSION_DELETE_MEDIA
//   forget_home_rows:  ForgetHomeRowsAsked -> HomeRowsForgotten  PERMISSION_FORGET_HOME_ROWS
//   delete_expired_sign_ins: ExpiredSignInsAsked -> ExpiredSignInsDeleted
//                      PERMISSION_DELETE_EXPIRED_SIGN_INS
//   forget_gone_plugins: ForgetGonePluginsAsked -> GonePluginsForgotten  PERMISSION_FORGET_GONE_PLUGINS
//   refresh_metadata:  RefreshMetadataAsked -> MetadataRefreshed  PERMISSION_REFRESH_METADATA
//   list_titles_sharing: TitlesSharingAsked -> SharingTitles  PERMISSION_READ_LIBRARIES
//   back_up:           BackUpAsked      -> BackedUp       PERMISSION_BACK_UP
//   list_version_titles: VersionTitlesAsked -> VersionTitles  PERMISSION_READ_LIBRARIES
//   list_devices:      DevicesAsked     -> Devices        PERMISSION_READ_USERS
//   list_hub_similar:  SimilarAsked     -> SimilarTitles  PERMISSION_READ_LIBRARIES
//   list_hub_recommended: HubRecommendedAsked -> HubTitles  PERMISSION_READ_WATCH_STATES
//   list_hub_trending: HubChartAsked    -> HubTitles      PERMISSION_READ_LIBRARIES
//   list_hub_most_watchlisted: HubChartAsked -> HubTitles  PERMISSION_READ_LIBRARIES
//
// The functions are documented here rather than declared as a service: they are not an Extension
// Point, and no Manifest names them. They are versioned with `CONTRACT_VERSION`.

// What a Kernel function returns.
message KernelAnswer {
  oneof result {
    // The function's response, encoded.
    bytes answer = 1;
    // Why the Kernel refused, in plain words, such as a Permission not granted.
    string refused = 2;
  }
}

// What a Plugin may ask the Kernel for, requested in its Manifest's `permissions` and granted by
// the Admin when enabling it.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  // The Plugin's own Store: `store_get`, `store_put` and `store_delete`.
  PERMISSION_STORE = 1;
  // Libraries and their titles: `list_libraries`, `list_titles`, `list_titles_sharing` and
  // `list_version_titles`, and what the Hub says of titles: `list_hub_similar`,
  // `list_hub_trending` and `list_hub_most_watchlisted`.
  PERMISSION_READ_LIBRARIES = 2;
  // Every User's Watch State: `list_watch_states`, and what the Hub recommends each User from what
  // they finished: `list_hub_recommended`.
  PERMISSION_READ_WATCH_STATES = 3;
  // Deleting a title's media files: `delete_media`.
  PERMISSION_DELETE_MEDIA = 4;
  // Every User's id and display name, and what kind of Device each Device is: `list_users` and
  // `list_devices`.
  PERMISSION_READ_USERS = 5;
  // Who Requested each title: `list_requesters`.
  PERMISSION_READ_REQUESTS = 6;
  // Every User's Watchlist: `list_watchlist`.
  PERMISSION_READ_WATCHLISTS = 7;
  // Deleting the Home rows and Featured suggestions of Users who stopped opening home:
  // `forget_home_rows`.
  PERMISSION_FORGET_HOME_ROWS = 8;
  // Deleting what Plugins the Server no longer has left behind: `forget_gone_plugins`.
  PERMISSION_FORGET_GONE_PLUGINS = 9;
  // Deleting the Devices and Invites that have expired: `delete_expired_sign_ins`.
  PERMISSION_DELETE_EXPIRED_SIGN_INS = 10;
  // Fetching every Matched title again from its title source: `refresh_metadata`.
  PERMISSION_REFRESH_METADATA = 11;
  // Writing a Backup of the Server into the folder its settings name: `back_up`.
  PERMISSION_BACK_UP = 12;
}

// An entry in the Plugin's Store, for `store_get` and `store_delete`.
message StoreKey {
  // Up to 256 bytes.
  string key = 1;
  // Scopes the entry to one User. Unset, the entry is the Plugin's alone.
  optional int64 user_id = 2;
}

// What `store_put` keeps in the Plugin's Store, replacing any value under the same key and User.
// A Plugin keeps at most 10 000 entries, Plugin-wide and per-User together: at that cap the Kernel
// refuses a new key, though it still replaces the value under a key the Plugin holds.
message StoreEntry {
  // Up to 256 bytes.
  string key = 1;
  // Scopes the entry to one User. Unset, the entry is the Plugin's alone.
  optional int64 user_id = 2;
  // Up to 64 KiB.
  bytes value = 3;
}

// What `store_get` answers: the value kept, unset if there is none.
message StoreValue {
  optional bytes value = 1;
}

// What `store_put` and `store_delete` answer.
message Stored {}

// What `list_libraries` takes.
message LibrariesAsked {}

// What `list_libraries` answers: every Library.
message Libraries {
  repeated Library libraries = 1;
}

// A Library.
message Library {
  int64 id = 1;
  string name = 2;
  LibraryKind kind = 3;
}

// What a Library holds.
enum LibraryKind {
  LIBRARY_KIND_UNSPECIFIED = 0;
  LIBRARY_KIND_MOVIES = 1;
  LIBRARY_KIND_SHOWS = 2;
}

// What `list_titles` takes: a page of a Library's titles, by kind and then id.
message TitlesAsked {
  int64 library_id = 1;
  // How many titles a page holds, at most 1000. 0 asks for every title in one answer, without a
  // `next_page_token`.
  uint32 page_size = 2;
  // The `next_page_token` of the page before, or empty for the first page. The Kernel refuses one
  // it didn't hand out.
  string page_token = 3;
}

// What `list_titles` answers: a page of the Library's Movies, or its Shows' Episodes.
message Titles {
  repeated Title titles = 1;
  // What `page_token` asks for the next page with. Empty on the last page.
  string next_page_token = 2;
}

// A Movie or an Episode in a Library.
message Title {
  TitleRef title_ref = 1;
  // The Movie's or the Episode's title.
  string title = 2;
  // The Episode's Show's title. Unset for a Movie.
  optional string show_title = 3;
  // Unset for a Movie.
  optional uint32 season_number = 4;
  // Unset for a Movie.
  optional uint32 episode_number = 5;
  // When a Scan first stored the Movie's newest Version, or the Episode's, in milliseconds since
  // the Unix epoch. A rescan or a new Match keeps it, even of a file changed in place. Items
  // stored before Servers recorded it have the time the Server upgraded.
  int64 added_at_ms = 6;
  // The Movie's genres, or the Episode's Show's, by name in the title source's language.
  repeated string genres = 7;
  // The Movie's Content Rating, or the Episode's Show's, such as `PG-13` or `TV-MA`. Unset if
  // the title source gave none.
  optional string content_rating = 8;
  // The id of the Episode's Show, picked as `title_ref.id` is. Unset for a Movie.
  TitleId show_id = 9;
  // Every id of the Movie or the Episode, `title_ref.id` among them, any of which identifies it.
  repeated TitleId ids = 10;
  // Every id of the Episode's Show, `show_id` among them. Empty for a Movie.
  repeated TitleId show_ids = 11;
  // Each of `genres`' id in the title source that named it, in the same order, such as `tmdb`
  // `35`. Empty if that source gave none, or for a Match stored before the Kernel kept them.
  repeated TitleId genre_ids = 12;
}

// Which Movie or Episode, in which Library.
message TitleRef {
  int64 library_id = 1;
  TitleRefKind kind = 2;
  // The id its Watch State is kept by.
  TitleId id = 3;
}

// Whether a `TitleRef` is a Movie or an Episode.
enum TitleRefKind {
  TITLE_REF_KIND_UNSPECIFIED = 0;
  TITLE_REF_KIND_MOVIE = 1;
  TITLE_REF_KIND_EPISODE = 2;
}

// What `list_watch_states` takes.
message WatchStatesAsked {
  repeated TitleRef titles = 1;
  // Asks for this User's Watch States only. Unset, it asks for every User's.
  optional int64 user_id = 2;
}

// What `list_watch_states` answers: each title asked for with every User's Watch State of it, or
// only the User's that `WatchStatesAsked.user_id` names.
message WatchStates {
  repeated TitleWatchStates titles = 1;
}

// One title's Watch States.
message TitleWatchStates {
  TitleRef title_ref = 1;
  // One per User who has one.
  repeated WatchState states = 2;
}

// One User's Watch State of a title.
message WatchState {
  int64 user_id = 1;
  bool played = 2;
  uint64 position_ms = 3;
  uint64 duration_ms = 4;
  // When it last changed, in milliseconds since the Unix epoch.
  int64 updated_at_ms = 5;
}

// What `list_users` takes.
message UsersAsked {}

// What `list_users` answers: every User. Every User sees every Library, so these are every User who
// can watch a title, including those without any Watch State.
message Users {
  repeated User users = 1;
}

// A User, as a Plugin sees one: their id and display name only.
message User {
  int64 id = 1;
  string display_name = 2;
}

// What `list_version_titles` takes.
message VersionTitlesAsked {
  // The Version, by its id as a `Playback` gives it.
  int64 version_id = 1;
}

// What `list_version_titles` answers: the Movie, or each Episode in order, that the Version's file
// holds, leaving out any whose Item isn't Matched. Empty for a Version that is gone.
message VersionTitles {
  repeated TitleRef titles = 1;
  // Each title's Show's id, in the same place as the title in `titles` and picked as
  // `Title.show_id` is. Unset for a Movie, or an Episode whose Match gives its Show no id.
  repeated TitleId show_ids = 2;
}

// What `list_devices` takes.
message DevicesAsked {
  // The Devices, by their ids as a `Playback` gives them.
  repeated int64 device_ids = 1;
}

// What `list_devices` answers: each Device asked for that the Kernel still has, in no order.
message Devices {
  repeated Device devices = 1;
}

// A Device, as a Plugin sees one: its id, its User's and its kind only.
message Device {
  int64 id = 1;
  int64 user_id = 2;
  DeviceKind kind = 3;
}

// What kind of Device a Device is, as the Kernel reads it from the `User-Agent` it signed in with.
enum DeviceKind {
  // One the Kernel couldn't tell.
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_COMPUTER = 1;
  DEVICE_KIND_PHONE = 2;
  DEVICE_KIND_TABLET = 3;
  DEVICE_KIND_TV = 4;
}

// What `list_requesters` takes.
message RequestersAsked {
  repeated TitleRef titles = 1;
}

// What `list_requesters` answers: each title asked for with who Requested it.
message Requesters {
  repeated TitleRequesters titles = 1;
}

// Who Requested one title. A Movie's Requesters are those of any Request for it that isn't
// Declined, whatever its state. An Episode's are those of any such Request for its Season, and
// of the Followed Show that requested that Season unless it was Declined.
message TitleRequesters {
  TitleRef title_ref = 1;
  // Whether any such Request is for the title, even one whose Requesters were all deleted.
  bool requested = 2;
  // The ids of its Requesters who are still Users, each once.
  repeated int64 user_ids = 3;
}

// What `delete_media` takes: the title whose media files to delete.
message DeleteAsked {
  TitleRef title_ref = 1;
  // Other titles the Plugin agrees to lose with it. A file holding two Episodes goes with either,
  // so the Kernel refuses, deleting nothing, a delete that would take along an Episode not named
  // here, and its refusal names each such Episode.
  repeated TitleRef also = 2;
}

// What `delete_media` answers: the Kernel checked the delete and it goes on in the background.
message DeleteStarted {
  // The other titles that go with this delete, since a file of the title holds them too.
  repeated TitleRef taken_along = 1;
}

// What `list_watchlist` takes.
message WatchlistAsked {
  int64 user_id = 1;
}

// What `list_watchlist` answers: the User's Watchlist, newest added first, empty for a User with
// none or no such User.
message Watchlist {
  repeated WatchlistTitle titles = 1;
}

// A title on a Watchlist, by the id it was added under, whether or not a Library has it.
message WatchlistTitle {
  TitleKind kind = 1;
  TitleId id = 2;
}

// What `forget_home_rows` takes.
message ForgetHomeRowsAsked {
  // Forgets the rows of each User who hasn't opened home in at least this many days. At least 1.
  uint32 days = 1;
}

// What `forget_home_rows` answers once it deleted each such User's own Home rows and Featured
// suggestions. A User who opens home again gets fresh ones, as after any stale visit.
message HomeRowsForgotten {
  // How many Users had rows it deleted.
  uint32 users = 1;
}

// What `delete_expired_sign_ins` takes.
message ExpiredSignInsAsked {}

// What `delete_expired_sign_ins` answers once it deleted every Device whose session expired and
// every Invite past its expiry. Neither worked any more; they were only still stored.
message ExpiredSignInsDeleted {
  // How many Devices it deleted.
  uint32 devices = 1;
  // How many Invites it deleted.
  uint32 invites = 2;
}

// What `forget_gone_plugins` takes.
message ForgetGonePluginsAsked {
  // Forgets each Plugin the Server hasn't had for at least this many days. At least 1.
  uint32 days = 1;
}

// What `forget_gone_plugins` answers once it deleted what each such Plugin left behind, as the
// Server's list of what a Plugin leaves behind says
// (`crates/nama-server/src/plugin_settings/leftovers.rs`). A Plugin the Server still has, enabled
// or not, is never one of them.
message GonePluginsForgotten {
  // The id of each Plugin whose rows it deleted.
  repeated string plugin_ids = 1;
}

// What `refresh_metadata` takes.
message RefreshMetadataAsked {}

// What `refresh_metadata` answers once it fetched every Matched title of every Library again by
// the ids its Match has, whatever its metadata version, and stored what it got. It never searches
// and never changes which title an Item is Matched to. A title it couldn't fetch keeps what it had.
message MetadataRefreshed {
  // How many titles, Movies and Shows, it fetched and stored.
  uint64 titles = 1;
  // The id of each Plugin that couldn't answer, whose titles it left as they were.
  repeated string unavailable_plugin_ids = 2;
}

// What `back_up` takes. It names no folder: the Admin sets where Backups go, so no Plugin chooses
// where a file holding every Plugin's keys is written.
message BackUpAsked {}

// What `back_up` answers once it wrote a Backup (ADR 0068) named `nama-<UTC time>.tar`, such as
// `nama-20261121T030000Z.tar`, into the Backup folder, and then deleted the oldest so named
// beyond the count the Admin keeps. A file named otherwise is never deleted, and a Backup that
// fails deletes nothing.
message BackedUp {
  // Its file name.
  string name = 1;
  // Its size, in bytes.
  uint64 size_bytes = 2;
}

// What `list_titles_sharing` takes: Persons and genres to find the Movies or Shows sharing them.
message TitlesSharingAsked {
  TitleKind kind = 1;
  // The Persons, by the External IDs their Roles have.
  repeated TitleId people = 2;
  // Genres' names, as title sources give them.
  repeated string genres = 3;
  // The most titles to answer, at most 1000. 0 asks for 1000.
  uint32 limit = 4;
}

// What `list_titles_sharing` answers: the Movies or Shows of the kind asked, from every Library,
// each once, that share at least one of the Persons or genres asked, those sharing the most
// Persons first, then the most genres. The order only narrows the Library down: a Plugin weighs
// the titles itself.
message SharingTitles {
  repeated SharingTitle titles = 1;
}

// A Movie or Show `list_titles_sharing` answers.
message SharingTitle {
  // Its External IDs, at most one per namespace.
  repeated TitleId ids = 1;
  // Its genres' names.
  repeated string genres = 2;
  // Every Role it has, its Cast and then its Crew, each in billing order.
  repeated TitleRole roles = 3;
}

// What `list_hub_recommended` takes: one User's recommendations from the Hub (ADR 0095).
message HubRecommendedAsked {
  int64 user_id = 1;
  // The namespaces titles are known by, such as `tmdb`, in the order the answer's ids are wanted.
  repeated string namespaces = 2;
}

// What `list_hub_trending` and `list_hub_most_watchlisted` take.
message HubChartAsked {}

// The titles the Hub suggests, in its order: what `list_hub_recommended` answers for the User,
// `list_hub_trending` the Movies most Accounts finished lately, and `list_hub_most_watchlisted`
// the titles on most Accounts' Watchlists (ADR 0093). Empty without a Hub, while the Server isn't
// Linked, or once the Hub forgot it, so the Server loses nothing unlinked (ADR 0002); the Kernel
// refuses while the Hub is unreachable. `list_hub_similar` answers the same way, in a
// `SimilarTitles` of the asked kind's titles by one id each.
message HubTitles {
  repeated HubTitle titles = 1;
}

// A title the Hub suggests, by one External ID, whether or not a Library has it.
message HubTitle {
  TitleKind kind = 1;
  TitleId id = 2;
  // How strongly, from 0.0 to 1.0.
  float weight = 3;
}
