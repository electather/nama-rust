syntax = "proto3";

package nama.plugin.v1;

import "nama/plugin/v1/request.proto";

// The Automation lane: a Plugin asks the Kernel.
//
// The Kernel's functions are the functions in the Wasm import namespace `nama` that a Plugin
// whose Manifest's `points` names `AutomationService` may call during any of its calls. Each takes
// its request message, encoded, and returns a `KernelAnswer`. Each needs the Plugin Permission
// named beside it, which the Admin granted when enabling the Plugin; without it the Kernel
// answers `refused`.
//
//   store_get:         StoreKey         -> StoreValue     PERMISSION_STORE
//   store_put:         StoreEntry       -> Stored         PERMISSION_STORE
//   store_delete:      StoreKey         -> Stored         PERMISSION_STORE
//   list_libraries:    LibrariesAsked   -> Libraries      PERMISSION_READ_LIBRARIES
//   list_titles:       TitlesAsked      -> Titles         PERMISSION_READ_LIBRARIES
//   list_watch_states: WatchStatesAsked -> WatchStates    PERMISSION_READ_WATCH_STATES
//   delete_media:      DeleteAsked      -> DeleteStarted  PERMISSION_DELETE_MEDIA
//
// The functions are documented here rather than declared as a service: they are not an Extension
// Point, and no Manifest names them. They are versioned with `AutomationService`.

// The Extension Point for an Automation Plugin, served through the WASM export the rpc names.
service AutomationService {
  // The `tick` export: the Plugin's scheduled tick. Required. The Kernel calls it every
  // `Manifest.tick_every_seconds`.
  // Fully qualified: inside the service, a bare `Tick` names this rpc.
  rpc Tick(.nama.plugin.v1.Tick) returns (Ticked);
}

// What the Kernel hands a Plugin on its scheduled tick, every `Manifest.tick_every_seconds`.
message Tick {
  // The Kernel's clock, in milliseconds since the Unix epoch. A Plugin uses it rather than its own
  // clock.
  int64 now_ms = 1;
}

// What a Plugin answers a `Tick` with.
message Ticked {}

// What a Kernel function returns.
message KernelAnswer {
  oneof result {
    // The function's response, encoded.
    bytes answer = 1;
    // Why the Kernel refused, in plain words, such as a Permission not granted.
    string refused = 2;
  }
}

// What a Plugin may ask the Kernel for, requested in its Manifest's `permissions` and granted by
// the Admin when enabling it.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  // The Plugin's own Store: `store_get`, `store_put` and `store_delete`.
  PERMISSION_STORE = 1;
  // Libraries and their titles: `list_libraries` and `list_titles`.
  PERMISSION_READ_LIBRARIES = 2;
  // Every User's Watch State: `list_watch_states`.
  PERMISSION_READ_WATCH_STATES = 3;
  // Deleting a title's media files: `delete_media`.
  PERMISSION_DELETE_MEDIA = 4;
}

// An entry in the Plugin's Store, for `store_get` and `store_delete`.
message StoreKey {
  // Up to 256 bytes.
  string key = 1;
  // Scopes the entry to one User. Unset, the entry is the Plugin's alone.
  optional int64 user_id = 2;
}

// What `store_put` keeps in the Plugin's Store, replacing any value under the same key and User.
message StoreEntry {
  // Up to 256 bytes.
  string key = 1;
  // Scopes the entry to one User. Unset, the entry is the Plugin's alone.
  optional int64 user_id = 2;
  // Up to 64 KiB.
  bytes value = 3;
}

// What `store_get` answers: the value kept, unset if there is none.
message StoreValue {
  optional bytes value = 1;
}

// What `store_put` and `store_delete` answer.
message Stored {}

// What `list_libraries` takes.
message LibrariesAsked {}

// What `list_libraries` answers: every Library.
message Libraries {
  repeated Library libraries = 1;
}

// A Library.
message Library {
  int64 id = 1;
  string name = 2;
  LibraryKind kind = 3;
}

// What a Library holds.
enum LibraryKind {
  LIBRARY_KIND_UNSPECIFIED = 0;
  LIBRARY_KIND_MOVIES = 1;
  LIBRARY_KIND_SHOWS = 2;
}

// What `list_titles` takes.
message TitlesAsked {
  int64 library_id = 1;
}

// What `list_titles` answers: the Library's Movies, or its Shows' Episodes.
message Titles {
  repeated Title titles = 1;
}

// A Movie or an Episode in a Library.
message Title {
  TitleRef title_ref = 1;
  // The Movie's or the Episode's title.
  string title = 2;
  // The Episode's Show's title. Unset for a Movie.
  optional string show_title = 3;
  // Unset for a Movie.
  optional uint32 season_number = 4;
  // Unset for a Movie.
  optional uint32 episode_number = 5;
}

// Which Movie or Episode, in which Library.
message TitleRef {
  int64 library_id = 1;
  TitleRefKind kind = 2;
  // The id its Watch State is kept by.
  TitleId id = 3;
}

// Whether a `TitleRef` is a Movie or an Episode.
enum TitleRefKind {
  TITLE_REF_KIND_UNSPECIFIED = 0;
  TITLE_REF_KIND_MOVIE = 1;
  TITLE_REF_KIND_EPISODE = 2;
}

// What `list_watch_states` takes.
message WatchStatesAsked {
  repeated TitleRef titles = 1;
}

// What `list_watch_states` answers: each title asked for with every User's Watch State of it.
message WatchStates {
  repeated TitleWatchStates titles = 1;
}

// One title's Watch States.
message TitleWatchStates {
  TitleRef title_ref = 1;
  // One per User who has one.
  repeated WatchState states = 2;
}

// One User's Watch State of a title.
message WatchState {
  int64 user_id = 1;
  bool played = 2;
  uint64 position_ms = 3;
  uint64 duration_ms = 4;
  // When it last changed, in milliseconds since the Unix epoch.
  int64 updated_at_ms = 5;
}

// What `delete_media` takes: the title whose media files to delete.
message DeleteAsked {
  TitleRef title_ref = 1;
}

// What `delete_media` answers: the Kernel checked the delete and it goes on in the background.
message DeleteStarted {}
