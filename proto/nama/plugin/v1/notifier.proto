syntax = "proto3";

package nama.plugin.v1;

import "nama/v1/event.proto";
import "nama/v1/request.proto";

// What the Kernel hands a Notifier to deliver: something that happened to a Request. The Notifier
// formats it for its service.
message Notification {
  // What happened: a Request event, as `EventService.Subscribe` streams it.
  nama.v1.Event event = 1;
  // The Request it happened to, as the event holds it.
  nama.v1.Request request = 2;
  // The Request's place in the web app, if the Server knows its own URL (`ServerSettings.url`) and
  // the Request wasn't removed.
  optional string request_url = 3;
}

// What an Installed Plugin's `deliver` export takes: a notification and whom it is for.
message Delivery {
  Notification notification = 1;
  // Whom it is for. A Plugin that finds none it knows, which a newer Server may send, fails
  // rather than tell the wrong people.
  oneof recipient {
    // The channel set in the Plugin's settings, which hears about every Request event. A Plugin
    // with no channel set does nothing with these.
    Channel channel = 2;
    // The Plugin Connection of one User the Server tells, as the Plugin's Connector found it, such
    // as their Telegram chat id.
    string connection = 3;
  }
}

// The Plugin's own channel, set in its settings.
message Channel {}

// What an Installed Plugin's `deliver` export returns once the service answered.
message Delivered {
  // The service says the recipient is gone, as Telegram does for a User who blocked the bot. The
  // Server then deletes that Plugin Connection. Never set for the channel.
  bool recipient_gone = 1;
}
