syntax = "proto3";

package nama.plugin.v1;

import "nama/plugin/v1/request.proto";

// The Extension Point for a title source, which tells the Kernel about Movies and Shows so it can
// Match the files in a Library to titles. An Installed Plugin serves it through the WASM exports
// each rpc names, each taking and returning its messages encoded as protobuf, and keeps its titles
// under the namespace `Manifest.title_namespace` names.
//
// Every rpc is optional: a Plugin without its export isn't asked, and the Kernel treats the method
// as one the source doesn't serve. An export that fails means the source couldn't answer, which is
// worth trying again later; an answer with its title unset means there is no such title. An answer
// with `unsupported_id` set means the source can't look titles up by the asked id's namespace, and
// the Kernel asks the next source; a source answers that rather than failing its export.
service TitleSourceService {
  // The `title_search` export: the titles of `SearchQuery.kind` that best fit the query, best
  // first. Optional.
  rpc Search(SearchQuery) returns (SearchResults);
  // The `title_movie` export: the Movie with the id asked for. Optional.
  rpc Movie(TitleAsked) returns (MovieAnswer);
  // The `title_show` export: the Show with the id asked for. Optional.
  rpc Show(TitleAsked) returns (ShowAnswer);
  // The `title_season` export: one Season of the Show with the id asked for, with its Episodes.
  // Season 0 holds specials. Optional.
  rpc Season(SeasonAsked) returns (SeasonAnswer);
  // The `title_episode` export: one Episode of the Show with the id asked for. Optional.
  rpc Episode(EpisodeAsked) returns (EpisodeAnswer);
  // The `title_image` export: the image at a path the source gave in a poster, backdrop or still.
  // A path names bytes that never change: the Kernel keeps an image under its path and browsers
  // cache it for good, so a changed image needs a new path. Optional.
  rpc Image(ImageAsked) returns (ImageAnswer);
}

// Whether a title is a Movie or a Show. A source that doesn't know a kind finds nothing of it.
enum TitleKind {
  TITLE_KIND_UNSPECIFIED = 0;
  TITLE_KIND_MOVIE = 1;
  TITLE_KIND_SHOW = 2;
}

// What the `title_search` export searches for.
message SearchQuery {
  // Movies or Shows.
  TitleKind kind = 1;
  // The title, as a file or folder names it.
  string title = 2;
  // The year a Movie was released or a Show first aired, if known.
  optional int32 year = 3;
}

// What the `title_search` export returns: the titles it found, best first. Empty if none fit.
message SearchResults {
  repeated Candidate candidates = 1;
}

// A title a search found.
message Candidate {
  // The id to fetch it by.
  TitleId id = 1;
  // Every id the source knows the title by, `id` among them, at most one per namespace.
  repeated TitleId ids = 2;
  // The title, in the source's language.
  string title = 3;
  // The title in its original language.
  optional string original_title = 4;
  // The year a Movie was released or a Show first aired.
  optional int32 year = 5;
  // The poster's path, for the `title_image` export.
  optional string poster = 6;
  // The ISO 3166-1 alpha-2 codes of the countries a Show comes from. Empty where unknown, as for
  // Movies.
  repeated string origin_country = 7;
  // How many people rated it, a measure of how well known it is.
  uint32 vote_count = 8;
}

// The title the `title_movie` and `title_show` exports are asked for.
message TitleAsked {
  // Its id, in a namespace the source may not know: then the export fails saying so.
  TitleId id = 1;
}

// What the `title_season` export is asked for.
message SeasonAsked {
  // The Show's id.
  TitleId show = 1;
  // The Season's number. Season 0 holds specials.
  uint32 season = 2;
}

// What the `title_episode` export is asked for.
message EpisodeAsked {
  // The Show's id.
  TitleId show = 1;
  // The Season's number. Season 0 holds specials.
  uint32 season = 2;
  // The Episode's number within the Season.
  uint32 episode = 3;
}

// What the `title_image` export is asked for.
message ImageAsked {
  // The path, as the source gave it in a poster, backdrop or still.
  string path = 1;
}

// What the `title_movie` export returns.
message MovieAnswer {
  // The Movie, unset if the source has no such Movie.
  Movie movie = 1;
  // Set when the source can't look titles up by the asked id's namespace, with `movie` unset.
  bool unsupported_id = 2;
}

// What the `title_show` export returns.
message ShowAnswer {
  // The Show, unset if the source has no such Show.
  Show show = 1;
  // Set when the source can't look titles up by the asked id's namespace, with `show` unset.
  bool unsupported_id = 2;
}

// What the `title_season` export returns.
message SeasonAnswer {
  // The Season, unset if the source has no such Season.
  Season season = 1;
  // Set when the source can't look titles up by the asked id's namespace, with `season` unset.
  bool unsupported_id = 2;
}

// What the `title_episode` export returns.
message EpisodeAnswer {
  // The Episode, unset if the source has no such Episode.
  Episode episode = 1;
  // Set when the source can't look titles up by the asked id's namespace, with `episode` unset.
  bool unsupported_id = 2;
}

// What the `title_image` export returns.
message ImageAnswer {
  // The image, unset if the source has none at the path.
  Image image = 1;
}

// A Movie's details.
message Movie {
  // Its ids, at most one per namespace.
  repeated TitleId ids = 1;
  // The title, in the source's language.
  string title = 2;
  // The title in its original language.
  optional string original_title = 3;
  // A summary of the plot.
  optional string overview = 4;
  // When it was released, as `YYYY-MM-DD`.
  optional string release_date = 5;
  // How long it runs, in minutes.
  optional uint32 runtime_minutes = 6;
  // The poster, as a path for the `title_image` export.
  optional string poster = 7;
  // The backdrop, as a path for the `title_image` export.
  optional string backdrop = 8;
}

// A Show's details.
message Show {
  // Its ids, at most one per namespace.
  repeated TitleId ids = 1;
  // The title, in the source's language.
  string title = 2;
  // The title in its original language.
  optional string original_title = 3;
  // A summary.
  optional string overview = 4;
  // When it first aired, as `YYYY-MM-DD`.
  optional string first_air_date = 5;
  // The poster, as a path for the `title_image` export.
  optional string poster = 6;
  // The backdrop, as a path for the `title_image` export.
  optional string backdrop = 7;
  // The numbers of its Seasons, in order. Season 0 holds specials.
  repeated uint32 seasons = 8;
}

// One Season of a Show, with its Episodes.
message Season {
  // The Season's own ids, where the source has them.
  repeated TitleId ids = 1;
  // Its number. Season 0 holds specials.
  uint32 number = 2;
  // Its name, such as `Season 1` or `Specials`.
  string title = 3;
  // A summary.
  optional string overview = 4;
  // When it first aired, as `YYYY-MM-DD`.
  optional string air_date = 5;
  // The poster, as a path for the `title_image` export.
  optional string poster = 6;
  // Its Episodes, in order.
  repeated Episode episodes = 7;
}

// One Episode of a Show.
message Episode {
  // The Episode's own ids. Within a `Season` only the source's own id may be known.
  repeated TitleId ids = 1;
  // The Season it is in.
  uint32 season = 2;
  // Its number within the Season.
  uint32 number = 3;
  // Its title.
  string title = 4;
  // A summary.
  optional string overview = 5;
  // When it first aired, as `YYYY-MM-DD`.
  optional string air_date = 6;
  // How long it runs, in minutes.
  optional uint32 runtime_minutes = 7;
  // A still from it, as a path for the `title_image` export.
  optional string still = 8;
}

// An image's bytes.
message Image {
  // Its media type, such as `image/jpeg`.
  string content_type = 1;
  // The encoded image.
  bytes bytes = 2;
}
