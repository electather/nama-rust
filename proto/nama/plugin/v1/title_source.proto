syntax = "proto3";

package nama.plugin.v1;

import "nama/plugin/v1/request.proto";

// The Extension Point for a title source, which tells the Kernel about Movies and Shows so it can
// Match the files in a Library to titles. An Installed Plugin serves it through the WASM exports
// each rpc names, each taking and returning its messages encoded as protobuf, and keeps its titles
// under the namespace `Manifest.title_namespace` names.
//
// Every rpc is optional: a Plugin without its export isn't asked, and the Kernel treats the method
// as one the source doesn't serve. An export that fails means the source couldn't answer, which is
// worth trying again later; an answer with its title unset means there is no such title. An answer
// with `unsupported_id` set means the source can't look titles up by the asked id's namespace, and
// the Kernel asks the next source; a source answers that rather than failing its export.
service TitleSourceService {
  // The `title_search` export: the titles of `SearchQuery.kind` that best fit the query, best
  // first. Optional.
  rpc Search(SearchQuery) returns (SearchResults);
  // The `title_movie` export: the Movie with the id asked for. Optional.
  rpc Movie(TitleAsked) returns (MovieAnswer);
  // The `title_show` export: the Show with the id asked for. Optional.
  rpc Show(TitleAsked) returns (ShowAnswer);
  // The `title_season` export: one Season of the Show with the id asked for, with its Episodes.
  // Season 0 holds specials. Optional.
  rpc Season(SeasonAsked) returns (SeasonAnswer);
  // The `title_episode` export: one Episode of the Show with the id asked for. Optional.
  rpc Episode(EpisodeAsked) returns (EpisodeAnswer);
  // The `title_image` export: the image at a path the source gave in a poster, backdrop, still,
  // `Artwork` or `Role.headshot`. A path names bytes that never change: the Kernel keeps an image under its path and
  // browsers cache it for good, so a changed image needs a new path. Optional.
  rpc Image(ImageAsked) returns (ImageAnswer);
  // The `title_artwork` export: the artwork the source has for one title, of every kind it has.
  // Optional.
  rpc Artwork(ArtworkAsked) returns (ArtworkAnswer);
  // The `title_season_artwork` export: the artwork the source has for one Season of the Show with
  // the id asked for, in any namespace the source keeps or looks titles up by. Optional.
  rpc SeasonArtwork(SeasonAsked) returns (ArtworkAnswer);
}

// Whether a title is a Movie or a Show. A source that doesn't know a kind finds nothing of it.
enum TitleKind {
  TITLE_KIND_UNSPECIFIED = 0;
  TITLE_KIND_MOVIE = 1;
  TITLE_KIND_SHOW = 2;
}

// What the `title_search` export searches for.
message SearchQuery {
  // Movies or Shows.
  TitleKind kind = 1;
  // The title, as a file or folder names it.
  string title = 2;
  // The year a Movie was released or a Show first aired, if known.
  optional int32 year = 3;
}

// What the `title_search` export returns: the titles it found, best first. Empty if none fit.
message SearchResults {
  repeated Candidate candidates = 1;
}

// A title a search found.
message Candidate {
  // The id to fetch it by.
  TitleId id = 1;
  // Every id the source knows the title by, `id` among them, at most one per namespace.
  repeated TitleId ids = 2;
  // The title, in the source's language.
  string title = 3;
  // The title in its original language.
  optional string original_title = 4;
  // The year a Movie was released or a Show first aired.
  optional int32 year = 5;
  // The poster's path, for the `title_image` export.
  optional string poster = 6;
  // The ISO 3166-1 alpha-2 codes of the countries a Show comes from. Empty where unknown, as for
  // Movies.
  repeated string origin_country = 7;
  // How many people rated it, a measure of how well known it is.
  uint32 vote_count = 8;
}

// The title the `title_movie` and `title_show` exports are asked for.
message TitleAsked {
  // Its id, in a namespace the source may not know: then the export fails saying so.
  TitleId id = 1;
}

// What the `title_season` and `title_season_artwork` exports are asked for.
message SeasonAsked {
  // The Show's id.
  TitleId show = 1;
  // The Season's number. Season 0 holds specials.
  uint32 season = 2;
}

// What the `title_episode` export is asked for.
message EpisodeAsked {
  // The Show's id.
  TitleId show = 1;
  // The Season's number. Season 0 holds specials.
  uint32 season = 2;
  // The Episode's number within the Season.
  uint32 episode = 3;
}

// What the `title_image` export is asked for.
message ImageAsked {
  // The path, as the source gave it in a poster, backdrop, still or `Artwork`.
  string path = 1;
}

// What the `title_movie` export returns.
message MovieAnswer {
  // The Movie, unset if the source has no such Movie.
  Movie movie = 1;
  // Set when the source can't look titles up by the asked id's namespace, with `movie` unset.
  bool unsupported_id = 2;
}

// What the `title_show` export returns.
message ShowAnswer {
  // The Show, unset if the source has no such Show.
  Show show = 1;
  // Set when the source can't look titles up by the asked id's namespace, with `show` unset.
  bool unsupported_id = 2;
}

// What the `title_season` export returns.
message SeasonAnswer {
  // The Season, unset if the source has no such Season.
  Season season = 1;
  // Set when the source can't look titles up by the asked id's namespace, with `season` unset.
  bool unsupported_id = 2;
}

// What the `title_episode` export returns.
message EpisodeAnswer {
  // The Episode, unset if the source has no such Episode.
  Episode episode = 1;
  // Set when the source can't look titles up by the asked id's namespace, with `episode` unset.
  bool unsupported_id = 2;
}

// What the `title_image` export returns.
message ImageAnswer {
  // The image, unset if the source has none at the path.
  Image image = 1;
}

// What the `title_artwork` export is asked for.
message ArtworkAsked {
  // Movie or Show.
  TitleKind kind = 1;
  // The title's id, in any namespace the source keeps or looks titles up by.
  TitleId id = 2;
}

// What the `title_artwork` and `title_season_artwork` exports return.
message ArtworkAnswer {
  // The title's artwork, in no particular order. Empty if the source has none.
  repeated Artwork artwork = 1;
  // Set when the source can't look titles up by the asked id's namespace, with `artwork` empty.
  bool unsupported_id = 2;
}

// One image of a title's artwork.
message Artwork {
  // What kind of artwork it is.
  ArtworkKind kind = 1;
  // Its path, for the `title_image` export.
  string path = 2;
  // The ISO 639-1 code of the language of its text, unset for an image without text.
  optional string language = 3;
  // Its width in pixels.
  optional uint32 width = 4;
  // Its height in pixels.
  optional uint32 height = 5;
  // The source's own score for it, where higher is better.
  optional double rating = 6;
  // How many people rated it.
  optional uint32 votes = 7;
}

// The kinds of artwork a title has.
enum ArtworkKind {
  ARTWORK_KIND_UNSPECIFIED = 0;
  // A poster, portrait.
  ARTWORK_KIND_POSTER = 1;
  // A backdrop, landscape and full screen, drawn behind the title's page.
  ARTWORK_KIND_BACKDROP = 2;
  // The Title Logo: the title's name as artwork, on a clear background.
  ARTWORK_KIND_LOGO = 3;
  // Characters or a scene from the title, on a clear background.
  ARTWORK_KIND_CLEAR_ART = 4;
  // A wide, short strip with the title's name.
  ARTWORK_KIND_BANNER = 5;
  // A landscape thumbnail, usually with the title's name.
  ARTWORK_KIND_THUMB = 6;
  // The art printed on the title's disc.
  ARTWORK_KIND_DISC = 7;
}

// A Movie's details.
message Movie {
  // Its ids, at most one per namespace.
  repeated TitleId ids = 1;
  // The title, in the source's language.
  string title = 2;
  // The title in its original language.
  optional string original_title = 3;
  // A summary of the plot.
  optional string overview = 4;
  // When it was released, as `YYYY-MM-DD`.
  optional string release_date = 5;
  // How long it runs, in minutes.
  optional uint32 runtime_minutes = 6;
  // The poster, as a path for the `title_image` export.
  optional string poster = 7;
  // The backdrop, as a path for the `title_image` export.
  optional string backdrop = 8;
  // Its genres' names, in the source's language.
  repeated string genres = 9;
  // Its Content Rating in the source's country, such as `R`. Unset rather than another
  // country's.
  optional string content_rating = 10;
  // Its Score: how well its audience liked it, from 0 to 10, as this source averages it. Unset,
  // not 0, if nobody has voted.
  optional double score = 11;
  // The ISO 639-1 code of the language it was made in, such as `ja`.
  optional string original_language = 12;
  // Its Similar titles: the Movies this source says are like it, most alike first, each by one
  // id. The Kernel keeps the first 20 and drops a malformed one.
  repeated TitleId similar = 16;
  // Its Trailers, in the order to show them. The Kernel keeps the first 5 it can link to.
  repeated Trailer trailers = 13;
  // Its Cast, in billing order.
  repeated Role cast = 14;
  // Its Crew, in billing order.
  repeated Role crew = 15;
}

// A Show's details.
message Show {
  // Its ids, at most one per namespace.
  repeated TitleId ids = 1;
  // The title, in the source's language.
  string title = 2;
  // The title in its original language.
  optional string original_title = 3;
  // A summary.
  optional string overview = 4;
  // When it first aired, as `YYYY-MM-DD`.
  optional string first_air_date = 5;
  // The poster, as a path for the `title_image` export.
  optional string poster = 6;
  // The backdrop, as a path for the `title_image` export.
  optional string backdrop = 7;
  // The numbers of its Seasons, in order. Season 0 holds specials.
  repeated uint32 seasons = 8;
  // As `Movie.genres`.
  repeated string genres = 9;
  // As `Movie.content_rating`, such as `TV-MA`.
  optional string content_rating = 10;
  // As `Movie.score`.
  optional double score = 11;
  // As `Movie.original_language`.
  optional string original_language = 12;
  // As `Movie.similar`, the Shows this source says are like it.
  repeated TitleId similar = 16;
  // As `Movie.trailers`.
  repeated Trailer trailers = 13;
  // As `Movie.cast`, over the Show's whole run, without one Episode's guest stars.
  repeated Role cast = 14;
  // As `Movie.crew`, over the Show's whole run. Its creators have the job `Creator`.
  repeated Role crew = 15;
}

// A video advertising a Movie or Show, which the Kernel only ever links to where it is hosted.
message Trailer {
  // The site hosting it: `YouTube` or `Vimeo`. The Kernel drops one on any other site.
  string site = 1;
  // Its id on that site, such as YouTube's `LjLamj-b0I8`.
  string key = 2;
  // What it is called, such as `Official Trailer`.
  string name = 3;
  // Whether the title's makers released it.
  bool official = 4;
}

// A Person's part in a Movie or Show: a character they play (Cast) or a job they did (Crew).
message Role {
  // The Person's id in this source, such as `tmdb` `500`.
  TitleId person = 1;
  // The Person's name.
  string name = 2;
  // The character they play, or the job they did in English, such as `Director`. Empty if the
  // source doesn't say.
  string part = 3;
  // Their headshot, as a path for the `title_image` export. The Kernel keeps it only for the
  // first 15 of the Cast.
  optional string headshot = 4;
}

// One Season of a Show, with its Episodes.
message Season {
  // The Season's own ids, where the source has them.
  repeated TitleId ids = 1;
  // Its number. Season 0 holds specials.
  uint32 number = 2;
  // Its name, such as `Season 1` or `Specials`.
  string title = 3;
  // A summary.
  optional string overview = 4;
  // When it first aired, as `YYYY-MM-DD`.
  optional string air_date = 5;
  // The poster, as a path for the `title_image` export.
  optional string poster = 6;
  // Its Episodes, in order.
  repeated Episode episodes = 7;
}

// One Episode of a Show.
message Episode {
  // The Episode's own ids. Within a `Season` only the source's own id may be known.
  repeated TitleId ids = 1;
  // The Season it is in.
  uint32 season = 2;
  // Its number within the Season.
  uint32 number = 3;
  // Its title.
  string title = 4;
  // A summary.
  optional string overview = 5;
  // When it first aired, as `YYYY-MM-DD`.
  optional string air_date = 6;
  // How long it runs, in minutes.
  optional uint32 runtime_minutes = 7;
  // A still from it, as a path for the `title_image` export.
  optional string still = 8;
}

// An image's bytes.
message Image {
  // Its media type, such as `image/jpeg`.
  string content_type = 1;
  // The encoded image.
  bytes bytes = 2;
}
