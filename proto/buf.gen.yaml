# Regenerates the checked-in Rust code in crates/nama-proto/src/generated/ and the web app's
# TypeScript client in web/src/gen/.
# Run from this directory: `buf generate`. Installing the plugins is described in
# crates/nama-proto/README.md.
version: v2
clean: true
plugins:
  # Message types.
  - local: protoc-gen-buffa
    out: ../crates/nama-proto/src/generated/buffa
    opt: [views=true, json=true]
  - local: protoc-gen-buffa-packaging
    out: ../crates/nama-proto/src/generated/buffa
    strategy: all
  # ConnectRPC service traits and clients.
  - local: protoc-gen-connect-rust
    out: ../crates/nama-proto/src/generated/connect
    opt: [buffa_module=crate::messages]
  - local: protoc-gen-buffa-packaging
    out: ../crates/nama-proto/src/generated/connect
    strategy: all
    opt: [filter=services]
  # TypeScript messages and service descriptors for the web app (ADR 0007), with enums as plain
  # objects so they compile under `erasableSyntaxOnly`. The plugin is a devDependency of web/, so
  # run `vp install` there first.
  - local: ../web/node_modules/.bin/protoc-gen-es
    out: ../web/src/gen
    opt: [target=ts, erasable_syntax=true]
