# The schema of the client API and the Plugin contract (ADR 0007).
# Run `buf` commands from this directory.
version: v2
lint:
  use:
    - STANDARD
  # The contract's rpcs are WASM exports, not RPCs (ADR 0043): they keep their message names, and
  # a message one export takes may be what another takes too.
  ignore_only:
    RPC_REQUEST_STANDARD_NAME:
      - nama/plugin
    RPC_RESPONSE_STANDARD_NAME:
      - nama/plugin
    RPC_REQUEST_RESPONSE_UNIQUE:
      - nama/plugin
breaking:
  use:
    - FILE
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
    - FIELD_NO_DELETE_UNLESS_NAME_RESERVED
  # A field may be removed once its number and name are reserved, so neither can be reused for
  # something else; FILE alone forbids removing one at all.
  except:
    - FIELD_NO_DELETE
