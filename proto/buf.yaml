# The Nama API schema (ADR 0007). Run `buf` commands from this directory.
version: v2
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
    - FIELD_NO_DELETE_UNLESS_NAME_RESERVED
  # A field may be removed once its number and name are reserved, so neither can be reused for
  # something else; FILE alone forbids removing one at all.
  except:
    - FIELD_NO_DELETE
