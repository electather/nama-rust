# cargo-deny: supply-chain checks on every dependency. Run `cargo deny check`.

[graph]
all-features = true

[advisories]
# Any RustSec advisory (vulnerable, unmaintained, yanked) fails a PR that adds it; one already on
# main becomes an issue instead (.github/workflows/advisories.yml).
yanked = "deny"
ignore = [
  # Bundled SQLite < 3.54 with a crafted db/-wal pair. sqlx 0.9 caps libsqlite3-sys below the
  # fixed 0.39; drop this once sqlx allows it. The Server opens only its own data dir's files,
  # and whoever can write those already owns the database.
  { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9 pins libsqlite3-sys < 0.38; Server opens only its own data dir" },
]

[licenses]
# Permissive licenses, plus AGPL for this workspace's own crates. Add more only after checking them.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "AGPL-3.0-only",
]
confidence-threshold = 0.9
exceptions = [
  # Extism's build script runs it to write a C header; none of it is built into the Server.
  { allow = ["MPL-2.0"], crate = "cbindgen" },
  # Mozilla's root certificates, as data. Extism's HTTP client for Installed Plugins (ureq) turns
  # them on, and a dependent can't turn a dependency's default features off.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path deps

[sources]
unknown-registry = "deny"
unknown-git = "deny"
