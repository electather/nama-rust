# cargo-deny: supply-chain checks on every dependency. Run `cargo deny check`.

[graph]
all-features = true

[advisories]
# Any RustSec advisory (vulnerable, unmaintained, yanked) fails the build.
yanked = "deny"

[licenses]
# Permissive licenses, plus AGPL for this workspace's own crates. Add more only after checking them.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "AGPL-3.0-only",
]
confidence-threshold = 0.9
exceptions = [
  # Extism's build script runs it to write a C header; none of it is built into the Server.
  { allow = ["MPL-2.0"], crate = "cbindgen" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path deps

[sources]
unknown-registry = "deny"
unknown-git = "deny"
