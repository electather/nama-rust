# cargo-deny: supply-chain checks on every dependency. Run `cargo deny check`.

[graph]
all-features = true

[advisories]
# Any RustSec advisory (vulnerable, unmaintained, yanked) fails the build.
yanked = "deny"
ignore = [
  # SQLite's stale-memory read needs a database and `-wal` pair written by someone less trusted.
  # The Server only opens the one it creates in its own data dir, and whoever can write there can
  # rewrite the database anyway. The fix is libsqlite3-sys 0.39, which sqlx-sqlite 0.9.0 (newest)
  # caps below; drop this once an sqlx release allows it.
  { id = "RUSTSEC-2026-0459", reason = "Server opens only its own database; no sqlx release takes the fix yet" },
]

[licenses]
# Permissive licenses, plus AGPL for this workspace's own crates. Add more only after checking them.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "AGPL-3.0-only",
]
confidence-threshold = 0.9
exceptions = [
  # Extism's build script runs it to write a C header; none of it is built into the Server.
  { allow = ["MPL-2.0"], crate = "cbindgen" },
  # Mozilla's root certificates, as data. Extism's HTTP client for Installed Plugins (ureq) turns
  # them on, and a dependent can't turn a dependency's default features off.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path deps

[sources]
unknown-registry = "deny"
unknown-git = "deny"
