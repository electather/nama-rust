syntax = "proto3";

package spike.v1;

// Round-trip and call-cost probe.
message GreetRequest {
  string name = 1;
}

message GreetResponse {
  string message = 1;
  // Which build of the guest answered, so the host can see a reload took effect.
  string guest_version = 2;
}

// Asks the guest to GET a URL through Extism's HTTP host function.
message FetchRequest {
  string url = 1;
}

message FetchResponse {
  uint32 status = 1;
  string body = 2;
}
