# Local toolchain, kept on the versions CI pins (.github/workflows/ci.yml, web/package.json).
[tools]
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
node = "26.13.0"
vp = "1.5.0"
buf = "1.75.0"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-machete" = "latest"
cargo-deny = "latest"
# Codegen plugins: keep in step with the runtime crates in crates/nama-proto/Cargo.toml.
"cargo:protoc-gen-buffa" = "0.9.2"
"cargo:protoc-gen-buffa-packaging" = "0.9.2"
"cargo:connectrpc-codegen" = "0.9.0"
"cargo:sqlx-cli" = { version = "0.9.0", default-features = "false", features = "sqlite,rustls" }

[env]
# The mise `vp` only bootstraps `vp install`: it runs its own bundled vitest, which can't find
# web/'s happy-dom. Once installed, web/'s own `vp` comes first on PATH.
_.path = ["{{config_root}}/web/node_modules/.bin"]

[settings]
cargo.binstall = true
