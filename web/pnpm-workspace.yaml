# The web app is the root package; `ui` is nama-ui, its design system (ADR 0101).
packages:
  - ui

# Only install versions that have been public for a day, so a compromised release has time to be
# caught and pulled before it reaches us. In minutes.
minimumReleaseAge: 1440

# Dependencies allowed to run install scripts. None needs to yet; pnpm fails on any that asks and
# isn't listed here.
allowBuilds:
  # Its postinstall only refreshes the Google Fonts list it ships, for remote font lookup, which
  # the ASS renderer leaves off.
  lfa-ponyfill: false

# `vp` pins Node and pnpm (devEngines in package.json), so pnpm leaves the versions to it.
runtimeOnFail: ignore
pmOnFail: ignore

# A dependency both packages declare is pinned here once, so they can't drift apart.
catalog:
  class-variance-authority: ^0.7.1
  cn: ^0.5.2
  lucide-react: ^1.72.0
  react: ^19.3.1
  tailwindcss: ^4
  # vp refuses to run unless the alias matches vite-plus. Dependabot bumps only vite-plus, so bump both.
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
  # GHSA-g3hv-75wg-m249: shadcn's ts-morph still asks for minimatch 10, which has no patched release.
  # Drop this once @ts-morph/common allows 11.
  "@ts-morph/common>minimatch": ^11.0.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
