# The web app is the root package; `ui` is nama-ui, its design system (ADR 0101).
packages:
  - ui

# Only install versions that have been public for a day, so a compromised release has time to be
# caught and pulled before it reaches us. In minutes.
minimumReleaseAge: 1440

# Dependencies allowed to run install scripts. None needs to yet; pnpm fails on any that asks and
# isn't listed here.
allowBuilds:
  # Its postinstall only refreshes the Google Fonts list it ships, for remote font lookup, which
  # the ASS renderer leaves off.
  lfa-ponyfill: false

# `vp` pins Node and pnpm (devEngines in package.json), so pnpm leaves the versions to it.
runtimeOnFail: ignore
pmOnFail: ignore

# web/AGENTS.md, "One version of a shared dependency".
catalog:
  "@bufbuild/protobuf": ^2.17.0
  "@connectrpc/connect": ^2.3.0
  "@connectrpc/connect-query": ^2.3.1
  "@connectrpc/connect-web": ^2.3.0
  "@tailwindcss/vite": ^4
  "@tanstack/react-query": ^5.108.2
  "@tanstack/react-router": ^1.170.46
  "@tanstack/router-plugin": ^1.169.0
  "@testing-library/react": ^16.3.3
  "@types/react": ^19
  "@types/react-dom": ^19
  "@vitejs/plugin-react": ^6
  class-variance-authority: ^0.7.1
  cn: ^0.5.2
  lucide-react: ^1.77.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4
  # vp refuses to run unless the alias matches vite-plus's own `vite` dependency (core versions no longer track vite-plus's). Dependabot bumps only vite-plus, so bump both.
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
  # GHSA-g3hv-75wg-m249: shadcn's ts-morph still asks for minimatch 10, which has no patched release.
  # Drop this once @ts-morph/common allows 11.
  "@ts-morph/common>minimatch": ^11.0.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
