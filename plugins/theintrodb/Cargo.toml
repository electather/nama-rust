[package]
name = "nama-plugin-theintrodb"
version = "0.1.0"
description = "Installed Plugin serving TheIntroDB's Intro, Recap and Credits times as a Segment source, bundled in the Server"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nama-pdk = { version = "0.2.0", path = "../../crates/nama-pdk" }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
