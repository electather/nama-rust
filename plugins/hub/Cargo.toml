[package]
name = "nama-plugin-hub"
version = "0.1.0"
description = "Hub Suggestions: the Built-in Plugin that turns the Hub's suggestions into Similar titles, Home rows and Featured suggestions"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true

# Built-in Plugins depend on no workspace crate but nama-plugin-api (ADR 0006).
[dependencies]
nama-plugin-api = { version = "0.2.0", path = "../../crates/nama-plugin-api" }

[dev-dependencies]
buffa = "0.9.2"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
