[package]
name = "nama-plugin-upkeep"
version = "0.1.0"
description = "Built-in Plugin whose Jobs back the Server up, delete what it keeps that nobody will read again, and refresh Matched titles' metadata"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true

# Built-in Plugins depend on no workspace crate but nama-plugin-api (ADR 0006).
[dependencies]
nama-plugin-api = { version = "0.2.0", path = "../../crates/nama-plugin-api" }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
