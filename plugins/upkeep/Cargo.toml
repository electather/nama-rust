[package]
name = "nama-plugin-upkeep"
version = "0.1.0"
description = "Built-in Plugin whose Jobs delete what the Server keeps that nobody will read again"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true

# Built-in Plugins depend on no workspace crate but nama-plugin-api (ADR 0006).
[dependencies]
# Encodes the Kernel functions' requests, which the Kernel takes as bytes.
buffa = "0.9.2"
nama-plugin-api = { version = "0.2.0", path = "../../crates/nama-plugin-api" }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
