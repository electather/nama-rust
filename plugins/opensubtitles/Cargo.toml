[package]
name = "nama-plugin-opensubtitles"
version = "0.1.0"
description = "Installed Plugin serving subtitles from OpenSubtitles.com, bundled in the Server"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nama-pdk = { version = "0.3.0", path = "../../crates/nama-pdk" }
serde = { version = "1", features = ["derive"] }
url = "2.5"

[lints]
workspace = true
