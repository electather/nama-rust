# A local Diagnostics backend: an OTel Collector, Tempo, Prometheus, Loki and Grafana in one
# container. The README's "Finding a slow request" says how to use it. Kept to what both
# `docker compose` and `podman compose` read, and the image names its registry so podman
# doesn't ask for one.
services:
  otel-lgtm:
    image: docker.io/grafana/otel-lgtm:0.41.0
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
