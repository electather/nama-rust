[package]
name = "nama-plugin-api"
version = "0.2.0"
description = "Extension Point traits through which Plugins take part in a Nama Server"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true

[dependencies]
buffa = "0.9.2"
nama-plugin-proto = { version = "0.2.0", path = "../nama-plugin-proto" }
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
