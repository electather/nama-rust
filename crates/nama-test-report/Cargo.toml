[package]
name = "nama-test-report"
version = "0.1.0"
description = "Records CI test results and reports flaky and slow tests"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true
publish = false

# CI tooling, not part of a release.
[package.metadata.dist]
dist = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
