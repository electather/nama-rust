[package]
name = "nama-server"
version = "0.1.0"
description = "The Nama Server: owns Libraries, streams media and handles Requests"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true

[features]
# `contents::Contents::files`: what a Library holds, as integration tests read it back;
# `ffmpeg::fake`, the fake programs tests run; and the Built-in Plugin `nama-plugin-test-choices`,
# whose settings check offers choices.
testing = ["dep:nama-plugin-test-choices"]
# Embeds the built web app (`web/dist`, from `vp build`) and serves it. Off by default so builds
# and tests need no Node; release builds turn it on (`dist-workspace.toml`).
web = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "query", "tokio"] }
base64 = "0.23"
buffa = "0.9.2"
clap = { version = "4", features = ["derive", "env"] }
connectrpc = { version = "0.9.1", features = ["axum"] }
extism = { version = "1.41.0", default-features = false, features = ["http", "wasmtime-default-features"] }
fast_image_resize = { version = "6", features = ["image"] }
figment = { version = "0.10", features = ["env", "toml"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
glob = "0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
isolang = { version = "2.4", default-features = false }
nama-plugin-api = { version = "0.1.0", path = "../nama-plugin-api" }
nama-plugin-local-auth = { version = "0.1.0", path = "../../plugins/local-auth" }
nama-plugin-log-events = { version = "0.1.0", path = "../../plugins/log-events" }
nama-plugin-test-choices = { version = "0.1.0", path = "../../plugins/test-choices", optional = true }
nama-plugin-tmdb = { version = "0.1.0", path = "../../plugins/tmdb" }
nama-proto = { version = "0.2.0", path = "../nama-proto" }
notify = "8.2.2"
regex = "1"
roxmltree = "0.21"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
# Only to tell a trap from other failed calls; its version must be the one extism uses.
wasmtime = { version = "49.0.5", default-features = false }

[target.'cfg(unix)'.dependencies]
# Only `access`, which sees a read-only mount as well as a folder's mode.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
connectrpc = { version = "0.9.1", features = ["client"] }
figment = { version = "0.10", features = ["test"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nama-server = { path = ".", features = ["testing"] }
nama-plugin-tmdb = { version = "0.1.0", path = "../../plugins/tmdb", features = ["testing"] }
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
