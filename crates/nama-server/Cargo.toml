[package]
name = "nama-server"
# Shared with nama-hub: see "Releases" in `crates/nama-hub/AGENTS.md`.
version = "0.2.0"
description = "The Nama Server: owns Libraries, streams media and handles Requests"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true

[features]
# What integration tests reach for: `ffmpeg::fake`, the fake programs tests run, and the test media
# writers; `db::advance_clock` and `db::reset_clock`, which move the Server's clock; the Plugin
# registry for checking what is enabled; and the Built-in Plugin `nama-plugin-test-choices`, whose
# settings check offers choices.
testing = ["dep:nama-plugin-test-choices"]
# Embeds the built web app (`web/dist`, from `vp build`) and serves it. Off by default so builds
# and tests need no Node; release builds turn it on (`dist-workspace.toml`).
web = ["dep:tower"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "query", "tokio"] }
base64 = "0.23"
buffa = "0.9.2"
# Guesses the charset of a sidecar subtitle that isn't UTF-8, which ffmpeg is told to read it in.
chardetng = "1.0.0"
clap = { version = "4", features = ["derive", "env"] }
connectrpc = { version = "0.9.1", features = ["axum"] }
# The charsets chardetng guesses; their names are the labels ffmpeg reads.
encoding_rs = "0.8.44"
extism = { version = "1.41.0", default-features = false, features = ["http", "wasmtime-default-features"] }
fast_image_resize = { version = "6", features = ["image"] }
figment = { version = "0.10", features = ["env", "toml"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
glob = "0.3"
# Its defaults add UTF-8 and UTF-16 input the Server never normalises, and two crates for them.
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_properties = "2.4.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
isolang = { version = "2.4", default-features = false }
# Reads a Job's schedule in the Server's time zone, from the system's time zone database, which
# `docker/Dockerfile` installs, or on Windows, which has none, from the one jiff bundles there.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
# Its defaults add `extraslow`, which pulls in two crates for speeds the Server never uses (ADR 0039).
jixel = { version = "0.5.7", default-features = false, features = ["avx", "neon", "sse"] }
nama-forwarded = { version = "0.1.0", path = "../nama-forwarded" }
nama-plugin-api = { version = "0.2.0", path = "../nama-plugin-api" }
nama-plugin-hub = { version = "0.1.0", path = "../../plugins/hub" }
nama-plugin-local-auth = { version = "0.1.0", path = "../../plugins/local-auth" }
nama-plugin-log-events = { version = "0.1.0", path = "../../plugins/log-events" }
nama-plugin-test-choices = { version = "0.1.0", path = "../../plugins/test-choices", optional = true }
nama-plugin-tmdb = { version = "0.1.0", path = "../../plugins/tmdb" }
nama-plugin-upkeep = { version = "0.1.0", path = "../../plugins/upkeep" }
nama-plugin-proto = { version = "0.2.0", path = "../nama-plugin-proto" }
nama-proto = { version = "0.2.0", path = "../nama-proto" }
notify = "8.2.2"
# Diagnostics (ADR 0054): traces and logs exported over OTLP/HTTP only when an endpoint is set.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-http = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "logs", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["logs", "trace"] }
regex = "1"
# Reads the description a router answers UPnP with (`port_mapping`).
roxmltree = "0.21"
# ring, as the bundled Plugins already build it, for reqwest when the Hub's features reach it
# (`diagnostics::use_ring_for_tls`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Forwards the web app's Diagnostics to the OTLP endpoint; already built for opentelemetry-otlp.
reqwest = { version = "0.13.5", default-features = false }
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
svg-hush = "0.9.7"
# Backups are one `.tar` (ADR 0068). Its default `xattr` would copy attributes no restore needs.
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
thumbhash = "0.1"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }
tower-http = { version = "0.7.1", default-features = false, features = [
    "compression-br",
    "compression-gzip",
    "fs",
] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
walkdir = "2"
# Only to tell a trap from other failed calls; its version must be the one extism uses.
wasmtime = { version = "49.0.7", default-features = false }

[target.'cfg(unix)'.dependencies]
# Only `access`, which sees a read-only mount as well as a folder's mode, `statvfs`, for the
# free space of a full segment folder or the data directory, and `statfs`, for the data
# directory's filesystem; and `setpriority`, for ffmpeg making Preview frames.
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
connectrpc = { version = "0.9.1", features = ["client"] }
figment = { version = "0.10", features = ["test"] }
flate2 = "1"
# The fake S3 checks each request's signature, as S3 does.
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jxl = "0.8"
nama-server = { path = ".", features = ["testing"] }
nama-plugin-tmdb = { version = "0.1.0", path = "../../plugins/tmdb", features = ["testing"] }
nama-structure = { path = "../nama-structure" }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["testing"] }
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
