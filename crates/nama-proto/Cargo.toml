[package]
name = "nama-proto"
version = "0.1.0"
description = "Protobuf messages and ConnectRPC stubs generated from the Nama schema in proto/"
license = "MIT OR Apache-2.0"
edition.workspace = true
repository.workspace = true

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.1", features = ["client"] }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
