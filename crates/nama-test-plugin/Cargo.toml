[package]
name = "nama-test-plugin"
version = "0.1.0"
description = "An Installed Plugin used only in the Server's tests"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Builds the Plugin so its `manifest()` panics, to show the Server gets the panic's message.
panic = []
# Builds the Plugin naming the Connector Extension Point without its exports, so the Server
# refuses it.
unexported-connector = []
# Builds the Plugin for Plugin contract 0.1, which no Server matches any more, so the Server
# refuses it.
contract-0-1 = []
# Builds the Plugin naming no Extension Points, as one built before they became services reads,
# so the Server refuses it.
empty-points = []
# Builds the Plugin naming the Automation Extension Point and requesting the Store and Library
# Permissions; its tick calls the Kernel's functions.
automation = []
# Builds the Plugin as `automation` does, with a tick that loops until the Server interrupts it.
looping-tick = ["automation"]
# Builds the Plugin naming the Recogniser Extension Point and exporting `recognise_file`, which
# reads `<Show> - <n>.<ext>`, or `<Show> (<year>) - <n>.<ext>`, as that Show's Season 1, Episode n.
recogniser = []
# Builds the Plugin naming the Home row Extension Point and requesting the Store Permission; its
# `shared_rows` gives fixed rows, those its `home_rows` setting picks, after keeping a value in its
# Store and reading it back, its `user_rows` a row named for the User's `handle`, and its
# `user_featured` fixed suggestions for a User who set one.
home-rows = []
# Builds the Plugin as `home-rows` does, exporting only `shared_rows`, or only `user_rows`, as a
# new version of it that stopped giving the others.
home-rows-shared-only = ["home-rows"]
home-rows-user-only = ["home-rows"]
# Builds the Plugin naming the subtitle source Extension Point; it finds and downloads nothing.
subtitle-source = []

[dependencies]
# Extism's own HTTP, which `nama_pdk::extism_pdk` closes, so the Kernel's refusal of a host
# reaches the Server's tests in the Kernel's words, not in a Plugin's "didn't answer".
extism-pdk = { version = "1.4.1", default-features = false, features = ["http"] }
nama-pdk = { version = "0.2.0", path = "../nama-pdk" }

[lints]
workspace = true
