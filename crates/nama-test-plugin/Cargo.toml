[package]
name = "nama-test-plugin"
version = "0.1.0"
description = "An Installed Plugin used only in the Server's tests"
license = "AGPL-3.0-only"
edition.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Builds the Plugin so its `manifest()` panics, to show the Server gets the panic's message.
panic = []
# Builds the Plugin naming the Connector Extension Point without its exports, so the Server
# refuses it.
unexported-connector = []
# Builds the Plugin for Nama API 0.1, before `nama.plugin.v1` took `nama.v1`'s setting kinds, so
# the Server refuses it.
nama-api-0-1 = []

[dependencies]
nama-pdk = { version = "0.1.0", path = "../nama-pdk" }

[lints]
workspace = true
